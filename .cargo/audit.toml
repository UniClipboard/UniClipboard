# Config for `cargo audit` (see .github/workflows/security-audit.yml and
# CONTRIBUTING.md). Auto-discovered by the `cargo-audit` binary from the
# working directory, so this is the single source of truth for both local
# `cargo audit` runs and the CI gate (rustsec/audit-check shells out to the
# same binary).
[advisories]
ignore = [
  # rsa: Marvin Attack timing side-channel. Pulled in transitively via
  # jsonwebtoken; no fixed version exists upstream as of this writing
  # (https://rustsec.org/advisories/RUSTSEC-2023-0071). Not exploitable here:
  # crates/uc-webserver/src/security/claims.rs only uses Algorithm::HS256
  # (HMAC) — the vulnerable RSA code path is never reached. Re-evaluate if a
  # fix ships or if RSA-based JWT algorithms are ever adopted.
  "RUSTSEC-2023-0071",
  # quick-xml: CPU-exhaustion (0194) and memory-exhaustion (0195) DoS when
  # parsing attacker-controlled XML. Pulled in transitively (0.37.5 via
  # tauri-winrt-notification, 0.39.4 via plist/wayland-scanner); no dependent
  # has released a version on quick-xml >=0.41 yet. Not exploitable here:
  # these paths only parse locally generated XML (Windows toast payloads,
  # plists, Wayland protocol files), never untrusted input. Remove once
  # upstream crates bump to quick-xml >=0.41.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # libcrux AES-GCM and ChaCha20-Poly1305 advisories. These crates are only
  # present in Cargo.lock through hpke-rs-libcrux's optional backend; the
  # active OpenMLS backend does not enable or compile them. Upstream hpke-rs
  # 0.6.1 pins the affected versions. Track removal in #1464, #1465, and
  # #1466 when the OpenMLS dependency chain can move to the fixed releases.
  "RUSTSEC-2026-0211",
  "RUSTSEC-2026-0209",
  "RUSTSEC-2026-0124",
  # libcrux-secrets is pulled in by libcrux-sha3 through its digest traits,
  # but UniClipboard's hpke-rs path does not call the affected Select or Swap
  # operations. hpke-rs 0.6.1 pins this transitive version; track #1467.
  "RUSTSEC-2026-0212",
  # hpke-rs uses libcrux-sha3 only through the one-shot portable shake256
  # function with fixed 32- or 64-byte outputs. The affected incremental
  # multi-squeeze and AVX2 x4 APIs are not called. hpke-rs 0.6.1 pins 0.0.8;
  # track #1468 and #1469 until the upstream dependency can be upgraded.
  "RUSTSEC-2026-0207",
  "RUSTSEC-2026-0208",
]
