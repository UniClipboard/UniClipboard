name: 问题反馈（中文）
description: 使用中文反馈 UniClipboard 的问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 当前版本
      description: 请写明分支（v1 或 v2）、发布版本或提交、应用（CLI 或 Desktop），以及操作系统版本。
      placeholder: 例如：v2，提交 b25562d9，CLI，macOS 15.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        请尽量在问题发生后导出日志，并把 ZIP 文件拖入此处。

        - v2：运行 `unic logs export`。命令会显示导出文件的路径。服务停止时也可以导出。
        - v1：运行 `uniclip debug export-logs`。

        上传前请检查日志中是否包含个人信息、剪贴板内容、设备信息或凭据；请勿公开敏感内容。无法导出或不方便公开时，请说明原因，不必上传。
      placeholder: 将日志 ZIP 拖到这里，或说明无法提供日志的原因。
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明发生了什么、如何重现、你原本期望什么；如有报错或大致发生时间，也请写上。
      placeholder: |
        操作步骤：
        实际结果：
        期望结果：
    validations:
      required: true
