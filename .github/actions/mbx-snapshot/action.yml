name: MBX CAS snapshot
description: Transfer a private R2 action closure without restoring Cargo targets.
inputs:
  operation:
    description: Restore or save a workload snapshot.
    default: restore
  scene:
    description: Workload exported by MBX; host OS and architecture further isolate the key.
    default: e2e-macos
  object-fallback:
    description: Keep per-object R2 reads after a snapshot hit.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Transfer MBX snapshot
      if: env.UC_COMPILE_CACHE_BACKEND == 'r2'
      # A transport failure costs cache reuse, never the build's correctness.
      continue-on-error: true
      shell: bash
      env:
        SNAPSHOT_SCENE: ${{ inputs.scene }}
        SNAPSHOT_OPERATION: ${{ inputs.operation }}
        SNAPSHOT_OBJECT_FALLBACK: ${{ inputs.object-fallback }}
      run: |
        bash scripts/ci/mbx-snapshot.sh "$SNAPSHOT_OPERATION" --scene "$SNAPSHOT_SCENE" --object-fallback "$SNAPSHOT_OBJECT_FALLBACK"
