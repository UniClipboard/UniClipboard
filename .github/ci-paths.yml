# Shared inputs for PR routing and main-branch coverage baselines.
# dorny/paths-filter flattens YAML aliases, so shared dependencies have one owner.
ci_config: &ci_config
  - '.github/ci-paths.yml'
  - '.github/workflows/pr-check.yml'
  - 'scripts/__tests__/pr-check-routing.test.ts'

rust_build_inputs: &rust_build_inputs
  - *ci_config
  - 'Cargo.toml'
  - 'Cargo.lock'
  - '.cargo/**'
  - 'rust-toolchain.toml'
  - 'scripts/build-cache/**'
  - '.github/actions/engine-build-cache/**'
  - '.github/actions/mbx-snapshot/**'
  - 'scripts/ci/mbx-snapshot.py'
  - 'scripts/ci/mbx-snapshot.sh'
  - 'vendor/**'

rust_shared: &rust_shared
  - *rust_build_inputs
  - 'clippy.toml'
  - '.github/actions/build-pr-rust/**'

rust:
  - *rust_shared
  - 'crates/**'
  - 'apps/daemon/**'
  - 'apps/quick-panel/**'
  - 'tools/**'
  - 'schema/**'
  - 'scripts/architecture/**'
  - '.github/docker/build-bookworm.Dockerfile'
  - '.github/workflows/coverage.yml'
  - '.github/actions/rust-coverage/**'

frontend:
  - *ci_config
  - 'apps/gui-go/frontend/**'
  - 'package.json'
  - 'bun.lock'
  - 'schema/**'
  - 'scripts/check-macos-compat.mjs'
  - 'scripts/gen-host-bindings.mjs'
  - '.github/workflows/frontend-coverage.yml'

cli_inputs: &cli_inputs
  - *ci_config
  - 'apps/cli-go/**/*.{go,mod,sum}'
  # Direct and transitive shared packages imported by apps/cli-go.
  - 'packages/desktop-host-go/{apppaths,buildinfo,daemonclient,daemonlife,daemonproc,errctx,hostlog}/**/*.go'
  - 'packages/desktop-host-go/go.{mod,sum}'
  - 'Cargo.toml'
  - 'crates/uc-daemon-contract/src/lib.rs'

cli_go: &cli_go
  - *cli_inputs
  # The compile gate also vets the entire shared module.
  - 'packages/desktop-host-go/**'
  - 'scripts/ci/build-go-cli.sh'

gui_go:
  - '.github/actions/go-host-apt/**'
  - 'scripts/ci/go-host-apt*'
  - *ci_config
  - 'apps/gui-go/**/*.{go,mod,sum,c,h,m,mm,syso,rc,ico,manifest}'
  - 'packages/desktop-host-go/**'
  - 'Cargo.toml'
  - 'crates/uc-daemon-contract/**'
  - 'scripts/ci/check-gui-go.sh'
  - 'scripts/gen-host-bindings.mjs'
  - 'scripts/architecture/check-host-events.mjs'
  - 'docs/architecture/gui-go-host-commands.md'
  - '.github/docker/build-bookworm.Dockerfile'

# TesterArmy backend and Windows product checks execute the real daemon and CLI.
daemon_runtime_inputs: &daemon_runtime_inputs
  - 'apps/daemon/**'
  - 'crates/uc-{platform,app-paths,observability,bootstrap,daemon-contract,daemon-process,daemon-local,desktop-settings,webserver}/**'

tooling:
  - '.github/actions/go-host-apt/**'
  - *ci_config
  - '.github/workflows/**'
  - 'scripts/**'
  - 'package.json'
  - 'bun.lock'
  - 'vitest.config.ts'

# GUI browser rendering has no Rust or native-host dependency.
testerarmy_gui_inputs: &testerarmy_gui_inputs
  - *ci_config
  - 'apps/gui-go/frontend/**'
  - 'schema/**'
  - 'scripts/gui-e2e.mjs'
  - 'package.json'
  - 'bun.lock'

testerarmy_browser: &testerarmy_browser
  - *testerarmy_gui_inputs
  - 'e2e.config.ts'
  - 'e2e.layouts.config.ts'
  - '.github/workflows/tester-army-e2e.yml'

# macOS backend fixtures execute the real daemon and user-facing CLI.
testerarmy_backend:
  - *testerarmy_browser
  - *rust_build_inputs
  - *daemon_runtime_inputs
  - *cli_inputs
  - 'e2e.daemon.config.ts'
  - 'e2e.backend.config.ts'

# Capability probes do not build the product or execute its daemon.
testerarmy_native_inputs: &testerarmy_native_inputs
  - *ci_config
  - 'package.json'
  - 'bun.lock'
  - 'apps/gui-go/e2e/tester-army-native/protocol.mjs'
  - '.github/workflows/tester-army-native.yml'

testerarmy_native_macos:
  - *testerarmy_native_inputs
  - 'apps/gui-go/e2e/tester-army-native/wkwebview.swift'
  - 'apps/gui-go/e2e/tester-army-native/macos-engine.mjs'
  - 'apps/gui-go/e2e/tester-army-native/macos-history.e2e.mjs'
  - 'e2e.macos-history.config.ts'

testerarmy_native_linux:
  - *testerarmy_native_inputs
  - 'apps/gui-go/e2e/tester-army-native/webkitgtk.py'

testerarmy_native_windows:
  - *testerarmy_native_inputs
  - 'apps/gui-go/e2e/tester-army-native/{engine,webview2,webview2.e2e}.mjs'
  - 'apps/gui-go/cmd/webview-probe/**'
  - 'apps/gui-go/go.{mod,sum}'
  - 'e2e.native.config.ts'

testerarmy_windows_product:
  - *testerarmy_gui_inputs
  - *rust_build_inputs
  - *daemon_runtime_inputs
  - *cli_inputs
  - 'apps/gui-go/*.{go,mod,sum,c,h,m,mm,syso,rc,ico,manifest,json}'
  - 'apps/gui-go/internal/**'
  - 'apps/gui-go/windows/**'
  - 'apps/gui-go/icons/**'
  - 'packages/desktop-host-go/**'
  - 'apps/gui-go/packaging/windows/**'
  - 'apps/gui-go/e2e/build_windows.py'
  - 'apps/gui-go/e2e/windows_startup_ready.mjs'
  - 'apps/gui-go/e2e/windows-startup-scenarios.mjs'
  - 'apps/gui-go/e2e/tester-army-native/{engine,windows-product.e2e,windows-history-seed}.mjs'
  - 'e2e.windows-product.config.ts'
  - '.github/workflows/tester-army-native.yml'
