name: 'Publish to AUR (uniclipboard-git)'
run-name: "aur-git-${{ github.run_number }}"

# Triggers:
#   1. pull_request touching the PKGBUILD, this workflow or the build script: build the package in a clean Arch
#      container and nothing else (no secrets, no AUR access).
#   2. push to main with the same paths: the same build. It never publishes.
#   3. workflow_dispatch: the same build and, only when `publish` is set and the run is on main, the push to the AUR.
#
# History: a push to main used to publish the PKGBUILD to the AUR directly, so a PKGBUILD that could not build was
# live within minutes of a merge. Publishing is now a deliberate dispatch that runs behind a successful build of
# exactly the commit being published.
#
# Not bound to release.published: a -git package tracks main, and pkgver is recomputed by makepkg on the user's
# machine, so releases are not its heartbeat. The AUR copy only needs to change when the PKGBUILD does.
on:
  pull_request:
    paths:
      - 'packaging/aur/uniclipboard-git/**'
      - 'scripts/ci/build-aur-package.sh'
      - '.github/workflows/aur.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/aur/uniclipboard-git/**'
      - 'scripts/ci/build-aur-package.sh'
      - '.github/workflows/aur.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the built PKGBUILD and .SRCINFO to the AUR (main only). Off = build and render only'
        required: false
        type: boolean
        default: false

# The AUR is a single-branch git remote and concurrent pushes trample each other. Runs are serialized;
# cancel-in-progress=false lets a running publish finish instead of being cut off half way.
concurrency:
  group: aur-uniclipboard-git-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the package in a clean Arch container
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The official Arch image: the same distribution users build on, with the toolchain makepkg expects.
    container: archlinux:base-devel
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          path: src
          # Full history and tags: pkgver() runs `git describe`, which needs them.
          fetch-depth: 0

      - name: Build with makepkg
        id: build
        shell: bash
        run: |
          # The workspace is owned by another user inside the container; the script clones from it as the build user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          commit="$(git -C src rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          src/scripts/ci/build-aur-package.sh "$GITHUB_WORKSPACE/src" "$commit" "$GITHUB_WORKSPACE/aur-build-evidence"

      - name: Upload the package and its evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aur-uniclipboard-git-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: aur-build-evidence
          retention-days: 14
          if-no-files-found: warn

  install:
    name: Install and launch in a clean Arch container
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A fresh container that did not build the package: its declared dependencies are the only runtime libraries present.
    container:
      image: archlinux:base-devel
      options: --init --cap-add IPC_LOCK
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/download-artifact@v4
        with:
          name: aur-uniclipboard-git-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: built

      - name: Install the package and launch the shipped form
        shell: bash
        run: |
          pkg="$(ls built/*.pkg.tar.zst)"
          src/scripts/ci/check-arch-package.sh "$pkg" "$GITHUB_WORKSPACE/aur-install-evidence"

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aur-uniclipboard-git-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: aur-install-evidence
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Sync PKGBUILD to AUR
    needs: [build, install]
    # Only a deliberate dispatch on main publishes. A pull request or a push never reaches this job, so a PKGBUILD that
    # has not been built cannot be pushed, and a branch cannot publish its own PKGBUILD.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # base-devel already has makepkg; git and openssh are installed below.
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install runtime tools
        shell: bash
        run: |
          pacman -Sy --noconfirm --needed git openssh sudo namcap

      - name: Configure non-root builder user
        shell: bash
        run: |
          # makepkg refuses to run as root. NOPASSWD sudo exists only inside this one-off container.
          useradd -m -G wheel -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Check that the published commit is the one that was built
        shell: bash
        env:
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          test "$(git -C src rev-parse HEAD)" = "$BUILT"

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret missing."
            echo "::error::Generate with: ssh-keygen -t ed25519 -C aur-uniclipboard -f aur"
            echo "::error::Then upload aur.pub at https://aur.archlinux.org/account/<user>/edit/"
            echo "::error::And put the private key (aur) into repo secret AUR_SSH_PRIVATE_KEY."
            exit 1
          fi
          install -d -m700 -o builder -g builder /home/builder/.ssh
          # printf '%s\n' 而不是 echo —— echo 在 ed25519 末尾换行处理诡异，曾
          # 在 ssh load 阶段触发 "invalid format"。printf 行为可预测。
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur

          # Host key pinning：
          # ssh-keyscan 本身是 TOFU——它接受 scan 那一刻路径上拿到的任何 key，
          # 包括 MITM 注入的 key。仅 keyscan 不算"防 MITM"。
          # 真正的信任锚需要带外验证：把 AUR 官方公布的 host key fingerprint
          # 存进 GH repository variable `AUR_HOST_FINGERPRINTS`（多算法用逗号
          # 分隔，至少含 ed25519，格式 "SHA256:..."），来源：
          #   https://wiki.archlinux.org/title/AUR_submission_guidelines
          # 已配置 → scan 后比对，对不上 fail-fast（MITM 或 AUR 轮换了 key）。
          # 未配置 → 退化为 keyscan + warning，保留首次部署可跑通。
          ssh-keyscan -H aur.archlinux.org > /tmp/aur_known_hosts 2>/dev/null
          EXPECTED_FPS='${{ vars.AUR_HOST_FINGERPRINTS }}'
          if [ -n "$EXPECTED_FPS" ]; then
            SCANNED_FPS=$(ssh-keygen -lf /tmp/aur_known_hosts | awk '{print $2}' | sort -u)
            echo "Scanned fingerprints:"
            printf '  %s\n' $SCANNED_FPS
            MATCH=false
            IFS=',' read -ra EXP_LIST <<< "$EXPECTED_FPS"
            for fp in "${EXP_LIST[@]}"; do
              fp="${fp// /}"
              [ -z "$fp" ] && continue
              if printf '%s\n' "$SCANNED_FPS" | grep -qxF "$fp"; then
                echo "Matched pinned fingerprint: $fp"
                MATCH=true
              fi
            done
            if [ "$MATCH" != "true" ]; then
              echo "::error::AUR host key fingerprint mismatch — possible MITM or AUR rotated its host key."
              echo "::error::Expected one of: $EXPECTED_FPS"
              echo "::error::Got: $(printf '%s,' $SCANNED_FPS)"
              echo "::error::Verify via https://wiki.archlinux.org/title/AUR_submission_guidelines"
              echo "::error::and update the AUR_HOST_FINGERPRINTS repo variable if AUR legitimately rotated."
              exit 1
            fi
          else
            echo "::warning::AUR_HOST_FINGERPRINTS repo variable not set — using TOFU keyscan."
            echo "::warning::To pin, run: gh variable set AUR_HOST_FINGERPRINTS --body 'SHA256:...,SHA256:...'"
            echo "::warning::Source the fingerprints from https://wiki.archlinux.org/title/AUR_submission_guidelines"
          fi
          cp /tmp/aur_known_hosts /home/builder/.ssh/known_hosts

          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            IdentitiesOnly yes
          EOF
          chown -R builder:builder /home/builder/.ssh

      - name: Clone AUR repository
        shell: bash
        run: |
          # AUR 的设计：clone 一个未注册的包名会成功（拿到空 repo），首次 push
          # 时后端校验 PKGBUILD 并注册新包名。所以 clone 失败 = SSH 配置或账号问题，
          # 不是"包名未注册"。直接 fail-fast。
          sudo -u builder git clone ssh://aur@aur.archlinux.org/uniclipboard-git.git /home/builder/aur

      - name: Render PKGBUILD with current pkgver snapshot
        shell: bash
        run: |
          cd src
          # git describe 输出形如 v0.10.1-alpha.2-3-g1234567，经 sed 变成
          # 0.10.1.alpha.2.r3.g1234567，与 PKGBUILD 内 pkgver() 函数算法一致。
          # CI 这步只更新 web 视图，用户 makepkg 时仍以 pkgver() 重算为准。
          PKGVER=$(git describe --long --tags --abbrev=7 2>/dev/null \
            | sed 's/^v//; s/\([^-]*-g\)/r\1/; s/-/./g' \
            || printf "0.0.0.r%s.g%s" \
                 "$(git rev-list --count HEAD)" \
                 "$(git rev-parse --short=7 HEAD)")
          echo "Computed pkgver=$PKGVER"
          echo "PKGVER=$PKGVER" >> "$GITHUB_ENV"

          install -m644 -o builder -g builder \
            packaging/aur/uniclipboard-git/PKGBUILD /home/builder/aur/PKGBUILD
          # sed 替换 pkgver= 那一行；用 # 作分隔符避免 $PKGVER 内任何 / 干扰。
          sudo -u builder sed -i "s#^pkgver=.*#pkgver=$PKGVER#" /home/builder/aur/PKGBUILD

      - name: Generate .SRCINFO
        shell: bash
        run: |
          cd /home/builder/aur
          # .SRCINFO 是 AUR web 索引读取的元数据；必须每次 PKGBUILD 变化时同步重生成。
          sudo -u builder bash -c 'makepkg --printsrcinfo > .SRCINFO'

      - name: Diff against AUR remote
        id: diff
        shell: bash
        run: |
          cd /home/builder/aur
          sudo -u builder git config user.email "aur@uniclipboard.app"
          sudo -u builder git config user.name "UniClipboard Bot"
          sudo -u builder git add PKGBUILD .SRCINFO
          if sudo -u builder git diff --cached --quiet; then
            echo "No changes to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "=== staged diff ==="
            sudo -u builder git --no-pager diff --cached
            COMMIT_MSG="chore: sync from upstream main @ ${GITHUB_SHA::7} (pkgver=$PKGVER)"
            sudo -u builder git commit -m "$COMMIT_MSG"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to AUR
        if: ${{ steps.diff.outputs.changed == 'true' }}
        shell: bash
        run: |
          cd /home/builder/aur
          # AUR 默认分支是 master（旧 git 默认），不要写 main。
          sudo -u builder git push origin HEAD:master

      - name: Upload rendered artifacts
        # 不管推没推都上传，方便人工 review 时下载。
        uses: actions/upload-artifact@v4
        with:
          name: aur-uniclipboard-git
          path: |
            /home/builder/aur/PKGBUILD
            /home/builder/aur/.SRCINFO
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo "## AUR sync — uniclipboard-git :package:"
            echo ""
            echo "- **pkgver**: \`${PKGVER}\`"
            echo "- **Source commit**: \`${GITHUB_SHA::7}\`"
            echo "- **Changed**: ${{ steps.diff.outputs.changed }}"
            echo "- **Pushed**: ${{ steps.diff.outputs.changed == 'true' }}"
            echo ""
            echo "AUR page: https://aur.archlinux.org/packages/uniclipboard-git"
          } >> "$GITHUB_STEP_SUMMARY"
