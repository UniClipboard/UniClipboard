name: 'Build CLI'
run-name: "build-cli-${{ inputs.platform || 'all' }}-${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select build platform'
        required: true
        type: choice
        options:
          - 'macos-aarch64'
          - 'macos-x86_64'
          - 'ubuntu-22.04'
          - 'ubuntu-22.04-arm'
          - 'windows-latest'
          - 'all'
        default: 'all'
      channel:
        description: '发布渠道(决定 uniclipd 编译期嵌入的 APP_ENV)'
        required: false
        type: choice
        options:
          - 'stable'
          - 'alpha'
          - 'beta'
          - 'rc'
        default: 'stable'
      save_cache:
        description: '是否保存构建缓存(用于手动验证 cache warmup)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_only:
        type: boolean
        default: false
      upload_symbols:
        type: boolean
        default: true
      platform:
        description: 'Select build platform'
        required: false
        type: string
        default: 'all'
      branch:
        description: 'Branch to build'
        required: false
        type: string
        default: ''
      channel:
        description: '发布渠道,决定 uniclipd 编译期嵌入的 APP_ENV'
        required: false
        type: string
        default: 'stable'
      linux_only:
        description: >-
          Build only the Linux musl targets. Release sets this because build.yml
          packages the macOS and Windows x64 CLI archives from the app build's
          uniclipd sidecar (same target triple, profile and telemetry env).
        required: false
        type: boolean
        default: false
      save_cache:
        description: '是否保存构建缓存'
        required: false
        type: boolean
        default: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select-targets.outputs.matrix }}
      windows-runner: ${{ steps.select-windows-runner.outputs.runner }}
      windows-runner-source: ${{ steps.select-windows-runner.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Windows runner
        id: select-windows-runner
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.WINDOWS_RUNNER_STATUS_TOKEN }}
        run: node scripts/ci/select-windows-runner.mjs

      - name: Generate matrix
        id: set-matrix
        env:
          WINDOWS_RUNNER: ${{ steps.select-windows-runner.outputs.runner }}
        run: |
          # CLI Linux target 选 musl 静态编译:
          # uniclipd 走 ring + rustls (无 aws-lc-sys / 无 openssl-sys),依赖图
          # 里没有 C 库,musl 静态链可以一气呵成,glibc 完全无关。产物可直接
          # 在任意 Linux (包括 Ubuntu 20.04 / Alpine / 老 RHEL) 上跑。
          # 容器仍用 debian:bookworm 拿 musl-tools / cmake / clang 工具链。
          PLATFORM="${{ inputs.platform || 'all' }}"
          if [ "$PLATFORM" == "all" ]; then
            echo "matrix=[{\"platform\":\"macos-latest\",\"target\":\"aarch64-apple-darwin\",\"args\":\"--target aarch64-apple-darwin\"},{\"platform\":\"macos-latest\",\"target\":\"x86_64-apple-darwin\",\"args\":\"--target x86_64-apple-darwin\"},{\"platform\":\"ubuntu-22.04\",\"target\":\"x86_64-unknown-linux-musl\",\"args\":\"--target x86_64-unknown-linux-musl\",\"container\":\"ghcr.io/uniclipboard/build-bookworm:latest\"},{\"platform\":\"ubuntu-22.04-arm\",\"target\":\"aarch64-unknown-linux-musl\",\"args\":\"--target aarch64-unknown-linux-musl\",\"container\":\"ghcr.io/uniclipboard/build-bookworm:latest\"},{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"x86_64-pc-windows-msvc\",\"args\":\"\"}]" >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "macos-aarch64" ]; then
            echo 'matrix=[{"platform":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "macos-x86_64" ]; then
            echo 'matrix=[{"platform":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "ubuntu-22.04" ]; then
            echo 'matrix=[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-musl","args":"--target x86_64-unknown-linux-musl","container":"ghcr.io/uniclipboard/build-bookworm:latest"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "ubuntu-22.04-arm" ]; then
            echo 'matrix=[{"platform":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-musl","args":"--target aarch64-unknown-linux-musl","container":"ghcr.io/uniclipboard/build-bookworm:latest"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "windows-latest" ] || [ "$PLATFORM" == "windows-x86_64" ]; then
            echo "matrix=[{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"x86_64-pc-windows-msvc\",\"args\":\"\"}]" >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "windows-arm64" ]; then
            # Release accepts the app's platform names; there is no Windows
            # arm64 CLI archive, so this selection builds no CLI target.
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          else
            echo "Error: Unknown platform '$PLATFORM'. Valid options: all, macos-aarch64, macos-x86_64, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-x86_64, windows-arm64"
            exit 1
          fi

      - name: Select CLI targets
        id: select-targets
        # With linux_only, keep only the musl targets: Linux CLI builds are
        # musl-static while the app ships glibc binaries, so they cannot reuse
        # the app build's uniclipd. Every other target is packaged by build.yml.
        env:
          MATRIX: ${{ steps.set-matrix.outputs.matrix }}
          LINUX_ONLY: ${{ inputs.linux_only }}
        run: |
          node -e '
            const all = JSON.parse(process.env.MATRIX)
            const keep = process.env.LINUX_ONLY === "true" ? all.filter(e => e.target.includes("-linux-musl")) : all
            console.log("matrix=" + JSON.stringify(keep))
          ' >> "$GITHUB_OUTPUT"

  # The shipped `uniclipd` daemon is built first (static musl on Linux). The Go
  # CLI job then packages it next to the CLI.
  build-sidecar:
    name: Build sidecar ${{ matrix.target }}
    needs: setup-matrix
    if: needs.setup-matrix.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner || matrix.platform }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    environment: ${{ github.ref == 'refs/heads/main' && 'desktop-build-cache-writer' || 'desktop-build-cache-reader' }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      # Inline atomic operations: musl linking omits libgcc outline-atomic helpers.
      CFLAGS_aarch64_unknown_linux_musl: "-mno-outline-atomics"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static"
    steps:
      # Linux 容器走预构建镜像 (.github/docker/build-bookworm.Dockerfile),
      # 含 musl-tools / build-essential / clang / cmake 等 CLI 编译所需 + Tauri 桌面端依赖。
      # 镜像由 build-base-image.yml 维护。

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive
          persist-credentials: false
          # MBX inherits predictions from earlier Cargo.lock revisions through Git history.
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Set up Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: resolve pinned Rust channel
        id: rust-channel
        # 见 build.yml 同名 step:CI 装 rust-toolchain.toml 钉死的 channel
        # (而非浮动 @stable),让 Swatinem/rust-cache 的 rust-environment-hash
        # key 在 warmup 与 tag build 之间保持稳定,避免 stable 补丁版漂移
        # (如 1.96.0 -> 1.96.1)导致缓存 key 失配、全量冷编译。
        shell: bash
        run: |
          channel=$(grep -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "pinned Rust channel: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          # Cross target 直接装到 cargo 实际使用的 pinned toolchain 上,
          # 因此不再需要单独的 `rustup target add` step。Linux 走 musl,
          # macOS 装两个 darwin target,Windows host=msvc 为 noop。
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Prepend cargo bin to PATH
        # 见 build.yml 同名 step 注释:绕开 macos-15-arm64 image 20260511+
        # Homebrew rustup 多链导致 `cargo` 落到 rustup-init 的问题。
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Isolate pinned build toolchain
        if: runner.environment == 'github-hosted'
        env:
          UC_PINNED_RUST: ${{ steps.rust-channel.outputs.channel }}
        run: node scripts/ci/isolate-build-toolchain.mjs

      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: cli-${{ matrix.target }}
          access: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && 'write' || 'read' }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: cli-${{ matrix.target }}
          cache-targets: false
          # 只在 main 写缓存,tag/PR 只读。详见 build.yml 同名 step 的注释。
          save-if: ${{ inputs.save_cache || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      - name: resolve APP_ENV from channel
        id: resolve-env
        env:
          UC_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: node scripts/ci/resolve-app-env.mjs

      - name: Restore musl daemon CAS snapshot
        if: contains(matrix.target, '-linux-musl') && env.UC_COMPILE_CACHE_BACKEND == 'r2'
        continue-on-error: true
        run: |
          bash scripts/ci/mbx-snapshot.sh restore --scene release-sidecar --target "${{ matrix.target }}" --component daemon --target-args="${{ matrix.args }}"

      - name: build uniclipd
        # musl 链接器 + ring/cc-rs 的 C 编译器都指到 musl-gcc,产物完全静态,
        # 不再链 host glibc。其他 platform 这两个 env 是 noop。
        #
        # `-C relocation-model=static` 禁用 PIE。Rust 1.71+ 的
        # x86_64-unknown-linux-musl target 默认 position-independent-executables=true,
        # 即使全静态链 (ldd 报 "statically linked",无 DT_NEEDED) 仍会写入
        # PT_INTERP=/lib/ld-musl-x86_64.so.1。glibc 主机上没有该 loader,
        # execve 直接 ENOENT,shell 报 "no such file or directory" (但报的是
        # 二进制本身,因为内核没法把 errno 区分成 "interpreter 找不到")。
        # 关掉 PIE 后产物变成无 PT_INTERP 的经典 static ELF,任意 Linux x86_64
        # (glibc / musl) 都能直接 exec。这才符合 ace8685f 切 musl 的初衷。
        env:
          # uniclipd embeds these at compile time (option_env!), exactly like the
          # app's sidecar build in build.yml, so every shipped daemon reports to
          # the same Sentry/PostHog projects and environment.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          APP_ENV: ${{ steps.resolve-env.outputs.app_env }}
        run: |
          # ADR-008 D13: the standalone `uniclipd` daemon ships in the same
          # tarball as the CLI so `uniclip start` spawns it as a sibling. The
          # musl static-link toolchain configured above (musl-gcc +
          # cmake/clang in the bookworm container, -mno-outline-atomics on
          # aarch64) builds it fully static.
          bash scripts/build-cache/mbx.sh --exec cargo build --release -p uc-daemon --bin uniclipd ${{ matrix.args }} --timings

      - name: Save musl daemon CAS snapshot
        if: contains(matrix.target, '-linux-musl') && env.UC_COMPILE_CACHE_BACKEND == 'r2' && inputs.build_only && inputs.save_cache && github.ref == 'refs/heads/main' && github.ref_protected
        continue-on-error: true
        run: |
          bash scripts/ci/mbx-snapshot.sh save --scene release-sidecar --target "${{ matrix.target }}" --component daemon --target-args="${{ matrix.args }}"

      - name: Upload Sentry debug symbols
        if: inputs.upload_symbols != false && inputs.build_only != true
        # uniclipd embeds the backend Sentry DSN, so its crashes need these
        # symbols to be readable. Same upload as build.yml; skipped when the
        # Sentry upload credentials are not configured.
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN/SENTRY_PROJECT not configured — skipping debug-files upload"
            exit 0
          fi
          npm install -g @sentry/cli
          if [ -n "${{ matrix.args }}" ]; then
            TARGET_DIR="target/${{ matrix.target }}/release"
          else
            TARGET_DIR="target/release"
          fi
          echo "Uploading debug files from $TARGET_DIR"
          sentry-cli debug-files upload --include-sources "$TARGET_DIR"

      - name: Upload Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-cli-sidecar-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: package sidecar artifact
        # One tar keeps the executable bit through artifact upload/download.
        shell: bash
        run: |
          # Windows builds with the host default target (args=""), landing in
          # target/release; the other targets pass --target.
          if [ -n "${{ matrix.args }}" ]; then
            BIN_DIR="target/${{ matrix.target }}/release"
          else
            BIN_DIR="target/release"
          fi
          EXE=""
          case "${{ matrix.target }}" in *windows*) EXE=".exe" ;; esac
          mkdir -p sidecar-stage
          cp "$BIN_DIR/uniclipd$EXE" sidecar-stage/
          tar -cf sidecar.tar -C sidecar-stage .

      - name: upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-sidecar-${{ matrix.target }}
          path: sidecar.tar
          if-no-files-found: error
          retention-days: 3

      - name: Summarize MBX cache requests
        if: always() && hashFiles('scripts/ci/summarize-mbx.py') != ''
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then python_cmd=python; else python_cmd=python3; fi
          "$python_cmd" scripts/ci/summarize-mbx.py "$RUNNER_TEMP/mbx-evidence"

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore


  # User-facing CLI (Go, apps/cli-go): no Rust toolchain and no container, it
  # only packages the daemon from build-sidecar. It never builds or links the
  # Rust development CLI.

  build-cli:
    name: Build CLI ${{ matrix.target }}
    needs: [setup-matrix, build-sidecar]
    if: inputs.build_only != true && needs.setup-matrix.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner || matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          # The module pins its Go version and toolchain.
          go-version-file: apps/cli-go/go.mod
          cache-dependency-path: apps/cli-go/go.sum

      - name: download uniclipd sidecar
        uses: actions/download-artifact@v6
        with:
          name: cli-sidecar-${{ matrix.target }}
          path: sidecar-artifact

      - name: stage uniclipd sidecar
        shell: bash
        run: |
          mkdir -p sidecar
          tar -xf sidecar-artifact/sidecar.tar -C sidecar

      - name: build Go CLI
        shell: bash
        run: |
          EXE=""
          case "${{ matrix.target }}" in *windows*) EXE=".exe" ;; esac
          mkdir -p target/go-cli
          scripts/ci/build-go-cli.sh "${{ matrix.target }}" "target/go-cli/uniclip$EXE"

      - name: package CLI binary
        id: package
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXE=""
          case "${{ matrix.target }}" in *windows*) EXE=".exe" ;; esac
          bash scripts/ci/package-cli.sh "${{ matrix.target }}" "target/go-cli/uniclip$EXE" "sidecar/uniclipd$EXE"

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: uniclipboard-cli-*
