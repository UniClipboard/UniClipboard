name: Build CLI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_target:
        type: choice
        default: none
        description: Build only this Desktop test target with a fresh matching CLI (no publication)
        options: [none, darwin-arm64, darwin-amd64, windows-amd64, windows-arm64, linux-amd64, linux-arm64]
      test_format:
        type: choice
        default: default
        description: Test package format; default selects DMG, setup EXE or DEB for the target
        options: [default, dmg, app.tar.gz, setup.exe, portable.zip, deb, rpm, archlinux, AppImage, AppImage.tar.gz, update.tar.gz]
      native_gui:
        type: boolean
        default: false
        description: Run the standard native-window scenario on all six OS/architecture targets
      sandbox_run_id:
        type: string
        default: ''
        description: Run native Nix, Flatpak and Snap acceptance from a completed Desktop candidate
      desktop_only:
        type: boolean
        default: false
        description: Run the six-target Desktop workflow with the already locked CLI
      distribution:
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      distribution:
        type: boolean
        default: false
      joint:
        type: boolean
        default: false
    secrets:
      POSTHOG_PROJECT_KEY:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
permissions:
  contents: read
  actions: read
env:
  CLI_METADATA: ${{ inputs.joint && 'dist/joint-plan/products.toml' || 'release/products.toml' }}
jobs:
  prepare:
    if: ${{ !inputs.desktop_only && !inputs.sandbox_run_id && !inputs.native_gui && (!inputs.test_target || inputs.test_target == 'none') }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.joint
        with:
          name: joint-release-plan
          path: dist/joint-plan
      - id: targets
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          matrix=$(python3 tools/release/release.py matrix --metadata "$CLI_METADATA")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  targets:
    needs: prepare
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.joint
        with:
          name: joint-release-plan
          path: dist/joint-plan
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Import Apple distribution identity
        if: inputs.distribution && matrix.goos == 'darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 tools/package/signing.py keychain --path "$RUNNER_TEMP/unic-cli-signing.keychain-db" --env-output "$GITHUB_ENV"
      - name: Build exact CLI pair
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          UNIC_POSTHOG_HOST: ${{ inputs.distribution && vars.POSTHOG_HOST || '' }}
          UNIC_POSTHOG_PROJECT_TOKEN: ${{ inputs.distribution && secrets.POSTHOG_PROJECT_KEY || '' }}
        run: go run ./tools/package -product cli -metadata "$CLI_METADATA" -output dist/cli
      - name: Native executable identity acceptance
        run: python tools/release/release.py smoke --directory dist/cli
      - name: Production headless E2E
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: make headless-e2e
      - uses: actions/setup-node@v6
        if: matrix.target == 'linux-amd64'
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: CLI release and v1 upgrade process E2E
        if: matrix.target == 'linux-amd64'
        run: python3 e2e/release/run.py
      - name: Joint release planning and acceptance process E2E
        if: matrix.target == 'linux-amd64'
        run: python3 e2e/release/joint_acceptance.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.target == 'linux-amd64' }}
        with:
          name: joint-release-process-acceptance
          path: .cache/joint-release-e2e/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.target == 'linux-amd64' }}
        with:
          name: cli-release-upgrade-acceptance
          path: |
            .cache/release-e2e/report.json
            .cache/release-e2e/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always() && matrix.goos == 'darwin'
        run: |
          if [ -f "$RUNNER_TEMP/unic-cli-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/unic-cli-signing.keychain-db"; fi
  assemble:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.joint
        with:
          name: joint-release-plan
          path: dist/joint-plan
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Restore pinned npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: release-npm-v1-${{ runner.os }}-${{ runner.arch }}-11.21.2
      - name: Select npm with dist-tag OIDC support
        run: npm install --global npm@11.21.2
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/targets
      - name: Assemble exact npm package set
        run: python3 tools/release/release.py assemble --metadata "$CLI_METADATA" --input dist/targets --output dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: cli-npm-candidate
          path: dist/npm/
          if-no-files-found: error

  desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_only && (!inputs.test_target || inputs.test_target == 'none')
    uses: ./.github/workflows/build-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      distribution: ${{ inputs.distribution }}
    secrets: inherit

  sandboxes:
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox_run_id != '' && (!inputs.test_target || inputs.test_target == 'none')
    uses: ./.github/workflows/sandbox-acceptance.yml
    with:
      source_sha: ${{ github.sha }}
      candidate_run_id: ${{ inputs.sandbox_run_id }}

  native-gui:
    if: github.event_name == 'workflow_dispatch' && inputs.native_gui && (!inputs.test_target || inputs.test_target == 'none')
    uses: ./.github/workflows/native-desktop-acceptance.yml
    with:
      source_sha: ${{ github.sha }}

  test-package:
    if: github.event_name == 'workflow_dispatch' && inputs.test_target != '' && inputs.test_target != 'none'
    uses: ./.github/workflows/build-desktop-test.yml
    with:
      source_sha: ${{ github.sha }}
      target: ${{ inputs.test_target }}
      format: ${{ inputs.test_format }}
      conflicting_options: ${{ inputs.desktop_only || inputs.native_gui || inputs.sandbox_run_id != '' || inputs.distribution }}
