name: Build Desktop
on:
  workflow_dispatch:
    inputs:
      distribution:
        type: boolean
        default: false
        description: Sign and notarize macOS candidates without publishing
  workflow_call:
    secrets:
      UNIC_UPDATE_PRIVATE_KEY:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_PASSWORD:
        required: false
    inputs:
      distribution:
        type: boolean
        default: false
      source_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: matrix
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          echo "matrix=$(python3 tools/release/release.py matrix --product desktop)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import tomllib, re
          p = tomllib.load(open('release/products.toml', 'rb'))['products']['desktop']
          assert re.fullmatch('[a-f0-9]{64}', p['cli_manifest_sha256']), 'Select an accepted immutable CLI lock before building Desktop'
          PY
  targets:
    needs: prepare
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Import Apple distribution identity
        if: matrix.goos == 'darwin' && inputs.distribution
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 tools/package/signing.py keychain --path "$RUNNER_TEMP/unic-desktop.keychain-db" --env-output "$GITHUB_ENV"
      - name: Fetch exact accepted CLI files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/package/desktop.py fetch-cli --allow-ci --target '${{ matrix.target }}' --output dist/cli-input
      - name: Stage and inspect native Desktop
        shell: bash
        run: |
          go run ./tools/package -product desktop -target '${{ matrix.target }}' -cli-manifest dist/cli-input/release-manifest.json -output dist/stage
          python tools/package/desktop.py smoke --stage dist/stage
      - name: Sign Desktop payload
        if: matrix.goos == 'darwin' && inputs.distribution
        run: python3 tools/package/desktop.py sign --stage dist/stage --identity "$UNIC_MACOS_SIGNING_IDENTITY"
      - name: Install pinned Linux format tools
        if: matrix.goos == 'linux'
        run: |
          python3 tools/package/install-tools.py --output dist/tools/nfpm
          python3 tools/package/install-tools.py --tool appimagetool --output dist/tools/appimagetool
          python3 tools/package/install-tools.py --tool appimage-runtime --output dist/tools/appimage-runtime
      - name: Construct Linux packages
        if: matrix.goos == 'linux'
        env:
          UNIC_UPDATE_PRIVATE_KEY: ${{ inputs.distribution && secrets.UNIC_UPDATE_PRIVATE_KEY || '' }}
        run: |
          for format in deb rpm archlinux update.tar.gz; do
            python3 tools/package/desktop.py package --stage dist/stage --format "$format" --nfpm "$PWD/dist/tools/nfpm" --output "dist/packages/$format"
          done
          for format in AppImage AppImage.tar.gz; do
            python3 tools/package/desktop.py package --stage dist/stage --format "$format" --appimagetool "$PWD/dist/tools/appimagetool" --appimage-runtime "$PWD/dist/tools/appimage-runtime" --output "dist/packages/$format"
          done
      - name: Construct macOS packages
        if: matrix.goos == 'darwin'
        env:
          UNIC_UPDATE_PRIVATE_KEY: ${{ inputs.distribution && secrets.UNIC_UPDATE_PRIVATE_KEY || '' }}
          DISTRIBUTION: ${{ inputs.distribution }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          package_stage=dist/stage
          if [ "$DISTRIBUTION" = true ]; then
            python3 tools/package/desktop.py notarize-stage --stage dist/stage --output dist/notarized
            package_stage=dist/notarized
          fi
          python3 tools/package/desktop.py smoke --stage "$package_stage"
          python3 tools/package/desktop.py package --stage "$package_stage" --format dmg --output dist/packages/dmg
          python3 tools/package/desktop.py package --stage "$package_stage" --format app.tar.gz --output dist/packages/app-archive
      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress --version=3.11
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Construct Windows packages (unsigned construction evidence)
        env:
          UNIC_UPDATE_PRIVATE_KEY: ${{ inputs.distribution && secrets.UNIC_UPDATE_PRIVATE_KEY || '' }}
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          python tools/package/desktop.py package --stage dist/stage --format setup.exe --output dist/packages/setup
          python tools/package/desktop.py package --stage dist/stage --format portable.zip --output dist/packages/portable
          python tools/package/desktop.py package --stage dist/stage --format update.tar.gz --output dist/packages/update
      - name: Remove temporary signing keychain
        if: always() && matrix.goos == 'darwin' && inputs.distribution
        run: security delete-keychain "$RUNNER_TEMP/unic-desktop.keychain-db"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/stage/manifest.json
            dist/notarized/manifest.json
            dist/notarized/notarization.json
            dist/packages/
          if-no-files-found: error
