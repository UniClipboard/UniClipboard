name: Build Desktop
on:
  workflow_dispatch:
    inputs:
      distribution:
        type: boolean
        default: false
        description: Sign and notarize macOS candidates without publishing
      expected_source:
        type: string
        description: Expected source SHA for a joint release
  workflow_call:
    secrets:
      UNIC_UPDATE_PRIVATE_KEY:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_PASSWORD:
        required: false
    inputs:
      distribution:
        type: boolean
        default: false
      source_sha:
        type: string
        required: true
      joint:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  DESKTOP_METADATA: ${{ inputs.joint && 'dist/cli-input/products.toml' || 'release/products.toml' }}
jobs:
  prepare:
    name: Verify six-target CLI lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - if: github.event_name == 'workflow_dispatch' && inputs.expected_source != '' && inputs.expected_source != github.sha
        run: exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source revision
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        if: inputs.joint
        with:
          name: joint-desktop-cli
          path: dist/cli-input
      - name: Check the joint CLI lock
        if: inputs.joint
        run: python3 tools/package/desktop.py check-cli --metadata "$DESKTOP_METADATA" --cli-manifest dist/cli-input/release-manifest.json
      - name: Fetch and check the standalone CLI lock
        if: '!inputs.joint'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/package/desktop.py fetch-cli --allow-ci --metadata "$DESKTOP_METADATA" --output dist/cli-input
      - uses: actions/upload-artifact@v4
        if: '!inputs.joint'
        with:
          name: locked-cli-for-desktop
          path: dist/cli-input/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
      - id: matrix
        run: |
          matrix=$(python3 tools/release/release.py matrix --product desktop --metadata "$DESKTOP_METADATA")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  targets:
    needs: prepare
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Import Apple distribution identity
        if: matrix.goos == 'darwin' && inputs.distribution
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 tools/package/signing.py keychain --path "$RUNNER_TEMP/unic-desktop.keychain-db" --env-output "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.joint && 'joint-desktop-cli' || 'locked-cli-for-desktop' }}
          path: dist/cli-input
      - name: Stage and inspect native Desktop
        shell: bash
        run: |
          go run ./tools/package -metadata "$DESKTOP_METADATA" -product desktop -target '${{ matrix.target }}' -cli-manifest dist/cli-input/release-manifest.json -output dist/stage
          python tools/package/desktop.py smoke --stage dist/stage
      - name: Sign Desktop payload
        if: matrix.goos == 'darwin' && inputs.distribution
        run: python3 tools/package/desktop.py sign --stage dist/stage --identity "$UNIC_MACOS_SIGNING_IDENTITY"
      - name: Restore Linux packaging tool downloads
        if: matrix.goos == 'linux'
        uses: actions/cache@v4
        with:
          path: .cache/packaging-tools
          key: packaging-tools-v1-${{ matrix.target }}-${{ hashFiles('packaging/tools.json') }}
          restore-keys: packaging-tools-v1-${{ matrix.target }}-
      - name: Install pinned Linux format tools
        if: matrix.goos == 'linux'
        run: |
          python3 tools/package/install-tools.py --cache-dir .cache/packaging-tools --output dist/tools/nfpm
          python3 tools/package/install-tools.py --cache-dir .cache/packaging-tools --tool appimagetool --output dist/tools/appimagetool
          python3 tools/package/install-tools.py --cache-dir .cache/packaging-tools --tool appimage-runtime --output dist/tools/appimage-runtime
      - name: Construct Linux packages
        if: matrix.goos == 'linux'
        env:
          UNIC_UPDATE_PRIVATE_KEY: ${{ inputs.distribution && secrets.UNIC_UPDATE_PRIVATE_KEY || '' }}
        run: |
          for format in deb rpm archlinux update.tar.gz; do
            python3 tools/package/desktop.py package --stage dist/stage --format "$format" --nfpm "$PWD/dist/tools/nfpm" --output "dist/packages/$format"
          done
          for format in AppImage AppImage.tar.gz; do
            python3 tools/package/desktop.py package --stage dist/stage --format "$format" --appimagetool "$PWD/dist/tools/appimagetool" --appimage-runtime "$PWD/dist/tools/appimage-runtime" --output "dist/packages/$format"
          done
      - name: Construct macOS packages
        if: matrix.goos == 'darwin'
        env:
          UNIC_UPDATE_PRIVATE_KEY: ${{ inputs.distribution && secrets.UNIC_UPDATE_PRIVATE_KEY || '' }}
          DISTRIBUTION: ${{ inputs.distribution }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          package_stage=dist/stage
          dmg_extra=()
          if [ "$DISTRIBUTION" = true ]; then
            python3 tools/package/desktop.py notarize-stage --stage dist/stage --output dist/notarized
            package_stage=dist/notarized
            dmg_extra=(--notarize-container)
          fi
          python3 tools/package/desktop.py smoke --stage "$package_stage"
          python3 tools/package/desktop.py package --stage "$package_stage" --format dmg "${dmg_extra[@]}" --output dist/packages/dmg
          python3 tools/package/desktop.py package --stage "$package_stage" --format app.tar.gz --output dist/packages/app-archive
      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis --yes --no-progress --version=3.11
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Construct Windows packages (unsigned Authenticode; separate updater signature)
        env:
          UNIC_UPDATE_PRIVATE_KEY: ${{ inputs.distribution && secrets.UNIC_UPDATE_PRIVATE_KEY || '' }}
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/package/desktop.py package --stage dist/stage --format setup.exe --output dist/packages/setup
          python tools/package/desktop.py package --stage dist/stage --format portable.zip --output dist/packages/portable
          python tools/package/desktop.py package --stage dist/stage --format update.tar.gz --output dist/packages/update
      - name: Native Windows installer lifecycle
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $identity = Get-Content dist/stage/manifest.json -Raw | ConvertFrom-Json
          python e2e/packaging/windows-upgrade-fixture.py --metadata "$env:DESKTOP_METADATA" --target "$env:TARGET" --build-number $identity.build_number
          $first = (Get-ChildItem dist/packages/setup/*.exe).FullName
          $newer = (Get-ChildItem dist/windows-upgrade-fixture/packages/*.exe).FullName
          ./e2e/packaging/windows-lifecycle.ps1 -Installer $first -Newer $newer -Receipt dist/lifecycle -Target "$env:TARGET" -Version $identity.version -BuildNumber $identity.build_number
          python tools/package/desktop.py accept --packages dist/packages/setup --receipt dist/lifecycle/report.json
      - name: Remove temporary signing keychain
        if: always() && matrix.goos == 'darwin' && inputs.distribution
        run: security delete-keychain "$RUNNER_TEMP/unic-desktop.keychain-db"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.joint && job.status != 'success' && format('joint-desktop-failure-{0}-{1}', matrix.target, github.run_attempt) || format('desktop-{0}', matrix.target) }}
          path: |
            dist/stage/manifest.json
            dist/notarized/manifest.json
            dist/notarized/notarization.json
            dist/lifecycle/
            dist/packages/
          if-no-files-found: error
