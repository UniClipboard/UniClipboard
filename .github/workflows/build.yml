name: 'Build Desktop'
run-name: "build-${{ inputs.platform || 'all' }}${{ inputs.build_mode == 'test' && '-test' || '' }}-${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      platform:
        description: '选择构建平台'
        required: true
        type: choice
        options:
          - 'macos-aarch64'
          - 'macos-x86_64'
          - 'ubuntu-22.04'
          - 'ubuntu-22.04-arm'
          - 'windows-latest'
          - 'windows-x86_64'
          - 'windows-arm64'
          - 'all'
          - 'updater-signatures'
        default: 'all'
      channel:
        description: '发布渠道(决定 Sentry/OTLP environment 标签)'
        required: false
        type: choice
        options:
          - 'stable'
          - 'alpha'
          - 'beta'
          - 'rc'
        default: 'stable'
      save_cache:
        description: '是否保存构建缓存(用于手动验证 cache warmup)'
        required: false
        type: boolean
        default: true
      build_mode:
        description: '构建方式：release 正式优化，test 快速测试包'
        type: choice
        options: ['release', 'test']
        default: 'test'
      package_cli:
        description: '同时用本次 sidecar 打包 macOS / Windows x64 CLI(仅 release 构建方式)'
        type: boolean
        default: false
      signing_self_test:
        description: 'Windows 签名机制自测:用一次性自签证书(仅在一次性 runner 上受信任)走完签名、验证、安装、更新流程;产物名带 -signing-selftest,不是可发布的签名'
        type: boolean
        default: false
      upload_symbols:
        description: '上传 Sentry 调试符号与前端 source map(仅 release 构建方式生效;关闭用于不产生生产副作用的优化构建验收)'
        type: boolean
        default: true
      updater_artifact_runs:
        description: 'For updater-signatures only: comma-separated successful Build Desktop run IDs'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      build_mode:
        description: 'Build optimization mode; publishing workflows keep release by default'
        required: false
        type: string
        default: 'release'
      platform:
        description: '选择构建平台'
        required: false
        type: string
        default: 'all'
      branch:
        description: 'Branch to build'
        required: false
        type: string
        default: ''
      channel:
        description: '发布渠道,决定 APP_ENV/VITE_APP_ENV 注入值(stable→production,其他→channel 原样)'
        required: false
        type: string
        default: 'stable'
      save_cache:
        description: '是否保存构建缓存'
        required: false
        type: boolean
        default: false
      require_signing:
        description: 'Fail the macOS app packaging when the Apple signing secrets are missing instead of ad-hoc signing'
        required: false
        type: boolean
        default: true
      signing_self_test:
        description: 'Exercise the Windows signing mechanics with a throwaway self-signed certificate trusted only on the disposable runner (artifacts are named -signing-selftest and are not a release signature)'
        required: false
        type: boolean
        default: false
      upload_symbols:
        description: 'Upload Sentry debug symbols and frontend source maps (release build mode only)'
        required: false
        type: boolean
        default: true
      package_cli:
        description: >-
          Also package the CLI archive for macOS and Windows x64 from this
          build's uniclipd sidecar (release build mode only). The CLI and app
          use the same target triple there, so one daemon build serves both.
        required: false
        type: boolean
        default: false

jobs:
  accept-updater-signatures:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'updater-signatures'
    uses: ./.github/workflows/updater-signatures.yml
    with:
      artifact_runs: ${{ inputs.updater_artifact_runs }}
    secrets: inherit

  setup-matrix:
    if: inputs.platform != 'updater-signatures'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      cli-matrix: ${{ steps.select-cli-targets.outputs.matrix }}
      macos-matrix: ${{ steps.select-macos-targets.outputs.matrix }}
      macos-smoke-matrix: ${{ steps.select-macos-targets.outputs.smoke }}
      windows-gui-matrix: ${{ steps.select-windows-gui-targets.outputs.matrix }}
      windows-runner: ${{ steps.select-windows-runner.outputs.runner }}
      windows-runner-source: ${{ steps.select-windows-runner.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Windows runner
        id: select-windows-runner
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.WINDOWS_RUNNER_STATUS_TOKEN }}
        run: node scripts/ci/select-windows-runner.mjs

      - name: Generate matrix
        id: set-matrix
        env:
          WINDOWS_RUNNER: ${{ steps.select-windows-runner.outputs.runner }}
        run: |
          # Linux 构建在 host=ubuntu-22.04 / ubuntu-22.04-arm 上启容器跑
          # (debian:bookworm, glibc 2.36),其他 platform (macOS/Windows) 不带
          # container 字段 → 直接在 host runner 跑。
          # aarch64 走 native arm runner (ubuntu-22.04-arm),避免在 x86 容器里
          # cross-compile webkit/gtk 栈;x86_64 仍在 ubuntu-22.04。
          PLATFORM="${{ inputs.platform || 'all' }}"
          if [ "$PLATFORM" == "all" ]; then
            echo "matrix=[{\"platform\":\"macos-latest\",\"target\":\"aarch64-apple-darwin\",\"args\":\"--target aarch64-apple-darwin\"},{\"platform\":\"macos-latest\",\"target\":\"x86_64-apple-darwin\",\"args\":\"--target x86_64-apple-darwin\"},{\"platform\":\"ubuntu-22.04\",\"target\":\"x86_64-unknown-linux-gnu\",\"args\":\"\",\"container\":\"ghcr.io/uniclipboard/build-bookworm:latest\"},{\"platform\":\"ubuntu-22.04-arm\",\"target\":\"aarch64-unknown-linux-gnu\",\"args\":\"\",\"container\":\"ghcr.io/uniclipboard/build-bookworm:latest\"},{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"x86_64-pc-windows-msvc\",\"args\":\"\"},{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"aarch64-pc-windows-msvc\",\"args\":\"--target aarch64-pc-windows-msvc\"}]" >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "macos-aarch64" ]; then
            echo 'matrix=[{"platform":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "macos-x86_64" ]; then
            echo 'matrix=[{"platform":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "ubuntu-22.04" ]; then
            echo 'matrix=[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","args":"","container":"ghcr.io/uniclipboard/build-bookworm:latest"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "ubuntu-22.04-arm" ]; then
            echo 'matrix=[{"platform":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu","args":"","container":"ghcr.io/uniclipboard/build-bookworm:latest"}]' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "windows-latest" ]; then
            echo "matrix=[{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"x86_64-pc-windows-msvc\",\"args\":\"\"},{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"aarch64-pc-windows-msvc\",\"args\":\"--target aarch64-pc-windows-msvc\"}]" >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "windows-x86_64" ]; then
            echo "matrix=[{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"x86_64-pc-windows-msvc\",\"args\":\"\"}]" >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" == "windows-arm64" ]; then
            echo "matrix=[{\"platform\":\"windows-latest\",\"runner\":\"$WINDOWS_RUNNER\",\"target\":\"aarch64-pc-windows-msvc\",\"args\":\"--target aarch64-pc-windows-msvc\"}]" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Unknown platform '$PLATFORM'. Valid options: all, macos-aarch64, macos-x86_64, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-x86_64, windows-arm64"
            exit 1
          fi

      - name: Select CLI targets
        id: select-cli-targets
        # The CLI archive is packaged only where the CLI and the app share a
        # target triple (macOS, Windows x64), so it can reuse the app's
        # uniclipd sidecar. Linux CLI archives are musl-static and come from
        # build-cli.yml.
        env:
          MATRIX: ${{ steps.set-matrix.outputs.matrix }}
        run: |
          node -e '
            const all = JSON.parse(process.env.MATRIX)
            const keep = all.filter(e => e.platform === "macos-latest" || e.target === "x86_64-pc-windows-msvc")
            console.log("matrix=" + JSON.stringify(keep))
          ' >> "$GITHUB_OUTPUT"

      - name: Select macOS GUI targets
        id: select-macos-targets
        # The macOS app is assembled on an arm64 runner for both architectures (Go and the Rust
        # sidecar cross-compile; the x86_64 bundle is exercised on a native Intel runner by the
        # smoke job), and from the same uniclipd/helper sidecar build-sidecar produced.
        env:
          MATRIX: ${{ steps.set-matrix.outputs.matrix }}
        run: |
          node -e '
            const all = JSON.parse(process.env.MATRIX)
            const keep = all.filter(e => e.platform === "macos-latest")
            console.log("matrix=" + JSON.stringify(keep))
            // Each shipped architecture is smoke-tested on a host of that architecture: Apple Silicon on
            // macos-latest, Intel on the native Intel runner (not Rosetta).
            const hosts = {
              "aarch64-apple-darwin": { arch: "arm64", runner: "macos-latest" },
              "x86_64-apple-darwin": { arch: "x86_64", runner: "macos-15-intel" },
            }
            const smoke = keep.map(e => ({ target: e.target, ...hosts[e.target] }))
            console.log("smoke=" + JSON.stringify(smoke))
          ' >> "$GITHUB_OUTPUT"

      - name: Select Windows GUI targets
        id: select-windows-gui-targets
        # The Windows packages are assembled on an x64 hosted runner for both architectures (Go and the
        # Rust sidecar cross-compile). Each is accepted on a disposable hosted runner of its own
        # architecture: x64 on windows-latest, arm64 on the native windows-11-arm runner (never emulated).
        env:
          MATRIX: ${{ steps.set-matrix.outputs.matrix }}
        run: |
          node -e '
            const all = JSON.parse(process.env.MATRIX)
            const hosts = {
              "x86_64-pc-windows-msvc": { arch: "amd64", smoke: "windows-latest" },
              "aarch64-pc-windows-msvc": { arch: "arm64", smoke: "windows-11-arm" },
            }
            const keep = all.filter(e => hosts[e.target]).map(e => ({ target: e.target, ...hosts[e.target] }))
            console.log("matrix=" + JSON.stringify(keep))
          ' >> "$GITHUB_OUTPUT"

  # The shipped `uniclipd` daemon is built once per target, first. The desktop
  # packagers ship it next to the GUI executable and the CLI archive ships it
  # next to the CLI, so those jobs wait for this one. The Go/Wails GUI packaging
  # is not part of this workflow yet (see docs/architecture/gui-go-tauri-retirement.md).
  build-sidecar:
    name: Build sidecar ${{ matrix.target }}
    needs: setup-matrix
    runs-on: ${{ matrix.runner || matrix.platform }}
    # matrix.container 仅 Linux 条目设置,其他 platform 该字段缺失 → null →
    # GitHub Actions 跳过容器,直接在 host runner 上执行。
    container: ${{ matrix.container || null }}
    # sccache R2, all targets (grew out of the aarch64-apple-darwin-only pilot,
    # t-0160): binds every matrix job to an environment so the sccache step
    # below can read BUILD_CACHE_R2_* secrets. github.ref is the trigger ref
    # (release tags included), not the branch actually checked out via
    # inputs.branch, matching the writer environment's own main-only
    # deployment restriction.
    environment: ${{ github.ref == 'refs/heads/main' && 'desktop-build-cache-writer' || 'desktop-build-cache-reader' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      # Linux 容器走预构建镜像 (.github/docker/build-bookworm.Dockerfile),
      # apt-get 已经在镜像里跑过,这里直接 checkout。镜像由 build-base-image.yml
      # 维护:Dockerfile 变更即重推 :latest,multi-arch (amd64/arm64) manifest。

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Configure package build mode
        id: build-mode
        env:
          UC_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
        run: node scripts/ci/configure-build-mode.mjs

      - name: resolve pinned Rust channel
        id: rust-channel
        # Single source of truth: rust-toolchain.toml (repo root). CI installs
        # that SAME pinned channel below instead of a floating `@stable`, so
        # Swatinem/rust-cache's rust-environment-hash key stays stable between
        # the weekly cache-warmup run and this release/tag build. A floating
        # stable drifts (e.g. 1.96.0 -> 1.96.1 between a Monday warmup and a
        # midweek release) and silently invalidates every Rust cache key,
        # forcing a full cold rebuild.
        shell: bash
        run: |
          channel=$(grep -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "pinned Rust channel: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          # Cross-compile targets are installed straight onto the pinned
          # toolchain that cargo actually uses (rust-toolchain.toml override),
          # so no separate `rustup target add` step is needed. Missing targets
          # here were the real cause of `Target ... is not installed`
          # (25960898069 / 25961183688, dtolnay/rust-toolchain#75), which only
          # happened because CI used to install `@stable` — a different
          # toolchain than the pinned channel cargo runs.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target == 'aarch64-pc-windows-msvc' && 'aarch64-pc-windows-msvc' || '' }}

      # sccache R2, all targets (grew out of the aarch64-apple-darwin-only
      # pilot, t-0160; modeled on Engine's ADR-029 shared bucket
      # `uniclipboard-build-cache`). Per-target object prefix keeps each
      # target's cache entries independent inside the shared bucket.
      - name: install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: configure sccache for R2
        id: sccache-config
        env:
          TARGET: ${{ matrix.target }}
          BUILD_CACHE_R2_ENDPOINT: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          BUILD_CACHE_R2_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          BUILD_CACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          if [[ -z "$BUILD_CACHE_R2_ENDPOINT" || -z "$BUILD_CACHE_R2_ACCESS_KEY_ID" || -z "$BUILD_CACHE_R2_SECRET_ACCESS_KEY" ]]; then
            echo "::warning title=sccache::R2 secrets not available in this run (e.g. fork PR); sccache stays off, falling back to the existing rust-cache target/ cache."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TARGET" in
            aarch64-apple-darwin) os_arch=darwin-arm64 ;;
            x86_64-apple-darwin) os_arch=darwin-x64 ;;
            x86_64-unknown-linux-gnu) os_arch=linux-x64 ;;
            aarch64-unknown-linux-gnu) os_arch=linux-arm64 ;;
            x86_64-pc-windows-msvc) os_arch=windows-x64 ;;
            aarch64-pc-windows-msvc) os_arch=windows-arm64 ;;
            *)
              echo "::warning title=sccache::unrecognized target '$TARGET', sccache stays off, falling back to the existing rust-cache target/ cache."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_BUCKET=uniclipboard-build-cache"
            echo "SCCACHE_ENDPOINT=$BUILD_CACHE_R2_ENDPOINT"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_KEY_PREFIX=desktop/sccache/v1/$os_arch"
            echo "AWS_ACCESS_KEY_ID=$BUILD_CACHE_R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$BUILD_CACHE_R2_SECRET_ACCESS_KEY"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Prepend cargo bin to PATH
        # macos-15-arm64 runner image 20260511+ 预装了 Homebrew rustup
        # formula,把 rustup-init multicall 软链到 /opt/homebrew/bin/cargo,
        # 导致 `cargo metadata` 命中错误 binary 并吐 rustup-init 用法。
        # dtolnay/rust-toolchain 检测到 rustup 已存在就跳过了 PATH 写入,
        # 这里强制把 rustup 真 proxy 所在目录前置,覆盖 brew 那条。
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Isolate pinned build toolchain
        if: runner.environment == 'github-hosted'
        env:
          UC_PINNED_RUST: ${{ steps.rust-channel.outputs.channel }}
        run: node scripts/ci/isolate-build-toolchain.mjs

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: sidecar-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          # The measured workspace-cache experiment still rebuilt every application crate.
          cache-workspace-crates: false
          # Compiled output is sccache/R2's job once sccache actually got R2
          # credentials; without them (e.g. fork PR, unrecognized target) this
          # falls back to caching target/ here instead of going fully cold on
          # both caches.
          cache-targets: ${{ steps.sccache-config.outputs.enabled != 'true' }}
          # 只在 main 写缓存,其他分支(含 tag 触发的 release)只读。
          # Windows Post Cache Rust 上传单次 ~2m43s (25682907543),tag run
          # 通常基于刚合入 main 的代码,命中已存的 main cache 即可,不必再
          # 写一份等价的进 GHA cache (10GB 上限)。
          save-if: ${{ inputs.save_cache || github.ref == 'refs/heads/main' }}

      - name: resolve APP_ENV from channel
        # Sentry/OTLP environment 标签来源:
        #   stable  → "production" (Sentry 默认值,符合大多数 dashboard 习惯)
        #   alpha/beta/rc → 同名,作为独立 environment
        # 该值同时注入给 Rust 后端 (APP_ENV, option_env! 编译期读取) 和前端
        # (VITE_APP_ENV, Vite 在 build 时内联),保证前后端 environment 一致。
        id: resolve-env
        env:
          UC_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: node scripts/ci/resolve-app-env.mjs

      - name: prepare uniclipd sidecar
        # ADR-008 D13: the standalone `uniclipd` daemon ships next to the GUI
        # executable so the GUI can spawn it as a sibling (uc-daemon-local
        # spawn.rs). scripts/stage-daemon.mjs builds it and stages it as
        # `target/sidecar-staging/uniclipd-<triple>`; `${{ matrix.args }}` is
        # either `--target <triple>` or empty.
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          APP_ENV: ${{ steps.resolve-env.outputs.app_env }}
        run: node scripts/stage-daemon.mjs ${{ matrix.args }} --timings

      - name: record sidecar provenance
        # Build evidence written by the job that built the binaries (source commit, hashes, toolchain).
        # The Windows packager verifies the daemon it ships against it.
        shell: bash
        run: node scripts/ci/write-sidecar-provenance.mjs --target "${{ matrix.target }}" --build-mode "${{ inputs.build_mode || 'release' }}"

      - name: Upload Sentry debug symbols
        # Test bundles are not released and should not upload symbols under the release version.
        if: inputs.build_mode != 'test' && inputs.upload_symbols != false
        # 把 release 编译出的 .dSYM (macOS) / .pdb (Windows) / DWARF (Linux)
        # 上传给 Sentry,后续 panic 上报时 Sentry 用 build-id 把地址翻译回
        # 函数名 + 文件 + 行号(配合 --include-sources 还会嵌源码片段)。
        # 没配 SENTRY_AUTH_TOKEN / SENTRY_PROJECT 时整个 step 跳过,不阻断构建。
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN/SENTRY_PROJECT not configured — skipping debug-files upload"
            exit 0
          fi
          npm install -g @sentry/cli
          # macOS 用 --target,产物在 target/<triple>/release/;
          # Linux/Windows args 为空,产物在 target/release/。
          if [ -d "target/${{ matrix.target }}/release" ]; then
            TARGET_DIR="target/${{ matrix.target }}/release"
          elif [ -d "target/release" ]; then
            TARGET_DIR="target/release"
          else
            echo "::warning::No release directory found — skipping"
            exit 0
          fi
          echo "Uploading debug files from $TARGET_DIR"
          sentry-cli debug-files upload --include-sources "$TARGET_DIR"

      - name: Upload Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-sidecar-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: package sidecar artifact
        # One tar, not loose files: it keeps the executable bits (artifact
        # upload drops them) and keeps `uniclipd-*.exe` out of the release
        # workflow's `*.exe` asset collection.
        shell: bash
        run: tar -cf sidecar.tar -C target/sidecar-staging .

      - name: upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          path: sidecar.tar
          if-no-files-found: error
          retention-days: 3

  # Go/Wails macOS app (issue #1895): UniClipboard.app around the release uniclipd and quick panel
  # helper from build-sidecar, Developer ID signed (inside-out, hardened runtime), notarized and
  # stapled, then the DMG and the updater archive. All steps are apps/gui-go/packaging/macos/package.py.
  # Without the Apple secrets (fork PRs) the bundle is only ad-hoc signed and labelled unsigned; a
  # release caller (workflow_call) fails instead of publishing that.
  package-macos-gui:
    name: Package macOS app ${{ matrix.target }}
    needs: [setup-matrix, build-sidecar]
    if: needs.setup-matrix.outputs.macos-matrix != '[]'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.macos-matrix) }}
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          # The module pins its Go version and toolchain.
          go-version-file: apps/gui-go/go.mod
          cache-dependency-path: |
            apps/gui-go/go.sum
            packages/desktop-host-go/go.sum

      - name: setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure package build mode
        id: build-mode
        env:
          UC_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
        run: node scripts/ci/configure-build-mode.mjs

      - name: resolve APP_ENV from channel
        id: resolve-env
        env:
          UC_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: node scripts/ci/resolve-app-env.mjs

      - name: Decide signing mode
        id: mode
        env:
          HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          IS_CALL: ${{ inputs.require_signing == true }}
        run: |
          if [ "$HAVE_CERT" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_CALL" = "true" ]; then
            echo "::error::The Apple signing secrets are not available; refusing to package an unsigned macOS app for a release."
            exit 1
          else
            echo "::warning::The Apple signing secrets are not available; the app is only ad-hoc signed and is NOT a distributable build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: download uniclipd sidecar
        uses: actions/download-artifact@v6
        with:
          name: sidecar-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          path: sidecar-artifact

      - name: stage sidecar
        run: |
          mkdir -p target/sidecar-staging
          tar -xf sidecar-artifact/sidecar.tar -C target/sidecar-staging
          ls -la target/sidecar-staging

      - name: build and assemble UniClipboard.app
        id: bundle
        env:
          VITE_APP_ENV: ${{ steps.resolve-env.outputs.app_env }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Frontend source map upload (apps/gui-go/vite.config.ts): the plugin runs inside the vite
          # build only when both the token and the project are present, and deletes the maps after.
          # Test-mode bundles are not releases: no upload under the real release version.
          SENTRY_AUTH_TOKEN: ${{ inputs.build_mode != 'test' && inputs.upload_symbols != false && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          VITE_SENTRY_PROJECT: ${{ inputs.build_mode != 'test' && inputs.upload_symbols != false && secrets.VITE_SENTRY_PROJECT || '' }}
        run: |
          python3 apps/gui-go/packaging/macos/package.py bundle \
            --target "${{ matrix.target }}" --variant shipping --out target/macos-gui
          echo "app=$PWD/target/macos-gui/UniClipboard.app" >> "$GITHUB_OUTPUT"

      - name: import Developer ID certificate into a temporary keychain
        if: steps.mode.outputs.signed == 'true'
        id: keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/gui-signing.keychain-db"
          IDENTITY=$(python3 apps/gui-go/packaging/macos/package.py keychain create --path "$KC" | tail -1)
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: sign (nested executables first, then the bundle)
        run: |
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
            python3 apps/gui-go/packaging/macos/package.py sign --app "${{ steps.bundle.outputs.app }}" \
              --identity "${{ steps.keychain.outputs.identity }}" --keychain "${{ steps.keychain.outputs.keychain }}"
          else
            python3 apps/gui-go/packaging/macos/package.py sign --app "${{ steps.bundle.outputs.app }}"
          fi

      - name: verify the signed bundle
        run: |
          python3 apps/gui-go/packaging/macos/verify_bundle.py --app "${{ steps.bundle.outputs.app }}" \
            --arch ${{ endsWith(matrix.target, 'aarch64-apple-darwin') && 'arm64' || 'x86_64' }} \
            --signature ${{ steps.mode.outputs.signed == 'true' && 'developer-id' || 'adhoc' }} --hardened \
            --expect-team "${{ secrets.APPLE_TEAM_ID }}" --out target/macos-gui/contract-signed.json

      - name: notarize and staple the bundle
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 apps/gui-go/packaging/macos/package.py notarize --app "${{ steps.bundle.outputs.app }}" \
            --evidence target/macos-gui/notary

      - name: updater archive from the finished bundle
        run: |
          mkdir -p target/macos-gui/dist
          python3 apps/gui-go/packaging/macos/package.py archive --app "${{ steps.bundle.outputs.app }}" \
            --out target/macos-gui/dist/UniClipboard.app.tar.gz

      - name: DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
            python3 apps/gui-go/packaging/macos/package.py dmg --app "${{ steps.bundle.outputs.app }}" \
              --target "${{ matrix.target }}" --out target/macos-gui/dist \
              --identity "${{ steps.keychain.outputs.identity }}" --keychain "${{ steps.keychain.outputs.keychain }}" \
              --notarize --evidence target/macos-gui/notary
          else
            python3 apps/gui-go/packaging/macos/package.py dmg --app "${{ steps.bundle.outputs.app }}" \
              --target "${{ matrix.target }}" --out target/macos-gui/dist
          fi

      - name: verify the distributed archive and DMG contents
        # Verification runs on copies unpacked from the shipped files, not on the build directory.
        run: |
          set -euo pipefail
          ARCH=${{ endsWith(matrix.target, 'aarch64-apple-darwin') && 'arm64' || 'x86_64' }}
          SIG=${{ steps.mode.outputs.signed == 'true' && 'developer-id' || 'adhoc' }}
          NOTARIZED=${{ steps.mode.outputs.signed == 'true' && '--notarized' || '' }}
          rm -rf "$RUNNER_TEMP/from-tar" "$RUNNER_TEMP/from-dmg" && mkdir -p "$RUNNER_TEMP/from-tar" "$RUNNER_TEMP/from-dmg"
          tar -xzf target/macos-gui/dist/UniClipboard.app.tar.gz -C "$RUNNER_TEMP/from-tar"
          python3 apps/gui-go/packaging/macos/verify_bundle.py --app "$RUNNER_TEMP/from-tar/UniClipboard.app" --arch "$ARCH" \
            --signature "$SIG" --hardened $NOTARIZED --expect-team "${{ secrets.APPLE_TEAM_ID }}" --out target/macos-gui/contract-from-tar.json
          DMG=$(ls target/macos-gui/dist/UniClipboard_*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg-mount" "$DMG"
          ditto "$RUNNER_TEMP/dmg-mount/UniClipboard.app" "$RUNNER_TEMP/from-dmg/UniClipboard.app"
          test -L "$RUNNER_TEMP/dmg-mount/Applications"
          hdiutil detach "$RUNNER_TEMP/dmg-mount"
          python3 apps/gui-go/packaging/macos/verify_bundle.py --app "$RUNNER_TEMP/from-dmg/UniClipboard.app" --arch "$ARCH" \
            --signature "$SIG" --hardened $NOTARIZED --expect-team "${{ secrets.APPLE_TEAM_ID }}" --out target/macos-gui/contract-from-dmg.json
          if [ "$SIG" = "developer-id" ]; then
            codesign --verify --strict --verbose=2 "$DMG"
            xcrun stapler validate "$DMG"
            spctl -a -vv -t open --context context:primary-signature "$DMG"
          fi
          shasum -a 256 target/macos-gui/dist/* | tee target/macos-gui/dist/SHA256SUMS.txt

      - name: remove the temporary keychain
        if: always() && steps.mode.outputs.signed == 'true'
        run: python3 apps/gui-go/packaging/macos/package.py keychain delete --path "$RUNNER_TEMP/gui-signing.keychain-db"

      - name: upload macOS app artifacts
        # The directory name carries the target triple: release.yml derives the per-target asset
        # name of the updater archive from it. Only the shipped files are in this artifact; the
        # evidence JSON goes to a separate artifact so the release asset collection never sees it.
        uses: actions/upload-artifact@v7
        with:
          name: macos-gui-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          path: |
            target/macos-gui/dist/UniClipboard_*.dmg
            target/macos-gui/dist/UniClipboard.app.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: upload macOS packaging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gui-evidence-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          path: |
            target/macos-gui/dist/SHA256SUMS.txt
            target/macos-gui/provenance.json
            target/macos-gui/contract-*.json
            target/macos-gui/notary/*.json
          if-no-files-found: warn
          retention-days: 14

  # Clean-machine acceptance of the shipped DMG. The shipping app has no profile, so it uses the real
  # data root and the real login keychain of the machine it runs on: this only ever runs on a disposable
  # GitHub-hosted runner (smoke_release.py refuses anything else). Apple Silicon runs on macos-latest,
  # Intel on the native macos-15-intel runner (x86_64 does not run under Rosetta here: the host is x86_64).
  smoke-macos-gui:
    name: Smoke macOS app ${{ matrix.arch }}
    needs: [setup-matrix, package-macos-gui]
    if: needs.package-macos-gui.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.macos-smoke-matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false

      - name: Configure package build mode
        id: build-mode
        env:
          UC_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
        run: node scripts/ci/configure-build-mode.mjs

      - name: download the shipped files
        uses: actions/download-artifact@v6
        with:
          name: macos-gui-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          path: shipped

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli-go/go.mod
          cache-dependency-path: apps/cli-go/go.sum

      - name: build the CLI used to read history back
        run: |
          mkdir -p target/go-cli
          scripts/ci/build-go-cli.sh "${{ matrix.target }}" target/go-cli/uniclip

      - name: install the DMG and run the app
        run: |
          python3 apps/gui-go/packaging/macos/smoke_release.py --dmg "$(find shipped -name 'UniClipboard_*.dmg' | head -1)" \
            --arch ${{ matrix.arch }} --signed ${{ needs.package-macos-gui.outputs.signed }} \
            --cli target/go-cli/uniclip --out smoke-evidence

      - name: upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gui-smoke-${{ matrix.arch }}${{ steps.build-mode.outputs.suffix }}
          path: smoke-evidence
          if-no-files-found: warn
          retention-days: 7

  # Go/Wails Windows packages (issue #1897): the NSIS installer and the portable zip around the release
  # uniclipd from build-sidecar. The daemon in the packages is verified against build-sidecar's record
  # (apps/gui-go/e2e/package_windows.py) and again inside the finished files
  # (windows_package_verify.py). There is no Authenticode signing yet (no product decision): a release
  # caller (workflow_call) fails instead of publishing unsigned installers.
  package-windows-gui:
    name: Package Windows ${{ matrix.arch }}
    needs: [setup-matrix, build-sidecar]
    if: needs.setup-matrix.outputs.windows-gui-matrix != '[]'
    # Always a hosted runner: the packaging is deterministic and needs nothing from the self-hosted VM.
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.sign.outputs.mode != 'unsigned' }}
    env:
      # The Windows default code page is not UTF-8; the packaging and acceptance scripts read UTF-8 files.
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.windows-gui-matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false

      - name: Decide Windows signing mode
        id: sign
        shell: bash
        env:
          # No Windows signing service or certificate is configured yet (docs/architecture/gui-go-windows-packaging.md).
          # SIGN_BACKEND is azure | pfx; its credentials are separate secrets read by apps/gui-go/packaging/windows/sign.py.
          SIGN_BACKEND: ${{ secrets.WINDOWS_SIGN_BACKEND }}
          SELF_TEST: ${{ inputs.signing_self_test == true }}
          IS_CALL: ${{ inputs.require_signing == true }}
        run: |
          if [ "$SELF_TEST" = "true" ]; then
            echo "mode=selftest" >> "$GITHUB_OUTPUT"
            echo "sfx=-signing-selftest" >> "$GITHUB_OUTPUT"
          elif [ -n "$SIGN_BACKEND" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "sfx=" >> "$GITHUB_OUTPUT"
          elif [ "$IS_CALL" = "true" ]; then
            echo "::error::No Windows code-signing backend is configured (WINDOWS_SIGN_BACKEND); refusing to package unsigned Windows installers for a release."
            exit 1
          else
            echo "::warning::No Windows code-signing backend is configured; the packages are NOT signed and are not distributable."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "sfx=" >> "$GITHUB_OUTPUT"
          fi

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/gui-go/go.mod
          cache-dependency-path: |
            apps/gui-go/go.sum
            packages/desktop-host-go/go.sum

      - name: setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure package build mode
        id: build-mode
        shell: bash
        env:
          UC_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
        run: node scripts/ci/configure-build-mode.mjs

      - name: resolve APP_ENV from channel
        id: resolve-env
        shell: bash
        env:
          UC_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: node scripts/ci/resolve-app-env.mjs

      - name: install NSIS and locate 7-Zip
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --version=3.10 -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files\7-Zip" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: download uniclipd sidecar
        uses: actions/download-artifact@v6
        with:
          name: sidecar-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}
          path: sidecar-artifact

      - name: stage sidecar
        shell: bash
        run: |
          mkdir -p target/sidecar-staging
          tar -xf sidecar-artifact/sidecar.tar -C target/sidecar-staging
          ls -la target/sidecar-staging

      - name: throwaway self-signed certificate (signing self-test only)
        if: steps.sign.outputs.mode == 'selftest'
        shell: pwsh
        run: |
          # Exercises the signing mechanics only. The certificate is trusted on THIS disposable runner so that
          # `signtool verify /pa` can pass; it proves nothing about a real publisher identity.
          $pw = [guid]::NewGuid().ToString('N')
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=UniClipboard signing SELF-TEST (not a trusted publisher)' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $pfx = Join-Path $env:RUNNER_TEMP 'selftest.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          $cer = Join-Path $env:RUNNER_TEMP 'selftest.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          # The public certificate travels with the acceptance inputs so the (separate, disposable) smoke runner
          # can trust it for the signature checks of the installed files.
          New-Item -ItemType Directory -Force target/windows-gui/inputs | Out-Null
          Copy-Item $cer target/windows-gui/inputs/selftest.cer
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)"
          "::add-mask::$pw"
          "SIGN_BACKEND=pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SIGN_PFX_PATH=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SIGN_PFX_PASSWORD=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: build the packages
        id: package
        shell: bash
        env:
          VITE_APP_ENV: ${{ steps.resolve-env.outputs.app_env }}
          VITE_SENTRY_DSN: ${{ inputs.build_mode != 'test' && secrets.VITE_SENTRY_DSN || '' }}
          # Frontend source map upload (apps/gui-go/vite.config.ts), same gate as the macOS app: test-mode
          # packages are not releases and never upload under the real release version.
          SENTRY_AUTH_TOKEN: ${{ inputs.build_mode != 'test' && inputs.upload_symbols != false && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          VITE_SENTRY_PROJECT: ${{ inputs.build_mode != 'test' && inputs.upload_symbols != false && secrets.VITE_SENTRY_PROJECT || '' }}
        run: |
          set -euo pipefail
          S=target/sidecar-staging
          SIGN=()
          if [ "${{ steps.sign.outputs.mode }}" != "unsigned" ]; then
            SIGN=(--sign-command "python apps/gui-go/packaging/windows/sign.py sign {file}")
          fi
          python apps/gui-go/e2e/package_windows.py --arch ${{ matrix.arch }} "${SIGN[@]}" \
            --daemon "$S/uniclipd-${{ matrix.target }}.exe" --daemon-provenance "$S/sidecar-provenance.json" \
            --out target/windows-gui/shipped
          # Acceptance-only package with a higher version, so the update and downgrade scenarios have a
          # newer build of the same sources. Never uploaded as a product.
          python apps/gui-go/e2e/package_windows.py --arch ${{ matrix.arch }} "${SIGN[@]}" --acceptance-version 999.0.0 \
            --daemon "$S/uniclipd-${{ matrix.target }}.exe" --daemon-provenance "$S/sidecar-provenance.json" \
            --out target/windows-gui/newer

      - name: prove the daemon inside the finished files is the CI-built one
        shell: bash
        run: |
          REQ=()
          if [ "${{ steps.sign.outputs.mode }}" != "unsigned" ]; then REQ=(--require-signed); fi
          python apps/gui-go/e2e/windows_package_verify.py --package target/windows-gui/shipped "${REQ[@]}" --signature-out target/windows-gui/signatures.json --out target/windows-gui/payload-verification.json
          python apps/gui-go/e2e/windows_package_verify.py --package target/windows-gui/newer "${REQ[@]}" --signature-out target/windows-gui/signatures-newer.json --out target/windows-gui/payload-verification-newer.json

      - name: negative check - a failing or ineffective signature must stop the packaging (signing self-test only)
        if: steps.sign.outputs.mode == 'selftest'
        shell: bash
        run: |
          # The real signer is wrapped so that only the temporary NSIS uninstaller is mishandled: `fail` makes the
          # signing command exit non-zero (NSIS ignores that), `skip` exits 0 without signing. Neither may yield a
          # package that passes the same gates the shipped packages pass.
          S=target/sidecar-staging
          mkdir -p target/windows-gui/negative
          for mode in fail skip; do
            OUT=target/windows-gui/negative-$mode
            LOG=target/windows-gui/negative/$mode.log
            rc=0
            python apps/gui-go/e2e/package_windows.py --arch ${{ matrix.arch }} \
              --sign-command "python apps/gui-go/e2e/testdata/signer_fault.py $mode $(pwd -W)/$OUT sign {file}" \
              --daemon "$S/uniclipd-${{ matrix.target }}.exe" --daemon-provenance "$S/sidecar-provenance.json" \
              --out "$OUT" > "$LOG" 2>&1 || rc=$?
            if [ "$rc" = 0 ]; then
              # Packaging finished: the verify gate must refuse it.
              python apps/gui-go/e2e/windows_package_verify.py --package "$OUT" --require-signed \
                --signature-out target/windows-gui/negative/$mode-signatures.json --out target/windows-gui/negative/$mode-verification.json >> "$LOG" 2>&1 && vrc=0 || vrc=$?
              echo "negative $mode: packaging exit 0, verify exit $vrc" | tee -a "$LOG"
              [ "$vrc" != 0 ] || { echo "::error::negative check '$mode': an unsigned uninstaller passed both packaging and verification"; exit 1; }
            else
              echo "negative $mode: packaging exit $rc" | tee -a "$LOG"
              grep -q "did not sign the uninstaller" "$LOG" || { echo "::error::negative check '$mode': packaging failed for another reason"; tail -20 "$LOG"; exit 1; }
            fi
            rm -rf "$OUT"
          done

      - name: build the CLI used to read history back
        shell: bash
        run: |
          mkdir -p target/windows-gui/inputs
          scripts/ci/build-go-cli.sh "${{ matrix.target }}" target/windows-gui/inputs/uniclip.exe
          cp target/windows-gui/newer/ACCEPTANCE-*-setup.exe target/windows-gui/inputs/

      - name: hashes of the shipped files
        shell: bash
        run: |
          cd target/windows-gui/shipped
          sha256sum *-setup.exe *-portable.zip | tee ../SHA256SUMS.txt

      - name: upload Windows packages
        # Only the named installer and portable zip: no bare exe, manifest or evidence, so the release asset
        # collection can never pick up anything else.
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}${{ steps.sign.outputs.sfx }}
          path: |
            target/windows-gui/shipped/UniClipboard_*-setup.exe
            target/windows-gui/shipped/UniClipboard_*-portable.zip
          if-no-files-found: error
          retention-days: 7

      - name: upload acceptance inputs
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-acceptance-inputs-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}${{ steps.sign.outputs.sfx }}
          path: target/windows-gui/inputs
          if-no-files-found: error
          retention-days: 7

      - name: upload packaging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-evidence-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}${{ steps.sign.outputs.sfx }}
          path: |
            target/windows-gui/SHA256SUMS.txt
            target/windows-gui/payload-verification*.json
            target/windows-gui/negative/
            target/windows-gui/signatures*.json
            target/windows-gui/shipped/package-manifest.json
            target/windows-gui/newer/package-manifest.json
            target/sidecar-staging/sidecar-provenance.json
          if-no-files-found: warn
          retention-days: 14

  # Clean-machine acceptance of the shipped Windows packages. The shipping form has no profile, so it uses the
  # real data root and Credential Manager of the machine: it only ever runs on a disposable GitHub-hosted runner
  # (windows_package_acceptance.py refuses anything else). arm64 runs on the native windows-11-arm runner.
  smoke-windows-gui:
    name: Smoke Windows ${{ matrix.arch }}
    needs: [setup-matrix, package-windows-gui]
    if: needs.package-windows-gui.result == 'success'
    runs-on: ${{ matrix.smoke }}
    timeout-minutes: 60
    env:
      # The Windows default code page is not UTF-8; the packaging and acceptance scripts read UTF-8 files.
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.windows-gui-matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false

      - name: Configure package build mode
        id: build-mode
        shell: bash
        env:
          UC_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
        run: node scripts/ci/configure-build-mode.mjs

      - name: artifact suffix
        id: sfx
        shell: bash
        run: echo "sfx=${{ inputs.signing_self_test == true && '-signing-selftest' || '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: download the shipped files
        uses: actions/download-artifact@v6
        with:
          name: windows-gui-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}${{ steps.sfx.outputs.sfx }}
          path: shipped

      - name: download the acceptance inputs
        uses: actions/download-artifact@v6
        with:
          name: windows-gui-acceptance-inputs-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}${{ steps.sfx.outputs.sfx }}
          path: inputs

      - name: download the packaging evidence
        uses: actions/download-artifact@v6
        with:
          name: windows-gui-evidence-${{ matrix.target }}${{ steps.build-mode.outputs.suffix }}${{ steps.sfx.outputs.sfx }}
          path: package-evidence

      - name: trust the throwaway self-test certificate (signing self-test only)
        if: steps.sfx.outputs.sfx == '-signing-selftest'
        shell: pwsh
        run: |
          # Disposable runner only; proves signing mechanics, not a publisher identity.
          # The hosted arm64 runner is not elevated, so the machine stores are denied there; fall back to the
          # runner user's own stores (still only this disposable runner).
          $cer = (Resolve-Path inputs/selftest.cer).Path
          try {
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root -ErrorAction Stop | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher -ErrorAction Stop | Out-Null
            'trusted in LocalMachine stores'
          } catch {
            "LocalMachine stores unavailable ($($_.Exception.Message)); using CurrentUser stores"
            certutil -user -f -addstore Root $cer
            if ($LASTEXITCODE -ne 0) { throw 'certutil Root failed' }
            certutil -user -f -addstore TrustedPublisher $cer
            if ($LASTEXITCODE -ne 0) { throw 'certutil TrustedPublisher failed' }
          }

      - name: install, run, update and uninstall the packages
        shell: bash
        run: |
          set -euo pipefail
          SIGNED_ARGS=""
          if [ "${{ needs.package-windows-gui.outputs.signed }}" = "true" ]; then
            SIGNED_ARGS="--expect-signed --sign-verifier apps/gui-go/packaging/windows/sign.py"
          fi
          MANIFEST=$(find package-evidence -path '*shipped/package-manifest.json' | head -1)
          DAEMON_SHA=$(python -c "import json,sys;d=json.load(open(sys.argv[1]))['daemon'];print(d.get('shippedSha256') or d['sha256'])" "$MANIFEST")
          NEWER_MANIFEST=$(find package-evidence -path '*newer/package-manifest.json' | head -1)
          NEWER_SHA=$(python -c "import json,sys;d=json.load(open(sys.argv[1]))['daemon'];print(d.get('shippedSha256') or d['sha256'])" "$NEWER_MANIFEST")
          python apps/gui-go/e2e/windows_package_acceptance.py --arch ${{ matrix.arch }} \
            --setup "$(ls shipped/UniClipboard_*-setup.exe)" --portable "$(ls shipped/UniClipboard_*-portable.zip)" \
            --newer-setup "$(ls inputs/ACCEPTANCE-*-setup.exe)" --uniclip inputs/uniclip.exe \
            --daemon-sha256 "$DAEMON_SHA" --newer-daemon-sha256 "$NEWER_SHA" --out smoke-evidence $SIGNED_ARGS

      - name: upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-smoke-${{ matrix.arch }}${{ steps.build-mode.outputs.suffix }}${{ steps.sfx.outputs.sfx }}
          path: smoke-evidence
          if-no-files-found: warn
          retention-days: 14

  # User-facing CLI (Go, apps/cli-go). It only needs the daemon staged by
  # build-sidecar and never builds or links the Rust development CLI.
  build-cli:
    name: Build CLI ${{ matrix.target }}
    needs: [setup-matrix, build-sidecar]
    if: inputs.package_cli && inputs.build_mode == 'release' && needs.setup-matrix.outputs.cli-matrix != '[]'
    runs-on: ${{ matrix.runner || matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.cli-matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          # The module pins its Go version and toolchain.
          go-version-file: apps/cli-go/go.mod
          cache-dependency-path: apps/cli-go/go.sum

      - name: download uniclipd sidecar
        uses: actions/download-artifact@v6
        with:
          # Release builds only, so the build-mode suffix is empty.
          name: sidecar-${{ matrix.target }}
          path: sidecar-artifact

      - name: stage uniclipd sidecar
        shell: bash
        run: |
          mkdir -p target/sidecar-staging
          tar -xf sidecar-artifact/sidecar.tar -C target/sidecar-staging

      - name: build Go CLI
        shell: bash
        run: |
          EXE=""
          case "${{ matrix.target }}" in *windows*) EXE=".exe" ;; esac
          mkdir -p target/go-cli
          scripts/ci/build-go-cli.sh "${{ matrix.target }}" "target/go-cli/uniclip$EXE"

      - name: package CLI binary
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXE=""
          case "${{ matrix.target }}" in *windows*) EXE=".exe" ;; esac
          bash scripts/ci/package-cli.sh "${{ matrix.target }}" \
            "target/go-cli/uniclip$EXE" \
            "target/sidecar-staging/uniclipd-${{ matrix.target }}$EXE"

      - name: upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: uniclipboard-cli-*
          if-no-files-found: error
