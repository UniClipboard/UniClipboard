name: 'Build Desktop'
run-name: "build-${{ inputs.platform || 'all' }}${{ inputs.build_mode == 'test' && '-test' || '' }}-${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build sidecars only; skip packaging, signing and acceptance
        required: false
        type: boolean
        default: false
      run_acceptance:
        description: 'Run isolated package lifecycle and functional acceptance; publishing disables this'
        required: false
        type: boolean
        default: true
      platform:
        description: '选择构建平台'
        required: true
        type: choice
        options:
          - 'macos-aarch64'
          - 'macos-x86_64'
          - 'ubuntu-22.04'
          - 'ubuntu-22.04-arm'
          - 'linux-gui'
          - 'windows-latest'
          - 'windows-x86_64'
          - 'windows-arm64'
          - 'all'
          - 'updater-signatures'
        default: 'all'
      channel:
        description: '发布渠道(决定 Sentry/OTLP environment 标签)'
        required: false
        type: choice
        options:
          - 'stable'
          - 'alpha'
          - 'beta'
          - 'rc'
        default: 'stable'
      save_cache:
        description: '是否保存构建缓存(用于手动验证 cache warmup)'
        required: false
        type: boolean
        default: true
      build_mode:
        description: '构建方式：release 正式优化，test 快速测试包'
        type: choice
        options: ['release', 'test']
        default: 'test'
      package_cli:
        description: '同时用本次 sidecar 打包 macOS / Windows x64 CLI(仅 release 构建方式)'
        type: boolean
        default: false
      signing_self_test:
        description: 'Windows 签名机制自测:用一次性自签证书(仅在一次性 runner 上受信任)走完签名、验证、安装、更新流程;产物名带 -signing-selftest,不是可发布的签名'
        type: boolean
        default: false
      signpath_test_signing:
        description: 'Windows 包经 SignPath test-signing 策略签名(仅 workflow_dispatch;GitHub 托管 runner;测试证书不是可发布的签名;需要 Environment signpath-test 中的 secret SIGNPATH_API_TOKEN);产物名带 -signpath-test'
        type: boolean
        default: false
      upload_symbols:
        description: '上传 Sentry 调试符号与前端 source map(仅 release 构建方式生效;关闭用于不产生生产副作用的优化构建验收)'
        type: boolean
        default: true
      updater_artifact_runs:
        description: 'For updater-signatures only: comma-separated successful Build Desktop run IDs'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      run_acceptance:
        description: 'Run isolated package lifecycle and functional acceptance; publishing disables this'
        required: false
        type: boolean
        default: true
      build_mode:
        description: 'Build optimization mode; publishing workflows keep release by default'
        required: false
        type: string
        default: 'release'
      platform:
        description: '选择构建平台'
        required: false
        type: string
        default: 'all'
      branch:
        description: 'Branch to build'
        required: false
        type: string
        default: ''
      channel:
        description: '发布渠道,决定 APP_ENV/VITE_APP_ENV 注入值(stable→production,其他→channel 原样)'
        required: false
        type: string
        default: 'stable'
      save_cache:
        description: '是否保存构建缓存'
        required: false
        type: boolean
        default: false
      require_signing:
        description: 'Fail the macOS app packaging when the Apple signing secrets are missing instead of ad-hoc signing'
        required: false
        type: boolean
        default: true
      signing_self_test:
        description: 'Exercise the Windows signing mechanics with a throwaway self-signed certificate trusted only on the disposable runner (artifacts are named -signing-selftest and are not a release signature)'
        required: false
        type: boolean
        default: false
      upload_symbols:
        description: 'Upload Sentry debug symbols and frontend source maps (release build mode only)'
        required: false
        type: boolean
        default: true
      allow_unsigned_windows:
        description: >-
          Alpha and stable releases only, set by release.yml from the per-channel repository variable ALLOW_UNSIGNED_WINDOWS_ALPHA or
          ALLOW_UNSIGNED_WINDOWS_STABLE (default off; beta and rc have none): when no production Windows
          signing backend is configured, package the Windows installers, portable zips and CLI archive unsigned instead of failing.
          A configured production backend always wins. Test certificates are still refused.
        required: false
        type: boolean
        default: false
      package_cli:
        description: >-
          Also package the CLI archive for macOS and Windows x64 from this
          build's uniclipd sidecar (release build mode only). The CLI and app
          use the same target triple there, so one daemon build serves both.
        required: false
        type: boolean
        default: false
      build_only:
        description: >-
          Build the sidecars only (cache warm-up): skip the GUI packaging jobs and, with them, signing and acceptance.
        required: false
        type: boolean
        default: false


jobs:
  accept-updater-signatures:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'updater-signatures'
    uses: ./.github/workflows/updater-signatures.yml
    with:
      artifact_runs: ${{ inputs.updater_artifact_runs }}
    secrets: inherit

  setup-platforms:
    if: inputs.platform != 'updater-signatures'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Planning belongs to this workflow revision, even for historical source builds.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin the source commit before platform fan-out
        id: source
        env:
          SOURCE_REF: ${{ inputs.branch }}
        run: |
          if [[ -n "$SOURCE_REF" ]]; then
            git fetch --no-tags --depth=1 -- origin "$SOURCE_REF"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Select Windows runner once
        id: windows-runner
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.WINDOWS_RUNNER_STATUS_TOKEN }}
        run: node scripts/ci/select-windows-runner.mjs
      - name: Select independent platform pipelines
        id: platforms
        env:
          WINDOWS_RUNNER: ${{ steps.windows-runner.outputs.runner }}
          SIGNPATH_PRODUCTION: ${{ inputs.require_signing == true && vars.SIGNPATH_PRODUCTION_POLICY_SLUG != '' }}
          UC_PLATFORM: ${{ inputs.platform || 'all' }}
          UC_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
          UC_BUILD_ONLY: ${{ inputs.build_only }}
        run: node scripts/ci/build-target-plan.mjs

  build-platform:
    name: ${{ matrix.platform }}
    needs: setup-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-platforms.outputs.matrix) }}
    uses: ./.github/workflows/build-target.yml
    with:
      platform: ${{ matrix.platform }}
      plan: ${{ matrix.plan }}
      branch: ${{ needs.setup-platforms.outputs.source_sha }}
      channel: ${{ inputs.channel || 'stable' }}
      build_mode: ${{ inputs.build_mode || 'release' }}
      build_only: ${{ inputs.build_only == true }}
      run_acceptance: ${{ inputs.run_acceptance != false }}
      save_cache: ${{ inputs.save_cache == true }}
      package_cli: ${{ inputs.package_cli == true }}
      require_signing: ${{ inputs.require_signing == true }}
      signing_self_test: ${{ inputs.signing_self_test == true }}
      signpath_test_signing: ${{ inputs.signpath_test_signing == true }}
      allow_unsigned_windows: ${{ inputs.allow_unsigned_windows == true }}
      upload_symbols: ${{ inputs.upload_symbols != false }}
    secrets: inherit
