name: 'Cache Warmup'

on:
  push:
    branches: [main]
    # Only paths that actually invalidate the Rust compiler cache key (deps,
    # toolchain, cargo config) or change which targets get warmed
    # (release-cache-policy.mjs). CI plumbing files (build.yml,
    # cache-warmup.yml itself, runner selection, GHA cache maintenance) don't
    # set RUSTFLAGS or anything else that affects the compiled output, so
    # editing them doesn't need an immediate re-warm — they used to be listed
    # here and fired a full 6-target warmup on every unrelated CI edit.
    paths:
      - 'scripts/ci/release-cache-policy.mjs'
      - 'scripts/ci/mbx-snapshot.py'
      - 'scripts/ci/mbx-snapshot.sh'
      - 'scripts/stage-daemon.mjs'
      - 'scripts/ci/configure-build-mode.mjs'
      - 'scripts/ci/resolve-app-env.mjs'
      - '.github/actions/mbx-snapshot/**'
      - '.github/actions/rust-coverage/**'
      - '.github/actions/build-e2e-rust/**'
      - '.github/actions/build-pr-rust/**'
      - 'scripts/build-cache/**'
      - '.github/actions/engine-build-cache/**'
      - '.github/docker/build-bookworm.Dockerfile'
      - 'apps/gui-go/e2e/linux/Dockerfile.package-build'
      - 'apps/gui-go/e2e/linux/build_daemon_release.sh'
      - 'apps/gui-go/e2e/linux/run.sh'
      - 'apps/gui-go/e2e/linux/apt_install.sh'
      - 'apps/gui-go/e2e/linux/verify_package_build_image.sh'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
  schedule:
    # Run every Monday at 00:00 UTC to keep Rust/Bun caches warm.
    # GitHub Actions caches expire after 7 days of inactivity.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read
  # Linux targets' build-sidecar jobs pull ghcr.io/uniclipboard/build-bookworm
  # via the implicit GITHUB_TOKEN container login; without this the pull is
  # denied. Never exercised before releaseCacheTargets included a Linux
  # target.
  packages: read

concurrency:
  group: cache-warmup-${{ github.ref }}
  # Let active builds finish and save their caches; newer pushes replace only queued runs.
  cancel-in-progress: false

jobs:
  release-cache-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      needed: ${{ steps.policy.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check compiler dependency changes
        id: policy
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == push ]]; then
            python3 scripts/ci/cache-warmup-needed.py "$BEFORE" "$GITHUB_SHA"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Select release cache targets
        id: matrix
        shell: bash
        run: |
          node --input-type=module -e 'import { releaseCacheTargets } from "./scripts/ci/release-cache-policy.mjs"; console.log("matrix=" + JSON.stringify({ include: releaseCacheTargets }))' >> "$GITHUB_OUTPUT"

  maintain-caches:
    needs: release-cache-matrix
    if: needs.release-cache-matrix.outputs.needed == 'true'
    uses: ./.github/workflows/cache-maintenance.yml

  warmup-release-app:
    name: Warm release app cache (${{ matrix.platform }})
    needs: [maintain-caches, release-cache-matrix]
    strategy:
      fail-fast: false
      # Background prewarming must not consume every hosted macOS/Windows slot.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.release-cache-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      save_cache: true
      build_only: true
      run_acceptance: false
      upload_symbols: false
    secrets: inherit

  warmup-musl-cli:
    needs: [maintain-caches, warmup-release-app]
    uses: ./.github/workflows/build-cli.yml
    with:
      linux_only: true
      build_only: true
      save_cache: true
      upload_symbols: false
    secrets: inherit

  warmup-linux-gui:
    needs: [maintain-caches, warmup-musl-cli]
    uses: ./.github/workflows/package-linux-gui.yml
    with:
      build_only: true
      save_cache: true
      run_acceptance: false
    secrets: inherit

  warmup-test-app:
    name: Warm Windows x64 test app cache
    needs: [maintain-caches, warmup-release-app]
    uses: ./.github/workflows/build.yml
    with:
      platform: 'windows-x86_64'
      build_mode: 'test'
      save_cache: true
      build_only: true
      run_acceptance: false
      upload_symbols: false
    secrets: inherit

  warmup-pr-rust:
    needs: [maintain-caches, warmup-release-app]
    name: Warm PR CAS snapshot (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main' && github.ref_protected
    environment: desktop-build-cache-writer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            container: ghcr.io/uniclipboard/build-bookworm:latest
            scene: pr-check-linux
            cache-key: pr-check
          - runner: windows-latest
            scene: quick-panel-windows
            cache-key: quick-panel-windows-latest
          - runner: windows-11-arm
            scene: quick-panel-windows
            cache-key: quick-panel-windows-11-arm
    env:
      MBX_CACHE_EXPORT_GROUP: ${{ matrix.scene }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: ${{ matrix.cache-key }}
          access: ${{ github.event_name == 'push' && 'write' || 'read' }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Restore previous PR CAS snapshot
        uses: ./.github/actions/mbx-snapshot
        with:
          scene: ${{ matrix.scene }}
          object-fallback: 'false'
      - name: Cache Rust downloads
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}
          cache-targets: false
          save-if: true
      - name: Build PR Rust checks
        uses: ./.github/actions/build-pr-rust
        with:
          scene: ${{ matrix.scene }}
      - name: Save PR CAS snapshot
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
          scene: ${{ matrix.scene }}
      - name: Summarize MBX cache requests
        if: always()
        shell: bash
        run: python3 scripts/ci/summarize-mbx.py "$RUNNER_TEMP/mbx-evidence"
      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-pr-${{ matrix.runner }}-warmup
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore

  warmup-docs-bun:
    needs: [maintain-caches, warmup-release-app]
    # docs-check.yml PR 阶段只 restore Linux-docs-bun-*,这里负责在 main 上写。
    name: Warm docs Bun cache
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            docs-site/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-docs-bun-${{ hashFiles('docs-site/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  warmup-coverage-rust:
    needs: [maintain-caches, warmup-release-app]
    name: Warm coverage Rust cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'desktop-build-cache-writer' || 'desktop-build-cache-reader' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run shared coverage workload and publish snapshot
        uses: ./.github/actions/rust-coverage
        with:
          publish-snapshot: 'true'
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

  warmup-e2e-macos:
    name: Warm macOS E2E CAS snapshot
    needs: [maintain-caches, warmup-release-app]
    runs-on: macos-latest
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main' && github.ref_protected
    environment: desktop-build-cache-writer
    env:
      MBX_CACHE_EXPORT_GROUP: e2e-macos
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: e2e-macos
          access: ${{ github.event_name == 'push' && 'write' || 'read' }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Restore previous E2E CAS snapshot
        uses: ./.github/actions/mbx-snapshot
        with:
          object-fallback: 'false'
      - name: Cache Rust downloads
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-macos
          cache-targets: false
          save-if: true
      - name: Build E2E Rust tools
        uses: ./.github/actions/build-e2e-rust
      - name: Save E2E CAS snapshot
        uses: ./.github/actions/mbx-snapshot
        with:
          operation: save
      - name: Summarize MBX cache requests
        if: always()
        shell: bash
        run: python3 scripts/ci/summarize-mbx.py "$RUNNER_TEMP/mbx-evidence"
      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-e2e-macos-warmup
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore
