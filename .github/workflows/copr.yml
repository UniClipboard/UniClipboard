name: 'Publish to COPR'
run-name: "copr-${{ inputs.version || github.event.release.tag_name || 'auto' }}-${{ github.run_number }}"

# 触发时机:
#   1. release.published — GitHub Release 被正式发布(草稿→发布,或非草稿创建)。
#      不能用 `workflow_run: Release` — stable 渠道的 release 由 release.yml 创建为
#      draft(release.yml:290 `draft: channel != 'alpha'`),draft asset 在公开
#      `releases/download/` URL 上一律 404。等到人工把 draft 发布,公开 URL 才可
#      下载,此时 `release.published` 事件触发,COPR 拿到的 RPM 是真的可达的。
#   2. workflow_dispatch — 手动重跑某个版本,也供 release.yml 在 alpha 自动
#      发布完成后异步触发。alpha release 是由 workflow 自动创建并发布的,
#      不要只依赖 release.published,否则可能不会带起本 workflow。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本(不带 v 前缀,例如 0.7.0-alpha.7)。留空 = 读 package.json'
        required: false
        type: string
        default: ''
      project:
        description: 'COPR 项目名 — 主仓 = uniclipboard,预发渠道 = uniclipboard-alpha 等'
        required: true
        type: choice
        options:
          - 'uniclipboard'
          - 'uniclipboard-alpha'
        default: 'uniclipboard-alpha'
      run_ids:
        description: 'RPM 来源 build run ID(逗号分隔多个) — 留空走 GitHub Release;给 ID 时从这些 build run 的 artifact 直接取 RPM(免去先发 release 的循环依赖)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build the SRPM and upload it as a workflow artifact; do not touch COPR (no credentials are read)'
        required: false
        type: boolean
        default: false

jobs:
  build-srpm-and-publish:
    # release 事件本身只在 published 时触发(见 on.release.types),不需要再过滤。
    # workflow_dispatch 任何时候都允许。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    # Fedora 镜像里有 rpmbuild / rpmdevtools / spectool / dnf,免去在 Ubuntu
    # 上手动装 rpm 工具链。fedora:latest = 滚动 stable,可读性高且常 cached。
    container: fedora:latest
    permissions:
      contents: read
      # 跨 workflow run 拉 artifact 需要 actions:read。
      actions: read
    steps:
      - name: Install build tooling
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git curl rpm-build python3-pip jq unzip
          # copr-cli 通过 pip 装 — Fedora 仓库里也有 dnf install copr-cli,
          # 但 pip 版本更新更稳定,接 API token 也更直接。
          # 显式带上 rich:copr-cli 新版 main.py 里 `from rich.text import Text`,
          # 但 setup.py 没声明这个依赖,pip 不会自动拉 → ModuleNotFoundError。
          pip3 install --no-cache-dir copr-cli rich

      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # 决策树:
          #   workflow_dispatch 给了 input.version → 直接用
          #   release 事件                          → 用 release.tag_name(剥掉 v 前缀)
          #   workflow_dispatch 没给 version       → 兜底读 package.json
          # 注意:release 事件下不能读 package.json,因为 checkout 默认 ref 是 tag
          # 对应 commit,但还是优先信任 release tag 本身,避免 tag 与 package.json 漂移。
          if [ -n "${{ inputs.version }}" ]; then
            UPSTREAM_TAG="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            UPSTREAM_TAG="${TAG#v}"
          else
            UPSTREAM_TAG=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          fi

          # RPM 不允许版本字段含 "-",将 prerelease 分隔符 "-" 替换为 "~"。
          # "~" 在 RPM 比较里小于任何字符 → 0.7.0~alpha.7 < 0.7.0,符合预期。
          RPM_VERSION="$(printf '%s' "$UPSTREAM_TAG" | sed 's/-/~/')"

          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "rpm_version=$RPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream_tag=$UPSTREAM_TAG rpm_version=$RPM_VERSION"

      - name: Determine COPR project
        id: project
        shell: bash
        run: |
          # 渠道映射规则(对应 release.yml 的 channel 推断):
          #   workflow_dispatch  → 用 inputs.project(用户选)
          #   workflow_run       → 看 upstream_tag 是否含 alpha/beta/rc
          #     含       → uniclipboard-alpha
          #     不含     → uniclipboard
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT="${{ inputs.project }}"
          else
            UPSTREAM_TAG="${{ steps.ver.outputs.upstream_tag }}"
            if [[ "$UPSTREAM_TAG" =~ -(alpha|beta|rc) ]]; then
              PROJECT="uniclipboard-alpha"
            else
              PROJECT="uniclipboard"
            fi
          fi
          echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Selected COPR project: $PROJECT"

      # Two mutually exclusive sources for the upstream binary rpms, selected by inputs.run_ids:
      #   - run_ids given  -> take them from the `linux-gui-<arch>` artifacts of those build runs
      #                       (no need to publish a release first)
      #   - run_ids empty  -> download them from the GitHub Release assets
      - name: Download RPMs from build run artifacts (run_ids mode)
        if: github.event_name == 'workflow_dispatch' && inputs.run_ids != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_IDS: ${{ inputs.run_ids }}
          UPSTREAM_TAG: ${{ steps.ver.outputs.upstream_tag }}
        run: |
          # RUN_IDS looks like "25618035983,25618036765". The Linux packaging workflow uploads one artifact per
          # architecture, named linux-gui-amd64 and linux-gui-arm64, each holding exactly the named release candidates.
          # The evidence artifacts (linux-gui-evidence-*, linux-gui-acceptance-*) are never matched: they can hold
          # fixture packages that are not release candidates.
          mkdir -p "$RUNNER_TEMP/upstream-rpms" /tmp/copr-art
          IFS=',' read -ra RUNS <<< "${RUN_IDS}"
          for RUN_ID in "${RUNS[@]}"; do
            RUN_ID="${RUN_ID// /}"  # drop spaces a user may have typed
            [ -z "$RUN_ID" ] && continue
            echo "::group::Run ${RUN_ID} — list artifacts"
            API="https://api.github.com/repos/UniClipboard/UniClipboard/actions/runs/${RUN_ID}/artifacts"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}" > "/tmp/copr-art/list-${RUN_ID}.json"
            echo "::endgroup::"

            jq -r '.artifacts[] | select(.name | test("^linux-gui-(amd64|arm64)$")) | "\(.id)\t\(.name)"' \
              "/tmp/copr-art/list-${RUN_ID}.json" | while IFS=$'\t' read -r id name; do
              [ -z "$id" ] && continue
              echo "::group::Fetch artifact ${name} (id=${id}, run=${RUN_ID})"
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/UniClipboard/UniClipboard/actions/artifacts/${id}/zip" \
                -o "/tmp/copr-art/${name}.zip"
              # Only the rpm; the deb, AppImage and updater archive in the same artifact are not COPR inputs.
              unzip -j -o -d "$RUNNER_TEMP/upstream-rpms/" "/tmp/copr-art/${name}.zip" 'UniClipboard-*.rpm'
              rm "/tmp/copr-art/${name}.zip"
              echo "::endgroup::"
            done
          done

          echo "--- upstream rpms ---"
          ls -lh "$RUNNER_TEMP/upstream-rpms/"
          # Both architectures, built for the version being published: the script below fails on a missing or
          # differently versioned file, but say it here with the likely cause.
          for arch in x86_64 aarch64; do
            if [ ! -f "$RUNNER_TEMP/upstream-rpms/UniClipboard-${UPSTREAM_TAG}-1.${arch}.rpm" ]; then
              echo "::error::UniClipboard-${UPSTREAM_TAG}-1.${arch}.rpm is not in the artifacts. Pass both run_ids, and a version that matches the build."
              exit 1
            fi
          done

      - name: Download upstream binary RPMs from GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_ids == '')
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.ver.outputs.upstream_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/upstream-rpms"
          BASE_URL="https://github.com/UniClipboard/UniClipboard/releases/download/v${UPSTREAM_TAG}"
          for ARCH in x86_64 aarch64; do
            FILE="UniClipboard-${UPSTREAM_TAG}-1.${ARCH}.rpm"
            echo "Fetching ${FILE}..."
            curl -fL --retry 3 --retry-delay 5 \
              -o "$RUNNER_TEMP/upstream-rpms/${FILE}" \
              "${BASE_URL}/${FILE}"
          done
          ls -lh "$RUNNER_TEMP/upstream-rpms/"

      - name: Build SRPM
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.ver.outputs.upstream_tag }}
        run: scripts/ci/build-copr-srpm.sh "$UPSTREAM_TAG" "$RUNNER_TEMP/upstream-rpms" out-srpm

      - name: Upload SRPM
        uses: actions/upload-artifact@v4
        with:
          name: copr-srpm-${{ steps.ver.outputs.rpm_version }}
          path: out-srpm
          retention-days: 14
          if-no-files-found: error

      - name: Configure copr-cli
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          if [ -z "$COPR_LOGIN" ] || [ -z "$COPR_TOKEN" ] || [ -z "$COPR_USERNAME" ]; then
            echo "::error::Missing COPR_LOGIN / COPR_TOKEN / COPR_USERNAME secrets"
            echo "::error::Get them from https://copr.fedorainfracloud.org/api/"
            exit 1
          fi
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          chmod 600 ~/.config/copr

      - name: Submit build to COPR
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          PROJECT="${{ steps.project.outputs.name }}"
          # 一次提交多个 SRPM 给同一 COPR build:--nowait 让命令立即返回,
          # 否则 GH job 会被 COPR build 队列阻塞 30+ min。
          # 如果想等结果,把 --nowait 去掉(默认会 watch 直至 succeeded/failed)。
          for SRPM in out-srpm/*.src.rpm; do
            echo "::group::copr build ${COPR_USERNAME}/${PROJECT} ${SRPM}"
            copr-cli build "${COPR_USERNAME}/${PROJECT}" "${SRPM}"
            echo "::endgroup::"
          done

      - name: Summary
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.name }}"
          USERNAME="${{ secrets.COPR_USERNAME }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "## COPR dry run: SRPM built, nothing submitted :package:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## COPR build submitted :package:" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project**: \`${USERNAME}/${PROJECT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ steps.ver.outputs.rpm_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Upstream tag**: v${{ steps.ver.outputs.upstream_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Track build status: https://copr.fedorainfracloud.org/coprs/${USERNAME}/${PROJECT}/builds/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "End-user install:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "sudo dnf copr enable ${USERNAME}/${PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          echo "sudo dnf install uniclipboard" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
