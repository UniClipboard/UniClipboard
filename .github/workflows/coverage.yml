name: Coverage

on:
  # Main coverage provides Codecov's PR comparison baseline.
  push:
    branches: [main]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/ci-paths.yml

  coverage:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.relevant == 'true') }}
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.2
        with:
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: coverage
          # PR 只读 default branch cache,写入由 cache-warmup 统一负责。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Rust workspace only: uc-platform uses libdbus; GPUI links FreeType, xcb and xkbcommon (xcb comes with libxkbcommon-x11-dev).
      # Wails GTK/WebKit and Linux packaging tools belong to the separate Go GUI build jobs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libxkbcommon-x11-dev: the workspace includes the GPUI quick panel (apps/quick-panel), whose
          # Linux test binary links xkbcommon-x11 (rust-lld: unable to find library -lxkbcommon-x11).
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libfreetype6-dev libxkbcommon-x11-dev xvfb xauth

      - name: Generate coverage report
        run: |
          xvfb-run -a cargo llvm-cov --lcov --output-path lcov.info --workspace

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: rust-backend
          name: rust-coverage
          fail_ci_if_error: false
