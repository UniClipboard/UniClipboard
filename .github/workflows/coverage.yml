name: Coverage

on:
  # Main coverage provides Codecov's PR comparison baseline.
  push:
    branches: [main]
  workflow_call:
    secrets:
      BUILD_CACHE_R2_ENDPOINT:
        required: false
      BUILD_CACHE_R2_ACCESS_KEY_ID:
        required: false
      BUILD_CACHE_R2_SECRET_ACCESS_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/ci-paths.yml

  coverage:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.relevant == 'true') }}
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: desktop-build-cache-reader
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run shared coverage workload
        uses: ./.github/actions/rust-coverage
        with:
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: rust-backend
          name: rust-coverage
          fail_ci_if_error: false
