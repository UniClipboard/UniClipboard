name: Dispatch package-manager releases
on:
  workflow_run:
    workflows: [Release CLI and Desktop]
    types: [completed]
permissions: {}
jobs:
  select:
    if: >-
      github.repository == 'UniClipboard/UniClipboard' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      joint: ${{ steps.selection.outputs.joint }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify the completed joint release
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python tools/release/package_channel.py select --run-id "$RELEASE_RUN" \
            --attempt "$RELEASE_ATTEMPT" --github-output "$GITHUB_OUTPUT"

  dispatch:
    needs: select
    if: needs.select.outputs.joint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        channel: [homebrew-tap, homebrew-cask, scoop, chocolatey, winget, aur, pacman, copr, snap, nix, flatpak]
    steps:
      - name: Start independent channel workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PACKAGE_CHANNEL: ${{ matrix.channel }}
        run: |
          gh workflow run "release-${PACKAGE_CHANNEL}.yml" --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" -f release_run_id="$RELEASE_RUN" \
            -f release_run_attempt="$RELEASE_ATTEMPT" -f publish=true
