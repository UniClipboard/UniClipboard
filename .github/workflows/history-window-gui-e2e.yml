name: History window GUI E2E

on:
  pull_request:
    paths:
      - ".github/workflows/history-window-gui-e2e.yml"
      - "apps/gui-go/e2e/history_window_run.py"
      - "apps/gui-go/frontend/src/e2e/history-window.ts"
      - "apps/gui-go/frontend/src/hooks/useHistoryWindow.ts"
      - "apps/gui-go/frontend/src/ui-kit/use-windowed-scroll.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux large viewport navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: desktop-build-cache-reader
    env:
      UC_MBX_BUILD_IMAGE: ubuntu:24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/gui-go/go.mod
          cache-dependency-path: |
            apps/gui-go/go.sum
            apps/cli-go/go.sum
            packages/desktop-host-go/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install native WebView and isolated display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config clang cmake \
            libssl-dev libdbus-1-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libx11-dev libwayland-dev libxkbcommon-dev xvfb xauth dbus-x11 python3-venv
      - uses: ./.github/actions/engine-build-cache
        with:
          cache-key: history-window-gui
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: false
      - name: Restore existing Ubuntu Linux GUI CAS snapshot
        uses: ./.github/actions/mbx-snapshot
        with:
          scene: linux-gui
      - name: Build exact checkout
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd apps/gui-go/frontend && VITE_GUI_GO_E2E=1 UC_UI_PLATFORM=linux bun run build)
          test "$(cat apps/gui-go/frontend/dist/.ui-platform)" = linux
          cargo build --locked -p uc-daemon
          (cd packages/desktop-host-go && go generate ./buildinfo)
          mkdir -p target/gui-go
          (cd apps/cli-go && go build -o ../../target/gui-go/uniclip ./cmd/uniclip)
          (cd apps/gui-go && go build -tags gtk4,e2e -o ../../target/gui-go/gui-go .)
          git diff --exit-code
      - name: Record reusable binary identities
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, tomllib
          from pathlib import Path
          files = ['target/debug/uniclipd', 'target/gui-go/uniclip', 'target/gui-go/gui-go']
          receipt = {
              'desktop_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'engine_sha': tomllib.loads(Path('Cargo.toml').read_text())['workspace']['dependencies']['uc-engine']['rev'],
              'binaries': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files},
          }
          Path('target/gui-go/binary-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Retain binaries for runner-only diagnosis
        uses: actions/upload-artifact@v7
        with:
          name: history-window-binaries-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/debug/uniclipd
            target/gui-go/uniclip
            target/gui-go/gui-go
            target/gui-go/binary-source.json
          if-no-files-found: error
      - name: Navigate both directions with all 50 records visible
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          mkdir -p artifacts/history-window
          dbus-run-session -- xvfb-run -a -s '-screen 0 2560x1920x24' \
            python3 apps/gui-go/e2e/history_window_run.py --repo "$PWD" \
            --gui "$PWD/target/gui-go/gui-go" --grid --large-viewport \
            --out "$PWD/artifacts/history-window/linux-large-viewport.json"
      - name: Summarize MBX compiler reuse
        if: always()
        run: python3 scripts/ci/summarize-mbx.py "$RUNNER_TEMP/mbx-evidence"
      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-window-mbx-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: history-window-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/history-window/
          if-no-files-found: warn
