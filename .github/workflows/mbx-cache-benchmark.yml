name: MBX cache comparison
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Workload to compare; seed its protected-main snapshot first.
        type: choice
        default: macos
        options: [macos, linux, windows, windows-arm64]

permissions:
  contents: read
  packages: read
concurrency:
  group: mbx-cache-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: ${{ inputs.platform }} (${{ matrix.mode }})
    runs-on: ${{ inputs.platform == 'macos' && 'macos-latest' || inputs.platform == 'linux' && 'ubuntu-latest' || inputs.platform == 'windows-arm64' && 'windows-11-arm' || 'windows-latest' }}
    container: ${{ inputs.platform == 'linux' && 'ghcr.io/uniclipboard/build-bookworm:latest' || null }}
    timeout-minutes: 90
    environment: desktop-build-cache-reader
    strategy:
      fail-fast: false
      matrix:
        mode: [objects, snapshot-and-objects, snapshot-only]
    env:
      MBX_CACHE_EXPORT_GROUP: ${{ inputs.platform == 'macos' && 'e2e-macos' || inputs.platform == 'linux' && 'pr-check-linux' || 'quick-panel-windows' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: ${{ env.MBX_CACHE_EXPORT_GROUP }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      - name: Restore snapshot
        if: matrix.mode != 'objects'
        uses: ./.github/actions/mbx-snapshot
        with:
          scene: ${{ env.MBX_CACHE_EXPORT_GROUP }}
          object-fallback: ${{ matrix.mode != 'snapshot-only' }}
      - name: Build E2E Rust tools
        if: inputs.platform == 'macos'
        uses: ./.github/actions/build-e2e-rust
      - name: Build PR Rust checks
        if: inputs.platform != 'macos'
        uses: ./.github/actions/build-pr-rust
        with:
          scene: ${{ env.MBX_CACHE_EXPORT_GROUP }}
      - name: Run restored macOS contract test
        if: inputs.platform == 'macos'
        shell: bash
        run: cargo test -p uc-daemon --features uc-daemon/e2e-rendezvous --test engine_log_file_name_contract
      - name: Run restored Linux schema generator
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          target/debug/gen-openapi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- schema/openapi.json
      - name: Run restored Windows font contract
        if: startsWith(inputs.platform, 'windows')
        shell: bash
        env:
          UC_WINDOWS_FONT_REGRESSION: '1'
        run: cargo test -p quick-panel --test windows_font_fallback --locked -- --ignored
      - name: Summarize MBX cache requests
        if: always()
        shell: bash
        run: python3 scripts/ci/summarize-mbx.py "$RUNNER_TEMP/mbx-evidence"
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-comparison-${{ inputs.platform }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: warn
