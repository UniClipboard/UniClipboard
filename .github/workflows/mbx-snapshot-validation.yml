name: MBX snapshot portability
on:
  pull_request:
    paths:
      - 'scripts/ci/mbx-snapshot*'
      - 'scripts/ci/cache-warmup-needed*'
      - 'scripts/build-cache/**'
      - '.github/actions/mbx-snapshot/**'
      - '.github/actions/build-pr-rust/**'
      - '.github/actions/rust-coverage/**'
      - '.github/workflows/mbx-snapshot-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbx-snapshot-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-roundtrip:
    name: Native CAS round trip (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install and verify the snapshot transport SDK
        shell: python
        run: |
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Keep the production bootstrap as the single SDK version owner.
          pins = re.findall(r'\bboto3==([0-9]+\.[0-9]+\.[0-9]+)\b', Path('scripts/ci/mbx-snapshot.sh').read_text())
          if len(pins) != 1:
              raise RuntimeError('Expected exactly one snapshot SDK pin')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', 'boto3==' + pins[0]], check=True)
          import boto3
          if boto3.__version__ != pins[0]:
              raise RuntimeError('Snapshot SDK version does not match the bootstrap')
          print('Snapshot transfer tests use boto3 ' + boto3.__version__)
      - name: Verify dependency-only warmup selection
        shell: bash
        run: python3 scripts/ci/cache-warmup-needed.test.py -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native export, compaction, import and executable reuse
        shell: bash
        run: |
          bash scripts/build-cache/mbx.sh --exec bash -c 'UC_MBX_TEST_BINARY="$(command -v mbx)" python scripts/ci/mbx-snapshot.test.py -v'

  coverage-roundtrip:
    name: Instrumented coverage CAS round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Verify restored compiler actions execute tests and produce fresh LCOV
        shell: bash
        run: |
          bash scripts/build-cache/mbx.sh --exec bash -c 'UC_MBX_TEST_BINARY="$(command -v mbx)" UC_MBX_TEST_COVERAGE=1 python3 scripts/ci/mbx-snapshot.test.py NativeMbxTests.test_coverage_snapshot_executes_tests_and_regenerates_lcov -v'
