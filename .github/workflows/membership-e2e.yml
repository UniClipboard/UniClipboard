name: 'Membership E2E'
run-name: "membership-e2e-${{ inputs.tier || (github.event_name == 'pull_request' && 'pr') || 'nightly' }}-${{ github.run_number }}"

on:
  workflow_call:
    inputs:
      tier:
        type: string
        required: true
      ref:
        type: string
        required: false
        default: ''
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: '测试层级'
        required: true
        type: choice
        options:
          - nightly
          - pr
        default: nightly
      ref:
        description: '要测试的分支、标签或提交'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  packages: read

jobs:
  setup-matrix:
    name: Select membership platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Select Linux for pull requests and all platforms otherwise
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo 'matrix=[{"name":"Linux","runner":"ubuntu-22.04","container":"ghcr.io/uniclipboard/build-bookworm:latest"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"name":"macOS","runner":"macos-latest"},{"name":"Linux","runner":"ubuntu-22.04","container":"ghcr.io/uniclipboard/build-bookworm:latest"},{"name":"Windows","runner":"windows-latest"}]' >> "$GITHUB_OUTPUT"
          fi

  membership:
    needs: setup-matrix
    name: "${{ matrix.name }} / ${{ inputs.tier || (github.event_name == 'pull_request' && 'pr') || 'nightly' }}"
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    environment: desktop-build-cache-reader
    env:
      MEMBERSHIP_TIER: ${{ inputs.tier || (github.event_name == 'pull_request' && 'pr') || 'nightly' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: membership-${{ matrix.name }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: membership-e2e-${{ runner.os }}
          cache-targets: false
          save-if: ${{ github.event_name == 'schedule' }}

      - name: Build daemon
        run: bash scripts/build-cache/mbx.sh --exec cargo build -p uc-daemon --features uc-daemon/e2e-rendezvous

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli-go/go.mod
          cache-dependency-path: apps/cli-go/go.sum

      - name: Build the user-facing CLI
        # The suites resolve the CLI (Go, apps/cli-go) from target/debug/uniclip.
        run: scripts/e2e/build-cli.sh

      - name: Verify fixed release preparation
        if: env.MEMBERSHIP_TIER == 'nightly'
        run: bash scripts/build-cache/mbx.sh --exec cargo test --manifest-path tests/e2e/Cargo.toml --test release_assets

      - name: Verify local invitation service contract
        run: bash scripts/build-cache/mbx.sh --exec cargo test --manifest-path tests/e2e/Cargo.toml --test rendezvous_contract

      - name: Prepare fixed legacy release
        if: env.MEMBERSHIP_TIER == 'nightly'
        shell: bash
        run: >-
          bash scripts/build-cache/mbx.sh --exec cargo run --manifest-path tests/e2e/Cargo.toml
          --bin prepare-legacy-release --
          --output "$RUNNER_TEMP/legacy-release"

      - name: Run membership matrix
        shell: bash
        env:
          UC_E2E_ARTIFACT_DIR: ${{ runner.temp }}/membership-e2e
          UC_E2E_KEEP_PROFILES: '1'
          UC_E2E_LEGACY_RELEASE_DIR: ${{ runner.temp }}/legacy-release
          UC_E2E_RUST_LOG: info
        run: bash scripts/e2e/run-membership-matrix.sh "$MEMBERSHIP_TIER"

      # Case logs live under RUNNER_TEMP. Profile data and daemon logs live under
      # the user profile, which on Windows is a different drive. upload-artifact
      # rejects that set because the paths have no common parent (run 41244992814:
      # rootDirectory D:\a\UniClipboard\UniClipboard is not a parent of
      # D:\a\_temp\membership-e2e\C0.log). Copy the profile trees next to the
      # case logs and upload that one directory on every OS.
      - name: Stage isolated profiles next to matrix logs
        if: always()
        shell: bash
        run: |
          set -o pipefail
          unix_path() {
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -u -- "$1"
            else
              printf '%s\n' "$1"
            fi
          }

          if [[ -z "${RUNNER_TEMP:-}" ]]; then
            echo "RUNNER_TEMP is not set" >&2
            exit 1
          fi
          runner_temp="$(unix_path "$RUNNER_TEMP")"
          case "$runner_temp" in
            *\\*)
              echo "RUNNER_TEMP is not a Unix path: $RUNNER_TEMP" >&2
              exit 1
              ;;
          esac
          artifact_root="$runner_temp/membership-e2e"
          stage="$artifact_root/profiles"
          mkdir -p "$stage"
          staged=0
          copy_failures=0

          stage_label() {
            local label="$1"
            local copied=0
            local dir
            shift
            for dir in "$@"; do
              if [[ ! -d "$dir" ]]; then
                continue
              fi
              mkdir -p "$stage/$label"
              if cp -a "$dir" "$stage/$label/"; then
                copied=$((copied + 1))
              else
                echo "failed to stage $dir" | tee -a "$stage/copy-errors.txt" >&2
                copy_failures=$((copy_failures + 1))
              fi
            done
            echo "staged $copied $label"
            staged=$((staged + copied))
          }

          shopt -s nullglob
          stage_label macos-data "$HOME/Library/Application Support"/app.uniclipboard.desktop-e2e-membership-*
          stage_label macos-logs "$HOME/Library/Logs"/app.uniclipboard.desktop-e2e-membership-*
          stage_label linux-data "${XDG_DATA_HOME:-$HOME/.local/share}"/app.uniclipboard.desktop-e2e-membership-*
          stage_label linux-state "${XDG_STATE_HOME:-$HOME/.local/state}"/app.uniclipboard.desktop-e2e-membership-*
          if [[ -n "${LOCALAPPDATA:-}" ]]; then
            windows_root="$(unix_path "$LOCALAPPDATA")"
          else
            windows_root="$HOME/AppData/Local"
          fi
          stage_label windows-local "$windows_root"/app.uniclipboard.desktop-e2e-membership-*
          shopt -u nullglob

          echo "staged $staged profile director(y/ies), $copy_failures copy failure(s)"
          if [[ -f "$artifact_root/results.tsv" && "$staged" -eq 0 ]]; then
            echo "matrix results exist but no profile directories were staged" >&2
            exit 1
          fi
          if [[ "$copy_failures" -ne 0 ]]; then
            echo "profile staging copied with errors; see profiles/copy-errors.txt" >&2
            exit 1
          fi

      - name: Upload matrix results and isolated profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: membership-e2e-${{ matrix.name }}-${{ inputs.tier || (github.event_name == 'pull_request' && 'pr') || 'nightly' }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/membership-e2e

      - name: Summarize MBX cache requests
        if: always()
        shell: bash
        run: python3 scripts/ci/summarize-mbx.py "$RUNNER_TEMP/mbx-evidence"

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-membership-${{ matrix.name }}
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore
