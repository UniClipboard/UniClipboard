# Copies the desktop installers that were registered with FlareRelease to a
# GitCode Release and registers each verified copy with FlareRelease, which
# then redirects users in mainland China to it. GitHub and R2 stay the
# authoritative sources: this workflow only adds an optional mirror and never
# rebuilds, re-signs or repackages any installer.
#
# Where the transfer runs: GitCode's upload endpoint is in mainland China and a
# GitHub runner reaches it at a few KiB/s, and Desktop's installers are large.
# So the published mkdir700/gitcode-release-mirror Action (pinned to a full
# commit SHA) logs in to the Shanghai host over SSH with strict host-key
# checking. The forced command on that host downloads each installer from R2
# (fast from China) and checks it against the SHA-256 registered for the
# release, uploads it to GitCode and reads it back anonymously. The Action never
# overwrites or deletes: an identical existing asset is `reused`, a different one
# with the same name is a `conflict` failure. The host stores no credential.
#
# Registering with FlareRelease (PUT /api/mirrors) is a separate step on the
# runner, scripts/register-flare-release-mirrors.mjs, driven by the Action's
# receipt, so the FlareRelease Access credentials never leave GitHub. FlareRelease
# still checks size and SHA-256 against what it recorded for the release.
#
# Only the artifacts FlareRelease already has registered for this release can
# be mirrored: today that is the single updater archive selected per platform
# (macOS .app.tar.gz, Linux .AppImage(.tar.gz), Windows .nsis.zip/.exe) - see
# docs/release-workflow.md "GitCode mirror" for why .dmg/.deb/.rpm/the
# Windows portable zip are not covered yet. The host allow-list enforces the
# same file-name set.
#
# - Dispatched with `ref: main` once a release is published - never called
#   inline from release.yml, whose own ref is the release tag and gets
#   rejected by `environment: mirror`'s main-only branch policy before any
#   step runs. release.yml's dispatch-mirror-alpha covers alpha; this
#   file's own `release: types: [published]` (via redispatch-from-release)
#   covers stable/beta/rc.
# - Run by hand (workflow_dispatch) to retry or to mirror an older tag. It
#   downloads installers' registration inputs from the GitHub Release at that
#   tag and rebuilds the registration payload with the current (default-branch)
#   scripts, not whatever existed at that historical tag. The release notes
#   come from the release tag itself, because a release cut from a release/*
#   branch may never have merged its docs/changelog files back to main.
#
# Configuration (nothing is created by this workflow):
#   environment mirror (only the main branch may use it, shared with Mobile's
#                        own mirror workflow) holding:
#   secret   GITCODE_MIRROR_ACTION_SSH_KEY         private key whose public half is bound to the
#                                                  Action's forced command on the host (replaces
#                                                  MIRROR_SSH_KEY, which is bound to the retired
#                                                  Desktop-only relay script)
#   variable GITCODE_MIRROR_ACTION_SSH_USER        the host account of that key (gitcode-mirror)
#   variable MIRROR_SSH_HOST, MIRROR_SSH_KNOWN_HOSTS  the host and its public keys
#   variable MIRROR_SSH_PORT (optional)            default 22
#   secret   GITCODE_RELEASE_TOKEN                 GitCode bot token (UniClipboard org secret)
#   variable GITCODE_OWNER, GITCODE_REPO           the mirror repository (must already exist, be a
#                                                  normal repository - not a pull mirror - and
#                                                  have a commit on its default branch)
#   variable UPDATE_SERVER_URL                     already used by release.yml (R2 base address)
#   secret   FLARE_RELEASE_ACCESS_CLIENT_ID/SECRET already used by release.yml
#
# The host-side files are installed separately by a maintainer (see
# docs/release-workflow.md); this workflow never installs or changes anything
# on the host.

name: mirror-desktop-gitcode

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag whose installers are mirrored (for example v1.1.0-alpha.3)'
        required: true
        type: string
      version:
        description: 'Version without the leading v (for example 1.1.0-alpha.3)'
        required: true
        type: string
      channel:
        description: 'Release channel (stable, alpha, beta, rc)'
        required: true
        type: string
      non_blocking:
        description: 'Report problems as warnings instead of failing the run'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag whose installers are mirrored (for example v1.1.0-alpha.3)'
        required: true
        type: string
      version:
        description: 'Version without the leading v (for example 1.1.0-alpha.3)'
        required: true
        type: string
      channel:
        description: 'Release channel (stable, alpha, beta, rc)'
        required: true
        type: choice
        options:
          - stable
          - alpha
          - beta
          - rc
      non_blocking:
        description: 'Report problems as warnings instead of failing the run'
        required: false
        default: false
        type: boolean
  # Fires on a human-published stable/beta/rc release (alpha is published
  # via GITHUB_TOKEN, which never fires release.published — see
  # dispatch-mirror-alpha). Only runs redispatch-from-release below, which
  # carries no environment and re-dispatches to ref=main.
  release:
    types: [published]

concurrency:
  group: gitcode-mirror-${{ inputs.tag_name || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  redispatch-from-release:
    name: Redispatch mirror from a trusted main ref
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch from main with the published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Same channel derivation as release.yml's validate job: strip the
          # leading v, then a `-<word>` suffix names the channel, else stable.
          VERSION="${TAG_NAME#v}"
          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
          else
            CHANNEL="stable"
          fi

          # non_blocking left at its default (false): a real mirror failure
          # must show as a failed run here, not be swallowed.
          gh api \
            --method POST \
            "repos/${{ github.repository }}/actions/workflows/mirror-desktop-gitcode.yml/dispatches" \
            -f ref="main" \
            -f inputs[tag_name]="$TAG_NAME" \
            -f inputs[version]="$VERSION" \
            -f inputs[channel]="$CHANNEL"

          echo "Dispatched mirror-desktop-gitcode.yml for $TAG_NAME ($CHANNEL) from main; this only confirms the dispatch request was accepted, not that the mirror itself will succeed." >> "$GITHUB_STEP_SUMMARY"

  mirror:
    name: Mirror desktop installers to GitCode
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Main-only environment secret; only a run dispatched with ref=main
    # ever reaches this job (see `if:` above).
    environment: mirror
    steps:
      # Not pinned to inputs.tag_name: the registration-building scripts below
      # must be the current ones, not whatever existed at that historical tag
      # (a tag cut before this mirror feature existed has no sha256 field in
      # its own copy of build-flare-release-registration.js, so backfilling
      # it would always fail "every registered artifact must have a sha256").
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Only the release notes are read from the tag: the default branch does
      # not necessarily have docs/changelog/<version>(.zh).md for a release cut
      # from a release/* branch (v1.1.2 was not merged back), and the notes of a
      # release must be the ones it was published with.
      - name: Checkout the release notes from the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}
          path: release-tag
          sparse-checkout: docs/changelog
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # Not gated by `non_blocking`: a caller error, not flaky infra.
      - name: Reject draft releases and inconsistent tag/version/channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          node scripts/validate-mirror-release.mjs \
            --repo "$REPO_NAME" \
            --tag-name "$TAG_NAME" \
            --version "$VERSION" \
            --channel "$CHANNEL"

      - name: Download release assets from the GitHub Release
        continue-on-error: ${{ inputs.non_blocking == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir release-assets

      - name: Rebuild the FlareRelease registration payload
        id: registration
        continue-on-error: ${{ inputs.non_blocking == true }}
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PUBLIC_URL: ${{ vars.UPDATE_SERVER_URL }}
        run: |
          for notes in "release-tag/docs/changelog/${VERSION}.md" "release-tag/docs/changelog/${VERSION}.zh.md"; do
            if [ ! -f "$notes" ]; then
              echo "::error::${notes#release-tag/} does not exist at tag ${{ inputs.tag_name }}"
              exit 1
            fi
          done

          node scripts/assemble-update-manifest.js \
            --version "$VERSION" \
            --artifacts-dir release-assets \
            --output "flare-release/manifest.json" \
            --base-url "${PUBLIC_URL}/artifacts/v${VERSION}" \
            --notes-file "release-tag/docs/changelog/${VERSION}.md" \
            --zh-notes-file "release-tag/docs/changelog/${VERSION}.zh.md"

          node scripts/build-flare-release-registration.js \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --manifest "flare-release/manifest.json" \
            --artifacts-dir release-assets \
            --source "github-actions:${{ github.repository }}:${{ github.run_id }}" \
            --output "flare-release/registration.json"

      - name: Check the mirror configuration
        id: config
        env:
          NON_BLOCKING: ${{ inputs.non_blocking == true && 'true' || 'false' }}
          MIRROR_SSH_KEY: ${{ secrets.GITCODE_MIRROR_ACTION_SSH_KEY }}
          MIRROR_SSH_USER: ${{ vars.GITCODE_MIRROR_ACTION_SSH_USER }}
          MIRROR_SSH_HOST: ${{ vars.MIRROR_SSH_HOST }}
          MIRROR_SSH_KNOWN_HOSTS: ${{ vars.MIRROR_SSH_KNOWN_HOSTS }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE_TOKEN }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
          FLARE_RELEASE_ACCESS_CLIENT_ID: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_ID }}
          FLARE_RELEASE_ACCESS_CLIENT_SECRET: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_SECRET }}
          UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in MIRROR_SSH_KEY MIRROR_SSH_USER MIRROR_SSH_HOST MIRROR_SSH_KNOWN_HOSTS GITCODE_TOKEN GITCODE_OWNER GITCODE_REPO FLARE_RELEASE_ACCESS_CLIENT_ID FLARE_RELEASE_ACCESS_CLIENT_SECRET UPDATE_SERVER_URL; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            reason="GitCode mirroring is not configured; missing ${missing[*]}"
            if [ "$NON_BLOCKING" = "true" ]; then
              echo "::warning title=GitCode mirror skipped::$reason"
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$reason"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Each source is the public R2 address of a registered installer plus the
      # SHA-256 FlareRelease has for it; the host refuses anything else.
      - name: Build the mirror sources
        id: sources
        if: ${{ steps.config.outputs.configured == 'true' && steps.registration.outcome == 'success' }}
        continue-on-error: ${{ inputs.non_blocking == true }}
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          PUBLIC_URL: ${{ vars.UPDATE_SERVER_URL }}
        run: |
          set -euo pipefail
          sources=$(node -e '
            const registration = require("./flare-release/registration.json")
            const base = `${process.env.PUBLIC_URL.replace(/\/$/, "")}/artifacts/${process.env.RELEASE_TAG}`
            const list = (registration.artifacts ?? []).map(a => {
              if (!a.sha256) {
                console.error("::error::every registered artifact must have a sha256 before it can be mirrored")
                process.exit(1)
              }
              return { url: `${base}/${encodeURIComponent(a.filename)}`, sha256: a.sha256 }
            })
            if (list.length === 0) {
              console.error("::error::the registration lists no artifacts")
              process.exit(1)
            }
            process.stdout.write(JSON.stringify(list))
          ')
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

      - name: Mirror the installers over the Shanghai host
        id: mirror
        if: ${{ steps.config.outputs.configured == 'true' && steps.registration.outcome == 'success' && steps.sources.outcome == 'success' }}
        continue-on-error: ${{ inputs.non_blocking == true }}
        # Shorter than the job timeout: a job timeout would fail the run even
        # though this step is non-blocking. The Action stops itself earlier still.
        timeout-minutes: 40
        uses: mkdir700/gitcode-release-mirror@5055ef17b7302e27ca53cbe5f6e44722f7e55f6b # v1.0.0
        with:
          transport: ssh
          repository: ${{ vars.GITCODE_OWNER }}/${{ vars.GITCODE_REPO }}
          tag: ${{ inputs.tag_name }}
          token: ${{ secrets.GITCODE_RELEASE_TOKEN }}
          prerelease: ${{ contains(inputs.tag_name, '-alpha.') || contains(inputs.tag_name, '-beta') || contains(inputs.tag_name, '-rc') }}
          ssh-host: ${{ vars.MIRROR_SSH_HOST }}
          ssh-user: ${{ vars.GITCODE_MIRROR_ACTION_SSH_USER }}
          ssh-port: ${{ vars.MIRROR_SSH_PORT || '22' }}
          ssh-key: ${{ secrets.GITCODE_MIRROR_ACTION_SSH_KEY }}
          ssh-known-hosts: ${{ vars.MIRROR_SSH_KNOWN_HOSTS }}
          sources: ${{ steps.sources.outputs.sources }}
          deadline: '2300'

      # Runs even when some files failed: the Action's receipt says exactly which
      # ones are on GitCode, and only those are registered.
      - name: Register the verified mirrors with FlareRelease
        id: register
        if: ${{ always() && steps.mirror.outputs.receipt != '' }}
        continue-on-error: ${{ inputs.non_blocking == true }}
        env:
          RECEIPT: ${{ steps.mirror.outputs.receipt }}
          FLARE_RELEASE_ACCESS_CLIENT_ID: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_ID }}
          FLARE_RELEASE_ACCESS_CLIENT_SECRET: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p gitcode-mirror
          printf '%s\n' "$RECEIPT" > gitcode-mirror/receipt.json
          node scripts/register-flare-release-mirrors.mjs \
            --receipt gitcode-mirror/receipt.json \
            --registration flare-release/registration.json \
            --source "github-actions:${{ github.repository }}:${{ github.run_id }}" \
            --provenance gitcode-mirror/registration-result.json

      - name: Keep the mirror receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gitcode-mirror-receipt-${{ inputs.tag_name }}
          path: gitcode-mirror/
          if-no-files-found: ignore

      - name: Warn that the mirror is incomplete
        if: ${{ always() && (steps.registration.outcome == 'failure' || steps.sources.outcome == 'failure' || steps.mirror.outcome == 'failure' || steps.register.outcome == 'failure') }}
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          echo "::warning title=GitCode mirror not available::The release is published from GitHub and R2. Users in mainland China are not redirected until the mirror succeeds. Run mirror-desktop-gitcode with tag $RELEASE_TAG, version and channel to retry."
