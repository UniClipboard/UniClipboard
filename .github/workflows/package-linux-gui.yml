name: 'Package Linux GUI'
run-name: package-linux-gui-${{ github.run_number }}

# Native Linux packaging with mandatory final artifact checks. Runtime acceptance is delegated to
# linux-gui-acceptance.yml for PR/manual builds; release.yml explicitly disables it.
on:
  workflow_call:
    inputs:
      build_only:
        description: 'Protected warmup: build only the daemon dependency baseline'
        type: boolean
        default: false
      save_cache:
        description: 'Save Rust downloads after packaging; release disables this'
        type: boolean
        default: true
      run_acceptance:
        description: 'Run isolated AppImage, package lifecycle and telemetry acceptance after packaging'
        required: false
        type: boolean
        default: true
      ref:
        description: 'Commit SHA to build, pinned by the caller (build.yml passes a full SHA); empty builds the caller commit'
        required: false
        type: string
        default: ''
      build_image:
        description: 'GTK4 packaging base image (GTK >= 4.14); default Ubuntu 24.04, glibc 2.39'
        required: false
        type: string
        default: 'ubuntu:24.04'
      max_glibc:
        description: 'Highest GLIBC symbol version any shipped ELF may need (must match build_image)'
        required: false
        type: string
        default: '2.39'
  pull_request:
    paths:
      - '.github/workflows/package-linux-gui.yml'
      - 'scripts/build-cache/**'
      - '.github/workflows/linux-gui-acceptance.yml'
      - 'apps/gui-go/e2e_invoke.go'
      - 'apps/gui-go/e2e/package_linux.py'
      - 'apps/gui-go/e2e/appimage_processes.py'
      - 'apps/gui-go/e2e/updatetool/**'
      - 'apps/gui-go/ui_appimage_linux.go'
      - 'scripts/ci/prepare-webkit-container-profile.sh'
      - 'scripts/tests/test_linux_gtk4_packaging.py'
      - 'scripts/install.sh'
      - 'packaging/nix/update.py'
      - 'packaging/uniclipboard.spec'
      - 'apps/gui-go/e2e/linux/**'
      - 'apps/gui-go/e2e/linux_appimage_run.py'
      - 'apps/gui-go/packaging/linux/**'
      - 'packaging/linux/**'
      - 'scripts/collect-release-assets.py'
  workflow_dispatch:
    inputs:
      save_cache:
        description: 'Save Rust downloads after packaging; release disables this'
        type: boolean
        default: true
      run_acceptance:
        description: 'Run isolated package lifecycle and functional acceptance'
        required: false
        type: boolean
        default: true
      ref:
        description: 'Commit-ish to build (branch, tag or SHA); a name is resolved once and every job uses that SHA. Empty builds the dispatched commit'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: package-linux-gui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_IMAGE: ${{ inputs.build_image || 'ubuntu:24.04' }}
  MAX_GLIBC: ${{ inputs.max_glibc || '2.39' }}

jobs:
  # Only a standalone manual dispatch with a `ref` needs this. Every other entry already supplies an exact SHA (build.yml passes the SHA
  # pinned by its setup-matrix job, a PR has its head, an empty ref is the dispatched commit), so the job is skipped there and a release
  # run never has it. When called from another workflow, `github.workflow` is the caller's name, not this one's.
  resolve:
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Package Linux GUI' && inputs.ref != ''
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # One SHA for both architectures: a branch that moves while the workflow runs must not give them different sources.
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.arch }}
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result != 'failure' }}
    outputs:
      sha: ${{ env.UC_EXPECT_HEAD }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, platform: linux/amd64, machine: x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, machine: aarch64 }
    environment: ${{ inputs.build_only && inputs.save_cache && github.ref == 'refs/heads/main' && github.ref_protected && 'desktop-build-cache-writer' || 'desktop-build-cache-reader' }}
    env:
      UC_MBX_PUBLISH_SNAPSHOT: ${{ inputs.build_only && inputs.save_cache && github.ref == 'refs/heads/main' && github.ref_protected && 'true' || 'false' }}
      UC_MBX_BUILD_IMAGE: ${{ inputs.build_image || 'ubuntu:24.04' }}
      UC_DOCKER_PLATFORM: ${{ matrix.platform }}
      UC_LINUX_IMAGE: uc-package-build:ci
      UC_LINUX_CACHE_VOLUME: uc-linux-gui-cache
      UC_KEYRING_IMAGE: uc-gui-go-linux-keyring:ci
      UC_MAX_GLIBC: ${{ inputs.max_glibc || '2.39' }}
      # The one source commit of this run, also verified against the package manifest.
      UC_EXPECT_HEAD: ${{ needs.resolve.outputs.sha || inputs.ref || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require a pinned source SHA
        # Matrix jobs never resolve a name themselves: it could move between them. A name reaching this point means a caller bug.
        run: |
          [[ "$UC_EXPECT_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "source must be a full 40-character commit SHA, got: $UC_EXPECT_HEAD" >&2; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.UC_EXPECT_HEAD }}
          persist-credentials: false
          # MBX inherits predictions from earlier Cargo.lock revisions through Git history.
          fetch-depth: 0

      - name: Assert a native runner
        # Emulation or cross-building must never be recorded as native evidence (C7). Everything this job writes for itself lives under
        # $RUNNER_TEMP: a file in the workspace would make the "checkout is still clean" gate and the package provenance fail.
        run: |
          mkdir -p "$RUNNER_TEMP/meta"
          test "$(uname -m)" = "${{ matrix.machine }}"
          { uname -a; cat /etc/os-release; docker version --format '{{.Server.Os}}/{{.Server.Arch}}'; } | tee "$RUNNER_TEMP/meta/host.txt"
          test "$(docker version --format '{{.Server.Arch}}')" = "${{ matrix.arch }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        if: inputs.build_only != true
        run: bun install --frozen-lockfile

      - name: Build the packaging image
        run: |
          docker build --platform "${{ matrix.platform }}" --build-arg BASE_IMAGE="$BUILD_IMAGE" --build-arg TARGETARCH="${{ matrix.arch }}" \
            -f apps/gui-go/e2e/linux/Dockerfile.package-build -t "$UC_LINUX_IMAGE" apps/gui-go/e2e/linux
          docker image inspect "$UC_LINUX_IMAGE" --format '{{.Id}}' | tee "$RUNNER_TEMP/meta/image-id.txt"
          echo "UC_BUILD_IMAGE=$BUILD_IMAGE (packaging image $(cat "$RUNNER_TEMP/meta/image-id.txt"))" >> "$GITHUB_ENV"
          docker run --rm "$UC_LINUX_IMAGE" verify_package_build_image.sh | tee "$RUNNER_TEMP/meta/image-versions.txt"

      - name: Verify GTK4 package contracts
        run: |
          docker run --rm --platform "${{ matrix.platform }}" -v "$PWD:/work:ro" -w /work "$UC_LINUX_IMAGE" \
            python3 -m unittest discover -s scripts/tests -p test_linux_gtk4_packaging.py

      - name: Start shared Engine MBX cache
        env:
          BUILD_CACHE_ACCESS: ${{ env.UC_MBX_PUBLISH_SNAPSHOT == 'true' && 'write' || 'read' }}
          BUILD_CACHE_R2_ENDPOINT: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          BUILD_CACHE_R2_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          BUILD_CACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
        run: bash scripts/build-cache/engine-tools.sh --ci

      - name: Restore Cargo downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/uc-cache/cargo/registry
            ${{ runner.temp }}/uc-cache/cargo/git
          key: linux-gui-mbx-v1-${{ github.ref }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-gui-mbx-v1-${{ github.ref }}-${{ matrix.arch }}-

      - name: Create the cache volume
        run: |
          mkdir -p "$RUNNER_TEMP/uc-cache"
          docker volume create --driver local --opt type=none --opt o=bind --opt device="$RUNNER_TEMP/uc-cache" "$UC_LINUX_CACHE_VOLUME"

      - name: Build the release daemon with its evidence
        # `cargo build --locked --release` on this architecture, in the floor image. No Sentry step exists in this workflow, and
        # SENTRY_DSN / POSTHOG_PROJECT_KEY / APP_ENV are deliberately NOT set: the daemons that the acceptance below executes must not be able to
        # report. The evidence records `telemetry_*_injected=false`. The injection contract itself is exercised by `telemetry-injection-contract`;
        # a release build that injects the production values is a separate build and is never the one that was accepted here.
        run: apps/gui-go/e2e/linux/run.sh daemon-release

      - name: Build the frontend (release, no source map upload)
        if: inputs.build_only != true
        # SENTRY_AUTH_TOKEN and VITE_SENTRY_PROJECT stay unset: apps/gui-go/frontend/vite.config.ts uploads source maps only when both are present.
        env:
          VITE_GUI_GO_E2E: '0'
          UC_UI_PLATFORM: linux
          SENTRY_AUTH_TOKEN: ''
          VITE_SENTRY_PROJECT: ''
        run: |
          bun --bun run --cwd apps/gui-go/frontend build
          test "$(cat apps/gui-go/frontend/dist/.ui-platform)" = linux

      - name: Package
        if: inputs.build_only != true
        run: apps/gui-go/e2e/linux/run.sh package-release "$RUNNER_TEMP/out"

      - name: Assert the checkout is still clean
        # The build steps (bun install, go generate, the frontend build) must not have edited a tracked file (C10).
        run: |
          git status --porcelain | tee "$RUNNER_TEMP/meta/dirty.txt"
          test ! -s "$RUNNER_TEMP/meta/dirty.txt"

      - name: Verify the package set
        if: inputs.build_only != true
        run: apps/gui-go/e2e/linux/run.sh verify-packages "$RUNNER_TEMP/out/packages" "$RUNNER_TEMP/upload"

      - name: Upload the named release candidates
        if: inputs.build_only != true
        # Only the four files checked for naming, manifest, provenance and glibc floor. Runtime acceptance is a separate job.
        uses: actions/upload-artifact@v7
        with:
          name: linux-gui-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error
          retention-days: 14

      - name: Return compiler evidence to the runner user
        if: always()
        run: |
          # The daemon container runs as root; mktemp session directories are mode 0700.
          # Change ownership only for this job's statistics, never its credential file or CAS.
          if [[ -d "$RUNNER_TEMP/mbx-evidence" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/mbx-evidence"
          fi

      - name: Summarize MBX cache requests
        if: always() && hashFiles('scripts/ci/summarize-mbx.py') != ''
        shell: bash
        run: python3 scripts/ci/summarize-mbx.py "$RUNNER_TEMP/mbx-evidence"

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-linux-package-${{ matrix.arch }}
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore

      - name: Gather the build evidence
        if: always()
        run: |
          ev="$RUNNER_TEMP/evidence"; mkdir -p "$ev"
          cp "$RUNNER_TEMP"/meta/* "$ev"/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/out/packages/package-manifest.json "$ev"/ 2>/dev/null || true
          docker run --rm -v "$UC_LINUX_CACHE_VOLUME:/cache:ro" -v "$ev:/out" debian:bookworm cp /cache/out-release/build-evidence.txt /out/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/upload.report.json "$ev"/verify.json 2>/dev/null || true
          (cd "$RUNNER_TEMP/upload" 2>/dev/null && sha256sum ./* > "$ev/upload.sha256") || true

      - name: Upload the build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-gui-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Save the Rust cache
        if: inputs.save_cache != false && github.ref == 'refs/heads/main' && github.ref_protected
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/uc-cache/cargo/registry
            ${{ runner.temp }}/uc-cache/cargo/git
          key: linux-gui-mbx-v1-${{ github.ref }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  acceptance:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' && inputs.build_only != true && (github.event_name == 'pull_request' || inputs.run_acceptance) }}
    uses: ./.github/workflows/linux-gui-acceptance.yml
    with:
      ref: ${{ needs.package.outputs.sha }}
      build_image: ${{ inputs.build_image || 'ubuntu:24.04' }}
