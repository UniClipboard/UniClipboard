name: 'PR Check'
run-name: 'PR check for ${{ github.head_ref }}'

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read
  pull-requests: read

# Keep job-level routing so checks have an explicit result on unrelated PRs.
# Shared inputs live in .github/ci-paths.yml; reusable suites have no independent PR trigger.
# The frontend suite owns the tested bundle consumed by the Go host compile job.
jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest

    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gui_go: ${{ steps.filter.outputs.gui_go }}
      cli_go: ${{ steps.filter.outputs.cli_go }}
      quick_panel: ${{ steps.filter.outputs.quick_panel }}
      e2e: ${{ steps.filter.outputs.e2e }}
      membership: ${{ steps.filter.outputs.membership }}
      tooling: ${{ steps.filter.outputs.tooling }}

    steps:
      - uses: actions/checkout@v4
      - name: Detect component changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci-paths.yml

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.gui_go == 'true' }}
    uses: ./.github/workflows/frontend-coverage.yml
    with:
      validate_build: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    name: Rust coverage
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  membership:
    name: Membership
    needs: changes
    if: ${{ needs.changes.outputs.membership == 'true' }}
    uses: ./.github/workflows/membership-e2e.yml
    with:
      tier: pr

  tooling:
    name: Repository tooling tests
    needs: changes
    if: ${{ needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x vitest run

  cli-go:
    name: Go CLI Compile Check
    needs: changes
    if: ${{ needs.changes.outputs.cli_go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli-go/go.mod
          cache: false
      - name: Vet the CLI and shared module
        run: |
          (cd packages/desktop-host-go && go vet ./...)
          (cd apps/cli-go && go vet ./...)
      - name: Link the CLI for supported platforms
        run: |
          mkdir -p target/cli-go-gate
          scripts/ci/build-go-cli.sh x86_64-unknown-linux-gnu target/cli-go-gate/linux-amd64
          for platform in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            (cd apps/cli-go && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -o "../../target/cli-go-gate/$os-$arch" ./cmd/uniclip)
          done

  # Compile gate for the Go/Wails host: a regression in a Linux-only (cgo, GTK) or Windows-only file cannot be seen
  # by the macOS developer build or by the frontend job. Same build image as the Rust job, which carries the GTK3 and
  # WebKitGTK 4.1 development packages. Evidence (linked binaries, SHA256SUMS, source head) is uploaded; nothing is shipped.
  gui-go:
    name: Go Host Compile Check
    needs: [changes, frontend]
    if: ${{ needs.changes.outputs.gui_go == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uniclipboard/build-bookworm:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Use the bundle built and tested by this run, including dotfiles.
      - name: Download tested frontend bundle
        uses: actions/download-artifact@v6
        with:
          name: pr-frontend-${{ github.run_id }}
          path: apps/gui-go/frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/gui-go/go.mod
          # PRs only read caches that the default branch wrote (see cache-warmup).
          cache: false

      # The Go HostService methods are the host command contract: Wails regenerates the
      # TypeScript bindings and the diff must be empty. The analysis runs as GOOS=windows
      # (no cgo, so no GTK needed; output verified byte-identical to darwin), and
      # `hostcontract lint` scans every platform's sources, so a platform file that changes
      # the exported method set still fails. The other
      # checks cross-check events, the //uc: directives and the
      # generated command document. Local fix: `bun run gen:host-contract`, then
      # `go run ./cmd/hostcontract docs` and `e2e-table` in apps/gui-go.
      - name: Verify the host command contract
        env:
          UC_BINDINGS_GOOS: windows
        run: |
          bun run check:host-contract
          bun run check:host-structure

      - name: Vet and link the Go host (Linux, Windows amd64 and arm64)
        run: scripts/ci/check-gui-go.sh all

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-go-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gui-go-gate
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: Rust Check
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # 复用 build-base-image.yml 维护的 bookworm 镜像,避免 PR job 每次访问
    # apt 源安装 webkit/gtk 依赖。镜像已包含 cargo check 所需系统包。
    container:
      image: ghcr.io/uniclipboard/build-bookworm:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    environment: desktop-build-cache-reader
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: pr-check
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: pr-check
          cache-targets: false
          # PR 只读 default branch cache,写入由 cache-warmup 统一负责。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      # Compile the native quick panel (the only Rust GUI) on its own. The workspace
      # check above unifies features across members, so a GUI dependency that only
      # the daemon side enables (e.g. `uc-observability/analytics`) would be hidden there.
      - name: Check quick panel without workspace feature unification
        run: cargo check -p quick-panel --locked

      # Also resolves the quick panel package on its own with `cargo tree` and fails
      # if it links any Engine package. The workspace `cargo check` above cannot
      # catch this: feature unification lets the daemon side enable
      # `uc-observability/analytics` for every member.
      # The quick panel renders from apps/quick-panel/assets/themes.json, which is generated
      # from the frontend preset table (the single source). Local fix: `bun run gen:theme-presets`.
      - name: Verify the quick panel theme presets match the frontend
        run: bun run check:theme-presets

      - name: Verify Engine repository extraction rules
        run: bun run check:engine-repository

      - name: Verify cargo audit exception assumptions
        run: bun run check:cargo-audit-exceptions

      # The retired Tauri host must not come back: no host crate, tooling, config or
      # path reference in manifests, workflows, scripts or live documentation.
      - name: Verify the Tauri host stays retired
        # The checkout is configured as a safe directory on the host runner only.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bun run check:tauri-retired

      # OpenAPI schema drift check (ADR-008) —— `cargo run --bin gen-openapi`
      # 物化 ApiDoc::openapi() 写到仓库根 schema/openapi.json。如果 PR 改了任何
      # #[utoipa::path] / DTO / alias 但没把 schema/openapi.json 一起提交，cmp
      # 会非零退出。本地修复: `bun run gen:openapi` 后 git add schema/openapi.json。
      # 用 cmp 而非 git diff 的原因同上 (容器内 git 看不到 safe.directory)。
      - name: Snapshot committed OpenAPI schema
        run: cp schema/openapi.json /tmp/openapi.committed.json
      - name: Generate OpenAPI schema
        run: cargo run -p uc-webserver --bin gen-openapi --locked
      - name: Verify OpenAPI schema is up to date
        run: |
          if ! cmp -s /tmp/openapi.committed.json schema/openapi.json; then
            echo "::error::OpenAPI schema drift detected. Run 'bun run gen:openapi' locally and commit the regenerated schema/openapi.json."
            diff -u /tmp/openapi.committed.json schema/openapi.json || true
            exit 1
          fi

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-pr-check
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore


  # The native quick panel has a Windows platform layer (apps/quick-panel/src/platform/win32). Ubuntu and macOS never
  # compile it, so it is compiled here on both Windows architectures. Running it needs a desktop session and is the
  # job of apps/gui-go/e2e/windows_native_panel_run.py, not of this check.

  quick-panel-windows:
    name: Quick panel (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.quick_panel == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-latest }
          - { name: Windows ARM64, runner: windows-11-arm }

    environment: desktop-build-cache-reader
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: quick-panel-${{ matrix.runner }}
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-targets: false
          shared-key: pr-check-quick-panel-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check the quick panel
        run: bash scripts/build-cache/mbx.sh --exec cargo check -p quick-panel --locked

      - name: Verify Windows font fallback with DirectWrite
        env:
          UC_WINDOWS_FONT_REGRESSION: '1'
        run: bash scripts/build-cache/mbx.sh --exec cargo test -p quick-panel --test windows_font_fallback --locked -- --ignored

  e2e:
    name: CLI E2E Tests
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: macos-latest
    # Cold builds and the complete real-daemon suite exceeded the previous 45-minute budget.
    timeout-minutes: 90

    environment: desktop-build-cache-reader
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Start shared Engine MBX cache
        uses: ./.github/actions/engine-build-cache
        with:
          cache-key: e2e-macos
          endpoint: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: e2e-macos
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build daemon
        run: cargo build -p uc-daemon --features uc-daemon/e2e-rendezvous

      - name: Run native clipboard startup recovery E2E
        env:
          CLIPBOARD_E2E_TOOLS: ${{ runner.temp }}/clipboard-startup-tools
          CLIPBOARD_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-evidence/clipboard-startup
        shell: bash
        run: |
          mkdir -p "$CLIPBOARD_E2E_TOOLS"
          clang -fobjc-arc -framework AppKit -DPRIVATE_PASTEBOARD_TOOL scripts/e2e/clipboard-startup/private-pasteboard.m -o "$CLIPBOARD_E2E_TOOLS/private-pasteboard"
          clang -fobjc-arc -dynamiclib -framework AppKit scripts/e2e/clipboard-startup/private-pasteboard.m -o "$CLIPBOARD_E2E_TOOLS/private-pasteboard.dylib"
          python3 scripts/e2e/clipboard-startup/real-daemon-clipboard-e2e.py --daemon target/debug/uniclipd --tools "$CLIPBOARD_E2E_TOOLS" --artifacts "$CLIPBOARD_E2E_ARTIFACTS"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli-go/go.mod
          cache-dependency-path: apps/cli-go/go.sum

      - name: Build the user-facing CLI
        # The suites resolve the CLI (Go, apps/cli-go) from target/debug/uniclip.
        run: scripts/e2e/build-cli.sh

      # Same package and features as the daemon build above, so the Engine
      # and daemon dependencies are reused rather than rebuilt. The daemon is
      # the only build that links both the Engine and Desktop's local log-name
      # parser used by diagnostic export.
      - name: Run Engine log-file-name contract test
        env:
          UC_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
        # Explicit `shell: bash` adds `-o pipefail`, so `tee` cannot mask a
        # failing test (the implicit default shell runs without pipefail).
        shell: bash
        run: |
          mkdir -p "$UC_E2E_EVIDENCE_DIR"
          cargo test -p uc-daemon --features uc-daemon/e2e-rendezvous \
            --test engine_log_file_name_contract 2>&1 \
            | tee "$UC_E2E_EVIDENCE_DIR/engine_log_file_name_contract.log"

      # The Rust development CLI serves only the `dev` commands that have no daemon
      # API (history seeding). It builds into its own target directory so the
      # dev-tools features never unify into the daemon build above.
      - name: Build development CLI for the E2E tests that seed history
        run: CARGO_TARGET_DIR=target/e2e-dev cargo build -p uc-dev-cli --features uc-dev-cli/dev-tools

      - name: Build Engine host for final-confirmation E2E test
        run: |
          engine_manifest="$({ cargo metadata --locked --format-version 1; } | jq -r '.packages[] | select(.name == "uc-engine") | .manifest_path')"
          engine_root="$(cd "$(dirname "$engine_manifest")/../.." && pwd)"
          cargo build --manifest-path "$engine_root/Cargo.toml" -p uc-connectivity-host --locked
          echo "UC_E2E_SPACE_WORK_HOST=$engine_root/target/debug/uc-connectivity-host" >> "$GITHUB_ENV"

      - name: Prepare pinned settings-migration history
        run: >-
          python3 scripts/e2e/desktop-settings/prepare-history.py
          --out "${{ runner.temp }}/e2e-evidence/settings-history"
          --github-env "$GITHUB_ENV"

      # `--no-fail-fast` runs every test binary even after one fails, so an
      # unrelated failing suite cannot hide the result of the others; the step
      # still fails if any test fails. The per-test results are kept with the
      # evidence artifact.
      - name: Run E2E tests
        env:
          # Tests that support it write redacted evidence here (see
          # tests/e2e/tests/update_analytics_capture.rs).
          UC_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
          UC_E2E_DEV_CLI: ${{ github.workspace }}/target/e2e-dev/debug/uc-dev-cli
          UC_E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-evidence/settings-migration
        # See above: `shell: bash` keeps the step failing when a test fails.
        shell: bash
        run: |
          mkdir -p "$UC_E2E_EVIDENCE_DIR"
          cargo test --manifest-path tests/e2e/Cargo.toml --no-fail-fast -- --ignored \
            --skip bad_metadata_stays_read_only_across_three_restricted_starts \
            --skip cli_auto_start_exposes_restricted_recovery \
            --skip healthy_saved_profile_stays_healthy_after_restart \
            --skip abandoned_pairings_red_green 2>&1 \
            | tee "$UC_E2E_EVIDENCE_DIR/e2e-suite.log"

      - name: Record E2E evidence source
        if: always()
        env:
          UC_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$UC_E2E_EVIDENCE_DIR"
          {
            echo "head_sha=$HEAD_SHA"
            echo "base_sha=$BASE_SHA"
            echo "tested_merge_sha=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            rustc --version
            cargo --version
            echo "rerun: cargo build -p uc-daemon --features uc-daemon/e2e-rendezvous"
            echo "rerun: scripts/e2e/build-cli.sh"
            echo "rerun: cargo test -p uc-daemon --features uc-daemon/e2e-rendezvous --test engine_log_file_name_contract"
            echo "rerun: UC_E2E_EVIDENCE_DIR=<dir> cargo test --manifest-path tests/e2e/Cargo.toml --test update_analytics_capture -- --ignored"
          } > "$UC_E2E_EVIDENCE_DIR/source.txt"
          # Per-test outcomes of the full suite (test names and ok/FAILED only).
          if [ -f "$UC_E2E_EVIDENCE_DIR/e2e-suite.log" ]; then
            sed 's/\x1b\[[0-9;]*m//g' "$UC_E2E_EVIDENCE_DIR/e2e-suite.log" \
              | grep -E '^(test .* \.\.\. |     Running |test result: )' \
              > "$UC_E2E_EVIDENCE_DIR/e2e-results.txt" || true
            # The raw suite log embeds test-daemon diagnostics on failure; it
            # stays in the job log and is not uploaded.
            rm -f "$UC_E2E_EVIDENCE_DIR/e2e-suite.log"
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Retain MBX compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mbx-e2e-macos
          path: ${{ runner.temp }}/mbx-evidence/
          if-no-files-found: ignore
