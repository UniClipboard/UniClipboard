name: 'PR Check'
run-name: 'PR check for ${{ github.head_ref }}'

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'apps/**'
      - 'src-tauri/**'
      - 'tests/e2e/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'index.html'
      - 'quick-panel.html'
      - 'public/**'
      - '.github/docker/build-bookworm.Dockerfile'
      - '.github/workflows/pr-check.yml'
      - '.github/workflows/membership-e2e.yml'
      - 'scripts/e2e/run-membership-matrix.sh'
      - 'scripts/architecture/**'

permissions:
  contents: read
  packages: read
  pull-requests: read

# 拆 frontend / frontend-tests / rust 三个 job：
# - changes: 检测 PR 是否改到 Rust 相关路径，供 rust job 判断是否需要运行
# - frontend: bun install + tsc + vite build (类型检查 + 产物构建)
# - frontend-tests: bun install + vitest run (前端单元测试)
# - rust: cargo check --workspace --locked (不再带 --all-targets --all-features，
#   PR 阶段不为 test/bench/全 feature 编译。test 在 coverage.yml 跑)
# 完整的 tauri build / 签名 / 公证 仍只在 release 工作流跑。
jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest

    outputs:
      rust: ${{ steps.filter.outputs.rust }}

    steps:
      - name: Detect Rust changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'src-tauri/**'
              - 'tests/e2e/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.github/docker/build-bookworm.Dockerfile'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/membership-e2e.yml'
              - 'scripts/e2e/run-membership-matrix.sh'
              - 'scripts/architecture/**'

  frontend:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun dependencies
        # PR 只读取 default branch 上由 cache-warmup 写入的 Bun cache。
        # actions/cache 会在 miss 时自动保存,这里用 restore 子 action 避免
        # 每个 refs/pull/*/merge 写出重复 cache 并挤掉 release 预热缓存。
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Type check & build frontend
        run: bun run build

      # @hey-api generated client drift check (ADR-008 P5) —— `bun run gen:client`
      # 从 committed 的 schema/openapi.json 重新生成 src/api/generated/。如果 schema
      # 变了但没重新生成客户端，diff 会非零退出。本地修复: `bun run gen:client` 后
      # git add src/api/generated/。
      - name: Verify generated API client is up to date
        run: |
          cp -r src/api/generated /tmp/api-generated.committed
          bun run gen:client
          if ! diff -r -q /tmp/api-generated.committed src/api/generated; then
            echo "::error::Generated API client drift detected. Run 'bun run gen:client' locally and commit src/api/generated/."
            diff -r -u /tmp/api-generated.committed src/api/generated || true
            exit 1
          fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun dependencies
        # PR 只读取 default branch 上由 cache-warmup 写入的 Bun cache。
        # actions/cache 会在 miss 时自动保存,这里用 restore 子 action 避免
        # 每个 refs/pull/*/merge 写出重复 cache 并挤掉 release 预热缓存。
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test -- --run

  rust:
    name: Rust Check
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # 复用 build-base-image.yml 维护的 bookworm 镜像,避免 PR job 每次访问
    # apt 源安装 webkit/gtk 依赖。镜像已包含 cargo check 所需系统包。
    container:
      image: ghcr.io/uniclipboard/build-bookworm:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: pr-check
          # PR 只读 default branch cache,写入由 cache-warmup 统一负责。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust workspace
        env:
          # ADR-008 D13 added `externalBin: ["binaries/uniclipd"]` to
          # tauri.conf.json, so `tauri_build::build()` hard-fails unless
          # `src-tauri/binaries/uniclipd-<triple>` exists. Real bundles stage it
          # via prepare-sidecars.mjs (build.yml / alpha-build.yml); this
          # `cargo check` neither bundles nor spawns the sidecar. Override the
          # config to drop the sidecar for this build (tauri-build merges
          # TAURI_CONFIG as a JSON Merge Patch; an empty array replaces the list).
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check --workspace --locked

      # Compile the GUI package on its own. The workspace check above unifies
      # features across members, so a GUI dependency that only the daemon side
      # enables (e.g. `uc-observability/analytics`) would be hidden there.
      # `custom-protocol` is left off: it only switches Tauri to embedding
      # `frontendDist`, which this job does not build, and does not change the
      # Rust dependency graph.
      - name: Check GUI package without workspace feature unification
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check -p uniclipboard --locked

      # Also resolves the GUI package (`uniclipboard`) on its own with
      # `cargo tree` and fails if it links any Engine package. The workspace
      # `cargo check` above cannot catch this: feature unification lets the
      # daemon side enable `uc-observability/analytics` for every member.
      - name: Verify Engine repository extraction rules
        run: bun run check:engine-repository

      - name: Verify cargo audit exception assumptions
        run: bun run check:cargo-audit-exceptions

      # IPC schema drift check (issue #698) —— `cargo test --test specta_export`
      # 用同一个 `tauri_specta::Builder` 构造命令清单，把 TypeScript binding
      # 写到 `src/lib/ipc-bindings.generated.ts`。如果 PR 改了任何
      # `#[tauri::command]` / DTO / error enum 的形状但没把这个文件一起提交，
      # `cmp` 会以非零退出，CI 拒绝合并。开发者本地修复:
      # `cargo test -p uc-tauri --test specta_export` 重新生成后 `git add`。
      #
      # 不用 `git diff` 是因为 actions/checkout@v4 只在 host runner 配置
      # `safe.directory`,容器内 git 看不到,会把 workspace 当成非仓库,导致
      # `git diff <file>` 误判为 `--no-index` 模式并打印 usage 报错。
      - name: Snapshot committed IPC bindings
        run: cp src/lib/ipc-bindings.generated.ts /tmp/ipc-bindings.committed.ts
      - name: Generate IPC bindings
        run: cargo test -p uc-tauri --test specta_export --locked
      - name: Verify IPC bindings are up to date
        run: |
          if ! cmp -s /tmp/ipc-bindings.committed.ts src/lib/ipc-bindings.generated.ts; then
            echo "::error::IPC schema drift detected. Run 'cargo test -p uc-tauri --test specta_export' locally and commit the regenerated src/lib/ipc-bindings.generated.ts."
            diff -u /tmp/ipc-bindings.committed.ts src/lib/ipc-bindings.generated.ts || true
            exit 1
          fi

      # OpenAPI schema drift check (ADR-008) —— `cargo run --bin gen-openapi`
      # 物化 ApiDoc::openapi() 写到仓库根 schema/openapi.json。如果 PR 改了任何
      # #[utoipa::path] / DTO / alias 但没把 schema/openapi.json 一起提交，cmp
      # 会非零退出。本地修复: `bun run gen:openapi` 后 git add schema/openapi.json。
      # 用 cmp 而非 git diff 的原因同上 (容器内 git 看不到 safe.directory)。
      - name: Snapshot committed OpenAPI schema
        run: cp schema/openapi.json /tmp/openapi.committed.json
      - name: Generate OpenAPI schema
        run: cargo run -p uc-webserver --bin gen-openapi --locked
      - name: Verify OpenAPI schema is up to date
        run: |
          if ! cmp -s /tmp/openapi.committed.json schema/openapi.json; then
            echo "::error::OpenAPI schema drift detected. Run 'bun run gen:openapi' locally and commit the regenerated schema/openapi.json."
            diff -u /tmp/openapi.committed.json schema/openapi.json || true
            exit 1
          fi

  e2e:
    name: CLI E2E Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: e2e-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build daemon and CLI binaries
        run: cargo build -p uc-daemon -p uc-cli --features uc-daemon/e2e-rendezvous

      # Same package selection and features as the build above, so the Engine
      # and daemon dependencies are reused rather than rebuilt. The daemon is
      # the only build that links both the Engine and Desktop's local log-name
      # parser used by diagnostic export.
      - name: Run Engine log-file-name contract test
        env:
          UC_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
        # Explicit `shell: bash` adds `-o pipefail`, so `tee` cannot mask a
        # failing test (the implicit default shell runs without pipefail).
        shell: bash
        run: |
          mkdir -p "$UC_E2E_EVIDENCE_DIR"
          cargo test -p uc-daemon -p uc-cli --features uc-daemon/e2e-rendezvous \
            --test engine_log_file_name_contract 2>&1 \
            | tee "$UC_E2E_EVIDENCE_DIR/engine_log_file_name_contract.log"

      - name: Build development CLI for shared-device E2E tests
        run: CARGO_TARGET_DIR=target/e2e-dev cargo build -p uc-cli --features uc-cli/dev-tools

      - name: Build Engine host for final-confirmation E2E test
        run: |
          engine_manifest="$({ cargo metadata --locked --format-version 1; } | jq -r '.packages[] | select(.name == "uc-engine") | .manifest_path')"
          engine_root="$(cd "$(dirname "$engine_manifest")/../.." && pwd)"
          cargo build --manifest-path "$engine_root/Cargo.toml" -p uc-connectivity-host --locked
          echo "UC_E2E_SPACE_WORK_HOST=$engine_root/target/debug/uc-connectivity-host" >> "$GITHUB_ENV"

      # `--no-fail-fast` runs every test binary even after one fails, so an
      # unrelated failing suite cannot hide the result of the others; the step
      # still fails if any test fails. The per-test results are kept with the
      # evidence artifact.
      - name: Run E2E tests
        env:
          # Tests that support it write redacted evidence here (see
          # tests/e2e/tests/update_analytics_capture.rs).
          UC_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
          UC_E2E_DEV_CLI: ${{ github.workspace }}/target/e2e-dev/debug/uniclip
        # See above: `shell: bash` keeps the step failing when a test fails.
        shell: bash
        run: |
          mkdir -p "$UC_E2E_EVIDENCE_DIR"
          cargo test --manifest-path tests/e2e/Cargo.toml --no-fail-fast -- --ignored \
            --skip bad_metadata_stays_read_only_across_three_restricted_starts \
            --skip cli_auto_start_exposes_restricted_recovery \
            --skip healthy_saved_profile_stays_healthy_after_restart \
            --skip abandoned_pairings_red_green 2>&1 \
            | tee "$UC_E2E_EVIDENCE_DIR/e2e-suite.log"

      - name: Record E2E evidence source
        if: always()
        env:
          UC_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$UC_E2E_EVIDENCE_DIR"
          {
            echo "head_sha=$HEAD_SHA"
            echo "base_sha=$BASE_SHA"
            echo "tested_merge_sha=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            rustc --version
            cargo --version
            echo "rerun: cargo build -p uc-daemon -p uc-cli --features uc-daemon/e2e-rendezvous"
            echo "rerun: cargo test -p uc-daemon -p uc-cli --features uc-daemon/e2e-rendezvous --test engine_log_file_name_contract"
            echo "rerun: UC_E2E_EVIDENCE_DIR=<dir> cargo test --manifest-path tests/e2e/Cargo.toml --test update_analytics_capture -- --ignored"
          } > "$UC_E2E_EVIDENCE_DIR/source.txt"
          # Per-test outcomes of the full suite (test names and ok/FAILED only).
          if [ -f "$UC_E2E_EVIDENCE_DIR/e2e-suite.log" ]; then
            sed 's/\x1b\[[0-9;]*m//g' "$UC_E2E_EVIDENCE_DIR/e2e-suite.log" \
              | grep -E '^(test .* \.\.\. |     Running |test result: )' \
              > "$UC_E2E_EVIDENCE_DIR/e2e-results.txt" || true
            # The raw suite log embeds test-daemon diagnostics on failure; it
            # stays in the job log and is not uploaded.
            rm -f "$UC_E2E_EVIDENCE_DIR/e2e-suite.log"
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
          retention-days: 14
