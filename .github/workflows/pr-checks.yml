name: PR checks

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.golangci-lint-version'
      - 'Makefile'
      - 'engine/**'
      - 'internal/**'
      - 'plugin/**'
      - 'plugins/**'
      - 'sourceapp/**'
      - 'app/service/**'
      - 'app/desktop/**'
      - 'e2e/**'
      - '!e2e/packaging/**'
      - '!e2e/release/**'
      - 'tools/docscheck/**'
      - 'tools/package/*.go'
      - 'tools/release/update-sign/**'
      - 'tools/ci/**'
      - '.github/workflows/pr-checks.yml'
      - '.github/workflows/desktop-e2e-nightly.yml'
      - '!**/README*.md'
      - '!**/AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.golangci-lint-version'
      - 'Makefile'
      - 'engine/**'
      - 'internal/**'
      - 'plugin/**'
      - 'plugins/**'
      - 'sourceapp/**'
      - 'app/service/**'
      - 'app/desktop/**'
      - 'e2e/**'
      - '!e2e/packaging/**'
      - '!e2e/release/**'
      - 'tools/docscheck/**'
      - 'tools/package/*.go'
      - 'tools/release/update-sign/**'
      - 'tools/ci/**'
      - '.github/workflows/pr-checks.yml'
      - '.github/workflows/desktop-e2e-nightly.yml'
      - '!**/README*.md'
      - '!**/AGENTS.md'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  DESKTOP_E2E_SMOKE_SHARDS: 2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.classify.outputs.lint }}
      test: ${{ steps.classify.outputs.test }}
      headless: ${{ steps.classify.outputs.headless }}
      desktop_e2e: ${{ steps.classify.outputs.desktop_e2e }}
      desktop_e2e_extra_cases: ${{ steps.classify.outputs.desktop_e2e_extra_cases }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify PR check trigger rules
        run: python3 -m unittest tools/ci/pr_changes_test.py
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            python3 tools/ci/pr_changes.py --base HEAD^1 --head HEAD --github-output "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]] && [[ -n "$PUSH_BEFORE" ]] && [[ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" >/dev/null 2>&1; then
              python3 tools/ci/pr_changes.py --base "$PUSH_BEFORE" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
            else
              python3 tools/ci/pr_changes.py --all --github-output "$GITHUB_OUTPUT"
            fi
          else
            python3 tools/ci/pr_changes.py --all --github-output "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
      - name: Check formatting
        run: golangci-lint fmt --diff --diff-colored=false

  test:
    name: Test and build
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Test with race detector
        run: go test -race -timeout 15m ./...
      - name: Build
        run: |
          go build -o unic ./app/service/cmd/unic
          go build -o unicd ./app/service/cmd/unicd
          go build -o unic-desktop ./app/desktop/cmd/unic-desktop

  headless:
    name: Production headless E2E
    needs: changes
    if: needs.changes.outputs.headless == 'true'
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Trust the checked-out repository for container builds
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify production binaries without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY make headless-e2e
      - name: Verify v1 tag and color migration
        env:
          UNIC_MIGRATION_TAGS_E2E: "1"
          UNIC_MIGRATION_TAGS_ARTIFACTS: ${{ github.workspace }}/.cache/0015-acceptance/migration
        run: env -u DISPLAY -u WAYLAND_DISPLAY go test ./e2e/headless -run '^TestProductionMigrationTags$' -count=1 -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-acceptance
          path: .cache/0015-acceptance
          include-hidden-files: true

  desktop-e2e:
    name: Desktop E2E smoke (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.desktop_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install native display and recording dependencies
        timeout-minutes: 5
        run: |
          # Regional EC2 package stalls must not consume the Desktop test budget.
          sudo sed -i -E \
            's@https?://([a-z0-9-]+\.)?ec2\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' \
            /etc/apt/sources.list.d/ubuntu.sources
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && \
               sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y \
                 ffmpeg xvfb xauth dbus-x11 libgtk-3-0t64 libayatana-appindicator3-1 fonts-noto-cjk; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::APT dependency bootstrap failed on attempt $attempt; retrying after 10s"
            sleep 10
          done
      - name: Execute the Desktop smoke suite
        env:
          INCLUDE_CASES: ${{ needs.changes.outputs.desktop_e2e_extra_cases }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' make desktop-e2e SUITE=smoke SHARD="${{ matrix.shard }}/$DESKTOP_E2E_SMOKE_SHARDS" INCLUDE_CASES="$INCLUDE_CASES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-smoke-evidence-${{ matrix.shard }}
          path: .build/desktop-e2e
          include-hidden-files: true
          retention-days: 7
          overwrite: true
