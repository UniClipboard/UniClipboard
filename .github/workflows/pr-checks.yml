name: PR checks

on:
  pull_request:
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  DESKTOP_E2E_SHARDS: 6

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
      - name: Check formatting
        run: golangci-lint fmt --diff --diff-colored=false

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: |
          go build -o unic ./app/service/cmd/unic
          go build -o unicd ./app/service/cmd/unicd
          go build -o unic-desktop ./app/desktop/cmd/unic-desktop

  headless:
    name: Production headless E2E
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Trust the checked-out repository for container builds
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify production binaries without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY make headless-e2e
      - name: Verify v1 tag and color migration
        env:
          UNIC_MIGRATION_TAGS_E2E: "1"
          UNIC_MIGRATION_TAGS_ARTIFACTS: ${{ github.workspace }}/.cache/0015-acceptance/migration
        run: env -u DISPLAY -u WAYLAND_DISPLAY go test ./e2e/headless -run '^TestProductionMigrationTags$' -count=1 -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-acceptance
          path: .cache/0015-acceptance
          include-hidden-files: true

  desktop-e2e:
    name: Desktop E2E and visual evidence (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install native display and recording dependencies
        timeout-minutes: 5
        run: |
          # Regional EC2 package stalls must not consume the Desktop test budget.
          sudo sed -i -E \
            's@https?://([a-z0-9-]+\.)?ec2\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' \
            /etc/apt/sources.list.d/ubuntu.sources
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg xvfb xauth dbus-x11 libgtk-3-0t64 libayatana-appindicator3-1 fonts-noto-cjk
      - name: Execute the canonical Desktop suite
        run: xvfb-run -a -s '-screen 0 1600x1000x24' make desktop-e2e SHARD="${{ matrix.shard }}/$DESKTOP_E2E_SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-evidence-${{ matrix.shard }}
          path: .build/desktop-e2e
          include-hidden-files: true
          retention-days: 7
          overwrite: true
      - name: Collect Desktop E2E timings
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          manifests=(.build/desktop-e2e/*/manifest.json)
          if (( ${#manifests[@]} == 1 )); then
            python3 -B app/desktop/e2e/timing.py collect "${manifests[0]}" timing.json
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-e2e-timing-${{ matrix.shard }}
          path: timing.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  desktop-e2e-timing:
    name: Desktop E2E timing report
    needs: desktop-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-e2e-timing-[1-6]
          path: desktop-timings
      - name: Report the slowest cases and shards
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.desktop-e2e.result }}
        run: |
          python3 -B app/desktop/e2e/timing.py report "$DESKTOP_E2E_SHARDS" desktop-timings "$GITHUB_SHA" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MATRIX_RESULT" == success ]]; then
            test -f desktop-timings/timings.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-timing-baseline
          path: desktop-timings/timings.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
