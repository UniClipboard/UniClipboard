name: PR checks

on:
  pull_request:
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
      - name: Check formatting
        run: golangci-lint fmt --diff --diff-colored=false

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: |
          go build -o unic ./app/service/cmd/unic
          go build -o unicd ./app/service/cmd/unicd
          go build -o unic-desktop ./app/desktop/cmd/unic-desktop

  headless:
    name: Production headless E2E
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify production binaries without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY make headless-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-acceptance
          path: .cache/0015-acceptance
          include-hidden-files: true

  desktop-e2e:
    name: Desktop E2E and visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install native display and recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg dbus-x11 libwebkit2gtk-4.1-0
      - name: Execute the canonical Desktop suite
        run: xvfb-run -a -s '-screen 0 1600x1000x24' make desktop-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-evidence
          path: .build/desktop-e2e
          include-hidden-files: true
          retention-days: 7
