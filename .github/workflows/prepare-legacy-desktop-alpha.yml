name: Prepare legacy Desktop alpha
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Desktop Alpha version
        type: string
        default: '2.0.0'
      build_number:
        description: Published Desktop Alpha build to sign for 1.6.2 and 1.6.2-alpha.2
        type: string
        required: true
permissions:
  contents: read
jobs:
  sign:
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 0a72be0fc1532824b72d8d3828462c205ad348f5
          path: v1-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: v1-source/apps/gui-go/go.mod
          cache-dependency-path: v1-source/apps/gui-go/go.sum
      - name: Sign exact published assets and check with the embedded v1 public key
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_ADMIN: ${{ vars.FLARE_RELEASE_ADMIN_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python3 tools/release/legacy_desktop_alpha.py --version "$VERSION" --build "$BUILD_NUMBER" \
            --admin "$RELEASE_ADMIN" --legacy-source v1-source --output dist/legacy-alpha
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-legacy-alpha
          path: |
            dist/legacy-alpha/desktop-legacy-alpha.json
            dist/legacy-alpha/v1-signature-verification.json
            dist/legacy-alpha/release-manifest.json
          if-no-files-found: error
  native:
    needs: sign
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source_version: ['1.6.2', '1.6.2-alpha.2']
        target: [darwin-aarch64, darwin-x86_64, linux-x86_64, linux-aarch64, windows-x86_64, windows-aarch64]
        include:
          - runner: macos-15
            target: darwin-aarch64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: windows-2025
            target: windows-x86_64
          - runner: windows-11-arm
            target: windows-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source_version == '1.6.2' && 'c6483d73c7a0234be68571fdb5fa3d38a17c4871' || '0a72be0fc1532824b72d8d3828462c205ad348f5' }}
          path: v1-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: v1-source/apps/gui-go/go.mod
          cache-dependency-path: v1-source/apps/gui-go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-legacy-alpha
          path: dist/legacy-alpha
      - name: Verify the old installer and replace an isolated v1 installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_TARGET: ${{ matrix.target }}
          LEGACY_SOURCE_VERSION: ${{ matrix.source_version }}
        shell: bash
        run: |
          python e2e/packaging/legacy-alpha-native.py --target "$LEGACY_TARGET" --source-version "$LEGACY_SOURCE_VERSION" \
            --legacy-source v1-source --offer dist/legacy-alpha --output dist/legacy-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-native-${{ matrix.source_version }}-${{ matrix.target }}
          path: dist/legacy-native
          if-no-files-found: error
  stage-build-4:
    needs: [sign, native]
    if: inputs.version == '2.0.0' && inputs.build_number == '4'
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/release/requirements.txt
      - run: pip install -r tools/release/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: desktop-legacy-alpha
          path: dist/legacy-alpha
      - uses: actions/download-artifact@v4
        with:
          pattern: legacy-native-*
          path: dist/legacy-receipts
      - name: Verify and stage the immutable legacy Alpha offer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_SECRET }}
          R2_ENDPOINT: ${{ vars.R2_RELEASE_ENDPOINT }}
          RELEASE_ADMIN: ${{ vars.FLARE_RELEASE_ADMIN_URL }}
        run: |
          PYTHONPATH=tools/release python - <<'PY'
          import json
          import os
          import re
          from itertools import product
          from pathlib import Path
          from urllib.parse import quote

          from botocore.exceptions import ClientError
          from desktop_release import matches, package, request, safe_base, storage
          from legacy_desktop_alpha import PUBLIC, SOURCE_COMMITS, TARGETS

          work = Path('dist/legacy-alpha')
          path = work / 'desktop-legacy-alpha.json'
          offer = json.loads(path.read_text())
          manifest_path = work / 'release-manifest.json'
          manifest = json.loads(manifest_path.read_text())
          registration = offer['manifestDigest']
          assert (offer['version'], offer['buildNumber']) == ('2.0.0', '4')
          assert re.fullmatch('[a-f0-9]{64}', registration)
          assert set(offer['sourceVersions']) == set(SOURCE_COMMITS)
          assert set(offer['signatures']) == set(TARGETS)
          by_name = {item['file']: item['sha256'] for item in manifest['artifacts']}
          checked = set()
          for receipt_path in Path('dist/legacy-receipts').glob('*/report.json'):
              receipt = json.loads(receipt_path.read_text())
              identity = (receipt['source_version'], receipt['target'])
              name = 'uniclipboard-2.0.0-build.4-' + TARGETS[identity[1]]
              assert receipt['status'] == 'passed' and receipt['manifest_digest'] == registration
              assert receipt['candidate_sha256'] == by_name[name] and identity not in checked
              checked.add(identity)
          assert checked == set(product(SOURCE_COMMITS, TARGETS))
          origin = request(PUBLIC, '/artifacts/desktop/2.0.0/build.4/publication.json?source=origin')
          assert origin['status'] == 'available' and origin['manifest_sha256'] == package.sha(manifest_path)
          admin = safe_base(os.environ['RELEASE_ADMIN'])
          release = request(admin, '/api/releases/' + quote(origin['release']['id'], safe=''), access=True)['data']
          assert release['contentHash'] == registration and release['status'] == 'ready'
          state = request(admin, '/api/channels/desktop%2Falpha', access=True)['data']
          assert (state['currentVersion'], state['currentBuildNumber']) == ('2.0.0', '3')

          client = storage(os.environ['R2_ENDPOINT'], False)
          bucket = 'uniclipboard-releases'
          key = '_control/desktop-legacy-alpha/' + registration + '.json'
          if not matches(client, bucket, key, path):
              try:
                  client.put_object(Bucket=bucket, Key=key, Body=path.read_bytes(),
                                    ContentType='application/json', IfNoneMatch='*')
              except ClientError as error:
                  if error.response['Error']['Code'] not in ('PreconditionFailed', '412'):
                      raise
          assert matches(client, bucket, key, path)
          result = {'status': 'staged', 'registration_digest': registration,
                    'offer_sha256': package.sha(path), 'native_receipts': len(checked),
                    'expected_revision': state['internalRevision']}
          (work / 'legacy-staging.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-legacy-staging
          path: dist/legacy-alpha/legacy-staging.json
          if-no-files-found: error
