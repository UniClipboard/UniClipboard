name: Prepare Release
run-name: prepare-release-${{ inputs.version || inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact semver version (e.g. 1.2.0-alpha.3, optional single "v" prefix). Leave empty to use bump type.'
        required: false
        type: string
        default: ''
      bump:
        description: 'Version bump type (used only if version is empty)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      channel:
        description: 'Release channel'
        required: false
        type: choice
        options:
          - stable
          - alpha
          - beta
          - rc
        default: stable
      base_branch:
        description: 'Branch to base the release off (default: main). Use release/vX.Y.Z when iterating prereleases on a release branch whose commits have not yet been merged back to main.'
        required: false
        type: string
        default: 'main'

# Serialize publication against the same base without cancelling an active release.
concurrency:
  group: prepare-release-${{ inputs.base_branch || 'main' }}
  cancel-in-progress: false

env:
  BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
  HUSKY: '0'

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_sha: ${{ steps.base.outputs.sha }}
      previous_tag: ${{ steps.changelog-context.outputs.previous_tag }}
      previous_version: ${{ steps.changelog-context.outputs.previous_version }}
      range_expression: ${{ steps.changelog-context.outputs.range_expression }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch || 'main' }}
          token: ${{ secrets.REPO_BOT_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Pin release base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        env:
          EXACT_VERSION: ${{ inputs.version }}
          BUMP_TYPE: ${{ inputs.bump }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -n "$EXACT_VERSION" ]; then
            # Strip only one optional prefix; validate before creating a branch.
            node scripts/bump-version.js --to "${EXACT_VERSION#v}" --dry-run
          else
            node scripts/bump-version.js --type "$BUMP_TYPE" --channel "$RELEASE_CHANNEL" --dry-run
          fi

      - name: Check release branch does not exist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --heads origin "release/v${VERSION}" | grep -q "release/v${VERSION}"; then
            echo "Error: Branch release/v${VERSION} already exists on remote"
            exit 1
          fi

      - name: Create release branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git checkout -b "release/v${VERSION}"

      - name: Bump version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node scripts/bump-version.js --to "${VERSION}"

      - name: Determine changelog context
        id: changelog-context
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_BOT_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TEMP_OUTPUT=$(mktemp)
          node scripts/previous-published-release.js \
            --repo "${{ github.repository }}" \
            --current-version "${VERSION}" \
            --github-output "${TEMP_OUTPUT}"

          PREV_TAG=$(grep '^previous_tag=' "${TEMP_OUTPUT}" | cut -d= -f2-)
          PREV_VERSION=$(grep '^previous_version=' "${TEMP_OUTPUT}" | cut -d= -f2-)

          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
            PREV_VERSION="initial commit"
          fi

          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "range_expression=${PREV_TAG}..HEAD" >> "$GITHUB_OUTPUT"

          echo "Previous published version: $PREV_VERSION"
          echo "Allowed changelog range: ${PREV_TAG}..HEAD"
          rm -f "${TEMP_OUTPUT}"

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh Cargo.lock for workspace members
        run: cargo update --workspace

      # The Go host compares its generated build info with the daemon's reported version and refuses to start against a daemon of another
      # version, and `scripts/ci/check-gui-go.sh` fails on a stale copy. The generator derives it from Cargo.toml, so the bump must regenerate it.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/desktop-host-go/go.mod

      - name: Regenerate the Go build info
        run: (cd packages/desktop-host-go && go generate ./buildinfo)

      - name: Generate changelog skeleton
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DATE="$(date -u +%F)"
          node scripts/changelog-draft.js init \
            --version "${VERSION}" \
            --date "${RELEASE_DATE}"

      - name: Commit version bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json apps/gui-go/app.json Cargo.toml Cargo.lock packages/desktop-host-go/buildinfo/buildinfo.go docs/changelog/
          git commit -m "chore: bump version to ${VERSION}"

      - name: Save release checkpoint
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: git bundle create "$RUNNER_TEMP/release.bundle" HEAD "^$BASE_SHA"

      - name: Upload release checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  format:
    name: Format release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          token: ${{ secrets.REPO_BOT_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Download release checkpoint
        uses: actions/download-artifact@v4
        with:
          name: release-version
          path: ${{ runner.temp }}/release-checkpoint

      - name: Restore release branch
        run: |
          git fetch "$RUNNER_TEMP/release-checkpoint/release.bundle" HEAD
          git checkout -B "release/v$VERSION" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Format code
        run: |
          cargo fmt --all
          bun run format

      - name: Commit release formatting
        run: |
          git add package.json apps/gui-go/app.json Cargo.toml Cargo.lock packages/desktop-host-go/buildinfo/buildinfo.go docs/changelog/
          git diff --cached --quiet || git commit -m "chore: format release v${VERSION}"

      - name: Save release checkpoint
        run: git bundle create "$RUNNER_TEMP/release.bundle" HEAD "^$BASE_SHA"

      - name: Upload release checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: release-formatted
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  changelog:
    name: Finalize changelog
    needs: [prepare, format]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          token: ${{ secrets.REPO_BOT_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Download release checkpoint
        uses: actions/download-artifact@v4
        with:
          name: release-formatted
          path: ${{ runner.temp }}/release-checkpoint

      - name: Restore release branch
        run: |
          git fetch "$RUNNER_TEMP/release-checkpoint/release.bundle" HEAD
          git checkout -B "release/v$VERSION" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Render Codex changelog prompt
        if: env.CODEX_API_KEY != ''
        id: render-codex-changelog-prompt
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
          RANGE_EXPRESSION: ${{ needs.prepare.outputs.range_expression }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const templatePath = '.github/prompts/release-changelog.codex.md';
          let prompt = fs.readFileSync(templatePath, 'utf8');
          const replacements = {
            '{{VERSION}}': process.env.VERSION,
            '{{CURRENT_TAG}}': `v${process.env.VERSION}`,
            '{{PREVIOUS_TAG}}': process.env.PREVIOUS_TAG,
            '{{PREVIOUS_VERSION}}': process.env.PREVIOUS_VERSION,
            '{{RANGE_EXPRESSION}}': process.env.RANGE_EXPRESSION,
            '{{CHANNEL}}': process.env.CHANNEL,
            '{{IS_PRERELEASE}}': process.env.CHANNEL === 'stable' ? 'false' : 'true',
          };

          for (const [token, value] of Object.entries(replacements)) {
            prompt = prompt.replaceAll(token, value);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `prompt<<__CODEX_PROMPT__\n${prompt}\n__CODEX_PROMPT__\n`
          );
          EOF

      - name: Codex polish changelog
        if: env.CODEX_API_KEY != ''
        uses: openai/codex-action@v1
        with:
          responses-api-endpoint: ${{ secrets.CODEX_API_ENDPOINT || 'https://api.openai.com/v1/responses' }}
          openai-api-key: ${{ env.CODEX_API_KEY }}
          prompt: ${{ steps.render-codex-changelog-prompt.outputs.prompt }}

      - name: Validate changelog output
        run: |
          if [ -z "${CODEX_API_KEY}" ]; then
            echo "CODEX_API_KEY is required to generate finalized changelog files." >&2
            exit 1
          fi

          VERSION="${{ needs.prepare.outputs.version }}"
          node scripts/changelog-draft.js validate --version "${VERSION}"

      - name: Commit codex changes
        if: env.CODEX_API_KEY != ''
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          git add docs/changelog/
          git diff --cached --quiet || git commit -m "docs: polish changelog for v${VERSION}"

      - name: Save release checkpoint
        run: git bundle create "$RUNNER_TEMP/release.bundle" HEAD "^$BASE_SHA"

      - name: Upload release checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: release-finalized
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Create release PR
    needs: [prepare, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          token: ${{ secrets.REPO_BOT_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Download release checkpoint
        uses: actions/download-artifact@v4
        with:
          name: release-finalized
          path: ${{ runner.temp }}/release-checkpoint

      - name: Restore release branch
        run: |
          git fetch "$RUNNER_TEMP/release-checkpoint/release.bundle" HEAD
          git checkout -B "release/v$VERSION" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push release branch
        run: |
          BRANCH="release/v$VERSION"
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "Remote branch $BRANCH differs from the finalized checkpoint; refusing to overwrite it." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Create pull request
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_BOT_TOKEN }}
        run: |
          PR_URL=$(gh pr list --state open --base "$BASE_BRANCH" --head "release/v$VERSION" --json url --jq '.[0].url // empty')
          if [ -n "$PR_URL" ]; then
            echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-pr-body.md" <<EOF
          ## Release v${VERSION}

          This PR prepares the release of v${VERSION} (base: \`${BASE_BRANCH}\`).

          ### Changes
          - Version bumped to ${VERSION} in package.json, apps/gui-go/app.json, Cargo.toml, Cargo.lock, packages/desktop-host-go/buildinfo/buildinfo.go
          - Changelog generated at docs/changelog/${VERSION}.md

          ### What happens when this PR is merged
          1. The **tag-on-merge** workflow will automatically create an annotated tag \`v${VERSION}\`
          2. The tag push will trigger the **Release** workflow to build and publish artifacts
          3. The release branch \`release/v${VERSION}\` will be automatically deleted

          > **Do not manually create a tag.** Merging this PR handles everything.
          EOF
          PR_URL=$(gh pr create \
            --title "release: v${VERSION}" \
            --body-file "$RUNNER_TEMP/release-pr-body.md" \
            --base "${BASE_BRANCH}" \
            --head "release/v${VERSION}")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          echo "## Release Preparation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Channel:** ${{ inputs.channel }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** release/v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** ${PR_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the PR and changelog" >> $GITHUB_STEP_SUMMARY
          echo "2. Merge the PR to trigger automatic tag creation and release" >> $GITHUB_STEP_SUMMARY
