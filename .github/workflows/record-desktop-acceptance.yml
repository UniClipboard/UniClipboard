name: Record Desktop native acceptance
on:
  workflow_dispatch:
    inputs:
      build:
        description: Exact Desktop Alpha identity, for example 2.0.0-build.8
        type: string
        required: true
      acceptance:
        description: JSON with the darwin, linux and windows native acceptance receipts
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: desktop-native-acceptance-${{ inputs.build }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify and record acceptance for the exact Alpha build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ inputs.build }}
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: |
          printf '%s\n' "$ACCEPTANCE" > "$RUNNER_TEMP/desktop-acceptance.json"
          python3 tools/release/joint_plan.py accept --build "$BUILD" --acceptance "$RUNNER_TEMP/desktop-acceptance.json"
