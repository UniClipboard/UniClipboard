name: Read-only npm OIDC diagnostic
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check GitHub claims and npm exchange status
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = build_opener(NoRedirect())
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=npm%3Aregistry.npmjs.org'
          headers = {'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}
          with opener.open(Request(url, headers=headers), timeout=20) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          identity = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          print(json.dumps({k: identity.get(k) for k in ('iss','aud','repository','workflow_ref','job_workflow_ref','ref','runner_environment')}))

          for suffix in ('', '-darwin-x64', '-darwin-arm64', '-linux-x64', '-linux-arm64', '-win32-x64', '-win32-arm64'):
              name = '@uniclipboard/cli' + suffix
              endpoint = 'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/' + quote(name, safe='@')
              request = Request(endpoint, method='POST', headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with opener.open(request, timeout=20) as response:
                      print(name, response.status, 'token received' if json.load(response).get('token') else 'token missing')
              except HTTPError as error:
                  body = json.loads(error.read(4096))
                  reason = str(body.get('message') or body.get('error') or '')[:250]
                  reason = re.sub(r'[A-Za-z0-9_.=-]{40,}', '[redacted]', reason)
                  print(name, error.code, reason)
          PY
