name: Release CLI and Desktop
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        type: string
        default: ''
        description: Publish exact files from an already accepted canonical CLI build
      channel:
        type: choice
        options: [alpha, stable]
        required: true
      version:
        type: string
        description: Release both products at this version; leave empty for standalone CLI
      expected_source:
        type: string
        description: Expected source SHA on the dispatched branch (defaults to github.sha)
      candidate_manifest_sha256:
        type: string
        description: Exact manifest required by the Desktop CLI lock
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: release-cli
  cancel-in-progress: false
jobs:
  plan:
    name: Select product builds
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      desktop_build: ${{ steps.plan.outputs.desktop_build }}
      reused_cli_sha256: ${{ steps.plan.outputs.reused_cli_sha256 }}
      cli_manifest_sha256: ${{ steps.plan.outputs.cli_manifest_sha256 }}
    steps:
      - name: Resolve and verify release source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          head_sha = os.environ["GITHUB_SHA"]
          expected = os.environ.get("EXPECTED_SOURCE", "").strip()
          repo = os.environ["GITHUB_REPOSITORY"]

          if not expected:
              source_sha = head_sha
          else:
              if not re.fullmatch(r"[0-9a-f]{40}", expected):
                  sys.exit(
                      f"expected_source must be a 40-character lowercase hex SHA, got: {expected!r}"
                  )
              if expected != head_sha:
                  result = subprocess.run(
                      ["gh", "api", f"repos/{repo}/compare/{expected}...{head_sha}"],
                      text=True,
                      capture_output=True,
                  )
                  if result.returncode != 0:
                      detail = result.stderr.strip() or result.stdout.strip()
                      sys.exit(
                          f"expected_source {expected} could not be compared against {head_sha}: {detail}"
                      )
                  data = json.loads(result.stdout)
                  status = data.get("status")
                  behind_by = data.get("behind_by")
                  if status not in ("identical", "ahead") or behind_by != 0:
                      sys.exit(
                          f"expected_source {expected} is not an ancestor of dispatched HEAD {head_sha} "
                          f"(compare status={status!r}, behind_by={behind_by!r})"
                      )
              source_sha = expected

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"source_sha={source_sha}\n")
          print(f"Resolved release source: {source_sha} (dispatched HEAD: {head_sha})")
          PY
      - uses: actions/checkout@v6
        if: inputs.version != ''
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        if: inputs.version != '' && inputs.channel == 'alpha'
        with:
          go-version-file: go.mod
      - id: plan
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          CLI_CANDIDATE: ${{ inputs.candidate_run_id }}
        run: |
          if [[ -n "$CLI_CANDIDATE" ]]; then
            echo "candidate_run_id cannot be combined with joint version" >&2
            exit 1
          fi
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          python3 tools/release/joint_plan.py plan --channel "$CHANNEL" --version "$VERSION" \
            --run-id "$GITHUB_RUN_ID" --source "$SOURCE_SHA" --output dist/joint-plan --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: joint-release-plan
          path: dist/joint-plan/
          overwrite: true
          if-no-files-found: error
  resolve:
    name: Recover CLI candidate
    needs: plan
    if: inputs.candidate_run_id == '' && (inputs.version == '' || inputs.channel == 'alpha')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      staged: ${{ steps.resume.outputs.staged }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.version != ''
        with:
          name: joint-release-plan
          path: dist/joint-plan
      - name: Recover an already staged immutable candidate
        id: resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          JOINT_VERSION: ${{ inputs.version }}
          REUSED_DIGEST: ${{ needs.plan.outputs.reused_cli_sha256 }}
        run: |
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          args=()
          if [[ -n "$JOINT_VERSION" ]]; then args+=(--metadata dist/joint-plan/products.toml); fi
          if [[ -n "$REUSED_DIGEST" ]]; then args+=(--reuse-published); fi
          python3 tools/release/release.py resume --output dist/npm --github-output "$GITHUB_OUTPUT" "${args[@]}"
          if [[ -n "$REUSED_DIGEST" ]]; then
            actual=$(sha256sum dist/npm/release-manifest.json)
            test "${actual%% *}" = "$REUSED_DIGEST"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.resume.outputs.staged == 'true'
        with:
          name: cli-npm-resumed
          path: dist/npm/
          overwrite: true
          if-no-files-found: error
  build:
    name: Build and sign CLI
    needs: [plan, resolve]
    if: needs.resolve.outputs.staged != 'true'
    uses: ./.github/workflows/build-cli.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      distribution: true
      joint: ${{ inputs.version != '' }}
    secrets:
      POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  publish:
    name: Publish CLI to npm
    needs: [plan, resolve, build, desktop_build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((inputs.version != '' && inputs.channel == 'stable')
      || (inputs.version != '' && needs.desktop_build.result == 'success')
      || (inputs.version == '' && (inputs.candidate_run_id != ''
      || (needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.resolve.outputs.staged == 'true'))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Restore pinned npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: release-npm-v1-${{ runner.os }}-${{ runner.arch }}-11.21.2
      - run: npm install --global npm@11.21.2
      - name: Isolate npm configuration for OIDC
        run: |
          echo "registry=https://registry.npmjs.org/" > "$RUNNER_TEMP/unic-npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/unic-npmrc" >> "$GITHUB_ENV"
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: inputs.version != '' && inputs.channel == 'stable'
        with:
          name: joint-release-plan
          path: dist/joint-plan
      - uses: actions/download-artifact@v4
        if: inputs.candidate_run_id == '' && (inputs.version == '' || inputs.channel == 'alpha')
        with:
          name: ${{ needs.resolve.outputs.staged == 'true' && 'cli-npm-resumed' || 'cli-npm-candidate' }}
          path: dist/npm
      - name: Acquire the selected immutable CLI candidate
        if: inputs.candidate_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: python3 tools/release/cli_candidate.py --run-id "$CANDIDATE_RUN" --output dist/npm --require-macos-signing
      - name: Verify the Desktop CLI lock
        if: inputs.candidate_manifest_sha256 != '' || needs.plan.outputs.cli_manifest_sha256 != ''
        env:
          EXPECTED_DIGEST: ${{ needs.plan.outputs.cli_manifest_sha256 || inputs.candidate_manifest_sha256 }}
        run: |
          manifest=dist/npm/release-manifest.json
          if [[ -f dist/joint-plan/cli-manifest.json ]]; then manifest=dist/joint-plan/cli-manifest.json; fi
          actual=$(sha256sum "$manifest")
          test "${actual%% *}" = "$EXPECTED_DIGEST"
      - name: Stage durable immutable build record
        if: inputs.version == '' || inputs.channel == 'alpha'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release/release.py record --manifest dist/npm/release-manifest.json
      - name: Publish and read back exact npm packages
        if: inputs.version == '' || inputs.channel == 'alpha'
        env:
          CHANNEL: ${{ inputs.channel }}
        run: python3 tools/release/release.py publish --manifest dist/npm/release-manifest.json --channel "$CHANNEL" --receipt dist/publication.json
      - name: Promote and read back the exact Alpha packages on npm
        if: inputs.version != '' && inputs.channel == 'stable'
        run: python3 tools/release/release.py promote --manifest dist/joint-plan/cli-manifest.json --channel stable --receipt dist/publication.json
      - name: Finalize build record
        if: inputs.version == '' || inputs.channel == 'alpha'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release/release.py record --manifest dist/npm/release-manifest.json --finish --receipt dist/publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.version != '' && format('cli-publication-receipt-{0}', github.run_attempt) || 'cli-publication-receipt' }}
          path: dist/publication.json
          if-no-files-found: warn

  desktop_lock:
    name: Lock Desktop to the accepted CLI
    needs: [plan, resolve, build]
    if: ${{ !cancelled() && inputs.version != '' && inputs.channel == 'alpha' && needs.plan.result == 'success' && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.resolve.outputs.staged == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: joint-release-plan
          path: dist/joint-plan
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.staged == 'true' && 'cli-npm-resumed' || 'cli-npm-candidate' }}
          path: dist/desktop-cli
      - env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/release/joint.py "$VERSION" --metadata dist/joint-plan/products.toml --cli-manifest dist/desktop-cli/release-manifest.json --output dist/desktop-cli/products.toml --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: joint-desktop-cli
          path: dist/desktop-cli/
          overwrite: true
          if-no-files-found: error
  desktop_build:
    name: Build and sign Desktop
    needs: [plan, desktop_lock]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.desktop_lock.result == 'success' }}
    uses: ./.github/workflows/build-desktop.yml
    with:
      distribution: true
      source_sha: ${{ needs.plan.outputs.source_sha }}
      joint: true
    secrets: inherit
  desktop_publish:
    name: Publish Desktop
    needs: [plan, publish, desktop_build]
    if: ${{ !cancelled() && inputs.version != '' && inputs.channel == 'alpha' && needs.publish.result == 'success' && needs.desktop_build.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      operation: publish
      channel: ${{ inputs.channel }}
      candidate_run_id: ${{ github.run_id }}
      joint: true
      source_sha: ${{ needs.plan.outputs.source_sha }}
    secrets: inherit
  legacy_alpha:
    name: Verify and stage legacy upgrades
    needs: [plan, desktop_publish]
    if: ${{ !cancelled() && inputs.channel == 'alpha' && needs.plan.result == 'success' && needs.desktop_publish.result == 'success' }}
    uses: ./.github/workflows/prepare-legacy-desktop-alpha.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ needs.plan.outputs.desktop_build }}
      stage: true
      source_sha: ${{ needs.plan.outputs.source_sha }}
    secrets: inherit
  desktop_promote:
    name: Advance and verify Desktop channel
    needs: [plan, publish, legacy_alpha]
    if: ${{ !cancelled() && inputs.version != '' && needs.plan.result == 'success' && needs.publish.result == 'success' && (inputs.channel == 'stable' || needs.legacy_alpha.result == 'success') }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      operation: promote
      channel: ${{ inputs.channel }}
      candidate_run_id: ${{ github.run_id }}
      expected_revision: ${{ inputs.channel == 'stable' && 'auto' || needs.legacy_alpha.outputs.expected_revision }}
      joint: true
      source_sha: ${{ needs.plan.outputs.source_sha }}
    secrets: inherit
  verify_joint_release:
    name: Verify both release results
    needs: [publish, desktop_promote]
    if: ${{ !cancelled() && inputs.version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CLI_RESULT: ${{ needs.publish.result }}
          DESKTOP_RESULT: ${{ needs.desktop_promote.result }}
        run: |
          if [[ "$CLI_RESULT" != success || "$DESKTOP_RESULT" != success ]]; then
            printf 'Joint release incomplete (CLI: %s, Desktop: %s)\n' "$CLI_RESULT" "$DESKTOP_RESULT" >&2
            exit 1
          fi
