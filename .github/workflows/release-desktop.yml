name: Release Desktop
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight, github-draft, publish, promote]
        required: true
      candidate_run_id:
        type: string
        description: Required for github-draft, publish and promote
      channel:
        type: choice
        options: [alpha, stable]
        default: alpha
      previous_tag:
        type: string
        default: ''
        description: Optional previous Desktop or v1 tag for the changelog comparison
      expected_revision:
        type: string
        default: '0'
      stable_acceptance:
        type: string
        description: JSON with darwin, linux and windows receipts for stable promotion
      expected_source:
        type: string
        description: Expected branch HEAD SHA for this manual run
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      candidate_run_id:
        type: string
        required: true
      channel:
        type: string
        required: true
      expected_revision:
        type: string
        default: '0'
      stable_acceptance:
        type: string
      joint:
        type: boolean
        required: true
      source_sha:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: release-desktop
  cancel-in-progress: false
jobs:
  preflight:
    if: inputs.operation == 'preflight'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/release/requirements.txt
      - run: pip install -r tools/release/requirements.txt
      - name: Verify authenticated R2 read-back and both FlareRelease contracts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_SECRET }}
          R2_ENDPOINT: ${{ vars.R2_RELEASE_ENDPOINT }}
          RELEASE_ADMIN: ${{ vars.FLARE_RELEASE_ADMIN_URL }}
        run: python3 tools/release/desktop_release.py preflight --endpoint "$R2_ENDPOINT" --admin "$RELEASE_ADMIN"
  deliver:
    if: inputs.operation != 'preflight'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 60
    outputs:
      published_tag: ${{ steps.published_tag.outputs.tag }}
    env:
      DESKTOP_NOTES: ${{ inputs.joint && inputs.channel == 'stable' && 'dist/catalogue/desktop-notes.json' || 'release/desktop-notes.json' }}
      DESKTOP_TEMPLATE: ${{ inputs.joint && inputs.channel == 'stable' && 'dist/catalogue/release-template.md' || '.github/release-notes/desktop.md.tmpl' }}
    steps:
      - name: Reject a mismatched manual source
        if: inputs.source_sha == '' && inputs.expected_source != '' && inputs.expected_source != github.sha
        run: |
          echo '::error::The expected source does not match the dispatched commit.'
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source revision
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/release/requirements.txt
      - run: pip install -r tools/release/requirements.txt
      - uses: actions/download-artifact@v4
        if: inputs.joint && inputs.channel == 'alpha'
        with:
          name: joint-desktop-cli
          path: dist/cli-input
      - uses: actions/download-artifact@v4
        if: inputs.joint && inputs.channel == 'alpha'
        with:
          pattern: desktop-*64
          path: dist/desktop-build-artifacts
      - uses: actions/download-artifact@v4
        if: inputs.joint && inputs.channel == 'stable'
        with:
          name: joint-release-plan
          path: dist/joint-plan
      - name: Acquire the selected published Alpha assets
        if: inputs.joint && inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/cli-input
          cp dist/joint-plan/cli-manifest.json dist/cli-input/release-manifest.json
          python3 tools/release/joint_plan.py fetch-stable --plan dist/joint-plan/plan.json \
            --output dist/catalogue --cli-manifest dist/cli-input/release-manifest.json \
            --acceptance dist/joint-plan/stable-acceptance.json
      - name: Acquire exact accepted native candidate and locked CLI
        if: ${{ !inputs.joint || inputs.channel == 'alpha' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          IN_RUN_BUILD: ${{ inputs.joint && inputs.channel == 'alpha' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          metadata=release/products.toml
          args=()
          if [[ "$IN_RUN_BUILD" == true ]]; then
            metadata=dist/cli-input/products.toml
            args+=(--current-artifacts dist/desktop-build-artifacts)
            if [[ -n "$SOURCE_SHA" ]]; then
              args+=(--source-sha "$SOURCE_SHA")
            fi
          else
            python3 tools/package/desktop.py fetch-cli --allow-ci --target linux-amd64 --output dist/cli-input
          fi
          python3 tools/release/desktop_release.py acquire --run-id "$CANDIDATE_RUN" --output dist/candidate "${args[@]}"
          python3 tools/release/desktop_release.py assemble --metadata "$metadata" --input dist/candidate --output dist/catalogue
      - name: Stage or verify immutable GitHub Release before delivery
        if: ${{ !inputs.joint || inputs.channel == 'alpha' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'PYNOTES'
          import json, os, subprocess
          from pathlib import Path
          m = json.loads(Path('dist/catalogue/release-manifest.json').read_text())
          command = ['gh', 'api', '--method', 'POST', 'repos/UniClipboard/UniClipboard/releases/generate-notes',
                     '-f', f"tag_name=desktop/v{m['version']}-build.{m['build_number']}",
                     '-f', 'target_commitish=' + m['source_sha']]
          if os.environ['PREVIOUS_TAG']:
              command += ['-f', 'previous_tag_name=' + os.environ['PREVIOUS_TAG']]
          body = ''
          if os.environ['OPERATION'] != 'promote':
              result = subprocess.run(command, text=True, capture_output=True)
              body = json.loads(result.stdout)['body'] if result.returncode == 0 else ''
              if result.returncode:
                  print('::warning::GitHub-generated contributors are unavailable; explicit changelog remains.')
          Path('dist/generated-notes.md').write_text(body, encoding='utf-8')
          PYNOTES
          python3 tools/release/github_desktop.py draft --manifest dist/catalogue/release-manifest.json --cli-manifest dist/cli-input/release-manifest.json --notes release/desktop-notes.json --output dist/github-page --channel "$CHANNEL" --previous-tag "$PREVIOUS_TAG" --generated-notes dist/generated-notes.md
      - name: Publish immutable packages and register numbered build
        if: inputs.operation == 'publish'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_SECRET }}
          R2_ENDPOINT: ${{ vars.R2_RELEASE_ENDPOINT }}
          RELEASE_ADMIN: ${{ vars.FLARE_RELEASE_ADMIN_URL }}
        run: |
          python3 tools/release/desktop_release.py publish --manifest dist/catalogue/release-manifest.json --cli-manifest dist/cli-input/release-manifest.json --endpoint "$R2_ENDPOINT" --admin "$RELEASE_ADMIN" --notes release/desktop-notes.json --receipt dist/publication.json
      - name: Promote exact immutable numbered build
        if: inputs.operation == 'promote'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLARE_RELEASE_ACCESS_CLIENT_SECRET }}
          RELEASE_ADMIN: ${{ vars.FLARE_RELEASE_ADMIN_URL }}
          CHANNEL: ${{ inputs.channel }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          FORWARD_ONLY: ${{ inputs.joint || inputs.expected_source != '' }}
          JOINT: ${{ inputs.joint }}
          STABLE_ACCEPTANCE: ${{ inputs.stable_acceptance }}
        run: |
          python3 - <<'PY'
          import json, urllib.request
          p = json.load(open('dist/catalogue/release-manifest.json'))
          url = f"https://release.uniclipboard.app/artifacts/desktop/{p['version']}/build.{p['build_number']}/publication.json?source=origin"
          request = urllib.request.Request(url, headers={'User-Agent': 'UniClipboard-Release'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read(1048577)
          if len(data) > 1048576:
              raise ValueError('publication receipt exceeds limit')
          open('dist/publication.json', 'wb').write(data)
          PY
          args=()
          if [[ "$FORWARD_ONLY" == true ]]; then
            args+=(--forward-only)
          fi
          if [[ "$CHANNEL" == stable ]]; then
            if [[ "$JOINT" == true ]]; then
              cp dist/joint-plan/stable-acceptance.json dist/stable-acceptance.json
            else
              printf '%s\n' "$STABLE_ACCEPTANCE" > dist/stable-acceptance.json
            fi
            args+=(--acceptance dist/stable-acceptance.json --cli-manifest dist/cli-input/release-manifest.json)
          fi
          python3 tools/release/desktop_release.py promote --manifest dist/catalogue/release-manifest.json --publication dist/publication.json --admin "$RELEASE_ADMIN" --channel "$CHANNEL" --expected-revision "$EXPECTED_REVISION" --receipt dist/promotion.json "${args[@]}"
      - name: Publish alpha page only after origin availability
        if: inputs.operation == 'publish' && inputs.channel == 'alpha'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: python3 tools/release/github_desktop.py publish --manifest dist/catalogue/release-manifest.json --cli-manifest dist/cli-input/release-manifest.json --notes release/desktop-notes.json --output dist/github-page --channel alpha --previous-tag "$PREVIOUS_TAG" --generated-notes dist/generated-notes.md --publication dist/publication.json
      - name: Publish promoted page after verified channel read-back
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          python3 tools/release/github_desktop.py publish --manifest dist/catalogue/release-manifest.json --cli-manifest dist/cli-input/release-manifest.json --notes "$DESKTOP_NOTES" --template "$DESKTOP_TEMPLATE" --output dist/github-page --channel "$CHANNEL" --previous-tag "$PREVIOUS_TAG" --publication dist/publication.json --promotion dist/promotion.json
      - name: Record published GitHub Release tag
        id: published_tag
        if: inputs.operation == 'promote' || (inputs.operation == 'publish' && inputs.channel == 'alpha')
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("dist/github-page/github-receipt.json"))["tag"])')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Record the verified Alpha selection
        if: inputs.joint && inputs.operation == 'promote' && inputs.channel == 'alpha'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release/joint_plan.py mark-alpha --manifest dist/catalogue/release-manifest.json \
            --cli-manifest dist/cli-input/release-manifest.json --promotion dist/promotion.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.joint && format('desktop-delivery-{0}-{1}', inputs.operation, github.run_attempt) || 'desktop-delivery-receipt' }}
          path: |
            dist/publication.json
            dist/promotion.json
            dist/stable-acceptance.json
            dist/github-page/github-receipt.json
            dist/github-page/release-notes.md
            dist/github-page/SHA256SUMS.txt
            dist/catalogue/release-manifest.json
          if-no-files-found: warn
  dispatch-gitcode-mirror:
    needs: deliver
    if: ${{ success() && !inputs.joint && needs.deliver.outputs.published_tag != '' && github.repository == 'UniClipboard/UniClipboard' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch GitCode mirror from default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_NAME: ${{ needs.deliver.outputs.published_tag }}
        run: |
          gh workflow run mirror-gitcode.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" -f tag_name="$TAG_NAME"
          echo "Dispatched mirror-gitcode.yml for $TAG_NAME from $DEFAULT_BRANCH." >> "$GITHUB_STEP_SUMMARY"
