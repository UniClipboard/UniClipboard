name: Release CLI and Desktop
run-name: Release CLI and Desktop ${{ inputs.version }} (${{ inputs.channel }})
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [alpha, stable]
        required: true
      version:
        type: string
        required: true
        description: Product version selected for both CLI and Desktop in release/products.toml
      desktop_candidate_run_id:
        type: string
        description: Accepted signed Build Desktop run. Required for stable.
      stable_acceptance:
        type: string
        description: JSON with darwin, linux and windows native receipts. Required for stable.
permissions:
  actions: write
  contents: write
concurrency:
  group: release-joint
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Release both products and verify channel delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          DESKTOP_CANDIDATE: ${{ inputs.desktop_candidate_run_id }}
          STABLE_ACCEPTANCE: ${{ inputs.stable_acceptance }}
        run: python3 tools/release/joint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-release-${{ github.run_attempt }}
          path: dist/joint-release.json
          if-no-files-found: ignore
