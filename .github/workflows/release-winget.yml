name: Release WinGet
run-name: WinGet from joint release ${{ inputs.release_run_id }}/${{ inputs.release_run_attempt }}
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful joint release run ID
        required: true
        type: string
      release_run_attempt:
        description: Successful joint release attempt
        required: true
        default: '1'
        type: string
      publish:
        description: Publish or submit a verified Stable build (Alpha always previews)
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
concurrency:
  group: release-package-winget
  queue: max
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-release
        id: release
        with:
          run-id: ${{ inputs.release_run_id }}
          run-attempt: ${{ inputs.release_run_attempt }}
          channel: winget
          publish: ${{ inputs.publish }}
      - name: Validate the WinGet manifests using WinGet
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Scope CurrentUser -Force -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers
            $env:Path += ";$env:LOCALAPPDATA\Microsoft\WindowsApps"
          }
          winget validate --manifest dist/channel/winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Submit manifests using WinGetCreate
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { throw 'WINGET_TOKEN is required' }
          python tools/release/package_channel.py check-current --manifest dist/channel/release-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit (Resolve-Path dist/channel/winget).Path --no-open
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: winget-definitions
          path: dist/channel/
          overwrite: true
          if-no-files-found: error
