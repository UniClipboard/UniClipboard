name: 'sccache Windows probe'
on:
  push:
    paths:
      - '.github/workflows/sccache-win-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    environment: desktop-build-cache-reader
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: configure
        shell: bash
        env:
          E: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
          K: ${{ secrets.BUILD_CACHE_R2_ACCESS_KEY_ID }}
          S: ${{ secrets.BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_BUCKET=uniclipboard-build-cache"
            echo "SCCACHE_ENDPOINT=$E"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_KEY_PREFIX=desktop/sccache/v1/probe"
            echo "AWS_ACCESS_KEY_ID=$K"
            echo "AWS_SECRET_ACCESS_KEY=$S"
            echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-err.log"
            echo "SCCACHE_LOG=info"
          } >> "$GITHUB_ENV"
      - name: isolate toolchain like the sidecar job
        env:
          UC_PINNED_RUST: 1.95.0
        run: node scripts/ci/isolate-build-toolchain.mjs
      - name: full sidecar build with a stats sampler
        shell: bash
        run: |
          set +e
          ( while true; do
              echo "$(date -u +%T) $(sccache --show-stats | grep -E 'Compile requests  |Cache misses  |Cache hits  ' | tr -s ' ' | tr '\n' ';')" >> "$RUNNER_TEMP/sampler.log"
              sleep 45
            done ) &
          node scripts/prepare-sidecars.mjs --timings > "$RUNNER_TEMP/real.log" 2>&1
          echo "build exit=$?"
          kill %1 2>/dev/null
          echo "--- sampler"
          cat "$RUNNER_TEMP/sampler.log"
          echo "--- final stats"
          sccache --show-stats | head -8
          echo "--- error log (non-WARN opendal lines)"
          grep -v "opendal::services" "$RUNNER_TEMP/sccache-err.log" | tail -30
          exit 0
