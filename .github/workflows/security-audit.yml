name: 'Security Audit'
run-name: 'Dependency vulnerability audit'

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'apps/**/Cargo.toml'
      - 'tools/**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'package.json'
      - 'bun.lock'
      - 'docs-site/package.json'
      - 'docs-site/bun.lock'
      - 'workers/update-server/package.json'
      - 'workers/update-server/bun.lock'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'apps/**/Cargo.toml'
      - 'tools/**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'package.json'
      - 'bun.lock'
      - 'docs-site/package.json'
      - 'docs-site/bun.lock'
      - 'workers/update-server/package.json'
      - 'workers/update-server/bun.lock'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Catches newly-published RustSec/npm advisories against an unchanged
    # lockfile — the whole point of running this daily rather than only on
    # PRs that happen to touch dependencies. Scheduled Rust audits report in
    # the job logs and summary, failing the job instead of opening issues.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cargo-audit from its locked dependency set
        run: cargo install cargo-audit --locked

      # audit-check opens issues on schedule events; retain its check reports
      # only for PR, push, and manual runs.
      - name: Audit Rust dependencies
        if: github.event_name != 'schedule'
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Rust dependencies on schedule
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          cargo audit 2>&1 | tee "$RUNNER_TEMP/cargo-audit.txt" || status=$?
          {
            echo '## Rust dependency audit'
            echo
            echo "Exit status: $status"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/cargo-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  bun-audit:
    name: bun audit (${{ matrix.project.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - directory: '.'
            name: root
            ignore: ''
          - directory: 'docs-site'
            name: docs-site
            # docs-site dependency remediation is tracked in #1226. Keep this
            # temporary allowlist scoped to docs-site so unrelated root PRs are
            # not blocked; remove each entry as its dependency upgrade lands.
            # Root-project findings must never be added here.
            ignore: >-
              --ignore=GHSA-vxr8-fq34-vvx9
              --ignore=GHSA-cmwh-pvxp-8882
              --ignore=GHSA-qx2v-qp2m-jg93
              --ignore=GHSA-g7r4-m6w7-qqqr
              --ignore=GHSA-h67p-54hq-rp68
              --ignore=GHSA-f88m-g3jw-g9cj
              --ignore=GHSA-c2j3-45gr-mqc4
              --ignore=GHSA-6g55-p6wh-862q
              --ignore=GHSA-r28c-9q8g-f849
              --ignore=GHSA-89xv-2m56-2m9x
              --ignore=GHSA-68g3-v927-f742
              --ignore=GHSA-6gpp-xcg3-4w24
              --ignore=GHSA-m99w-x7hq-7vfj
              --ignore=GHSA-4633-3j49-mh5q
              --ignore=GHSA-4c39-4ccg-62r3
              --ignore=GHSA-p9j2-gv94-2wf4
              --ignore=GHSA-q8wf-6r8g-63ch
              --ignore=GHSA-955p-x3mx-jcvp
              --ignore=GHSA-52cp-r559-cp3m
          - directory: 'workers/update-server'
            name: update-server
            ignore: ''

    defaults:
      run:
        working-directory: ${{ matrix.project.directory }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--production` scopes the gate to what actually ships (runtime
      # dependencies). Dev tooling (vite, vitest, oxlint, wdio, ...) has its
      # own, much noisier advisory surface that never reaches a build
      # artifact — gating on it would fail CI on unrelated tooling churn
      # instead of on dependencies that could ship a known vulnerability.
      - name: Audit production dependencies
        run: bun audit --production ${{ matrix.project.ignore }}
