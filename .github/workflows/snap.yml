name: 'Snap'
run-name: "snap-${{ inputs.channel || github.event.release.tag_name || 'edge' }}-${{ github.run_number }}"

# The core24 GNOME platform owns GTK >= 4.14. WebKitGTK 6.0 is application-owned.
# The application checks its helpers before packing; old-host acceptance is separate.
#
# 默认只构建:pull request(改了 snap 配方时)和 release.published 都只产
# workflow artifact,不推送商店。Go 宿主在 strict 限制下的行为还没有在真实
# snapd 上验证(docs/architecture/gui-go-distribution-channels.md),所以推送只能
# 由人显式 workflow_dispatch 并勾选 release;snapcraft.yaml 的 grade: devel
# 另外让商店拒绝 candidate / stable。
#
# 推送到 snap store 需要 SNAPCRAFT_STORE_CREDENTIALS secret(`snapcraft
# export-login --snaps=uniclipboard --acls package_upload --expires <date>`
# 生成,详见 README/CONTRIBUTING)。secret 缺失时 publish 步骤跳过,只产
# workflow artifact。
on:
  pull_request:
    paths:
      - 'snap/**'
      - '.github/workflows/snap.yml'
      - 'scripts/check-snap-desktop-icons.py'
      - 'scripts/ci/check-snap-package.sh'
      - 'scripts/ci/remove-snap-platform-libraries.py'
      - 'scripts/tests/test_*snap*.py'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ubuntu20:
        description: 'Diagnostic only: boot Ubuntu 20.04 with the existing amd64 Snap'
        required: false
        type: boolean
        default: false
      artifact_run_id:
        description: 'Diagnostic only: reuse an existing arm64 Snap artifact'
        required: false
        type: string
        default: ''
      channel:
        description: 'Snap store channel'
        required: true
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
        default: edge
      release:
        description: 'Push to snap store after build (off = artifact only)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Branch to build'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      channel:
        description: 'Snap store channel'
        required: false
        type: string
        default: edge
      release:
        description: 'Push to snap store after build (false = artifact only)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Branch / ref to build'
        required: false
        type: string
        default: ''
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        description: 'snapcraft export-login token; missing = artifact-only'
        required: false

jobs:
  build:
    # alpha 由 release.yml 在自动发布完成后显式 dispatch,这里的
    # release.published 入口只承接人工发布的 beta / rc / stable。
    if: ${{ (github.event_name != 'release' || !contains(github.event.release.tag_name, '-alpha')) && inputs.artifact_run_id == '' }}
    name: Build snap (${{ matrix.arch }})
    # Native runners match the core24 build environment on both architectures.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Resolve snap metadata
        id: snap-meta
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_RELEASE: ${{ inputs.release }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          REF="${INPUT_BRANCH:-}"
          if [ -z "$REF" ]; then
            REF="${RELEASE_TAG:-${GITHUB_REF}}"
          fi

          CHANNEL="${INPUT_CHANNEL:-}"
          if [ -z "$CHANNEL" ]; then
            VERSION="${RELEASE_TAG#v}"
            case "$VERSION" in
              *-alpha*) CHANNEL="edge" ;;
              *-beta*) CHANNEL="beta" ;;
              *-rc*) CHANNEL="candidate" ;;
              *) CHANNEL="stable" ;;
            esac
          fi

          # Publishing needs an explicit input; the pull_request and release events only build.
          RELEASE="${INPUT_RELEASE:-false}"

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.snap-meta.outputs.ref }}
          submodules: recursive

      - name: Verify snap recipe checks
        run: |
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-yaml
          fi
          python3 -m unittest discover -s scripts/tests -p 'test_*snap*.py'

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        # action-build 默认在 LXD 容器里跑 snapcraft,产物路径输出到
        # steps.build.outputs.snap。strict + gnome extension 自动 attach
        # gnome-46-2404 + gtk-common-themes content snaps,无需手动挂。

      - name: Upload .snap as workflow artifact
        # 即便 publish 走 store,也保留 artifact 用于离线分发 / 调试
        # (`snap install --dangerous file.snap`)。retention 7 天够用。
        uses: actions/upload-artifact@v7
        with:
          name: uniclipboard-${{ matrix.arch }}-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7
          if-no-files-found: error

      - name: Verify desktop entry icons
        # The store rejects snaps whose desktop Icon path is missing; fail
        # here with the offending path instead of after upload review.
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          command -v unsquashfs >/dev/null || sudo apt-get install -y squashfs-tools
          python3 scripts/check-snap-desktop-icons.py "$SNAP_FILE"

      - name: Install and launch the confined GTK4 Snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: scripts/ci/check-snap-package.sh "$SNAP_FILE" "$RUNNER_TEMP/snap-acceptance"

      - name: Upload Snap runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snap-acceptance-${{ matrix.arch }}
          path: ${{ runner.temp }}/snap-acceptance
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Check snap store credentials
        id: check-creds
        if: ${{ steps.snap-meta.outputs.release == 'true' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            echo "::warning::SNAPCRAFT_STORE_CREDENTIALS secret missing — skipping publish."
            echo "::warning::Run \`snapcraft export-login --snaps=uniclipboard --acls package_upload\` and add it to repo secrets to enable publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to snap store
        if: ${{ steps.snap-meta.outputs.release == 'true' && steps.check-creds.outputs.publish == 'true' }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.snap-meta.outputs.channel }}

  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && !inputs.ubuntu20 }}
    name: Diagnose the existing arm64 Snap
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: uniclipboard-arm64-snap
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: snap-artifact
      - name: Diagnose startup without rebuilding
        run: scripts/ci/check-snap-package.sh "$(find snap-artifact -name '*.snap' -print -quit)" "$RUNNER_TEMP/snap-acceptance"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snap-startup-diagnostic-arm64
          path: ${{ runner.temp }}/snap-acceptance
          include-hidden-files: true
          if-no-files-found: error

  old-host:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.ubuntu20 }}
    name: Verify the existing Snap on Ubuntu 20.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: uniclipboard-amd64-snap
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: snap-artifact
      - name: Read the harness from the artifact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          source_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq .head_sha)
          git fetch --depth=1 origin "$source_commit"
          git show "$source_commit:scripts/ci/check-snap-package.sh" > "$RUNNER_TEMP/check-snap.sh"
          printf '%s\n' "$source_commit" > "$RUNNER_TEMP/artifact-source.txt"
      - name: Boot Focal and verify the confined Snap
        run: scripts/ci/check-snap-ubuntu20-vm.sh "$(find snap-artifact -name '*.snap' -print -quit)" "$RUNNER_TEMP/check-snap.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snap-ubuntu20-vm
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/artifact-source.txt
            ${{ runner.temp }}/snap-ubuntu20-vm/accelerator.txt
            ${{ runner.temp }}/snap-ubuntu20-vm/console.log
            ${{ runner.temp }}/snap-ubuntu20-vm/shared/host.txt
            ${{ runner.temp }}/snap-ubuntu20-vm/shared/guest.log
            ${{ runner.temp }}/snap-ubuntu20-vm/shared/result-code
            ${{ runner.temp }}/snap-ubuntu20-vm/shared/evidence/
          if-no-files-found: error
