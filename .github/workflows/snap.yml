name: Snap Store read-only reconciliation (issue-1926)
run-name: snap-store-inspect-${{ github.run_number }}

# Operation branch only. Never merge. No Store mutation or upload retry.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-1926-snap-store-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Guard read-only inspection
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snap-store-inspection"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = UniClipboard/UniClipboard
          test "$GITHUB_REF" = refs/heads/ci/snap-edge-review-status
          test "$GITHUB_RUN_ATTEMPT" = 1

      - name: Install the inspection CLI before credential access
        run: sudo snap install --classic snapcraft

      - name: Read only uniclipboard revisions and channel status
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          out = Path(os.environ['RUNNER_TEMP']) / 'snap-store-inspection'
          credential = os.environ.pop('SNAPCRAFT_STORE_CREDENTIALS', '')
          commands = [
              ('revisions-amd64', ['/snap/bin/snapcraft', 'list-revisions', 'uniclipboard', '--arch', 'amd64']),
              ('revisions-arm64', ['/snap/bin/snapcraft', 'list-revisions', 'uniclipboard', '--arch', 'arm64']),
              ('status', ['/snap/bin/snapcraft', 'status', 'uniclipboard']),
          ]
          def sanitize(value):
              text = value.decode('utf-8', 'replace') if isinstance(value, bytes) else (value or '')
              if credential:
                  text = text.replace(credential, '[REDACTED]')
                  for line in credential.splitlines():
                      if len(line.strip()) >= 8:
                          text = text.replace(line.strip(), '[REDACTED]')
              text = re.sub(r'(?im)^.*\b(?:authorization|bearer|macaroon|password|token|credential)\b.*$', '[REDACTED sensitive diagnostic line]', text)
              lines = text.splitlines()
              truncated = len(lines) > 300 or len(text) > 262144
              if len(lines) > 300:
                  lines = lines[:150] + ['[middle lines omitted]'] + lines[-150:]
              text = '\n'.join(lines)
              if len(text) > 262144:
                  text = text[:131072] + '\n[middle bytes omitted]\n' + text[-131072:]
              return text + '\n', truncated

          results = []
          for name, command in commands:
              stdout = stderr = ''
              if not credential:
                  code, stderr = 2, 'Store credential missing; query not executed.'
              else:
                  try:
                      result = subprocess.run(command, capture_output=True, text=True, timeout=300, stdin=subprocess.DEVNULL, env={**os.environ, 'SNAPCRAFT_STORE_CREDENTIALS': credential})
                      code, stdout, stderr = result.returncode, result.stdout, result.stderr
                  except subprocess.TimeoutExpired as error:
                      code, stdout, stderr = 124, error.stdout, error.stderr
                  except OSError:
                      code, stderr = 127, 'CLI could not be started; no retry attempted.'
              clean_stdout, stdout_truncated = sanitize(stdout)
              clean_stderr, stderr_truncated = sanitize(stderr)
              (out / (name + '.stdout.txt')).write_text(clean_stdout)
              (out / (name + '.stderr.txt')).write_text(clean_stderr)
              results.append({'command': command, 'exit_code': code, 'stdout_truncated': stdout_truncated, 'stderr_truncated': stderr_truncated})
              (out / 'results.json').write_text(json.dumps({
                  'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'reconciliation_target_upload_run': 41310604881,
                  'commands': results,
                  'revision_hash_binding': 'UNVERIFIED: do not infer uploaded bytes from version/revision tables',
                  'review_queue_identity': 'Only explicit CLI output is evidence; unavailable details remain unknown',
                  'queue_recovery': 'NOT_ATTEMPTED: read-only inspection cannot recover the review queue',
                  'store_mutations': 'NOT_RUN',
              }, indent=2) + '\n')
          raise SystemExit(0 if all(row['exit_code'] == 0 for row in results) else 1)
          PY

      - name: Record inspection outcome without environment or credentials
        if: always()
        env:
          INSPECTION_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'snap-store-inspection'
          out.mkdir(exist_ok=True)
          (out / 'outcome.json').write_text(json.dumps({'job_status': os.environ['INSPECTION_JOB_STATUS'], 'publication': 'NOT_RUN', 'review_changes': 'NOT_RUN'}, indent=2) + '\n')
          PY
          echo 'Read-only uniclipboard evidence is attached. Revision hashes and queue recovery are not established by this inspection.' >> "$GITHUB_STEP_SUMMARY"

      - name: Always preserve only sanitized inspection results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-1926-store-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snap-store-inspection
          retention-days: 14
          if-no-files-found: error
