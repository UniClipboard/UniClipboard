name: TesterArmy browser E2E
on:
  pull_request:
    paths:
      - 'apps/gui-go/frontend/**'
      - 'e2e*.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/tester-army-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: node node_modules/@e2e-dev/web/dist/bin.js install chromium --with-deps
      - run: bun run e2e:browser
      - run: bun run e2e:browser:layouts
      - uses: actions/setup-go@v6
        if: runner.os == 'macOS'
        with:
          go-version-file: apps/cli-go/go.mod
          cache: false
      - name: Build isolated daemon and CLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/build-cache/mbx.sh --exec cargo build --locked -p uc-daemon --bin uniclipd
          mkdir -p target/gui-go
          (cd apps/cli-go && go build -o ../../target/gui-go/uniclip ./cmd/uniclip)
      - name: Verify browser to real daemon
        if: runner.os == 'macOS'
        run: bun run e2e:browser:daemon
      - name: Record source and artifact checksums
        if: always()
        run: python3 apps/gui-go/frontend/e2e/tester-army/receipt.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tester-army-browser-${{ matrix.os }}
          path: |
            target/tester-army/
            target/tester-army-server.log
            target/tester-army-daemon/
            target/tester-army-daemon-server.log
            target/tester-army-layout/
            target/tester-army-layout-report/
            target/tester-army-receipt.json
            target/tester-army-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
