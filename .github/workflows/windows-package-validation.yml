name: Windows package validation from existing sidecars

# Nonrelease packaging verification; never rebuild Rust or invoke a signing backend.
on:
  workflow_dispatch:
  push:
    branches: [ci/shared-mbx-r2-cache]
    paths:
      - .github/workflows/windows-package-validation.yml
      - apps/gui-go/e2e/package_windows.py

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      PYTHONUTF8: '1'
      PRODUCER_RUN: '38532831460'
      PRODUCER_SHA: fd7e590b28fb43af5f86a41aec4d5f4dc1993a6e
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the successful sidecar producer and immutable artifact
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          e = os.environ
          api = lambda path: json.loads(subprocess.check_output(['gh', 'api', 'repos/UniClipboard/UniClipboard/' + path], text=True))
          run = api('actions/runs/' + e['PRODUCER_RUN'])
          assert run['head_sha'] == e['PRODUCER_SHA']
          jobs = api('actions/runs/' + e['PRODUCER_RUN'] + '/jobs?per_page=100')['jobs']
          job = next(j for j in jobs if j['name'] == 'build / Build sidecar ' + e['TARGET'])
          assert job['conclusion'] == 'success'
          artifacts = api('actions/runs/' + e['PRODUCER_RUN'] + '/artifacts?per_page=100')['artifacts']
          artifact = next(a for a in artifacts if a['name'] == 'sidecar-' + e['TARGET'])
          assert not artifact['expired'] and artifact['workflow_run']['head_sha'] == e['PRODUCER_SHA']
          evidence = Path(e['RUNNER_TEMP']) / 'package-evidence'
          evidence.mkdir()
          (evidence / 'producer.json').write_text(json.dumps({'run': run['id'], 'source': run['head_sha'], 'job': job['id'], 'artifact': artifact}, indent=2))
          with open(e['GITHUB_OUTPUT'], 'a') as f:
              f.write('artifact_id=' + str(artifact['id']) + '\n')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCER_SHA }}
          path: source
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact_id }}
          run-id: ${{ env.PRODUCER_RUN }}
          github-token: ${{ github.token }}
          path: sidecar-artifact

      - name: Verify sidecar identity and apply only the packaging cleanup fix
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, tarfile
          from pathlib import Path
          e = os.environ
          source = Path('source').resolve()
          evidence = Path(e['RUNNER_TEMP']) / 'package-evidence'
          staging = source / 'target/sidecar-staging'
          staging.mkdir(parents=True)
          with tarfile.open('sidecar-artifact/sidecar.tar') as archive:
              archive.extractall(staging, filter='data')
          rec = json.loads((staging / 'sidecar-provenance.json').read_text())
          assert rec['schema'] == 1 and rec['target'] == e['TARGET']
          assert rec['sourceHead'] == e['PRODUCER_SHA'] and not rec['sourceDirty']
          assert rec['buildMode'] == 'release' and str(rec['run']['id']) == e['PRODUCER_RUN']
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert rec['cargoLockSha256'] == sha(source / 'Cargo.lock')
          for program in ['uniclipd', 'uniclip-quick-panel']:
              name = program + '-' + e['TARGET'] + '.exe'
              assert sha(staging / name) == rec['files'][name]['sha256']
              assert (staging / name).stat().st_size == rec['files'][name]['bytes']
          path = Path('apps/gui-go/e2e/package_windows.py')
          before = (source / path).read_text()
          after = (Path('automation') / path).read_text()
          assert before.count('    shutil.rmtree(tools)\n') == 1
          assert after == before.replace('    shutil.rmtree(tools)\n', '')
          (source / path).write_text(after)
          diff = subprocess.check_output(['git', '-C', str(source), 'diff', '--binary'], text=True)
          (evidence / 'packaging-fix.patch').write_text(diff)
          (evidence / 'sidecar-provenance.json').write_text(json.dumps(rec, indent=2))
          (evidence / 'validation-source.json').write_text(json.dumps({
              'productSource': e['PRODUCER_SHA'], 'sidecarSource': rec['sourceHead'],
              'packagingAutomationSource': e['GITHUB_SHA'], 'packagingScriptSha256': sha(source / path),
              'sourceDirty': True, 'rustRebuilt': False, 'releaseOrSigningInvoked': False,
              'note': 'Original alpha source plus the exact cleanup patch; not a daemon built at the patch commit.'
          }, indent=2))
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/apps/gui-go/go.mod
          cache-dependency-path: |
            source/apps/gui-go/go.sum
            source/packages/desktop-host-go/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Install packaging tools
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            foreach ($attempt in 1..3) {
              choco install nsis --version=3.10 -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "NSIS installation failed" }
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files\7-Zip" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Prepare the complete alpha package
        working-directory: source
        env:
          VITE_APP_ENV: alpha
          SENTRY_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          S=target/sidecar-staging
          python apps/gui-go/e2e/package_windows.py --stage prepare --arch '${{ matrix.arch }}' \
            --daemon "$S/uniclipd-$TARGET.exe" --helper "$S/uniclip-quick-panel-$TARGET.exe" \
            --daemon-provenance "$S/sidecar-provenance.json" --out target/windows-validation \
            2>&1 | tee "$RUNNER_TEMP/package-evidence/prepare.log"
      - name: Assemble the unsigned alpha installer
        working-directory: source
        run: |
          set -euo pipefail
          python apps/gui-go/e2e/package_windows.py --stage assemble --unsigned --out target/windows-validation \
            2>&1 | tee "$RUNNER_TEMP/package-evidence/assemble.log"
      - name: Finalize the complete installer and portable archive
        working-directory: source
        run: |
          set -euo pipefail
          python apps/gui-go/e2e/package_windows.py --stage finalize --unsigned --out target/windows-validation \
            2>&1 | tee "$RUNNER_TEMP/package-evidence/finalize.log"
      - name: Verify the finished packages and original sidecar payloads
        working-directory: source
        run: |
          set -euo pipefail
          python apps/gui-go/e2e/windows_package_verify.py --package target/windows-validation \
            --out "$RUNNER_TEMP/package-evidence/payload-verification.json" \
            2>&1 | tee "$RUNNER_TEMP/package-evidence/verify.log"
          sha256sum target/windows-validation/*-setup.exe target/windows-validation/*-portable.zip \
            > "$RUNNER_TEMP/package-evidence/SHA256SUMS.txt"
      - name: Retain nonrelease packages and complete stage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-validation-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/package-evidence
            source/target/windows-validation/*-setup.exe
            source/target/windows-validation/*-portable.zip
            source/target/windows-validation/stage.json
            source/target/windows-validation/package-manifest.json
            source/target/windows-validation/to-sign/to-sign-manifest.json
          if-no-files-found: error
          retention-days: 14
