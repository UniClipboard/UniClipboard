version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - nolintlint
  exclusions:
    # internal/luavm is a port of gopher-lua kept close to upstream; its style
    # and unused code are not ours to clean up.
    paths:
      - internal/luavm

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/luavm
  settings:
    goimports:
      local-prefixes:
        - github.com/uniclipboard/unic/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
