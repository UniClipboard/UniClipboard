    <script>
      // Fill the startup screen copy in the stored or system language, mirroring the locale
      // resolution in src/i18n/index.ts.
      try {
        const copy = JSON.parse(document.getElementById('uc-splash-copy').textContent)
        let language = null
        try {
          language = localStorage.getItem('uniclipboard.language')
        } catch {}
        if (!copy[language]) {
          const parts = (navigator.language || 'en').toLowerCase().split('-')
          const traditional = ['hant', 'tw', 'hk', 'mo'].some(part => parts.includes(part))
          language =
            parts[0] === 'zh'
              ? traditional
                ? 'zh-TW'
                : 'zh-CN'
              : { ja: 'ja-JP', ru: 'ru-RU', pt: 'pt-BR' }[parts[0]] || 'en-US'
        }
        document.querySelectorAll('[data-copy]').forEach(node => {
          node.textContent = copy[language][node.getAttribute('data-copy')]
        })
      } catch {}
    </script>
