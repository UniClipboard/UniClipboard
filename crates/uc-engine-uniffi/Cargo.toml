[package]
name = "uc-engine-uniffi"
version.workspace = true
license.workspace = true
edition = "2021"
description = "UniFFI bindings for the public UniClipboard engine interface"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uc-engine-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
bindgen-cli = ["uniffi/cli"]

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
uc-engine = { path = "../uc-engine" }
uniffi = "=0.31.1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
