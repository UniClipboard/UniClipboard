buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.12.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

layout.buildDirectory = file(System.getenv("UC_ENGINE_UNIFFI_GRADLE_BUILD_DIR") ?: "build")

android {
    namespace "app.uniclipboard.engine"
    compileSdk 36

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }

    sourceSets {
        main {
            java.srcDirs = [System.getenv("UC_ENGINE_UNIFFI_KOTLIN_DIR")]
            jniLibs.srcDirs = [System.getenv("UC_ENGINE_UNIFFI_JNI_DIR")]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    api "net.java.dev.jna:jna:5.14.0@aar"
}
