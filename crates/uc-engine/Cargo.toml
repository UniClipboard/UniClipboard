[package]
name = "uc-engine"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Stable cross-platform engine interface for UniClipboard hosts"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uc-core = { path = "../uc-core" }
uc-infra = { path = "../uc-infra" }
zeroize = "1.8"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true
