<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>UniClipboard · 设备同步路径策略原型（BoardUI v2）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  /* BoardUI v2 Light Surface Hierarchy (aligned with prototype/devices.html & desktopkit) */
  --bg-canvas-outer: #e7e7eb;
  --bg-toolbar: #ffffff;
  --bg-canvas: #f5f5f7;
  --bg-inspector: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #fafafa;
  --bg-inspector-card: #f7f7f9;
  --bg-inspector-card-hover: #f0f0f3;
  --bg-inset: #f2f2f5;
  --bg-inset-on-subtle: #ffffff;
  --bg-sheet: #ffffff;
  --bg-primary: #ffffff;
  --bg-primary-hover: #f5f5f7;
  --bg-secondary: #f5f5f7;
  --bg-secondary-hover: #ebebee;
  --bg-tertiary: #ebebee;

  --sep: #e6e6e9;
  --card-border: #e5e5e8;
  --border-btn: #dfdfe4;
  --border-hover: #c8c8cf;
  --text-primary: #0a0a0a;
  --text-secondary: #6b6b70;
  --text-tertiary: #9a9aa0;
  --icon-primary: #141416;
  --icon-secondary: #6b6b70;
  --icon-tertiary: #9a9aa0;

  --accent-50: #f2f7ff;
  --accent-100: #dbeafe;
  --accent-200: #c2dcff;
  --accent-400: #3392ff;
  --accent-500: #2b7fff;
  --accent-600: #155dfc;

  --success-bg: #eaf9d0;
  --success-fg: #365900;
  --success-dot: #5ea500;
  --warn-pill-bg: #fef3c7;
  --warn-pill-fg: #92400e;
  --info-bg: #e0edff;
  --info-fg: #155dfc;
  --err-bg: #ffe4e6;
  --err-fg: #d91445;

  --warn-bg: #fffbeb;
  --warn-fg: #92400e;
  --warn-border: #fde68a;
  --err-border: #fecdd3;
  --destructive: #c41022;
  --destructive-bg-hover: #fff1f2;

  --seg-bg: #ececf0;
  --seg-sel: #ffffff;
  --sw-off: #dcdce0;
  --sw-on-start: #2273ff;
  --sw-on-end: #144be9;
  --shadow-window: 0 24px 64px rgba(0, 0, 0, .13), 0 0 0 1px rgba(0, 0, 0, .06);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .035);
  --shadow-popover: 0 10px 28px rgba(0, 0, 0, .12), 0 0 0 1px var(--sep);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .04);
  --scrim: rgba(0, 0, 0, .34);

  /* Policy Direction Tints */
  --dir-bi-bg: #e0edff;
  --dir-bi-fg: #155dfc;
  --dir-send-bg: #e8f6ec;
  --dir-send-fg: #166534;
  --dir-recv-bg: #f3e8ff;
  --dir-recv-fg: #6b21a8;
  --dir-off-bg: #ebebee;
  --dir-off-fg: #6b6b70;
}

[data-theme="dark"] {
  --bg-canvas-outer: #09090b;
  --bg-toolbar: #1d1d20;
  --bg-canvas: #141416;
  --bg-inspector: #1b1b1e;
  --bg-card: #222226;
  --bg-card-hover: #29292e;
  --bg-inspector-card: #242428;
  --bg-inspector-card-hover: #2c2c31;
  --bg-inset: #19191c;
  --bg-inset-on-subtle: #1b1b1f;
  --bg-sheet: #202024;
  --bg-primary: #26262a;
  --bg-primary-hover: #2f2f35;
  --bg-secondary: #1b1b1e;
  --bg-secondary-hover: #27272c;
  --bg-tertiary: #2c2c31;

  --sep: #2c2c31;
  --card-border: rgba(255, 255, 255, .085);
  --border-btn: rgba(255, 255, 255, .12);
  --border-hover: rgba(255, 255, 255, .22);
  --text-primary: #f5f5f7;
  --text-secondary: #9c9ca4;
  --text-tertiary: #6c6c74;
  --icon-primary: #f5f5f7;
  --icon-secondary: #9c9ca4;
  --icon-tertiary: #63636a;

  --accent-50: rgba(43, 127, 255, .12);
  --accent-100: rgba(43, 127, 255, .20);
  --accent-200: rgba(51, 146, 255, .34);
  --accent-400: #4da0ff;
  --accent-500: #2b7fff;
  --accent-600: #4da0ff;

  --success-bg: rgba(74, 140, 20, .28);
  --success-fg: #b8ee62;
  --success-dot: #a3e635;
  --warn-pill-bg: rgba(245, 158, 11, .20);
  --warn-pill-fg: #fcd34d;
  --info-bg: rgba(43, 127, 255, .20);
  --info-fg: #8ec5ff;
  --err-bg: rgba(236, 0, 63, .22);
  --err-fg: #fda4af;

  --warn-bg: rgba(245, 158, 11, .11);
  --warn-fg: #fcd34d;
  --warn-border: rgba(245, 158, 11, .28);
  --err-border: rgba(255, 100, 103, .30);
  --destructive: #ff7376;
  --destructive-bg-hover: rgba(220, 38, 38, .18);

  --seg-bg: #161619;
  --seg-sel: #2c2c32;
  --sw-off: #3a3a40;
  --shadow-window: 0 28px 80px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .09);
  --shadow-card: none;
  --shadow-popover: 0 14px 36px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .11);
  --shadow-xs: none;
  --scrim: rgba(0, 0, 0, .60);

  --dir-bi-bg: rgba(43, 127, 255, .20);
  --dir-bi-fg: #8ec5ff;
  --dir-send-bg: rgba(34, 197, 94, .18);
  --dir-send-fg: #86efac;
  --dir-recv-bg: rgba(168, 85, 247, .22);
  --dir-recv-fg: #d8b4fe;
  --dir-off-bg: #2c2c31;
  --dir-off-fg: #9c9ca4;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-primary);
  background: var(--bg-canvas-outer);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 18px 20px;
  gap: 10px;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---- Prototype Control Bar ---- */
.proto-bar {
  width: 100%;
  max-width: 1180px;
  background: var(--bg-toolbar);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  box-shadow: var(--shadow-xs);
  font-size: 12px;
}
.proto-tag {
  font-weight: 600;
  color: var(--accent-600);
  background: var(--accent-50);
  border: 1px solid var(--accent-200);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
}
.proto-group { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.proto-pills { display: inline-flex; background: var(--bg-secondary); padding: 2px; border-radius: 8px; border: 1px solid var(--sep); gap: 2px; }
.proto-pills button {
  border: 0; background: transparent; padding: 3px 9px; border-radius: 6px;
  font-size: 11.5px; color: var(--text-secondary); transition: .15s;
}
.proto-pills button.active {
  background: var(--bg-primary); color: var(--text-primary); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
}
.proto-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; color: var(--text-primary); font-size: 12px; }
.proto-div { width: 1px; height: 16px; background: var(--sep); }
.proto-spacer { flex: 1; }

/* ---- Desktop Window Frame ---- */
.window-stage {
  flex: 1;
  width: 100%;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
.app-window {
  width: 1140px;
  max-width: 100%;
  height: min(780px, calc(100vh - 104px));
  min-height: 560px;
  background: var(--bg-canvas);
  border-radius: 14px;
  box-shadow: var(--shadow-window);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  transition: width .22s cubic-bezier(.32, .72, 0, 1);
}
.app-window.compact { width: 900px; }
.app-window.narrow { width: 660px; }

/* ---- Top 52 DIP Toolbar ---- */
.toolbar {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px 0 16px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--sep);
  user-select: none;
}
.traffic-lights { display: flex; align-items: center; gap: 7px; margin-right: 6px; flex: none; }
.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl.r { background: #ff5f57; }
.tl.y { background: #febc2e; }
.tl.g { background: #28c840; }
.tb-back {
  height: 28px; padding: 0 8px; border-radius: 7px; border: 0; background: transparent;
  display: inline-flex; align-items: center; gap: 4px; color: var(--text-primary);
  font-size: 13px; transition: background .12s;
}
.tb-back:hover { background: var(--bg-secondary-hover); }
.tb-sep { width: 1px; height: 16px; background: var(--sep); flex: none; }
.tb-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.tb-spacer { flex: 1; }

/* ---- Status Pill ---- */
.pill {
  height: 22px; padding: 0 8px; border-radius: 11px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 500; white-space: nowrap; flex: none;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pill.pos { background: var(--success-bg); color: var(--success-fg); }
.pill.pos .dot { background: var(--success-dot); }
.pill.warn { background: var(--warn-pill-bg); color: var(--warn-pill-fg); }
.pill.warn .dot { background: var(--warn-pill-fg); }
.pill.info { background: var(--info-bg); color: var(--info-fg); }
.pill.info .dot { background: var(--accent-500); }
.pill.neu { background: var(--bg-tertiary); color: var(--text-secondary); }
.pill.neu .dot { background: var(--text-tertiary); }

/* ---- Buttons ---- */
.btn {
  height: 30px; padding: 0 11px; border-radius: 8px;
  border: 1px solid var(--border-btn);
  background: var(--bg-primary); color: var(--text-primary);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: transform .08s, background .12s, border-color .12s, opacity .12s;
  box-shadow: var(--shadow-xs);
}
.btn:hover:not(:disabled) { background: var(--bg-primary-hover); border-color: var(--border-hover); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 6px; }
.btn.pri { background: var(--accent-500); border-color: var(--accent-500); color: #fff; box-shadow: none; }
.btn.pri:hover:not(:disabled) { background: var(--accent-600); border-color: var(--accent-600); }
.btn.subtle { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-secondary); }
.btn.subtle:hover:not(:disabled) { background: var(--bg-secondary-hover); color: var(--text-primary); }
.btn.link { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent-600); padding: 0 3px; height: auto; font-weight: 500; font-size: 11.5px; }
.btn.link:hover:not(:disabled) { text-decoration: underline; }
.btn.danger { color: var(--destructive); border-color: var(--border-btn); background: var(--bg-primary); }
.btn.danger:hover:not(:disabled) { background: var(--destructive-bg-hover); border-color: var(--err-border); }
.btn.danger-solid { background: #dc2626; border-color: #dc2626; color: #fff; box-shadow: none; }
.btn.icon-only { width: 26px; height: 26px; padding: 0; border-radius: 7px; }

/* ---- Body Split ---- */
.body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.canvas {
  flex: 1; min-width: 0; overflow-y: auto;
  padding: 18px 22px 28px;
  background: var(--bg-canvas);
  display: flex; flex-direction: column; gap: 16px;
}
.inspector {
  width: 400px; flex: none;
  background: var(--bg-inspector);
  border-left: 1px solid var(--sep);
  overflow-y: auto;
  padding: 18px 18px 28px;
  display: flex; flex-direction: column; gap: 14px;
}
.app-window.narrow .inspector { width: 100%; border-left: 0; }

/* ---- Sync Channels Strip ---- */
.backend-strip {
  background: var(--bg-card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card); border-radius: 12px;
  padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.strip-label {
  font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
  display: inline-flex; align-items: center; gap: 5px; flex: none; margin-right: 2px;
}
.chip-list { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.be-chip {
  height: 24px; padding: 0 9px; border-radius: 999px;
  border: 1px solid var(--card-border); background: var(--bg-inset); color: var(--text-primary);
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
  transition: border-color .12s, background .12s;
}
.be-chip:hover { border-color: var(--border-hover); background: var(--bg-secondary-hover); }
.be-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success-dot); }
.be-chip .meta { font-size: 11px; color: var(--text-secondary); font-weight: 400; }

/* ---- Notice Banner ---- */
.notice {
  border-radius: 11px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; border: 1px solid transparent;
}
.notice.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-fg); }
.notice.info { background: var(--accent-50); border-color: var(--accent-200); color: var(--text-primary); }
.notice-body { flex: 1; min-width: 0; }
.notice-title { font-weight: 600; font-size: 12.5px; }
.notice-sub { font-size: 11.5px; opacity: .9; margin-top: 1px; }

/* ---- Section Headings ---- */
.sec { display: flex; flex-direction: column; gap: 9px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.sec-hint { font-size: 11.5px; color: var(--text-tertiary); }

/* ---- Icon Tile ---- */
.icon-tile {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-inset); border: 1px solid var(--card-border); color: var(--icon-primary);
}
.inspector .icon-tile { background: var(--bg-inset-on-subtle); }
.icon-tile.lg { width: 42px; height: 42px; border-radius: 11px; }
.icon-tile.accent { background: var(--accent-50); border-color: var(--accent-400); color: var(--accent-500); }

/* ---- Aligned 2-Column Device Grid ---- */
.dev-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}
.app-window.compact .dev-grid,
.app-window.narrow .dev-grid { grid-template-columns: 1fr; }

.dev-card {
  background: var(--bg-card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card); border-radius: 13px;
  padding: 13px 14px; display: flex; flex-direction: column; gap: 11px;
  cursor: pointer; transition: border-color .12s, background .12s, opacity .12s;
  min-width: 0;
}
.dev-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.dev-card.selected { border: 1.5px solid var(--accent-500); padding: 12.5px 13.5px; }
.dev-card.dim { opacity: .78; }
.dev-card.dim.selected { opacity: 1; }
.dev-card-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dev-card-info { flex: 1; min-width: 0; }
.dev-card-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-card-sub { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.dev-card-div { height: 1px; background: var(--sep); }
.dev-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; }
.dev-card-paths { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; display: flex; align-items: center; gap: 5px; }
.dev-card-time { color: var(--text-tertiary); flex: none; }

/* ---- Grouped List Box ---- */
.group-box {
  background: var(--bg-card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card); border-radius: 12px; overflow: visible;
}
.inspector .group-box { background: var(--bg-inspector-card); box-shadow: none; }
.list-row {
  padding: 10px 13px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: background .1s;
}
.list-row:first-child { border-radius: 11px 11px 0 0; }
.list-row:last-child { border-radius: 0 0 11px 11px; }
.list-row:only-child { border-radius: 11px; }
.list-row + .list-row { border-top: 1px solid var(--sep); }
.list-row:hover { background: var(--bg-card-hover); }
.list-row.selected { background: var(--accent-50); }
.list-row-meta { flex: 1; min-width: 0; }
.list-row-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.list-row-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tag-badge {
  font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px;
  background: var(--info-bg); color: var(--info-fg); flex: none; white-space: nowrap;
}
.tag-badge.neu { background: var(--bg-tertiary); color: var(--text-secondary); }
.tag-badge.warn { background: var(--warn-pill-bg); color: var(--warn-pill-fg); }
.tag-badge.send { background: var(--dir-send-bg); color: var(--dir-send-fg); }
.tag-badge.recv { background: var(--dir-recv-bg); color: var(--dir-recv-fg); }

/* ---- Inspector Hero ---- */
.hero-card {
  background: var(--bg-inspector-card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 13px 14px; display: flex; align-items: center; gap: 12px;
}
.hero-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hero-name-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
.hero-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-sub { font-size: 11.5px; color: var(--text-secondary); }

/* ---- Switch ---- */
.switch {
  width: 34px; height: 20px; border-radius: 10px; border: 0; padding: 2px;
  background: var(--sw-off); position: relative; flex: none; transition: background .16s ease;
}
.switch::after {
  content: ""; display: block; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
  transform: translateX(0); transition: transform .16s cubic-bezier(.32, .72, 0, 1);
}
.switch.on { background: linear-gradient(180deg, var(--sw-on-start), var(--sw-on-end)); }
.switch.on::after { transform: translateX(14px); }
.switch:disabled { opacity: .4; cursor: not-allowed; }

/* ---- Per-Device Sync Path Policy Card (NEW!) ---- */
.path-card {
  display: flex;
  flex-direction: column;
}
.path-card + .path-card {
  border-top: 1px solid var(--sep);
}
.path-head {
  padding: 11px 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}
.path-head-clickable {
  flex: 1; min-width: 0;
  display: flex; align-items: flex-start; gap: 8px;
  cursor: pointer; user-select: none;
}
.path-chevron {
  width: 18px; height: 18px; margin-top: 2px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--icon-tertiary); border-radius: 4px;
  transition: transform .16s ease, color .12s;
}
.path-card.expanded .path-chevron { transform: rotate(90deg); color: var(--icon-secondary); }
.path-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.path-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.path-sub { font-size: 11.5px; color: var(--text-secondary); }
.path-summary-line {
  margin-top: 3px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.mini-chip {
  font-size: 10.5px; font-weight: 500;
  padding: 1px 6px; border-radius: 5px;
  display: inline-flex; align-items: center; gap: 3px;
  border: 1px solid transparent;
}
.mini-chip.bi { background: var(--dir-bi-bg); color: var(--dir-bi-fg); }
.mini-chip.send { background: var(--dir-send-bg); color: var(--dir-send-fg); }
.mini-chip.recv { background: var(--dir-recv-bg); color: var(--dir-recv-fg); }
.mini-chip.off { background: var(--dir-off-bg); color: var(--dir-off-fg); }
.mini-chip.locked { background: var(--warn-pill-bg); color: var(--warn-pill-fg); }

.path-actions { display: flex; align-items: center; gap: 5px; flex: none; position: relative; }

/* Expanded Policy Body */
.policy-panel {
  border-top: 1px dashed var(--sep);
  padding: 11px 13px 12px;
  background: var(--bg-inset-on-subtle);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.path-card:last-child .policy-panel {
  border-radius: 0 0 11px 11px;
}
.policy-panel.paused {
  opacity: .56;
}

.preset-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.preset-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  white-space: nowrap;
}
.preset-pills {
  display: inline-flex;
  background: var(--seg-bg);
  padding: 2px;
  border-radius: 7px;
  gap: 2px;
}
.preset-pills button {
  border: 0; background: transparent;
  padding: 3px 7px; border-radius: 5px;
  font-size: 11px; font-weight: 500; color: var(--text-secondary);
  transition: .12s; white-space: nowrap;
}
.preset-pills button:hover:not(:disabled) { color: var(--text-primary); }
.preset-pills button.active {
  background: var(--seg-sel); color: var(--text-primary); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .09);
}
.preset-pills button:disabled { opacity: .45; cursor: not-allowed; }

/* Per-Type Direction Matrix (Model A) */
.type-matrix {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.type-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 30px;
}
.type-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}
.type-icon {
  width: 24px; height: 24px; border-radius: 6px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-inset); color: var(--icon-secondary);
  border: 1px solid var(--card-border);
}
.type-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
.type-hint { font-size: 10.5px; color: var(--text-tertiary); }

.dir-seg {
  display: inline-grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--seg-bg);
  padding: 2px;
  border-radius: 8px;
  gap: 2px;
  flex: none;
}
.dir-seg button {
  border: 0; background: transparent;
  height: 24px; padding: 0 7px; border-radius: 6px;
  font-size: 11px; font-weight: 500; color: var(--text-secondary);
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
  white-space: nowrap; transition: .12s;
}
.dir-seg button:hover:not(:disabled) { color: var(--text-primary); }
.dir-seg button.active {
  background: var(--seg-sel);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .10);
  font-weight: 600;
}
.dir-seg button.active.d-bi { color: var(--dir-bi-fg); }
.dir-seg button.active.d-send { color: var(--dir-send-fg); }
.dir-seg button.active.d-recv { color: var(--dir-recv-fg); }
.dir-seg button.active.d-off { color: var(--text-secondary); }
.dir-seg button:disabled { opacity: .4; cursor: not-allowed; }

.ceiling-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 7px;
  background: var(--warn-bg); border: 1px solid var(--warn-border);
  color: var(--warn-fg); font-size: 11px; font-weight: 500;
}

/* Unified Direction + Type Toggles (Model B) */
.model-b-dir {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--seg-bg);
  padding: 3px;
  border-radius: 9px;
  gap: 2px;
}
.model-b-dir button {
  border: 0; background: transparent;
  height: 28px; border-radius: 6px;
  font-size: 11.5px; font-weight: 500; color: var(--text-secondary);
  display: inline-flex; align-items: center; justify-content: center; gap: 3px;
}
.model-b-dir button.active {
  background: var(--seg-sel); color: var(--text-primary); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .10);
}
.model-b-dir button.active.d-bi { color: var(--dir-bi-fg); }
.model-b-dir button.active.d-send { color: var(--dir-send-fg); }
.model-b-dir button.active.d-recv { color: var(--dir-recv-fg); }
.model-b-types {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.type-toggle-card {
  border: 1px solid var(--card-border);
  background: var(--bg-inspector-card);
  border-radius: 9px;
  padding: 8px 9px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  transition: border-color .12s, background .12s;
  user-select: none;
}
.type-toggle-card:hover:not(.disabled) { border-color: var(--border-hover); }
.type-toggle-card.on {
  border-color: var(--accent-400);
  background: var(--accent-50);
}
.type-toggle-card.disabled { opacity: .5; cursor: not-allowed; }
.type-toggle-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.type-toggle-check {
  width: 15px; height: 15px; border-radius: 4px;
  border: 1.5px solid var(--border-hover);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; color: #fff;
}
.type-toggle-card.on .type-toggle-check {
  background: var(--accent-500); border-color: var(--accent-500);
}

/* Effective Transfer Preview */
.flow-preview {
  background: var(--bg-inspector-card);
  border: 1px solid var(--card-border);
  border-radius: 9px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 11px;
}
.flow-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.flow-dir { color: var(--text-secondary); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.flow-badges { display: inline-flex; align-items: center; gap: 4px; }
.flow-ok { padding: 1px 6px; border-radius: 4px; background: var(--success-bg); color: var(--success-fg); font-weight: 600; }
.flow-no { padding: 1px 6px; border-radius: 4px; background: var(--bg-tertiary); color: var(--text-tertiary); text-decoration: line-through; }

.policy-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 11px; color: var(--text-tertiary);
}

/* ---- Popover ---- */
.popover {
  position: absolute; top: 30px; right: 0; z-index: 30;
  min-width: 178px; padding: 4px;
  background: var(--bg-sheet); border-radius: 10px;
  box-shadow: var(--shadow-popover);
  display: flex; flex-direction: column; gap: 1px;
}
.popover button {
  width: 100%; border: 0; background: transparent; text-align: left;
  padding: 7px 10px; border-radius: 7px; font-size: 12px;
  display: flex; align-items: center; gap: 7px; color: var(--text-primary);
}
.popover button:hover { background: var(--bg-secondary-hover); }
.popover button.danger { color: var(--destructive); }
.popover button.danger:hover { background: var(--destructive-bg-hover); }

/* ---- Fingerprint Grid ---- */
.fp-box {
  background: var(--bg-inspector-card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 11px;
}
.fp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fp-cell {
  height: 30px; border-radius: 7px;
  background: var(--bg-inset-on-subtle); border: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: center;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; font-weight: 600; letter-spacing: .04em;
}

/* ---- Toast ---- */
.toast-wrap {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 60; pointer-events: none;
}
.toast {
  background: #18181b; color: #fafafa; padding: 8px 14px; border-radius: 10px;
  font-size: 12px; font-weight: 500; box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
  white-space: nowrap;
}
[data-theme="dark"] .toast { background: #fafafa; color: #0a0a0a; }

.row-gap { display: flex; align-items: center; gap: 8px; }
.row-end { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.footnote { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; }
.grow { flex: 1; min-width: 0; }

// Compute effective ceiling from Global & Channel policy (0007 invariant: lower layer cannot exceed upper layer)
function ceilingFor(instanceId, typeKey) {
  if (!S.globalSync) return { allowed: false, reason: "全局同步已关闭" };
  if (typeKey === "files" && !S.globalFiles) return { allowed: false, reason: "全局文件同步已关闭" };
  const be = S.backends.find(x => x.id === instanceId);
  if (be && !be.policy[typeKey]) {
    return { allowed: false, reason: `${backendDisplayName(instanceId)} 渠道已关闭` };
  }
  return { allowed: true, reason: "" };
}

// Compute effective send/recv flags for a binding under current UI model
function effectiveBinding(b) {
  const out = {};
  for (const t of TYPES) {
    const ceil = ceilingFor(b.instanceId, t.key);
    let desired = "off";
    if (b.syncEnabled) {
      if (S.model === "matrix") {
        desired = b.policy[t.key];
      } else {
        desired = b.unified[t.key] ? b.unified.dir : "off";
      }
    }
    const effDir = ceil.allowed ? desired : "off";
    out[t.key] = {
      desired,
      effDir,
      send: effDir === "bi" || effDir === "send",
      recv: effDir === "bi" || effDir === "recv",
      locked: !ceil.allowed,
      lockReason: ceil.reason
    };
  }
  return out;
}

function isDefaultBindingPolicy(b) {
  if (!b.syncEnabled) return false;
  if (S.model === "matrix") {
    return b.policy.text === "bi" && b.policy.images === "bi" && b.policy.files === "bi";
  }
  return b.unified.dir === "bi" && b.unified.text && b.unified.images && b.unified.files;
}

function bindingSummaryTags(b) {
  if (!b.syncEnabled) return [{ text: "已暂停", cls: "off" }];
  const eff = effectiveBinding(b);
  const dirs = TYPES.map(t => eff[t.key].effDir);
  if (dirs.every(d => d === "off")) return [{ text: "不同步", cls: "off" }];
  if (dirs.every(d => d === "bi")) return [{ text: "全部双向 ⇄", cls: "bi" }];
  if (dirs.every(d => d === "send")) return [{ text: "全部仅发送 →", cls: "send" }];
  if (dirs.every(d => d === "recv")) return [{ text: "全部仅接收 ←", cls: "recv" }];
  // Mixed summary chips
  return TYPES.map(t => {
    const info = eff[t.key];
    if (info.locked) return { text: `${t.label} 受限`, cls: "locked" };
    const dm = DIR_META[info.effDir];
    return { text: `${t.label} ${dm.short}`, cls: dm.chip };
  });
}

function cardBindingFootLabel(b) {
  const name = backendDisplayName(b.instanceId);
  if (!b.syncEnabled) return `${name}（暂停）`;
  const eff = effectiveBinding(b);
  const dirs = TYPES.map(t => eff[t.key].effDir);
  if (dirs.every(d => d === "bi")) return name;
  if (dirs.every(d => d === "off")) return `${name}（不同步）`;
  if (dirs.every(d => d === "send")) return `${name}（仅发送）`;
  if (dirs.every(d => d === "recv")) return `${name}（仅接收）`;
  const activeTypes = TYPES.filter(t => eff[t.key].effDir !== "off").map(t => t.label);
  const nonOffDirs = new Set(dirs.filter(d => d !== "off"));
  if (nonOffDirs.size === 1) {
    const d = [...nonOffDirs][0];
    return `${name}（${activeTypes.join("/")} · ${DIR_META[d].short}）`;
  }
  return `${name}（自定义策略）`;
}

function deviceAggregateStatus(d) {
  const enabled = d.bindings.filter(b => b.syncEnabled);
  if (enabled.length === 0) return { text: "已暂停", tone: "neu", online: false };
  const connected = enabled.filter(b => b.connection === "connected");
  if (connected.length > 0) {
    if (d.bindings.length > 1 && connected.length < d.bindings.length) {
      return { text: `在线 · ${connected.length}/${d.bindings.length}`, tone: "pos", online: true };
    }
    return { text: connected[0].path ? `在线 · ${connected[0].path}` : "在线", tone: "pos", online: true };
  }
  return { text: "离线", tone: "neu", online: false };
}

      if (vals.every(v => v === "send")) return "send";
      if (vals.every(v => v === "recv")) return "recv";

          { id: "send", label: "仅发送 →" },
          { id: "recv", label: "仅接收 ←" },
          { id: "off",  label: "不同步" }
        ].map(opt => `
          <button class="${b.syncEnabled && b.unified.dir === opt.id ? `active ${DIR_META[opt.id].cls}` : ""}"

      </div>

      <div class="policy-foot">
        <span>仅作用于本机一侧与自动同步；手动发送不受限制，修改仅影响新传输</span>
        ${!isDefaultBindingPolicy(b) && S.model === "matrix"
          ? `<button class="btn link" data-act="reset-policy" data-dev="${esc(d.id)}" data-bid="${esc(b.id)}">${IC.reset} 恢复默认</button>`
          : ""}
      </div>

  `;

        </div>
        <div class="fp-box">
          <div class="fp-grid">
            ${d.fingerprint.split(/\s+/).map(g => `<div class="fp-cell">${esc(g)}</div>`).join("")}
          </div>
        </div>
      </div>

      <div class="row-end" style="margin-top:2px">
        <button class="btn sm danger-solid" data-act="toast" data-msg="将弹出移除设备确认框">${IC.trash} 移除设备</button>
      </div>
    </div>
  `;
}

function render() {
  const win = document.getElementById("appWindow");
  win.className = "app-window" + (viewportMode === "compact" ? " compact" : viewportMode === "narrow" ? " narrow" : "");
  const onlinePeers = S.devices.filter(d => deviceAggregateStatus(d).online).length;
  const totalDevices = S.devices.length + 1;
  const isNarrow = viewportMode === "narrow";

  win.innerHTML = `
    <div class="toolbar">
      <div class="traffic-lights"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span></div>
      ${isNarrow && S.narrowDetailOpen
        ? `<button class="tb-back" data-act="narrow-back">${IC.back} 设备</button>`
        : `<button class="tb-back" data-act="toast" data-msg="返回历史记录主视图">${IC.back} 返回历史</button>`}
      <span class="tb-sep"></span>
      <span class="tb-title">设备管理</span>
      ${!S.globalSync
        ? renderPill("全局同步已关闭", "warn")
        : renderPill(`${onlinePeers} 台在线 · 共 ${totalDevices} 台`, "pos")}
      <span class="tb-spacer"></span>
      <button class="btn sm pri" data-act="toast" data-msg="打开添加设备配对面板">${IC.add} 添加设备</button>
    </div>
    <div class="body">
      ${(!isNarrow || !S.narrowDetailOpen) ? renderCanvas() : ""}
      ${(!isNarrow || S.narrowDetailOpen) ? renderInspector() : ""}
    </div>
    ${S.toast ? `<div class="toast-wrap"><div class="toast">${esc(S.toast)}</div></div>` : ""}
  `;
}

function findBinding(devId, bid) {
  const d = S.devices.find(x => x.id === devId);
  const b = d && d.bindings.find(x => x.id === bid);
  return { d, b };
}

document.getElementById("appWindow").addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    if (S.openMenuBindingId) { S.openMenuBindingId = null; render(); }
    return;
  }
  const act = el.dataset.act;
  if (act !== "toggle-menu" && S.openMenuBindingId) {
    S.openMenuBindingId = null;
  }
  switch (act) {
    case "select":
      S.selected = el.dataset.id;
      S.narrowDetailOpen = true;
      render();
      break;
    case "narrow-back":
      S.narrowDetailOpen = false;
      render();
      break;
    case "enable-global":
      S.globalSync = true;
      document.getElementById("chkGlobalSync").checked = true;
      showToast("已开启全局同步");
      break;
    case "toggle-expand":
      S.expandedBindings[el.dataset.bid] = !S.expandedBindings[el.dataset.bid];
      render();
      break;
    case "toggle-menu":
      e.stopPropagation();
      S.openMenuBindingId = S.openMenuBindingId === el.dataset.bid ? null : el.dataset.bid;
      render();
      break;
    case "toggle-binding": {
      const { b } = findBinding(el.dataset.dev, el.dataset.bid);
      if (b) {
        b.syncEnabled = !b.syncEnabled;
        showToast(b.syncEnabled ? `已恢复 ${backendDisplayName(b.instanceId)} 路径` : `已暂停 ${backendDisplayName(b.instanceId)} 路径`);
      }
      break;
    }
    case "apply-preset": {
      const { b } = findBinding(el.dataset.dev, el.dataset.bid);
      const dir = el.dataset.dir;
      if (b) {
        if (dir === "off") {
          b.policy = { text: "off", images: "off", files: "off" };
          b.syncEnabled = false;
          showToast("已设为不同步（暂停此路径）");
        } else {
          b.syncEnabled = true;
          b.policy = { text: dir, images: dir, files: dir };
          showToast(`已切换为「全部${DIR_META[dir].label}」`);
        }
      }
      break;
    }
    case "set-type-dir": {
      const { b } = findBinding(el.dataset.dev, el.dataset.bid);
      if (b) {
        b.syncEnabled = true;
        b.policy[el.dataset.type] = el.dataset.dir;
        const tLabel = TYPES.find(t => t.key === el.dataset.type)?.label || "";
        showToast(`${tLabel}策略已设为「${DIR_META[el.dataset.dir].label}」`);
      }
      break;
    }
    case "set-unified-dir": {
      const { b } = findBinding(el.dataset.dev, el.dataset.bid);
      const dir = el.dataset.dir;
      if (b) {
        b.unified.dir = dir;
        b.syncEnabled = dir !== "off";
        showToast(`路径方向已设为「${dir === "off" ? "不同步" : DIR_META[dir].label}」`);
      }
      break;
    }
    case "toggle-unified-type": {
      const { b } = findBinding(el.dataset.dev, el.dataset.bid);
      if (b) {
        b.unified[el.dataset.type] = !b.unified[el.dataset.type];
        const tLabel = TYPES.find(t => t.key === el.dataset.type)?.label || "";
        showToast(`${tLabel}已${b.unified[el.dataset.type] ? "开启" : "关闭"}`);
      }
      break;
    }
    case "reset-policy": {
      const { b } = findBinding(el.dataset.dev, el.dataset.bid);
      if (b) {
        b.syncEnabled = true;
        b.policy = { text: "bi", images: "bi", files: "bi" };
        b.unified = { dir: "bi", text: true, images: true, files: true };
        showToast("已恢复为渠道默认策略（全部双向）");
      }
      break;
    }
    case "jump-plugin":
      showToast(el.dataset.id ? `跳转至：设置 → 插件 → ${backendDisplayName(el.dataset.id)}` : "跳转至：设置 → 插件");
      break;
    case "copy-fp":
      if (navigator.clipboard) navigator.clipboard.writeText(el.dataset.val).catch(() => {});
      showToast("已复制设备指纹");
      break;
    case "toast":
      showToast(el.dataset.msg || "演示操作");
      break;
  }
});

// Top bar controls
document.getElementById("modelPills").addEventListener("click", e => {
  const b = e.target.closest("button[data-model]");
  if (!b) return;
  document.querySelectorAll("#modelPills button").forEach(x => x.classList.toggle("active", x === b));
  S.model = b.dataset.model;
  render();
});
document.getElementById("presetPills").addEventListener("click", e => {
  const b = e.target.closest("button[data-preset]");
  if (!b) return;
  document.querySelectorAll("#presetPills button").forEach(x => x.classList.toggle("active", x === b));
  const curModel = S.model;
  S = buildPreset(b.dataset.preset);
  S.model = curModel;
  syncCheckboxesFromState();
  render();
});
document.getElementById("widthPills").addEventListener("click", e => {
  const b = e.target.closest("button[data-width]");
  if (!b) return;
  document.querySelectorAll("#widthPills button").forEach(x => x.classList.toggle("active", x === b));
  viewportMode = b.dataset.width;
  if (viewportMode !== "narrow") S.narrowDetailOpen = false;
  render();
});
document.getElementById("themePills").addEventListener("click", e => {
  const b = e.target.closest("button[data-theme]");
  if (!b) return;
  document.querySelectorAll("#themePills button").forEach(x => x.classList.toggle("active", x === b));
  document.documentElement.setAttribute("data-theme", b.dataset.theme);
});

function syncCheckboxesFromState() {
  const tc = S.backends.find(x => x.id === "builtin.tailcat");
  document.getElementById("chkGlobalSync").checked = S.globalSync;
  document.getElementById("chkGlobalFiles").checked = S.globalFiles;
  document.getElementById("chkTcImages").checked = tc ? tc.policy.images : true;
  document.getElementById("chkTcFiles").checked = tc ? tc.policy.files : true;
}

document.getElementById("chkGlobalSync").addEventListener("change", e => { S.globalSync = e.target.checked; render(); });
document.getElementById("chkGlobalFiles").addEventListener("change", e => { S.globalFiles = e.target.checked; render(); });
document.getElementById("chkTcImages").addEventListener("change", e => {
  const tc = S.backends.find(x => x.id === "builtin.tailcat");
  if (tc) tc.policy.images = e.target.checked;
  render();
});
document.getElementById("chkTcFiles").addEventListener("change", e => {
  const tc = S.backends.find(x => x.id === "builtin.tailcat");
  if (tc) tc.policy.files = e.target.checked;
  render();
});
document.getElementById("btnReset").addEventListener("click", () => {
  const curModel = S.model;
  S = buildPreset(S.preset);
  S.model = curModel;
  syncCheckboxesFromState();
  render();
});

render();
</script>
</body>
</html>
