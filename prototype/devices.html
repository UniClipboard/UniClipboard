<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>UniClipboard · 设备管理重设计原型（BoardUI v2）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  /* Refined 3-Tier BoardUI Light Surface Hierarchy */
  --bg-canvas-outer: #e7e7eb;
  --bg-toolbar: #ffffff;
  --bg-canvas: #f5f5f7;          /* L1: calm neutral overview canvas so cards float cleanly */
  --bg-inspector: #ffffff;       /* L1.5: crisp pure-white detail/inspection pane */
  --bg-card: #ffffff;            /* L2: elevated cards on canvas */
  --bg-card-hover: #fafafa;
  --bg-inspector-card: #f7f7f9;  /* L2 (subtle): recessed cards inside white inspector */
  --bg-inspector-card-hover: #f0f0f3;
  --bg-inset: #f2f2f5;           /* L2.5: icon tiles & chips inside white cards */
  --bg-inset-on-subtle: #ffffff; /* L2.5: fp cells / inputs inside subtle inspector cards */
  --bg-sheet: #ffffff;           /* L3: modal & popover surface */
  --bg-full: #ffffff;
  --bg-primary: #ffffff;
  --bg-primary-hover: #f5f5f7;
  --bg-secondary: #f5f5f7;
  --bg-secondary-hover: #ebebee;
  --bg-tertiary: #ebebee;

  --sep: #e6e6e9;
  --card-border: #e5e5e8;
  --border-btn: #dfdfE4;
  --border-hover: #c8c8cf;
  --border-active: #a1a1aa;
  --text-primary: #0a0a0a;
  --text-secondary: #6b6b70;
  --text-tertiary: #9a9aa0;
  --icon-primary: #141416;
  --icon-secondary: #6b6b70;
  --icon-tertiary: #9a9aa0;

  --accent-50: #f2f7ff;
  --accent-100: #dbeafe;
  --accent-200: #c2dcff;
  --accent-400: #3392ff;
  --accent-500: #2b7fff;
  --accent-600: #155dfc;
  --accent-700: #1447e6;

  /* Status Pills */
  --success-bg: #eaf9d0;
  --success-fg: #365900;
  --success-dot: #5ea500;
  --warn-pill-bg: #fef3c7;
  --warn-pill-fg: #92400e;
  --info-bg: #e0edff;
  --info-fg: #155dfc;
  --err-bg: #ffe4e6;
  --err-fg: #d91445;

  /* Soft Banners (never harsh pill yellow) */
  --warn-bg: #fffbeb;
  --warn-fg: #92400e;
  --warn-border: #fde68a;
  --err-border: #fecdd3;
  --destructive: #c41022;
  --destructive-bg-hover: #fff1f2;

  --seg-bg: #f1f1f4;
  --seg-sel: #ffffff;
  --sw-off: #dcdce0;
  --sw-on-start: #2273ff;
  --sw-on-end: #144be9;
  --shadow-window: 0 24px 64px rgba(0, 0, 0, .13), 0 0 0 1px rgba(0, 0, 0, .06);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .035);
  --shadow-popover: 0 10px 28px rgba(0, 0, 0, .12), 0 0 0 1px var(--sep);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .04);
  --scrim: rgba(0, 0, 0, .34);
}

[data-theme="dark"] {
  /* Refined 3-Tier BoardUI Dark Surface Hierarchy (aligned with desktopkit/surface.go) */
  --bg-canvas-outer: #09090b;
  --bg-toolbar: #1d1d20;         /* L0: WorkspaceSurface */
  --bg-canvas: #141416;          /* L1: deepest overview canvas so cards elevate cleanly */
  --bg-inspector: #1b1b1e;       /* L1.5: slightly stepped WorkspaceSurface for detail pane */
  --bg-card: #222226;            /* L2: elevated card surface with visible subtle border */
  --bg-card-hover: #29292e;
  --bg-inspector-card: #242428;  /* L2: CardSurface inside inspector */
  --bg-inspector-card-hover: #2c2c31;
  --bg-inset: #19191c;           /* L2.5: gentle recessed tiles/chips */
  --bg-inset-on-subtle: #1b1b1f; /* L2.5: fp cells / inputs inside inspector cards */
  --bg-sheet: #202024;           /* L3: elevated modal / popover */
  --bg-full: #18181b;
  --bg-primary: #26262a;
  --bg-primary-hover: #2f2f35;
  --bg-secondary: #1b1b1e;
  --bg-secondary-hover: #27272c;
  --bg-tertiary: #2c2c31;

  --sep: #2c2c31;
  --card-border: rgba(255, 255, 255, .085);
  --border-btn: rgba(255, 255, 255, .12);
  --border-hover: rgba(255, 255, 255, .22);
  --border-active: rgba(255, 255, 255, .32);
  --text-primary: #f5f5f7;
  --text-secondary: #9c9ca4;
  --text-tertiary: #6c6c74;
  --icon-primary: #f5f5f7;
  --icon-secondary: #9c9ca4;
  --icon-tertiary: #63636a;

  --accent-50: rgba(43, 127, 255, .12);
  --accent-100: rgba(43, 127, 255, .20);
  --accent-200: rgba(51, 146, 255, .34);
  --accent-400: #4da0ff;
  --accent-500: #2b7fff;
  --accent-600: #4da0ff;
  --accent-700: #8ec5ff;

  /* Status Pills */
  --success-bg: rgba(74, 140, 20, .28);
  --success-fg: #b8ee62;
  --success-dot: #a3e635;
  --warn-pill-bg: rgba(245, 158, 11, .20);
  --warn-pill-fg: #fcd34d;
  --info-bg: rgba(43, 127, 255, .20);
  --info-fg: #8ec5ff;
  --err-bg: rgba(236, 0, 63, .22);
  --err-fg: #fda4af;

  /* Soft Banners */
  --warn-bg: rgba(245, 158, 11, .11);
  --warn-fg: #fcd34d;
  --warn-border: rgba(245, 158, 11, .28);
  --err-border: rgba(255, 100, 103, .30);
  --destructive: #ff7376;
  --destructive-bg-hover: rgba(220, 38, 38, .18);

  --seg-bg: #141417;
  --seg-sel: #2a2a2f;
  --sw-off: #3a3a40;
  --shadow-window: 0 28px 80px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .09);
  --shadow-card: none;
  --shadow-popover: 0 14px 36px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .11);
  --shadow-xs: none;
  --scrim: rgba(0, 0, 0, .60);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-primary);
  background: var(--bg-canvas-outer);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 18px 22px;
  gap: 12px;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---- Prototype Control Bar (outside app frame) ---- */
.proto-bar {
  width: 100%;
  max-width: 1180px;
  background: var(--bg-toolbar);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  box-shadow: var(--shadow-xs);
  font-size: 12px;
}
.proto-tag {
  font-weight: 600;
  color: var(--accent-600);
  background: var(--accent-50);
  border: 1px solid var(--accent-200);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: .01em;
}
.proto-group { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.proto-pills { display: inline-flex; background: var(--bg-secondary); padding: 2px; border-radius: 8px; border: 1px solid var(--sep); gap: 2px; }
.proto-pills button {
  border: 0; background: transparent; padding: 3px 9px; border-radius: 6px;
  font-size: 12px; color: var(--text-secondary); transition: .15s;
}
.proto-pills button.active {
  background: var(--bg-primary); color: var(--text-primary); font-weight: 500;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
}
.proto-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; color: var(--text-primary); }
.proto-spacer { flex: 1; }

/* ---- Desktop Window Frame ---- */
.window-stage {
  flex: 1;
  width: 100%;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
.app-window {
  width: 1120px;
  max-width: 100%;
  height: min(760px, calc(100vh - 90px));
  min-height: 540px;
  background: var(--bg-canvas);
  border-radius: 14px;
  box-shadow: var(--shadow-window);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  transition: width .22s cubic-bezier(.32, .72, 0, 1);
}
.app-window.compact { width: 880px; }
.app-window.narrow { width: 660px; }

/* ---- Top 52 DIP Toolbar ---- */
.toolbar {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px 0 16px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--sep);
  user-select: none;
}
.traffic-lights {
  display: flex; align-items: center; gap: 7px; margin-right: 6px; flex: none;
}
.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl.r { background: #ff5f57; }
.tl.y { background: #febc2e; }
.tl.g { background: #28c840; }
.tb-back {
  height: 28px; padding: 0 8px; border-radius: 7px; border: 0; background: transparent;
  display: inline-flex; align-items: center; gap: 4px; color: var(--text-primary);
  font-size: 13px; transition: background .12s;
}
.tb-back:hover { background: var(--bg-secondary-hover); }
.tb-sep { width: 1px; height: 16px; background: var(--sep); flex: none; }
.tb-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.tb-spacer { flex: 1; }

/* ---- Status Pill ---- */
.pill {
  height: 22px; padding: 0 8px; border-radius: 11px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 500; white-space: nowrap; flex: none;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pill.pos { background: var(--success-bg); color: var(--success-fg); }
.pill.pos .dot { background: var(--success-dot); }
.pill.warn { background: var(--warn-pill-bg); color: var(--warn-pill-fg); }
.pill.warn .dot { background: var(--warn-pill-fg); }
.pill.info { background: var(--info-bg); color: var(--info-fg); }
.pill.info .dot { background: var(--accent-500); }
.pill.err { background: var(--err-bg); color: var(--err-fg); }
.pill.err .dot { background: var(--err-fg); }
.pill.neu { background: var(--bg-tertiary); color: var(--text-secondary); }
.pill.neu .dot { background: var(--text-tertiary); }

/* ---- BoardUI Buttons ---- */
.btn {
  height: 30px; padding: 0 11px; border-radius: 8px;
  border: 1px solid var(--border-btn);
  background: var(--bg-primary); color: var(--text-primary);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: transform .08s, background .12s, border-color .12s, opacity .12s;
  box-shadow: var(--shadow-xs);
}
.btn:hover:not(:disabled) { background: var(--bg-primary-hover); border-color: var(--border-hover); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 6px; }
.btn.pri { background: var(--accent-500); border-color: var(--accent-500); color: #fff; box-shadow: none; }
.btn.pri:hover:not(:disabled) { background: var(--accent-600); border-color: var(--accent-600); }
.btn.subtle { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-secondary); }
.btn.subtle:hover:not(:disabled) { background: var(--bg-secondary-hover); color: var(--text-primary); }
.btn.link { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent-600); padding: 0 4px; height: auto; font-weight: 500; }
.btn.link:hover:not(:disabled) { text-decoration: underline; background: transparent; }
.btn.danger { color: var(--destructive); border-color: var(--border-btn); background: var(--bg-primary); }
.btn.danger:hover:not(:disabled) { background: var(--destructive-bg-hover); border-color: var(--err-border); }
.btn.danger-solid { background: #dc2626; border-color: #dc2626; color: #fff; box-shadow: none; }
.btn.danger-solid:hover:not(:disabled) { background: #b91c1c; border-color: #b91c1c; }
.btn.icon-only { width: 26px; height: 26px; padding: 0; border-radius: 7px; }
.btn.full { width: 100%; height: 34px; font-size: 13px; }

/* ---- Body Split ---- */
.body {
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;
}
.canvas {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 18px 22px 28px;
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.inspector {
  width: 380px;
  flex: none;
  background: var(--bg-inspector);
  border-left: 1px solid var(--sep);
  overflow-y: auto;
  padding: 18px 18px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.app-window.narrow .inspector { width: 100%; border-left: 0; }

/* ---- Sync Backends Status Strip ---- */
.backend-strip {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.backend-strip.zero {
  background: var(--warn-bg);
  border-color: var(--warn-border);
}
.backend-strip-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.strip-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  margin-right: 2px;
}
.backend-strip.zero .strip-label { color: var(--warn-fg); }
.chip-list {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.be-chip {
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--card-border);
  background: var(--bg-inset);
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  transition: border-color .12s, background .12s;
}
.be-chip:hover { border-color: var(--border-hover); background: var(--bg-secondary-hover); }
.be-chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.be-chip.running .dot { background: var(--success-dot); }
.be-chip.restarting .dot, .be-chip.pending_restart .dot { background: #eab308; }
.be-chip.unavailable .dot { background: var(--err-fg); }
.be-chip.disabled { opacity: .68; color: var(--text-secondary); }
.be-chip.disabled .dot { background: var(--text-tertiary); }
.be-chip .meta { font-size: 11px; color: var(--text-secondary); font-weight: 400; }
.strip-restart {
  display: flex;
  align-items: center;
  gap: 7px;
  padding-top: 7px;
  border-top: 1px solid var(--sep);
  font-size: 12px;
  color: var(--warn-fg);
}
.strip-zero-text { font-size: 12.5px; color: var(--warn-fg); font-weight: 500; flex: 1; }

/* ---- Inline Notice Banners ---- */
.notice {
  border-radius: 11px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  border: 1px solid transparent;
}
.notice.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-fg); }
.notice.info { background: var(--accent-50); border-color: var(--accent-200); color: var(--text-primary); }
.notice.err { background: var(--err-bg); border-color: var(--err-border); color: var(--err-fg); }
.notice-body { flex: 1; min-width: 0; }
.notice-title { font-weight: 600; }
.notice-sub { font-size: 12px; opacity: .88; margin-top: 1px; }

/* ---- Section Headings ---- */
.sec { display: flex; flex-direction: column; gap: 9px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.sec-hint { font-size: 11.5px; color: var(--text-tertiary); }

/* ---- Pending Approval Banners ---- */
.pending-card {
  padding: 11px 13px;
  border-radius: 12px;
  background: var(--accent-50);
  border: 1.5px solid var(--accent-200);
  display: flex;
  align-items: center;
  gap: 11px;
  cursor: pointer;
  transition: border-color .12s;
}
.pending-card:hover { border-color: var(--accent-400); }
.pending-card.selected { border-color: var(--accent-500); }
.pending-meta { flex: 1; min-width: 0; }
.pending-meta .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pending-meta .sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ---- Device Icon Tile ---- */
.icon-tile {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-inset); border: 1px solid var(--card-border); color: var(--icon-primary);
}
.inspector .icon-tile { background: var(--bg-inset-on-subtle); }
.icon-tile.lg { width: 42px; height: 42px; border-radius: 11px; }
.icon-tile.accent { background: var(--accent-50); border-color: var(--accent-400); color: var(--accent-500); }

/* ---- Device Card Grid ---- */
.dev-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}
.app-window.compact .dev-grid,
.app-window.narrow .dev-grid { grid-template-columns: 1fr; }

.dev-card {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  border-radius: 13px;
  padding: 13px 14px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  cursor: pointer;
  transition: border-color .12s, background .12s, box-shadow .12s, opacity .12s;
}
.dev-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.dev-card.selected { border: 1.5px solid var(--accent-500); padding: 12.5px 13.5px; }
.dev-card.dim { opacity: .76; }
.dev-card.dim.selected { opacity: 1; }
.dev-card-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dev-card-info { flex: 1; min-width: 0; }
.dev-card-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-card-sub { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.dev-card-div { height: 1px; background: var(--sep); }
.dev-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; }
.dev-card-paths { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dev-card-time { color: var(--text-tertiary); flex: none; }

/* ---- Grouped List Box (Channels / Candidates / Inspector Groups) ---- */
.group-box {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  border-radius: 12px;
  overflow: visible;
}
.inspector .group-box {
  background: var(--bg-inspector-card);
  box-shadow: none;
}
.list-row {
  padding: 10px 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background .1s;
}
.list-row:first-child { border-radius: 11px 11px 0 0; }
.list-row:last-child { border-radius: 0 0 11px 11px; }
.list-row:only-child { border-radius: 11px; }
.list-row + .list-row { border-top: 1px solid var(--sep); }
.list-row:hover { background: var(--bg-card-hover); }
.inspector .list-row:hover { background: var(--bg-inspector-card-hover); }
.list-row.selected { background: var(--accent-50); }
.list-row-meta { flex: 1; min-width: 0; }
.list-row-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.list-row-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tag-badge {
  font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px;
  background: var(--info-bg); color: var(--info-fg); flex: none;
}
.tag-badge.neu { background: var(--bg-tertiary); color: var(--text-secondary); }
.tag-badge.warn { background: var(--warn-pill-bg); color: var(--warn-pill-fg); }

/* ---- Inspector Components ---- */
.hero-card {
  background: var(--bg-inspector-card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hero-card.accent { background: var(--accent-50); border-color: var(--accent-200); }
.hero-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hero-name-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
.hero-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-sub { font-size: 11.5px; color: var(--text-secondary); }

.rename-box {

  transform: translateX(0); transition: transform .16s cubic-bezier(.32, .72, 0, 1);

.switch.on { background: linear-gradient(180deg, var(--sw-on-start), var(--sw-on-end)); }

  } else if (name === "zero") {
    backends = backends.map(b => ({ ...b, state: "disabled" }));
    devices = [
      { ...structuredClone(baseDevices[0]), bindings: [{ ...structuredClone(baseDevices[0].bindings[0]), connection: "disconnected" }] }
    ];
    channels = [];
    pending = [];
    candidates = [];
  } else if (name === "empty") {
    backends = [structuredClone(baseBackends[0]), structuredClone(baseBackends[1])];
    devices = [];
    channels = [];
    pending = [];
    candidates = [];
  }

  return {
    preset: name,
    globalSync: true,
    restartRequired: false,
    local: { id: "local", name: "MacBook Pro (本机)", deviceId: "m7x4q9k2p8n3v5w1r6y0t2h8c4", icon: "laptop" },
    backends,
    devices,
    channels,
    pending,
    candidates,
    selected: devices.length ? devices[0].id : "local",
    narrowDetailOpen: false,
    renaming: false,
    renameDraft: "",
    openMenuBindingId: null,

    task: null, // null | "invite" | "connect" | "wait" | "inline-approve"
    taskForDeviceId: null,
    inviteMode: "code", // "code" | "ticket"

    inviteCode: randCode(),

    connectInput: "",
    connectError: "",
    waitFingerprint: "",
    inlinePending: null,
    // Confirmation dialog
    confirm: null,
    // Toast
    toast: null
  };
}

// ---- Derived Helpers ----
function runningPairingBackends() {
  return S.backends.filter(b => b.pairing && b.state === "running");
}
function runningBackends() {
  return S.backends.filter(b => b.state === "running");
}
function deviceDisplayName(d) {
  return (d.userName || "").trim() || d.reportedName || "未命名设备";
}
function authorizedBindings(d) {
  return d.bindings.filter(b => b.state === "authorized");
}
function pendingBindings(d) {
  return d.bindings.filter(b => b.state === "pending");
}
function deviceAggregateStatus(d) {
  const auth = authorizedBindings(d);
  if (auth.length === 0) return { text: "无路径", tone: "neu", online: false };
  const enabled = auth.filter(b => b.syncEnabled);
  if (enabled.length === 0) return { text: "已暂停", tone: "neu", online: false };
  const connected = enabled.filter(b => b.connection === "connected");
  if (connected.length > 0) {
    if (auth.length > 1 && connected.length < auth.length) {
      return { text: `在线 · ${connected.length}/${auth.length}`, tone: "pos", online: true };
    }
    return { text: "在线", tone: "pos", online: true };
  }
  return { text: "离线", tone: "neu", online: false };
}
function deviceSubtitle(d) {
  const auth = authorizedBindings(d).length;
  const pend = pendingBindings(d).length;
  if (auth === 0 && pend === 0) return "已信任 · 无同步路径";
  if (pend > 0) return `${auth + pend} 条路径 · ${pend} 条待批准`;
  if (auth === 1) return backendDisplayName(authorizedBindings(d)[0].instanceId);
  return `${auth} 条同步路径`;
}
function deviceFootPaths(d) {
  const auth = authorizedBindings(d);
  if (auth.length === 0) return "点击右侧添加同步路径";
  return auth.map(b => {
    const n = backendDisplayName(b.instanceId);
    return b.syncEnabled ? n : `${n}(暂停)`;
  }).join(" · ");
}
function unboundRunningBackends(d) {
  const bound = new Set(d.bindings.map(b => b.instanceId));
  return runningPairingBackends().filter(b => !bound.has(b.id));
}

function ensureSelection() {
  if (S.selected === "local") return;
  if (S.selected.startsWith("pending:")) {
    const pid = S.selected.slice(8);
    if (S.pending.some(p => !p.isExistingDevice && p.id === pid)) return;
  } else if (S.selected.startsWith("ch:")) {
    const cid = S.selected.slice(3);
    if (S.channels.some(c => c.id === cid)) return;
  } else if (S.selected.startsWith("cand:")) {
    const cid = S.selected.slice(5);
    if (S.candidates.some(c => c.id === cid)) return;
  } else if (S.devices.some(d => d.id === S.selected)) {
    return;
  }
  const newPend = S.pending.find(p => !p.isExistingDevice);
  if (newPend) { S.selected = "pending:" + newPend.id; return; }
  if (S.devices.length) { S.selected = S.devices[0].id; return; }
  S.selected = "local";
}

function sortedDevices() {
  return [...S.devices].sort((a, b) => {
    const score = d => {
      if (pendingBindings(d).length > 0) return 0;
      const st = deviceAggregateStatus(d);
      if (st.online) return 1;
      if (authorizedBindings(d).length > 0) return 2;
      return 3;
    };
    return score(a) - score(b);
  });
}

function openPairingSheet(forDeviceId = null, preferredBackend = "") {
  const avail = runningPairingBackends();
  S.taskForDeviceId = forDeviceId;
  S.inviteMode = "code";
  S.inviteCode = randCode();
  S.inviteSeconds = 300;
  S.connectInput = "";
  S.connectError = "";
  S.inlinePending = null;
  S.openMenuBindingId = null;
  if (avail.length === 0) {
    S.pairingBackend = "";
    S.task = "invite";
  } else {
    S.pairingBackend = (preferredBackend && avail.some(b => b.id === preferredBackend))
      ? preferredBackend : avail[0].id;
    S.task = "invite";
  }
  render();
}

function jumpToPluginSettings(targetId) {
  S.openMenuBindingId = null;

              <div class="path-info">
                <div class="path-title">启用此渠道同步</div>
                <div class="path-sub">关闭后停止经此外部渠道收发内容</div>
              </div>
              <button class="switch ${ch.enabled ? "on" : ""}" data-act="toggle-ch-enabled" data-id="${esc(ch.id)}"></button>
            </div>
            <div class="path-row">
              <div class="path-info">
                <div class="path-title">收到时自动写入剪贴板</div>
                <div class="path-sub">开启后来自此渠道的内容会自动应用到系统剪贴板</div>
              </div>
              <button class="switch ${ch.autoApply ? "on" : ""}" data-act="toggle-ch-auto" data-id="${esc(ch.id)}" ${!ch.enabled ? "disabled" : ""}></button>
            </div>
          </div>
        </div>
        <div class="row-end" style="margin-top:4px">
          <button class="btn sm danger" data-act="ask-remove-ch" data-id="${esc(ch.id)}">${IC.trash} 移除渠道</button>
        </div>
      </div>
    `;
  }

  // 4. Discovery Candidate
  if (S.selected.startsWith("cand:")) {
    const cid = S.selected.slice(5);
    const cd = S.candidates.find(x => x.id === cid);
    if (!cd) return `<div class="inspector"></div>`;
    return `
      <div class="inspector">
        <div class="hero-card">
          <div class="icon-tile lg accent">${IC[cd.icon] || IC.desktop}</div>
          <div class="hero-meta">
            <div class="hero-name">${esc(cd.name)}</div>
            <div class="hero-sub">由 ${esc(cd.introducer)} 介绍 · ${esc(backendDisplayName(cd.backendId))}</div>
          </div>
        </div>
        <div class="footnote">介绍信息仅为发现建议，设备名称未经验证。发起连接后仍需双方核对指纹并各自批准。</div>
        <div class="row-gap">
          <button class="btn full pri" data-act="pair-cand" data-id="${esc(cd.id)}">发起连接</button>
          <button class="btn" style="height:34px" data-act="ignore-cand" data-id="${esc(cd.id)}">忽略</button>
        </div>
      </div>
    `;
  }

  // 5. Trusted Device
  const d = S.devices.find(x => x.id === S.selected);
  if (!d) return `<div class="inspector"></div>`;
  const st = deviceAggregateStatus(d);
  const auth = authorizedBindings(d);
  const pendEntry = S.pending.find(p => p.isExistingDevice && p.id === d.id);
  const unbound = unboundRunningBackends(d);
  const allPaused = auth.length > 0 && auth.every(b => !b.syncEnabled);
  const showBatchPause = auth.length >= 2; // Strictly follows User Decision #2!

  return `
    <div class="inspector">
      <div class="hero-card">
        <div class="icon-tile lg">${IC[d.icon] || IC.desktop}</div>
        <div class="hero-meta">
          <div class="hero-name-row">
            <span class="hero-name">${esc(deviceDisplayName(d))}</span>
            <button class="btn subtle icon-only" data-act="start-rename" title="重命名设备">${IC.edit}</button>
          </div>
          ${d.userName && d.reportedName && d.userName !== d.reportedName ? `<div class="hero-sub">对方自报：${esc(d.reportedName)}</div>` : ""}
          <div class="row-gap" style="margin-top:2px">
            ${renderPill(st.text, st.tone)}
            ${d.lastSeen ? `<span class="footnote">最近活动 ${esc(d.lastSeen)}</span>` : ""}
          </div>
        </div>
      </div>

      ${S.renaming ? `
        <div class="rename-box">
          <label>设备备注名</label>
          <div class="rename-row">
            <input class="text-input" id="renameInput" value="${esc(S.renameDraft)}" placeholder="${esc(d.reportedName)}" autofocus>
            <button class="btn sm pri" data-act="commit-rename">保存</button>
            <button class="btn sm" data-act="cancel-rename">取消</button>
          </div>
          <div class="field-hint">只修改本机显示的名称；留空则恢复使用对方自报名（${esc(d.reportedName)}）。</div>
        </div>
      ` : ""}

      ${pendEntry ? `
        <div class="inline-approve">
          <div class="inline-approve-head">
            <span style="color:var(--accent-500);margin-top:1px">${IC.shield}</span>
            <div class="grow">
              <div class="title">待批准新同步路径：${esc(pendEntry.paths.map(x => backendDisplayName(x.instanceId)).join("、"))}</div>
              <div class="sub">此设备已受信任，但新增同步路径仍需核对指纹并显式批准。</div>
            </div>
          </div>
          ${renderFingerprintGrid(pendEntry.fingerprint)}
          <div class="row-end">
            <button class="btn sm danger" data-act="reject-pending" data-id="${esc(pendEntry.id)}">拒绝</button>
            <button class="btn sm pri" data-act="approve-pending" data-id="${esc(pendEntry.id)}">确认指纹一致并批准</button>
          </div>
        </div>
      ` : ""}

      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">同步路径 (${auth.length})</span>
          <button class="btn xs subtle" data-act="open-add-path" data-id="${esc(d.id)}" ${unbound.length === 0 ? `disabled title="所有运行中的可配对同步渠道均已关联"` : ""}>
            ${IC.add} 添加路径
          </button>
        </div>

        ${auth.length === 0 ? `
          <div class="empty-card" style="padding:16px 14px">
            <div class="t" style="font-size:13px">暂无已授权同步路径</div>
            <div class="d">设备信任仍然保留，但目前不会同步任何内容。通过同步渠道重新关联即可恢复。</div>
            <button class="btn sm pri" data-act="open-add-path" data-id="${esc(d.id)}">${IC.add} 添加同步路径</button>
          </div>
        ` : `
          <div class="group-box">
            ${auth.map(b => {
              const be = S.backends.find(x => x.id === b.instanceId);
              const beStopped = be && be.state !== "running";
              const connText = !b.syncEnabled ? "已暂停" : (b.connection === "connected" ? "已连接" : "未连接");
              const menuOpen = S.openMenuBindingId === b.id;
              return `
                <div class="path-row">
                  <div class="path-info">
                    <div class="path-title">
                      <span>${esc(backendDisplayName(b.instanceId))}</span>
                      ${beStopped ? `<span class="tag-badge warn">${esc(backendStateLabel(be.state))}</span>` : ""}
                    </div>
                    <div class="path-sub">${esc(b.impl)} · ${esc(connText)}${b.lastActive ? ` · ${esc(b.lastActive)}` : ""}</div>
                    ${b.lastError && b.syncEnabled && !beStopped ? `<div class="path-err">${IC.alert} ${esc(errorLabel(b.lastError))}</div>` : ""}
                    ${beStopped ? `<div class="path-warn">${IC.alert} 对应同步渠道未运行，<button class="btn link" style="font-size:11.5px" data-act="jump-plugin" data-id="${esc(b.instanceId)}">前往插件设置</button></div>` : ""}
                  </div>
                  <div class="path-actions">
                    <button class="switch ${b.syncEnabled ? "on" : ""}" data-act="toggle-binding" data-dev="${esc(d.id)}" data-bid="${esc(b.id)}" title="${b.syncEnabled ? "暂停此路径同步" : "恢复此路径同步"}"></button>
                    <button class="btn subtle icon-only" data-act="toggle-menu" data-bid="${esc(b.id)}" title="更多操作">${IC.more}</button>
                    ${menuOpen ? `
                      <div class="popover">
                        <button data-act="jump-plugin" data-id="${esc(b.instanceId)}">${IC.settings} 查看同步渠道策略…</button>
                        <button class="danger" data-act="ask-remove-binding" data-dev="${esc(d.id)}" data-bid="${esc(b.id)}">${IC.trash} 移除此路径</button>
                      </div>
                    ` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="footnote">单路径开关控制是否经该同步渠道收发内容；文本/图片/文件策略请在插件设置中按同步渠道调整。</div>
        `}
      </div>

      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">安全核对（设备指纹）</span>
          <button class="btn xs subtle" data-act="copy-text" data-val="${esc(d.fingerprint)}" data-msg="已复制设备指纹">${IC.copy} 复制</button>
        </div>
        <div class="fp-box">
          ${renderFingerprintGrid(d.fingerprint)}
        </div>
      </div>

      <div class="row-gap" style="margin-top:4px">
        ${showBatchPause ? `
          <button class="btn sm grow" data-act="toggle-all-bindings" data-dev="${esc(d.id)}">
            ${allPaused ? "恢复全部路径" : "暂停全部路径"}
          </button>
        ` : `<span class="grow"></span>`}
        <button class="btn sm danger" data-act="ask-remove-device" data-id="${esc(d.id)}">${IC.trash} 移除设备</button>
      </div>
    </div>
  `;
}

function renderTaskSheet() {
  if (!S.task) return "";
  const avail = runningPairingBackends();
  const targetDev = S.taskForDeviceId ? S.devices.find(d => d.id === S.taskForDeviceId) : null;
  const title = targetDev ? `为「${deviceDisplayName(targetDev)}」添加同步路径` : "添加设备";

  let body = "";

  // Case 0: Zero running pairing backends
  if (avail.length === 0) {
    body = `
      <div class="empty-card" style="background:transparent;border:0;padding:18px 8px">
        <div class="icon-tile lg" style="margin-bottom:4px">${IC.plug}</div>
        <div class="t">没有正在运行的可配对同步渠道</div>
        <div class="d">
          请先在「设置 → 插件」中启用支持设备配对的同步渠道（如 Tailcat 或外部同步插件）并重启桌面端。
          ${S.restartRequired ? "<br><strong>当前存在待重启生效的插件变更。</strong>" : ""}
        </div>
        <button class="btn pri" style="margin-top:6px" data-act="jump-plugin" data-id="">前往插件设置 ${IC.arrowRight}</button>
      </div>
    `;
  } else if (S.task === "inline-approve" && S.inlinePending) {
    const p = S.inlinePending;
    body = `
      <div class="notice info">
        <span style="color:var(--accent-500)">${IC.shield}</span>
        <div class="notice-body">
          <div class="notice-title">${p.isExistingDevice ? `「${esc(p.name)}」请求新增同步路径` : "核对指纹并批准"}</div>
          <div class="notice-sub">${esc(p.name)} · 仅在对方屏幕上显示相同指纹时才接受。</div>
        </div>
      </div>
      <div class="row-gap" style="flex-wrap:wrap">
        <span class="footnote">同步渠道：</span>
        ${p.paths.map(x => `<span class="tag-badge">${esc(backendDisplayName(x.instanceId))}</span>`).join("")}
      </div>
      ${renderFingerprintGrid(p.fingerprint)}
      <div class="footnote">名称由对方自报，未经验证。</div>
      <div class="row-end">
        <button class="btn sm danger" data-act="reject-inline">拒绝</button>
        <button class="btn sm pri" data-act="accept-inline">确认指纹一致并接受</button>
      </div>
    `;
  } else {
    const showSelector = avail.length >= 2 || !!targetDev;
    const selectorHtml = showSelector ? `
      <div class="select-field">
        <label>${S.task === "connect" ? "接入到本地同步渠道" : "使用同步渠道"}</label>
        <select class="select-input" id="pairingBackendSelect">
          ${avail.map(b => `<option value="${esc(b.id)}" ${b.id === S.pairingBackend ? "selected" : ""}>${esc(backendDisplayName(b.id))} (${esc(b.impl)})</option>`).join("")}
        </select>
        ${S.task === "connect" ? `<div class="field-hint">远端同步渠道名可以不同，但需使用相同的传输插件。</div>` : ""}
      </div>
    ` : "";

    const tabsHtml = (S.task === "invite" || S.task === "connect") ? `
      <div class="seg">
        <button class="${S.task === "invite" ? "active" : ""}" data-act="task-tab" data-tab="invite">出示配对码</button>
        <button class="${S.task === "connect" ? "active" : ""}" data-act="task-tab" data-tab="connect">输入配对码</button>
      </div>
    ` : "";

    if (S.task === "invite") {
      const digits = S.inviteCode.replace("-", "").split("");
      const fakeTicket = `unic-pair:v1:${S.pairingBackend}:AQ7xK2m9pR4vN8qL3fZ1yB6cH0wE5tJ…`;
      body = `
        ${tabsHtml}
        ${selectorHtml}
        <div class="footnote" style="font-size:12.5px">
          ${targetDev
            ? `在「${esc(deviceDisplayName(targetDev))}」上输入下方配对码或票据，核对指纹后将为其新增此同步路径。`
            : "在另一台设备的 UniClipboard 中输入下方一次性配对码，随后核对指纹即可完成关联。"}
        </div>
        ${S.inviteMode === "code" ? `
          <div class="code-boxes">
            ${digits.slice(0,3).map(d => `<div class="code-tile">${d}</div>`).join("")}
            <span class="code-dash">-</span>
            ${digits.slice(3,6).map(d => `<div class="code-tile">${d}</div>`).join("")}
          </div>
          <div class="row-between">
            <span class="row-gap footnote">
              <span style="width:7px;height:7px;border-radius:50%;background:var(--accent-500);display:inline-block"></span>
              <span id="countdownLabel">${S.inviteSeconds} 秒内有效 · 仅可使用一次</span>
            </span>
            <div class="row-gap" style="gap:4px">
              <button class="btn xs subtle" data-act="copy-text" data-val="${esc(S.inviteCode)}" data-msg="已复制配对码">${IC.copy} 复制</button>
              <button class="btn xs subtle" data-act="regen-code">${IC.retry} 刷新</button>
            </div>
          </div>
        ` : `
          <div class="ticket-box">
            <div class="ticket-text">${esc(fakeTicket)}</div>
            <div class="row-between">
              <span class="footnote">300 秒内有效 · 单次使用</span>
              <button class="btn xs" data-act="copy-text" data-val="${esc(fakeTicket)}" data-msg="已复制完整票据">${IC.copy} 复制票据</button>
            </div>
          </div>
        `}
        <div style="text-align:center">
          <button class="btn link" style="font-size:12px" data-act="toggle-invite-mode">
            ${S.inviteMode === "code" ? "跨网或命令行配对？改用完整票据 →" : "← 返回 6 位配对码"}
          </button>
        </div>
        <div class="sheet-sep"></div>
        <div class="sheet-foot">
          <span>${avail.length === 1 ? `通过 ${esc(backendDisplayName(S.pairingBackend))} · ` : ""}端到端加密</span>
          <button class="btn xs" data-act="sim-incoming">模拟对方接入</button>
        </div>
      `;
    } else if (S.task === "connect") {
      const kind = connectKind(S.connectInput);
      body = `
        ${tabsHtml}
        ${selectorHtml}
        <div class="col-gap" style="gap:6px">
          <label style="font-size:12px;font-weight:600;color:var(--text-secondary)">配对码或完整票据</label>
          <input class="text-input ${S.connectError ? "error" : ""}" id="connectInput" value="${esc(S.connectInput)}" placeholder="482-913 或 unic-pair:…" autofocus>
          ${S.connectError
            ? `<div class="field-err" id="connectHint">${esc(S.connectError)}</div>`
            : `<div class="field-hint" id="connectHint">${kind ? `已识别为：${kind}` : "支持 6 位配对码或完整票据（演示：000000 模拟过期，999999 模拟渠道不兼容）"}</div>`}
        </div>
        <button class="btn full pri" id="btnConnectSubmit" data-act="submit-connect" ${!kind ? "disabled" : ""}>连接设备</button>
        ${avail.length === 1 ? `<div class="sheet-foot"><span>通过 ${esc(backendDisplayName(S.pairingBackend))} · 端到端加密</span></div>` : ""}
      `;
    } else if (S.task === "wait") {
      body = `
        <div class="notice info">
          <span style="color:var(--accent-500)">${IC.shield}</span>
          <div class="notice-body">
            <div class="notice-title">等待双方批准</div>
            <div class="notice-sub">请在另一台设备上核对下方指纹，并在本机收到请求后点击接受。</div>
          </div>
        </div>
        ${renderFingerprintGrid(S.waitFingerprint)}
        <div class="sheet-sep"></div>
        <div class="row-between">
          <button class="btn sm subtle" data-act="task-tab" data-tab="connect">${IC.back} 返回</button>
          <div class="row-gap">
            <button class="btn xs" data-act="sim-wait-fail">模拟对方拒绝</button>
            <button class="btn xs pri" data-act="sim-wait-approve">模拟对端握手到达</button>
          </div>
        </div>
      `;
    }
  }

  return `
    <div class="scrim" data-act="close-scrim">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-head">
          <span class="sheet-title">${esc(title)}</span>
          <button class="btn subtle icon-only" data-act="close-task" title="关闭">${IC.close}</button>
        </div>
        ${body}
      </div>
    </div>
  `;
}

function renderConfirmDialog() {
  if (!S.confirm) return "";
  return `
    <div class="scrim" data-act="close-confirm">
      <div class="sheet" style="width:390px" onclick="event.stopPropagation()">
        <div class="sheet-head">
          <span class="sheet-title">${esc(S.confirm.title)}</span>
        </div>
        <div class="footnote" style="font-size:13px;line-height:1.55">${esc(S.confirm.desc)}</div>
        <div class="row-end" style="margin-top:4px">
          <button class="btn sm" data-act="close-confirm">取消</button>
          <button class="btn sm danger-solid" data-act="do-confirm">${esc(S.confirm.confirmLabel || "移除")}</button>
        </div>
      </div>
    </div>
  `;
}

function render() {
  ensureSelection();
  const win = document.getElementById("appWindow");
  win.className = "app-window" + (viewportMode === "compact" ? " compact" : viewportMode === "narrow" ? " narrow" : "");

  const onlinePeers = S.devices.filter(d => deviceAggregateStatus(d).online).length;
  const totalDevices = S.devices.length + 1; // + local
  const summaryPill = !S.globalSync
    ? renderPill("全局同步已关闭", "warn")
    : runningBackends().length === 0
      ? renderPill("仅本地模式", "neu")
      : renderPill(`${onlinePeers} 台在线 · 共 ${totalDevices} 台`, "pos");

  const isNarrow = viewportMode === "narrow";
  const showCanvas = !isNarrow || !S.narrowDetailOpen;
  const showInspector = !isNarrow || S.narrowDetailOpen;

  win.innerHTML = `
    <div class="toolbar">
      <div class="traffic-lights"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span></div>
      ${isNarrow && S.narrowDetailOpen
        ? `<button class="tb-back" data-act="narrow-back">${IC.back} 设备</button>`
        : `<button class="tb-back" data-act="back-history">${IC.back} 返回历史</button>`}
      <span class="tb-sep"></span>
      <span class="tb-title">设备管理</span>
      ${summaryPill}
      <span class="tb-spacer"></span>
      <button class="btn sm pri" data-act="open-pair">${IC.add} 添加设备</button>
    </div>
    <div class="body">
      ${showCanvas ? renderCanvas() : ""}
      ${showInspector ? renderInspector() : ""}
    </div>
    ${renderTaskSheet()}
    ${renderConfirmDialog()}
    ${S.toast ? `<div class="toast-wrap"><div class="toast">${esc(S.toast)}</div></div>` : ""}
  `;

  // Bind input events directly for smooth typing without losing focus
  const connectEl = document.getElementById("connectInput");
  if (connectEl) {
    connectEl.addEventListener("input", e => {
      S.connectInput = e.target.value;
      S.connectError = "";
      const kind = connectKind(S.connectInput);
      const btn = document.getElementById("btnConnectSubmit");
      if (btn) btn.disabled = !kind;
      const hint = document.getElementById("connectHint");
      if (hint) {
        hint.className = "field-hint";
        hint.textContent = kind ? `已识别为：${kind}` : "支持 6 位配对码或完整票据（演示：000000 模拟过期，999999 模拟渠道不兼容）";
      }
      connectEl.classList.remove("error");
    });
    connectEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && connectKind(S.connectInput)) handleConnectSubmit();
    });
  }
  const renameEl = document.getElementById("renameInput");
  if (renameEl) {
    renameEl.addEventListener("input", e => { S.renameDraft = e.target.value; });
    renameEl.addEventListener("keydown", e => {
      if (e.key === "Enter") commitRename();
      if (e.key === "Escape") { S.renaming = false; render(); }
    });
  }
  const selectEl = document.getElementById("pairingBackendSelect");
  if (selectEl) {
    selectEl.addEventListener("change", e => {
      S.pairingBackend = e.target.value;
      S.inviteCode = randCode();
      S.inviteSeconds = 300;
      render();
    });
  }
}

// ---- Actions ----
function commitRename() {
  const val = S.renameDraft.trim();
  if (S.selected === "local") {
    if (val) S.local.name = val;
    showToast("本机名称已保存");
  } else if (S.selected.startsWith("ch:")) {
    const ch = S.channels.find(c => c.id === S.selected.slice(3));
    if (ch && val) { ch.name = val; showToast("渠道名称已保存"); }
  } else {
    const d = S.devices.find(x => x.id === S.selected);
    if (d) {
      d.userName = val; // Empty string clears custom name and reverts to reportedName
      showToast(val ? "设备名称已保存" : "已恢复为对方自报名");
    }
  }
  S.renaming = false;
  render();
}

function handleConnectSubmit() {
  const raw = S.connectInput.trim().replace("-", "");
  if (raw === "000000") {
    S.connectError = "配对码或票据已过期，请让对方刷新后重试。";
    render();
    return;
  }
  if (raw === "999999") {
    S.connectError = "当前选择的本地同步渠道与该票据不兼容，请切换为对应的同步渠道。";
    render();
    return;
  }
  S.connectError = "";
  S.waitFingerprint = randFp();
  S.task = "wait";
  render();
}

function approvePendingById(pid) {
  const idx = S.pending.findIndex(p => p.id === pid);
  if (idx < 0) return;
  const p = S.pending[idx];
  S.pending.splice(idx, 1);

  if (p.isExistingDevice) {
    const d = S.devices.find(x => x.id === p.id);
    if (d) {
      p.paths.forEach(pp => {
        const existing = d.bindings.find(b => b.id === pp.id || b.instanceId === pp.instanceId);
        if (existing) {
          existing.state = "authorized";
          existing.connection = "connected";
          existing.lastActive = "刚刚";
        } else {
          const be = S.backends.find(x => x.id === pp.instanceId);
          d.bindings.push({
            id: "b-" + Date.now(),
            instanceId: pp.instanceId,
            impl: be ? be.impl : pp.instanceId,
            state: "authorized",
            syncEnabled: true,
            connection: "connected",
            lastActive: "刚刚",
            lastError: ""
          });
        }
      });
      d.lastSeen = "刚刚";
      S.selected = d.id;
    }
    showToast(`已批准新同步路径`);
  } else {
    const newId = "d-" + Date.now();
    const newBindings = p.paths.map((pp, i) => {
      const be = S.backends.find(x => x.id === pp.instanceId);
      return {
        id: "b-" + Date.now() + "-" + i,
        instanceId: pp.instanceId,
        impl: be ? be.impl : pp.instanceId,
        state: "authorized",
        syncEnabled: true,
        connection: "connected",
        lastActive: "刚刚",
        lastError: ""
      };
    });
    S.devices.push({
      id: newId,
      userName: "",
      reportedName: p.name,
      icon: p.icon || "desktop",
      fingerprint: p.fingerprint,
      lastSeen: "刚刚",
      bindings: newBindings
    });
    S.selected = newId;
    showToast(`已批准设备「${p.name}」`);
  }
  render();
}

function rejectPendingById(pid) {
  const idx = S.pending.findIndex(p => p.id === pid);
  if (idx < 0) return;
  const p = S.pending[idx];
  S.pending.splice(idx, 1);
  if (p.isExistingDevice) {
    const d = S.devices.find(x => x.id === p.id);
    if (d) d.bindings = d.bindings.filter(b => b.state !== "pending");
  }
  showToast("已拒绝请求");
  render();
}

// ---- Delegated Click Handling ----
document.getElementById("appWindow").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) {
    if (S.openMenuBindingId) { S.openMenuBindingId = null; render(); }
    return;
  }
  const act = btn.dataset.act;
  if (act !== "toggle-menu" && S.openMenuBindingId) {
    S.openMenuBindingId = null;
  }

  switch (act) {
    case "back-history":
      showToast("返回历史记录主视图");
      break;
    case "narrow-back":
      S.narrowDetailOpen = false; S.renaming = false; render();
      break;
    case "jump-plugin":
      jumpToPluginSettings(btn.dataset.id);
      break;
    case "enable-global-sync":
      S.globalSync = true;
      document.getElementById("chkGlobalSync").checked = true;
      showToast("已开启全局同步");
      break;
    case "select":
      S.selected = btn.dataset.id;
      S.renaming = false;
      S.narrowDetailOpen = true;
      render();
      break;
    case "start-rename":
      S.renaming = true;
      if (S.selected === "local") S.renameDraft = S.local.name;
      else if (S.selected.startsWith("ch:")) {
        const ch = S.channels.find(c => c.id === S.selected.slice(3));
        S.renameDraft = ch ? ch.name : "";
      } else {
        const d = S.devices.find(x => x.id === S.selected);
        S.renameDraft = d ? (d.userName || d.reportedName) : "";
      }
      render();
      break;
    case "commit-rename":
      commitRename();
      break;
    case "cancel-rename":
      S.renaming = false; render();
      break;
    case "copy-text":
      if (navigator.clipboard) navigator.clipboard.writeText(btn.dataset.val).catch(() => {});
      showToast(btn.dataset.msg || "已复制");
      break;
    case "open-pair":
      openPairingSheet(null, "");
      break;
    case "open-add-path": {
      const d = S.devices.find(x => x.id === btn.dataset.id);
      const unbound = d ? unboundRunningBackends(d) : [];
      openPairingSheet(d ? d.id : null, unbound[0] ? unbound[0].id : "");
      break;
    }
    case "toggle-binding": {
      const d = S.devices.find(x => x.id === btn.dataset.dev);
      const b = d && d.bindings.find(x => x.id === btn.dataset.bid);
      if (b) {
        b.syncEnabled = !b.syncEnabled;
        showToast(b.syncEnabled ? `已恢复 ${backendDisplayName(b.instanceId)} 同步` : `已暂停 ${backendDisplayName(b.instanceId)} 同步`);
      }
      break;
    }
    case "toggle-all-bindings": {
      const d = S.devices.find(x => x.id === btn.dataset.dev);
      if (d) {
        const auth = authorizedBindings(d);
        const shouldEnable = auth.every(b => !b.syncEnabled);
        auth.forEach(b => { b.syncEnabled = shouldEnable; });
        showToast(shouldEnable ? "已恢复此设备的全部路径" : "已暂停此设备的全部路径");
      }
      break;
    }
    case "toggle-menu":
      e.stopPropagation();
      S.openMenuBindingId = (S.openMenuBindingId === btn.dataset.bid) ? null : btn.dataset.bid;
      render();
      break;
    case "ask-remove-binding": {
      const d = S.devices.find(x => x.id === btn.dataset.dev);
      const b = d && d.bindings.find(x => x.id === btn.dataset.bid);
      if (d && b) {
        S.confirm = {
          title: `移除 ${backendDisplayName(b.instanceId)} 路径？`,
          desc: `仅移除与「${deviceDisplayName(d)}」通过 ${backendDisplayName(b.instanceId)} 的同步路径。设备信任与其他同步路径将保留，日后可重新配对添加。`,
          confirmLabel: "移除路径",
          onConfirm: () => {
            d.bindings = d.bindings.filter(x => x.id !== b.id);
            showToast("同步路径已移除");
          }
        };
        render();
      }
      break;
    }
    case "ask-remove-device": {
      const d = S.devices.find(x => x.id === btn.dataset.id);
      if (d) {
        S.confirm = {
          title: `移除「${deviceDisplayName(d)}」？`,
          desc: "将撤销此设备的信任并移除全部同步路径。对方需要重新配对并批准。已同步到对方的内容无法撤回。",
          confirmLabel: "移除设备",
          onConfirm: () => {
            S.devices = S.devices.filter(x => x.id !== d.id);
            S.pending = S.pending.filter(p => p.id !== d.id);
            S.narrowDetailOpen = false;
            showToast("设备已移除");
          }
        };
        render();
      }
      break;
    }
    case "toggle-ch-enabled": {
      const ch = S.channels.find(c => c.id === btn.dataset.id);
      if (ch) { ch.enabled = !ch.enabled; showToast(ch.enabled ? "已启用外部渠道" : "已停用外部渠道"); }
      break;
    }
    case "toggle-ch-auto": {
      const ch = S.channels.find(c => c.id === btn.dataset.id);
      if (ch) { ch.autoApply = !ch.autoApply; showToast("渠道设置已保存"); }
      break;
    }
    case "ask-remove-ch": {
      const ch = S.channels.find(c => c.id === btn.dataset.id);
      if (ch) {
        S.confirm = {
          title: `移除外部渠道「${ch.name}」？`,
          desc: ch.remoteRevocation
            ? "将停用并尝试退出远端群组，退出成功后清除本机记录；若退出失败将保留并标示异常。"
            : "此操作仅从本机移除该外部渠道记录，不影响第三方远端群组状态。",
          confirmLabel: "移除渠道",
          onConfirm: () => {
            S.channels = S.channels.filter(x => x.id !== ch.id);
            S.narrowDetailOpen = false;
            showToast("外部渠道已移除");
          }
        };
        render();
      }
      break;
    }
    case "approve-pending":
      approvePendingById(btn.dataset.id);
      break;
    case "reject-pending":
      rejectPendingById(btn.dataset.id);
      break;
    case "ignore-cand":
      S.candidates = S.candidates.filter(c => c.id !== btn.dataset.id);
      showToast("已忽略此发现建议");
      break;
    case "pair-cand": {
      const cd = S.candidates.find(c => c.id === btn.dataset.id);
      if (cd) {
        S.candidates = S.candidates.filter(c => c.id !== cd.id);
        S.pairingBackend = cd.backendId;
        S.waitFingerprint = randFp();
        S.taskForDeviceId = null;
        S.task = "wait";
        showToast(`已向「${cd.name}」发起连接`);
      }
      break;
    }
    case "close-task":
    case "close-scrim":
      S.task = null; S.inlinePending = null; render();
      break;
    case "task-tab":
      S.task = btn.dataset.tab;
      S.connectError = "";
      if (S.task === "invite") { S.inviteCode = randCode(); S.inviteSeconds = 300; }
      render();
      break;
    case "regen-code":
      S.inviteCode = randCode(); S.inviteSeconds = 300;
      showToast("已刷新配对码");
      break;
    case "toggle-invite-mode":
      S.inviteMode = S.inviteMode === "code" ? "ticket" : "code";
      render();
      break;
    case "submit-connect":
      handleConnectSubmit();
      break;
    case "sim-incoming": {
      const target = S.taskForDeviceId ? S.devices.find(d => d.id === S.taskForDeviceId) : null;
      S.inlinePending = {
        id: target ? target.id : ("p-in-" + Date.now()),
        isExistingDevice: !!target,
        name: target ? deviceDisplayName(target) : "工作室 Mac Studio",
        icon: target ? target.icon : "desktop",
        fingerprint: target ? target.fingerprint : randFp(),
        paths: [{ id: "bp-" + Date.now(), instanceId: S.pairingBackend, state: "pending" }]
      };
      S.task = "inline-approve";
      render();
      break;
    }
    case "sim-wait-fail":
      S.task = "connect";
      S.connectError = "对方拒绝了请求或连接超时，请检查后重试。";
      render();
      break;
    case "sim-wait-approve":
      S.inlinePending = {
        id: "p-join-" + Date.now(),
        isExistingDevice: false,
        name: "对端设备",
        icon: "desktop",
        fingerprint: S.waitFingerprint,
        paths: [{ id: "bp-j-" + Date.now(), instanceId: S.pairingBackend || "builtin.tailcat", state: "pending" }]
      };
      S.task = "inline-approve";
      render();
      break;
    case "accept-inline": {
      const p = S.inlinePending;
      if (p) {
        S.pending.push(p);
        S.inlinePending = null;
        S.task = null;
        approvePendingById(p.id);
      }
      break;
    }
    case "reject-inline":
      S.inlinePending = null;
      S.task = null;
      showToast("已拒绝配对请求");
      break;
    case "close-confirm":
      S.confirm = null; render();
      break;
    case "do-confirm": {
      const fn = S.confirm && S.confirm.onConfirm;
      S.confirm = null;
      if (fn) fn();
      render();
      break;
    }
  }
});

// ---- Keyboard Escape Layering ----
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (S.openMenuBindingId) { S.openMenuBindingId = null; render(); return; }
  if (S.confirm) { S.confirm = null; render(); return; }
  if (S.task) { S.task = null; S.inlinePending = null; render(); return; }
  if (S.renaming) { S.renaming = false; render(); return; }
  if (viewportMode === "narrow" && S.narrowDetailOpen) { S.narrowDetailOpen = false; render(); return; }
});

// ---- Prototype Control Bar Bindings ----
document.getElementById("presetPills").addEventListener("click", e => {
  const b = e.target.closest("button[data-preset]");
  if (!b) return;
  document.querySelectorAll("#presetPills button").forEach(x => x.classList.toggle("active", x === b));
  S = buildPreset(b.dataset.preset);
  S.globalSync = document.getElementById("chkGlobalSync").checked;
  S.restartRequired = document.getElementById("chkRestart").checked;
  render();
});

document.getElementById("widthPills").addEventListener("click", e => {
  const b = e.target.closest("button[data-width]");
  if (!b) return;
  document.querySelectorAll("#widthPills button").forEach(x => x.classList.toggle("active", x === b));
  viewportMode = b.dataset.width;
  if (viewportMode !== "narrow") S.narrowDetailOpen = false;
  render();
});

document.getElementById("themePills").addEventListener("click", e => {
  const b = e.target.closest("button[data-theme]");
  if (!b) return;
  document.querySelectorAll("#themePills button").forEach(x => x.classList.toggle("active", x === b));
  document.documentElement.setAttribute("data-theme", b.dataset.theme);
});

document.getElementById("chkGlobalSync").addEventListener("change", e => {
  S.globalSync = e.target.checked; render();
});
document.getElementById("chkRestart").addEventListener("change", e => {
  S.restartRequired = e.target.checked; render();
});
document.getElementById("btnReset").addEventListener("click", () => {
  S = buildPreset(S.preset);
  document.getElementById("chkGlobalSync").checked = true;
  document.getElementById("chkRestart").checked = false;
  render();
});

render();
</script>
</body>
</html>
