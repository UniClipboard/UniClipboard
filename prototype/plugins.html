<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniClipboard · 插件与插件市场原型（BoardUI v2）</title>
<!--
  Interactive Desktop prototype for Settings → Plugins + Online Plugin Marketplace (Obsidian-inspired, BoardUI v2).
  Open directly in any browser — zero external dependencies.
  Design goals:
    - Obsidian-style online plugin marketplace as the primary discovery & one-click install flow
    - Human-friendly language; technical metadata (plugin ID, commit, GitHub URL install, execution order) tucked into secondary/advanced surfaces
    - Zero-config plugins (such as Wenshushu temporary share) never show an empty settings button or form
-->
<style>
:root {
  /* 3-Tier BoardUI Light Surface Hierarchy */
  --bg-canvas-outer: #e7e7eb;
  --bg-toolbar: #ffffff;
  --bg-sidebar: #f7f7f9;
  --bg-canvas: #f5f5f7;
  --bg-pane: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #fafafa;
  --bg-subtle: #f7f7f9;
  --bg-subtle-hover: #efeff2;
  --bg-inset: #f2f2f5;
  --bg-input: #ffffff;
  --bg-sheet: #ffffff;
  --bg-primary: #ffffff;
  --bg-primary-hover: #f5f5f7;
  --bg-secondary: #f5f5f7;
  --bg-secondary-hover: #ebebee;
  --bg-tertiary: #ebebee;

  --sep: #e6e6e9;
  --card-border: #e5e5e8;
  --border-btn: #dfdfe4;
  --border-hover: #c8c8cf;
  --text-primary: #0a0a0a;
  --text-secondary: #6b6b70;
  --text-tertiary: #9a9aa0;
  --icon-primary: #141416;
  --icon-secondary: #6b6b70;
  --icon-tertiary: #9a9aa0;

  --accent-50: #f2f7ff;
  --accent-100: #dbeafe;
  --accent-200: #c2dcff;
  --accent-400: #3392ff;
  --accent-500: #2b7fff;
  --accent-600: #155dfc;

  --success-bg: #eaf9d0;
  --success-fg: #365900;
  --success-dot: #5ea500;
  --warn-pill-bg: #fef3c7;
  --warn-pill-fg: #92400e;
  --info-bg: #e0edff;
  --info-fg: #155dfc;
  --purple-bg: #f3e8ff;
  --purple-fg: #7e22ce;
  --teal-bg: #ccfbf1;
  --teal-fg: #0f766e;
  --amber-bg: #ffedd5;
  --amber-fg: #c2410c;
  --err-bg: #ffe4e6;
  --err-fg: #d91445;

  --warn-bg: #fffbeb;
  --warn-fg: #92400e;
  --warn-border: #fde68a;
  --err-border: #fecdd3;
  --destructive: #c41022;
  --destructive-bg-hover: #fff1f2;

  --seg-bg: #f1f1f4;
  --seg-sel: #ffffff;
  --sw-off: #dcdce0;
  --sw-on-start: #2273ff;
  --sw-on-end: #144be9;
  --shadow-window: 0 24px 64px rgba(0, 0, 0, .13), 0 0 0 1px rgba(0, 0, 0, .06);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .035);
  --shadow-popover: 0 10px 28px rgba(0, 0, 0, .12), 0 0 0 1px var(--sep);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .04);
  --scrim: rgba(0, 0, 0, .34);
}

[data-theme="dark"] {
  --bg-canvas-outer: #09090b;
  --bg-toolbar: #1d1d20;
  --bg-sidebar: #18181b;
  --bg-canvas: #141416;
  --bg-pane: #1b1b1e;
  --bg-card: #222226;
  --bg-card-hover: #29292e;
  --bg-subtle: #242428;
  --bg-subtle-hover: #2c2c31;
  --bg-inset: #19191c;
  --bg-input: #1b1b1f;
  --bg-sheet: #202024;
  --bg-primary: #26262a;
  --bg-primary-hover: #2f2f35;
  --bg-secondary: #1b1b1e;
  --bg-secondary-hover: #27272c;
  --bg-tertiary: #2c2c31;

  --sep: #2c2c31;
  --card-border: rgba(255, 255, 255, .085);
  --border-btn: rgba(255, 255, 255, .12);
  --border-hover: rgba(255, 255, 255, .22);
  --text-primary: #f5f5f7;
  --text-secondary: #9c9ca4;
  --text-tertiary: #6c6c74;
  --icon-primary: #f5f5f7;
  --icon-secondary: #9c9ca4;
  --icon-tertiary: #63636a;

  --accent-50: rgba(43, 127, 255, .12);
  --accent-100: rgba(43, 127, 255, .20);
  --accent-200: rgba(51, 146, 255, .34);
  --accent-400: #4da0ff;
  --accent-500: #2b7fff;
  --accent-600: #4da0ff;

  --success-bg: rgba(74, 140, 20, .28);
  --success-fg: #b8ee62;
  --success-dot: #a3e635;
  --warn-pill-bg: rgba(245, 158, 11, .20);
  --warn-pill-fg: #fcd34d;
  --info-bg: rgba(43, 127, 255, .20);
  --info-fg: #8ec5ff;
  --purple-bg: rgba(168, 85, 247, .22);
  --purple-fg: #d8b4fe;
  --teal-bg: rgba(20, 184, 166, .20);
  --teal-fg: #5eead4;
  --amber-bg: rgba(249, 115, 22, .22);
  --amber-fg: #fdba74;
  --err-bg: rgba(236, 0, 63, .22);
  --err-fg: #fda4af;

  --warn-bg: rgba(245, 158, 11, .11);
  --warn-fg: #fcd34d;
  --warn-border: rgba(245, 158, 11, .28);
  --err-border: rgba(255, 100, 103, .30);
  --destructive: #ff7376;
  --destructive-bg-hover: rgba(220, 38, 38, .18);

  --seg-bg: #141417;
  --seg-sel: #2a2a2f;
  --sw-off: #3a3a40;
  --shadow-window: 0 28px 80px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .09);
  --shadow-card: none;
  --shadow-popover: 0 14px 36px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .11);
  --shadow-xs: none;
  --scrim: rgba(0, 0, 0, .62);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.48;
  color: var(--text-primary);
  background: var(--bg-canvas-outer);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 18px 20px;
  gap: 12px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; flex: none; }

/* ---- Prototype Control Bar ---- */
.proto-bar {
  width: 100%;
  max-width: 1180px;
  background: var(--bg-toolbar);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 7px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  box-shadow: var(--shadow-xs);
  font-size: 12px;
}
.proto-tag {
  font-weight: 600;
  color: var(--accent-600);
  background: var(--accent-50);
  border: 1px solid var(--accent-200);
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
}
.proto-group { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.proto-pills {
  display: inline-flex; background: var(--bg-secondary);
  padding: 2px; border-radius: 8px; border: 1px solid var(--sep); gap: 2px;
}
.proto-pills button {
  border: 0; background: transparent; padding: 3px 9px; border-radius: 6px;
  font-size: 12px; color: var(--text-secondary); transition: .14s;
}
.proto-pills button.active {
  background: var(--bg-primary); color: var(--text-primary); font-weight: 500;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
}
.proto-spacer { flex: 1; }

/* ---- Window Frame ---- */
.window-stage {
  flex: 1; width: 100%; min-height: 0;
  display: flex; justify-content: center; align-items: stretch;
}
.app-window {
  width: 1160px; max-width: 100%;
  height: min(760px, calc(100vh - 88px)); min-height: 560px;
  background: var(--bg-canvas);
  border-radius: 14px;
  box-shadow: var(--shadow-window);
  display: flex;
  overflow: hidden;
  position: relative;
  transition: width .22s cubic-bezier(.32, .72, 0, 1);
}
.app-window.compact { width: 900px; }
.app-window.narrow { width: 660px; }

/* ---- Settings Sidebar ---- */
.sidebar {
  width: 196px; flex: none;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--sep);
  display: flex; flex-direction: column;
  user-select: none; z-index: 15;
}
.sidebar.hidden { display: none; }
.app-window.compact .sidebar.overlay,
.app-window.narrow .sidebar.overlay {
  position: absolute; top: 0; bottom: 0; left: 0;
  box-shadow: 12px 0 32px rgba(0, 0, 0, .18);
}
.sb-top {
  height: 52px; flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px 0 16px;
}
.traffic-lights { display: flex; align-items: center; gap: 7px; flex: none; }
.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl.r { background: #ff5f57; }
.tl.y { background: #febc2e; }
.tl.g { background: #28c840; }
.sb-scroll {
  flex: 1; overflow-y: auto; padding: 4px 12px 12px;
  display: flex; flex-direction: column; gap: 2px;
}
.sb-row {
  height: 30px; padding: 0 9px; border-radius: 8px;
  border: 1px solid transparent; background: transparent;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-primary); text-align: left;
  transition: background .1s;
}
.sb-row:hover { background: var(--bg-secondary-hover); }
.sb-row.active {
  background: var(--bg-primary); border-color: var(--card-border);
  font-weight: 500; box-shadow: var(--shadow-xs);
}
.sb-row.active .sb-ico { color: var(--accent-500); }
.sb-ico { color: var(--icon-secondary); width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
.sb-lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-500); }
.sb-dot.warn { background: #eab308; }
.sb-foot { flex: none; padding: 8px 12px 12px; border-top: 1px solid var(--sep); }
.sb-kbd { font-size: 11px; color: var(--text-tertiary); font-family: ui-monospace, Menlo, monospace; }

/* ---- Main Shell ---- */
.main-shell { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.toolbar {
  height: 52px; flex: none;
  display: flex; align-items: center; gap: 10px;
  padding: 0 20px 0 16px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--sep);
  user-select: none;
}
.tb-chrome-btn {
  width: 28px; height: 28px; border-radius: 7px; border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--icon-secondary); transition: background .12s, color .12s;
}
.tb-chrome-btn:hover { background: var(--bg-secondary-hover); color: var(--icon-primary); }
.tb-title { font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
.tb-spacer { flex: 1; }
.tb-menu-wrap { position: relative; }

/* ---- Buttons ---- */
.btn {
  height: 32px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--border-btn);
  background: var(--bg-primary); color: var(--text-primary);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: transform .08s, background .12s, border-color .12s, opacity .12s;
  box-shadow: var(--shadow-xs);
}
.btn:hover:not(:disabled) { background: var(--bg-primary-hover); border-color: var(--border-hover); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; gap: 5px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 6px; gap: 4px; }
.btn.pri { background: var(--accent-500); border-color: var(--accent-500); color: #fff; box-shadow: none; }
.btn.pri:hover:not(:disabled) { background: var(--accent-600); border-color: var(--accent-600); }
.btn.subtle { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-secondary); }
.btn.subtle:hover:not(:disabled) { background: var(--bg-secondary-hover); color: var(--text-primary); }
.btn.link { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent-600); padding: 0 3px; height: auto; font-weight: 500; }
.btn.link:hover:not(:disabled) { text-decoration: underline; }
.btn.danger { color: var(--destructive); border-color: var(--border-btn); background: var(--bg-primary); }
.btn.danger:hover:not(:disabled) { background: var(--destructive-bg-hover); border-color: var(--err-border); }
.btn.danger-solid { background: #dc2626; border-color: #dc2626; color: #fff; box-shadow: none; }
.btn.danger-solid:hover:not(:disabled) { background: #b91c1c; border-color: #b91c1c; }
.btn.icon-only { width: 28px; height: 28px; padding: 0; border-radius: 7px; }
.btn.icon-sm { width: 24px; height: 24px; padding: 0; border-radius: 6px; }

/* ---- Pills, Badges, Switch ---- */
.pill {
  height: 22px; padding: 0 8px; border-radius: 11px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 500; white-space: nowrap; flex: none;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pill.pos { background: var(--success-bg); color: var(--success-fg); }
.pill.pos .dot { background: var(--success-dot); }
.pill.warn { background: var(--warn-pill-bg); color: var(--warn-pill-fg); }
.pill.warn .dot { background: var(--warn-pill-fg); }
.pill.info { background: var(--info-bg); color: var(--info-fg); }
.pill.err { background: var(--err-bg); color: var(--err-fg); }
.pill.neu { background: var(--bg-tertiary); color: var(--text-secondary); }

.badge {
  font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px;
  background: var(--bg-tertiary); color: var(--text-secondary); flex: none;
  display: inline-flex; align-items: center; gap: 3px; line-height: 1.5;
}
.badge.official { background: var(--info-bg); color: var(--info-fg); }
.badge.pos { background: var(--success-bg); color: var(--success-fg); }
.badge.purple { background: var(--purple-bg); color: var(--purple-fg); }
.badge.teal { background: var(--teal-bg); color: var(--teal-fg); }
.badge.warn { background: var(--warn-pill-bg); color: var(--warn-pill-fg); }

.switch {
  width: 34px; height: 20px; border-radius: 10px; border: 0; padding: 2px;
  background: var(--sw-off); position: relative; flex: none;
  transition: background .16s ease;
}
.switch::after {
  content: ""; display: block; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
  transform: translateX(0); transition: transform .16s cubic-bezier(.32, .72, 0, 1);
}
.switch.on { background: linear-gradient(180deg, var(--sw-on-start), var(--sw-on-end)); }
.switch.on::after { transform: translateX(14px); }
.switch:disabled { opacity: .45; cursor: not-allowed; }

.icon-tile {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-inset); border: 1px solid var(--card-border); color: var(--icon-primary);
}
.icon-tile.lg { width: 46px; height: 46px; border-radius: 12px; }
.icon-tile.sm { width: 30px; height: 30px; border-radius: 8px; }
.icon-tile.accent { background: var(--accent-50); border-color: var(--accent-200); color: var(--accent-600); }
.icon-tile.purple { background: var(--purple-bg); border-color: transparent; color: var(--purple-fg); }
.icon-tile.teal { background: var(--teal-bg); border-color: transparent; color: var(--teal-fg); }
.icon-tile.amber { background: var(--amber-bg); border-color: transparent; color: var(--amber-fg); }

/* ---- Settings Page Canvas (Obsidian-style Clean Single Column) ---- */
.settings-scroll {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 22px 26px 36px;
  background: var(--bg-canvas);
}
.settings-inner {
  max-width: 740px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Hero Marketplace Banner */
.market-hero {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  border-radius: 14px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.market-hero-body { flex: 1; min-width: 0; }
.market-hero-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.market-hero-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }
.market-hero-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.app-window.narrow .market-hero { flex-direction: column; align-items: flex-start; }

/* Notices */
.notice {
  border-radius: 11px;
  padding: 10px 13px;
  display: flex; align-items: center; gap: 10px;
  font-size: 12.5px;
  border: 1px solid transparent;
}
.notice.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-fg); }
.notice.info { background: var(--accent-50); border-color: var(--accent-200); color: var(--text-primary); }
.notice.err { background: var(--err-bg); border-color: var(--err-border); color: var(--err-fg); }
.notice.pos { background: var(--success-bg); color: var(--success-fg); }
.notice-body { flex: 1; min-width: 0; }
.notice-title { font-weight: 600; font-size: 12.5px; }
.notice-sub { font-size: 11.5px; opacity: .88; margin-top: 1px; }

/* Sections & Installed Rows */
.sec { display: flex; flex-direction: column; gap: 9px; }
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 0 2px;
}
.sec-title { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.sec-hint { font-size: 11.5px; color: var(--text-tertiary); }

.group-box {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  border-radius: 13px;
  overflow: hidden;
}
.inst-row {
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 13px;
  cursor: pointer;
  transition: background .1s;
}
.inst-row + .inst-row { border-top: 1px solid var(--sep); }
.inst-row:hover { background: var(--bg-card-hover); }
.inst-row.off .inst-name { color: var(--text-secondary); }
.inst-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.inst-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.inst-name { font-size: 13.5px; font-weight: 600; }
.inst-desc { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inst-meta { font-size: 11.5px; color: var(--text-tertiary); display: flex; align-items: center; gap: 8px; }
.inst-actions { display: flex; align-items: center; gap: 6px; flex: none; }

/* Inline Mini Search */
.mini-search {
  position: relative; width: 210px;
}
.mini-search .s-ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--icon-tertiary); pointer-events: none; }
.mini-search input {
  width: 100%; height: 28px; padding: 0 10px 0 28px;
  border-radius: 8px; border: 1px solid var(--card-border);
  background: var(--bg-card); font-size: 12px; outline: none;
}
.mini-search input:focus { border-color: var(--accent-500); }

/* Featured Discovery Strip (when 0 plugins installed) */
.featured-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px;
}
.app-window.narrow .featured-grid { grid-template-columns: 1fr; }
.feat-card {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  border-radius: 13px;
  padding: 14px 15px;
  display: flex; flex-direction: column; gap: 10px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.feat-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.feat-card.primary-pick { border-color: var(--accent-200); background: var(--accent-50); }
.feat-top { display: flex; align-items: center; gap: 10px; }
.feat-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; flex: 1; }
.feat-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--sep); }

/* ================= Obsidian-Style Online Marketplace Overlay ================= */
.scrim {
  position: absolute; inset: 0; z-index: 40;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.market-modal {
  width: min(1040px, calc(100% - 8px));
  height: min(690px, calc(100% - 8px));
  background: var(--bg-pane);
  border-radius: 16px;
  box-shadow: 0 28px 72px rgba(0, 0, 0, .32), 0 0 0 1px var(--card-border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.market-head {
  padding: 14px 18px 12px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--sep);
  display: flex; flex-direction: column; gap: 11px;
  flex: none;
}
.market-head-row { display: flex; align-items: center; gap: 10px; }
.market-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.market-search-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search-box {
  flex: 1; min-width: 200px; position: relative;
}
.search-box .s-ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--icon-tertiary); pointer-events: none; }
.search-box input {
  width: 100%; height: 34px; padding: 0 30px 0 32px;
  border-radius: 9px; border: 1px solid var(--border-btn);
  background: var(--bg-input); font-size: 13px; outline: none;
}
.search-box input:focus { border-color: var(--accent-500); box-shadow: 0 0 0 3px rgba(43, 127, 255, .15); }
.search-clear {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; border: 0; border-radius: 50%;
  background: var(--bg-tertiary); color: var(--text-secondary);
  display: inline-flex; align-items: center; justify-content: center;
}
.cat-chips { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.chip {
  height: 26px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--card-border); background: var(--bg-card);
  color: var(--text-secondary); font-size: 12px; font-weight: 500;
  transition: .12s;
}
.chip:hover { border-color: var(--border-hover); color: var(--text-primary); }
.chip.active { background: var(--accent-50); border-color: var(--accent-400); color: var(--accent-600); }

/* Marketplace Split Body */
.market-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.market-list-pane {
  flex: 1; min-width: 0;
  background: var(--bg-canvas);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.market-grid-scroll {
  flex: 1; overflow-y: auto; padding: 14px 16px 20px;
}
.market-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px;
}
.app-window.compact .market-grid,
.app-window.narrow .market-grid { grid-template-columns: 1fr; }

.m-card {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  border-radius: 13px;
  padding: 13px 14px;
  display: flex; flex-direction: column; gap: 9px;
  cursor: pointer;
  transition: border-color .12s, background .12s;
}
.m-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.m-card.selected {
  border: 1.5px solid var(--accent-500);
  padding: 12.5px 13.5px;
  background: var(--accent-50);
}
.m-card-top { display: flex; align-items: flex-start; gap: 10px; }
.m-card-title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.m-card-author { font-size: 11.5px; color: var(--text-tertiary); margin-top: 1px; }
.m-card-desc {
  font-size: 12px; color: var(--text-secondary); line-height: 1.48;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  flex: 1;
}
.m-card-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 11.5px; color: var(--text-tertiary);
  padding-top: 7px; border-top: 1px solid var(--sep);
}
.m-dl { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }

.market-list-foot {
  flex: none; padding: 9px 16px;
  border-top: 1px solid var(--sep);
  background: var(--bg-toolbar);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; color: var(--text-tertiary);
}

/* Marketplace Right Detail Pane (Obsidian Style) */
.market-detail {
  width: 390px; flex: none;
  background: var(--bg-pane);
  border-left: 1px solid var(--sep);
  overflow-y: auto;
  padding: 20px 20px 26px;
  display: flex; flex-direction: column; gap: 16px;
}
.app-window.compact .market-detail { width: 340px; }
.app-window.narrow .market-detail { width: 100%; border-left: 0; }
.app-window.narrow .market-list-pane.hidden-narrow,
.app-window.narrow .market-detail.hidden-narrow { display: none; }

.md-head { display: flex; align-items: flex-start; gap: 12px; }
.md-name { font-size: 17px; font-weight: 700; letter-spacing: -.015em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.md-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.md-cta-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.md-progress {
  width: 100%; background: var(--bg-subtle); border: 1px solid var(--card-border);
  border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px;
}
.prog-track { width: 100%; height: 6px; border-radius: 3px; background: var(--bg-tertiary); overflow: hidden; }
.prog-fill { height: 100%; background: var(--accent-500); border-radius: 3px; transition: width .25s ease; }

.md-section { display: flex; flex-direction: column; gap: 8px; }
.md-section h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.md-text { font-size: 12.5px; color: var(--text-primary); line-height: 1.6; }

.howto-box {
  background: var(--bg-subtle); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 9px;
}
.howto-step { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: var(--text-primary); }
.howto-num {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: var(--accent-50); color: var(--accent-600);
  border: 1px solid var(--accent-200);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; margin-top: 1px;
}

.menu-demo {
  background: var(--bg-sheet); border: 1px solid var(--card-border);
  border-radius: 10px; padding: 5px; box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; gap: 1px;
}
.md-mi { padding: 6px 9px; border-radius: 6px; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 7px; }
.md-mi.hl { background: var(--accent-50); color: var(--accent-600); font-weight: 600; }
.md-msep { height: 1px; background: var(--sep); margin: 3px 6px; }

/* Collapsible Technical Details */
details.tech-fold {
  border-top: 1px solid var(--sep);
  padding-top: 10px;
}
details.tech-fold summary {
  font-size: 12px; color: var(--text-tertiary); cursor: pointer;
  list-style: none; display: flex; align-items: center; justify-content: space-between;
  user-select: none;
}
details.tech-fold summary::-webkit-details-marker { display: none; }
details.tech-fold summary:hover { color: var(--text-secondary); }
.tech-kv {
  margin-top: 10px;
  background: var(--bg-subtle); border: 1px solid var(--card-border);
  border-radius: 10px; overflow: hidden;
}
.kv-row {
  padding: 7px 11px; display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px;
}
.kv-row + .kv-row { border-top: 1px solid var(--sep); }
.kv-k { color: var(--text-secondary); flex: none; }
.kv-v { color: var(--text-primary); text-align: right; word-break: break-all; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }

/* ================= Standard Sheet / Config Modal ================= */
.sheet {
  width: 490px; max-width: 100%; max-height: calc(100% - 20px);
  background: var(--bg-sheet); border-radius: 16px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, .30), 0 0 0 1px var(--card-border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet.sm { width: 410px; }
.sheet-head {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--sep);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex: none;
}
.sheet-title { font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sheet-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 16px 20px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.sheet-foot {
  flex: none; padding: 12px 20px;
  border-top: 1px solid var(--sep);
  background: var(--bg-toolbar);
  display: flex; align-items: center; gap: 8px;
}
.sheet-foot .sp { flex: 1; }

/* Settings Form inside Modal */
.set-group {
  background: var(--bg-subtle); border: 1px solid var(--card-border);
  border-radius: 12px; overflow: hidden;
}
.set-row {
  padding: 11px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.set-row.col { flex-direction: column; align-items: stretch; gap: 7px; }
.set-row + .set-row { border-top: 1px solid var(--sep); }
.set-l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.set-label { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.set-label .req { color: var(--err-fg); font-weight: 700; }
.set-desc { font-size: 11.5px; color: var(--text-secondary); }
.set-err { font-size: 11.5px; color: var(--err-fg); font-weight: 500; margin-top: 2px; }
.set-ctl { display: flex; align-items: center; gap: 6px; flex: none; }

.text-input, .select-input, .textarea-input {
  border-radius: 8px; border: 1px solid var(--border-btn);
  background: var(--bg-input); color: var(--text-primary);
  font-size: 12.5px; outline: none;
  transition: border-color .12s, box-shadow .12s;
}
.text-input { height: 30px; padding: 0 9px; width: 175px; }
.text-input.wide { width: 100%; height: 32px; padding: 0 10px; }
.text-input.num { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
.select-input { height: 30px; padding: 0 8px; }
.textarea-input { width: 100%; min-height: 64px; padding: 7px 9px; resize: vertical; }
.text-input:focus, .select-input:focus, .textarea-input:focus {
  border-color: var(--accent-500); box-shadow: 0 0 0 3px rgba(43, 127, 255, .15);
}
.text-input.error { border-color: var(--err-fg); background: var(--err-bg); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.unset-pill {
  font-size: 11.5px; color: var(--text-tertiary);
  background: var(--bg-input); border: 1px dashed var(--border-btn);
  padding: 2px 8px; border-radius: 6px;
}

/* Popover Menu */
.popover {
  position: absolute; top: 34px; right: 0; z-index: 30;
  min-width: 196px; padding: 4px;
  background: var(--bg-sheet); border-radius: 10px;
  box-shadow: var(--shadow-popover);
  display: flex; flex-direction: column; gap: 1px;
}
.popover button {
  width: 100%; border: 0; background: transparent; text-align: left;
  padding: 7px 10px; border-radius: 7px; font-size: 12.5px;
  display: flex; align-items: center; gap: 8px; color: var(--text-primary);
}
.popover button:hover { background: var(--bg-secondary-hover); }
.pop-sep { height: 1px; background: var(--sep); margin: 3px 6px; }

/* Order Row */
.order-row { padding: 9px 13px; display: flex; align-items: center; gap: 10px; }
.order-row + .order-row { border-top: 1px solid var(--sep); }
.order-idx { width: 18px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-tertiary); }

/* Toast */
.toast-wrap {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 60; pointer-events: none;
}
.toast {
  background: #18181b; color: #fafafa; padding: 8px 14px; border-radius: 10px;
  font-size: 12.5px; font-weight: 500; box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  animation: fadeIn .14s ease-out;
}
[data-theme="dark"] .toast { background: #fafafa; color: #0a0a0a; }

.row-gap { display: flex; align-items: center; gap: 6px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.spin { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
</style>

function catById(id) { return MARKET_CATALOG.find(c => c.id === id); }

  for (const k of Object.keys(installTimers)) { clearInterval(installTimers[k]); delete installTimers[k]; }
  S.preset = name;
  S.builtins = clone(BUILTIN_FEATURES);
  S.installedQuery = "";
  S.marketQuery = "";
  S.marketCat = "all";
  S.marketSort = "featured";
  S.marketSelectedId = "unic.wenshushu";
  S.marketNarrowDetail = false;

    S.installed = {

// ================= Actions =================
function startOnlineInstall(id) {
  const item = catById(id);
  if (!item || S.installing[id]) return;
  S.installing[id] = { pct: 18, text: "正在下载插件包…" };
  render();

  let step = 0;
  installTimers[id] = setInterval(() => {
    step++;
    if (step === 1) {
      S.installing[id] = { pct: 62, text: "正在验证安全性与兼容性…" };
      render();
    } else if (step === 2) {
      S.installing[id] = { pct: 92, text: "正在完成安装…" };
      render();
    } else {
      clearInterval(installTimers[id]);
      delete installTimers[id];
      delete S.installing[id];
      S.installed[id] = {
        enabled: false,
        installedVersion: item.version,
        config: item.defaultConfig ? clone(item.defaultConfig) : undefined,
        secrets: {}
      };
      if (!S.order.includes(id)) S.order.push(id);
      showToast(`已安装「${item.name}」，点击「启用」即可使用`);
    }
  }, 360);
}

function toggleInstalled(id, ev) {
  if (ev) ev.stopPropagation();
  const st = S.installed[id];
  const item = catById(id);
  if (!st || !item) return;
  st.enabled = !st.enabled;
  S.needsRestart = true;
  showToast(st.enabled ? `已启用「${item.name}」` : `已停用「${item.name}」`);
}

function toggleBuiltin(id, ev) {
  if (ev) ev.stopPropagation();
  const b = builtinById(id);
  if (!b) return;
  b.enabled = !b.enabled;
  S.needsRestart = true;
  showToast(b.enabled ? `已开启「${b.name}」` : `已关闭「${b.name}」`);
}

function updatePlugin(id, ev) {
  if (ev) ev.stopPropagation();
  const st = S.installed[id];
  const item = catById(id);
  if (!st || !st.updateTo) return;
  st.installedVersion = st.updateTo;
  delete st.updateTo;
  S.needsRestart = true;
  showToast(`「${item.name}」已更新至 v${st.installedVersion}`);
}

function updateAllPlugins() {
  const list = updatesAvailable();
  if (!list.length) {
    showToast("所有已安装插件均为最新版本");
    return;
  }
  for (const id of list) {
    S.installed[id].installedVersion = S.installed[id].updateTo;
    delete S.installed[id].updateTo;
  }
  S.needsRestart = true;
  showToast(`已更新 ${list.length} 个插件，重启后生效`);
}

function confirmUninstall(id) {
  const item = catById(id);
  delete S.installed[id];
  S.order = S.order.filter(x => x !== id);
  S.needsRestart = true;
  if (S.overlay === "uninstall" || S.overlay === "info" || S.overlay === "config") S.overlay = null;
  showToast(`已卸载「${item ? item.name : id}」`);
}

function restartNow() {
  S.needsRestart = false;
  showToast("已重启服务，所有插件变更已生效");
}

function openConfig(id, ev) {
  if (ev) ev.stopPropagation();
  const b = builtinById(id);
  if (b) {
    S.overlay = "config";
    S.overlayId = id;
    S.draft = { isBuiltin: true, policy: clone(b.syncPolicy), dirty: false, err: "" };
    render();
    return;
  }
  const item = catById(id);
  const st = S.installed[id];
  if (!item || !item.hasSettings || !st) return;
  S.overlay = "config";
  S.overlayId = id;
  S.draft = {
    isBuiltin: false,
    values: clone(st.config || item.defaultConfig || {}),
    secretOp: "keep", // keep | replace | clear
    secretVal: "",
    dirty: false,
    err: "",
    extraTagInput: ""
  };
  render();
}

function openPluginInfo(id) {
  S.overlay = "info";
  S.overlayId = id;
  render();
}

function saveConfigModal() {
  const id = S.overlayId;
  const d = S.draft;
  if (!d) return;
  if (d.isBuiltin) {
    const n = Number(d.policy.maxFileMB);
    if (d.policy.maxFileMB === "" || !Number.isInteger(n) || n < 0 || n > 4096) {
      d.err = "请输入 0 到 4096 之间的整数";
      render();
      return;
    }
    builtinById(id).syncPolicy = clone(d.policy);
    S.overlay = null;
    showToast("同步设置已保存并立即生效");
    return;
  }
  const item = catById(id);
  const st = S.installed[id];
  if (id === "unic.smarttags") {
    if (!String(d.values.prefix || "").trim()) {
      d.err = "标签前缀不能为空";
      render();
      return;
    }
    if (new TextEncoder().encode(d.values.prefix).length > 16) {
      d.err = "标签前缀过长，请控制在 16 字节以内（约 5 个中文字符）";
      render();
      return;
    }
    const maxL = Number(d.values.maxLength);
    if (!Number.isInteger(maxL) || maxL < 1 || maxL > 10000) {
      d.err = "最大处理长度需在 1 到 10000 之间";
      render();
      return;
    }
  }
  if (id === "community.webdav") {
    if (!String(d.values.endpoint || "").startsWith("https://")) {
      d.err = "请填写有效的 HTTPS 服务地址";
      render();
      return;
    }
    if (!String(d.values.username || "").trim()) {
      d.err = "请填写用户名";
      render();
      return;
    }
  }
  st.config = clone(d.values);
  if (item.hasSecretField) {
    if (!st.secrets) st.secrets = {};
    const sk = item.hasSecretField.key;
    if (d.secretOp === "replace" && d.secretVal.trim()) st.secrets[sk] = true;
    if (d.secretOp === "clear") st.secrets[sk] = false;
  }
  S.needsRestart = st.enabled;
  S.overlay = null;
  showToast(st.enabled ? `「${item.name}」选项已保存，重启后生效` : `「${item.name}」选项已保存`);
}

function submitManualInstall() {
  const url = S.manualUrl.trim();
  if (!/^https:\/\/github\.com\/[^/\s]+\/[^/\s]+/.test(url)) {
    showToast("请输入有效的 GitHub 仓库链接");
    return;
  }
  S.overlay = "market";
  S.marketSelectedId = "unic.wenshushu";
  S.manualUrl = "";
  if (!S.installed["unic.wenshushu"]) {
    startOnlineInstall("unic.wenshushu");
  } else {
    showToast("该仓库对应的插件已安装");
  }
}

function moveOrder(i, delta) {
  const j = i + delta;
  if (j < 0 || j >= S.order.length) return;
  [S.order[i], S.order[j]] = [S.order[j], S.order[i]];
  S.needsRestart = true;
  render();
}

                      : `<button class="btn" onclick="toggleInstalled('${sel.id}')">停用</button>`}
                    ${sel.hasSettings ? `<button class="btn" onclick="openConfig('${sel.id}')">${SVG.gear}<span>选项</span></button>` : ""}
                    <button class="btn danger" onclick="S.overlay='uninstall';S.overlayId='${sel.id}';render()">卸载</button>
                  `}
                </div>
              `}

              <div class="row-gap" style="flex-wrap:wrap">
                ${(sel.highlights || []).map(h => `<span class="badge">${esc(h)}</span>`).join("")}
              </div>

              <div class="md-section">
                <h4>简介</h4>
                <div class="md-text">${esc(sel.description)}</div>
              </div>

              <div class="md-section">
                <h4>如何使用</h4>
                <div class="howto-box">
                  ${(sel.howTo || []).map((s, idx) => `
                    <div class="howto-step"><span class="howto-num">${idx + 1}</span><span>${esc(s)}</span></div>
                  `).join("")}
                </div>
              </div>

              ${sel.menuAction ? `
                <div class="md-section">
                  <h4>右键菜单效果</h4>
                  <div class="menu-demo">
                    <div class="md-mi">${SVG.copy}<span>复制</span></div>
                    <div class="md-mi">${SVG.sync}<span>发送到其他设备…</span></div>
                    <div class="md-msep"></div>
                    <div class="md-mi hl">${SVG.bolt}<span>${esc(sel.menuAction)}</span></div>
                  </div>
                </div>
              ` : ""}

              <div class="notice info">
                ${SVG.shield}
                <div class="notice-body">
                  <div class="notice-title">隐私与安全</div>
                  <div class="notice-sub">${esc(sel.privacy)}</div>
                </div>
              </div>

              <details class="tech-fold">
                <summary><span>查看来源与技术信息</span>${SVG.chevDown}</summary>
                <div class="tech-kv">
                  <div class="kv-row"><span class="kv-k">插件标识</span><span class="kv-v mono">${esc(sel.id)}</span></div>
                  <div class="kv-row"><span class="kv-k">运行方式</span><span class="kv-v">${esc(sel.runtime)}</span></div>
                  <div class="kv-row"><span class="kv-k">更新日期</span><span class="kv-v">${esc(sel.updatedAt)}</span></div>
                  <div class="kv-row"><span class="kv-k">开源主页</span><span class="kv-v mono">${esc(sel.repo)}</span></div>
                </div>
              </details>
            </aside>
          ` : ""}
        </div>
      </div>
    </div>
  `;
}

// ================= Render: Secondary Modals =================
function renderOtherOverlays() {
  if (S.overlay === "info") {
    const it = catById(S.overlayId);
    const st = S.installed[S.overlayId];
    if (!it || !st) return "";
    return `
      <div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
        <div class="sheet">
          <div class="sheet-head">
            <span class="sheet-title">
              <span class="icon-tile sm ${it.tone}">${SVG[it.icon]}</span>
              <span>${esc(it.name)}</span>
              ${it.official ? `<span class="badge official">${SVG.verified}官方</span>` : ""}
            </span>
            <button class="btn subtle icon-only" onclick="S.overlay=null;render()">${SVG.close}</button>
          </div>
          <div class="sheet-body">
            <div class="md-text">${esc(it.description)}</div>
            <div class="md-section">
              <h4>如何使用</h4>
              <div class="howto-box">
                ${(it.howTo || []).map((s, idx) => `<div class="howto-step"><span class="howto-num">${idx + 1}</span><span>${esc(s)}</span></div>`).join("")}
              </div>
            </div>
            ${it.zeroConfig ? `
              <div class="notice info">
                ${SVG.info}
                <div class="notice-body">
                  <div class="notice-title">此插件无需任何配置</div>
                  <div class="notice-sub">${esc(it.privacy)}</div>
                </div>
              </div>
            ` : ""}
            <details class="tech-fold">
              <summary><span>版本与来源信息</span>${SVG.chevDown}</summary>
              <div class="tech-kv">
                <div class="kv-row"><span class="kv-k">当前版本</span><span class="kv-v mono">v${esc(st.installedVersion)}</span></div>
                <div class="kv-row"><span class="kv-k">插件标识</span><span class="kv-v mono">${esc(it.id)}</span></div>
                <div class="kv-row"><span class="kv-k">开源主页</span><span class="kv-v mono">${esc(it.repo)}</span></div>
              </div>
            </details>
          </div>
          <div class="sheet-foot">
            <button class="btn sm danger" onclick="S.overlay='uninstall';S.overlayId='${it.id}';render()">卸载</button>
            <span class="sp"></span>
            ${it.hasSettings ? `<button class="btn sm" onclick="openConfig('${it.id}')">${SVG.gear}<span>打开选项</span></button>` : ""}
            <button class="btn sm pri" onclick="S.overlay=null;render()">完成</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.overlay === "config" && S.draft) {
    const d = S.draft;
    if (d.isBuiltin) {
      const b = builtinById(S.overlayId);
      const sp = d.policy;
      return `
        <div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
          <div class="sheet">
            <div class="sheet-head">
              <span class="sheet-title">${esc(b.name)} · 设置</span>
              <button class="btn subtle icon-only" onclick="S.overlay=null;render()">${SVG.close}</button>
            </div>
            <div class="sheet-body">
              <div class="set-group">
                <div class="set-row">
                  <div class="set-l"><div class="set-label">同步文本</div><div class="set-desc">允许通过此方式收发文本内容。</div></div>
                  <button class="switch ${sp.text ? "on" : ""}" onclick="S.draft.policy.text=!S.draft.policy.text;render()"></button>
                </div>
                <div class="set-row">
                  <div class="set-l"><div class="set-label">同步图片</div><div class="set-desc">允许通过此方式收发图片。</div></div>
                  <button class="switch ${sp.images ? "on" : ""}" onclick="S.draft.policy.images=!S.draft.policy.images;render()"></button>
                </div>
                <div class="set-row">
                  <div class="set-l"><div class="set-label">同步文件与文件夹</div><div class="set-desc">自动同步文件夹仍受「同步」总开关控制。</div></div>
                  <button class="switch ${sp.files ? "on" : ""}" onclick="S.draft.policy.files=!S.draft.policy.files;render()"></button>
                </div>
                <div class="set-row">
                  <div class="set-l">
                    <div class="set-label">自动同步单文件上限（MB）</div>
                    <div class="set-desc">填 0 表示不额外限制；手动发送不受限制。</div>
                    ${d.err ? `<div class="set-err">${esc(d.err)}</div>` : ""}
                  </div>
                  <div class="set-ctl">
                    <input class="text-input num ${d.err ? "error" : ""}" value="${esc(sp.maxFileMB)}" oninput="S.draft.policy.maxFileMB=this.value;S.draft.err=''">
                  </div>
                </div>
              </div>
            </div>
            <div class="sheet-foot">
              <span class="sec-hint">保存后立即生效</span>
              <span class="sp"></span>
              <button class="btn sm" onclick="S.overlay=null;render()">取消</button>
              <button class="btn sm pri" onclick="saveConfigModal()">保存</button>
            </div>
          </div>
        </div>
      `;
    }

    const it = catById(S.overlayId);
    const st = S.installed[S.overlayId];
    const v = d.values;
    const sf = it.hasSecretField;
    const secretSaved = sf && st.secrets && st.secrets[sf.key];

    return `
      <div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
        <div class="sheet">
          <div class="sheet-head">
            <span class="sheet-title">
              <span class="icon-tile sm ${it.tone}">${SVG[it.icon]}</span>
              <span>${esc(it.name)} · 选项</span>
            </span>
            <button class="btn subtle icon-only" onclick="S.overlay=null;render()">${SVG.close}</button>
          </div>
          <div class="sheet-body">
            ${d.err ? `<div class="notice err">${SVG.warn}<div class="notice-body"><div class="notice-title">${esc(d.err)}</div></div></div>` : ""}

            ${it.id === "unic.smarttags" ? `
              <div class="sec">
                <div class="sec-head"><span class="sec-title">标签规则</span></div>
                <div class="set-group">
                  <div class="set-row">
                    <div class="set-l"><div class="set-label">标签前缀<span class="req">*</span></div><div class="set-desc">添加到自动生成标签前（最多 16 字节）。</div></div>
                    <input class="text-input" value="${esc(v.prefix)}" oninput="S.draft.values.prefix=this.value;S.draft.dirty=true;S.draft.err=''">
                  </div>
                  <div class="set-row">
                    <div class="set-l"><div class="set-label">最大处理长度<span class="req">*</span></div><div class="set-desc">超过此字数的文本将跳过自动标注。</div></div>
                    <div class="stepper">
                      <button class="btn icon-sm" onclick="S.draft.values.maxLength=Math.max(1,Number(S.draft.values.maxLength||500)-100);S.draft.dirty=true;render()">−</button>
                      <input class="text-input num" value="${esc(v.maxLength)}" oninput="S.draft.values.maxLength=this.value;S.draft.dirty=true">
                      <button class="btn icon-sm" onclick="S.draft.values.maxLength=Math.min(10000,Number(S.draft.values.maxLength||500)+100);S.draft.dirty=true;render()">+</button>
                    </div>
                  </div>
                  <div class="set-row">
                    <div class="set-l"><div class="set-label">文本模式</div><div class="set-desc">选择识别内容时的解析方式。</div></div>
                    <select class="select-input" onchange="S.draft.values.mode=this.value;S.draft.dirty=true">
                      <option value="plain" ${v.mode === "plain" ? "selected" : ""}>纯文本</option>
                      <option value="markdown" ${v.mode === "markdown" ? "selected" : ""}>Markdown</option>
                    </select>
                  </div>
                  <div class="set-row">
                    <div class="set-l"><div class="set-label">启用自动标签</div><div class="set-desc">关闭后仅保留手动触发，不自动打标。</div></div>
                    <button class="switch ${v.autoTag ? "on" : ""}" onclick="S.draft.values.autoTag=!S.draft.values.autoTag;S.draft.dirty=true;render()"></button>
                  </div>
                </div>
              </div>
              <div class="sec">
                <div class="sec-head"><span class="sec-title">其他</span></div>
                <div class="set-group">
                  <div class="set-row col">
                    <div class="set-l"><div class="set-label">附加固定标签</div><div class="set-desc">每次命中规则时额外添加的标签。</div></div>
                    <div class="row-gap" style="flex-wrap:wrap">
                      ${(v.extraTags || []).map((t, i) => `
                        <span class="pill info">#${esc(t)} <button style="border:0;background:transparent;padding:0;margin-left:2px;color:inherit" onclick="S.draft.values.extraTags.splice(${i},1);S.draft.dirty=true;render()">×</button></span>
                      `).join("")}
                      <input class="text-input" style="width:120px;height:26px" placeholder="输入后回车…" value="${esc(d.extraTagInput)}" oninput="S.draft.extraTagInput=this.value" onkeydown="if(event.key==='Enter'&&this.value.trim()){S.draft.values.extraTags.push(this.value.trim());S.draft.extraTagInput='';S.draft.dirty=true;render();}">
                    </div>
                  </div>
                </div>
              </div>
            ` : `
              <div class="sec">
                <div class="sec-head"><span class="sec-title">服务器连接</span></div>
                <div class="set-group">
                  <div class="set-row col">
                    <div class="set-l"><div class="set-label">WebDAV 地址<span class="req">*</span></div></div>
                    <input class="text-input wide" value="${esc(v.endpoint)}" oninput="S.draft.values.endpoint=this.value;S.draft.dirty=true;S.draft.err=''">
                  </div>
                  <div class="set-row">
                    <div class="set-l"><div class="set-label">用户名<span class="req">*</span></div></div>
                    <input class="text-input" value="${esc(v.username)}" oninput="S.draft.values.username=this.value;S.draft.dirty=true;S.draft.err=''">
                  </div>
                  <div class="set-row">
                    <div class="set-l"><div class="set-label">同步文本 / 图片</div><div class="set-desc">控制通过此服务器同步的内容类型。</div></div>
                    <button class="switch ${v.syncImages ? "on" : ""}" onclick="S.draft.values.syncImages=!S.draft.values.syncImages;S.draft.dirty=true;render()"></button>
                  </div>
                </div>
              </div>
            `}

            ${sf ? `
              <div class="sec">
                <div class="sec-head"><span class="sec-title">凭据</span></div>
                <div class="set-group">
                  <div class="set-row ${d.secretOp === "replace" ? "col" : ""}">
                    <div class="set-l">
                      <div class="set-label">${esc(sf.label)}${sf.required ? `<span class="req">*</span>` : ""}</div>
                      <div class="set-desc">${esc(sf.desc)}</div>
                    </div>
                    ${d.secretOp === "replace" ? `
                      <div class="row-gap" style="width:100%">
                        <input id="secret-in" type="password" class="text-input wide" placeholder="输入新的密钥…" value="${esc(d.secretVal)}" oninput="S.draft.secretVal=this.value;S.draft.dirty=true">
                        <button class="btn sm" onclick="S.draft.secretOp='keep';S.draft.secretVal='';render()">取消</button>
                      </div>
                    ` : d.secretOp === "clear" ? `
                      <div class="set-ctl"><span class="pill warn">保存后清除</span><button class="btn xs" onclick="S.draft.secretOp='keep';render()">撤销</button></div>
                    ` : secretSaved ? `
                      <div class="set-ctl">
                        <span class="pill pos"><i class="dot"></i>已加密保存</span>
                        <button class="btn xs" onclick="S.draft.secretOp='replace';render();setTimeout(()=>document.getElementById('secret-in')?.focus(),0)">修改</button>
                        ${!sf.required ? `<button class="btn xs subtle" onclick="S.draft.secretOp='clear';S.draft.dirty=true;render()">清除</button>` : ""}
                      </div>
                    ` : `
                      <div class="set-ctl">
                        <span class="unset-pill">未设置</span>
                        <button class="btn xs" onclick="S.draft.secretOp='replace';render();setTimeout(()=>document.getElementById('secret-in')?.focus(),0)">设置</button>
                      </div>
                    `}
                  </div>
                </div>
              </div>
            ` : ""}
          </div>
          <div class="sheet-foot">
            <button class="btn xs" onclick="S.draft.values=clone(catById('${it.id}').defaultConfig);S.draft.dirty=true;S.draft.err='';render()">恢复默认</button>
            <span class="sp"></span>
            <button class="btn sm" onclick="S.overlay=null;render()">取消</button>
            <button class="btn sm pri" onclick="saveConfigModal()">保存</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.overlay === "advanced") {
    const activeOrder = S.order.filter(id => builtinById(id) || S.installed[id]);
    return `
      <div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
        <div class="sheet">
          <div class="sheet-head">
            <span class="sheet-title">执行顺序与高级设置</span>
            <button class="btn subtle icon-only" onclick="S.overlay=null;render()">${SVG.close}</button>
          </div>
          <div class="sheet-body">
            <div class="notice info">
              ${SVG.info}
              <div class="notice-body"><div class="notice-sub">大多数情况下无需调整。顺序仅影响同一阶段多个插件的先后；同步始终在本地保存之后进行。</div></div>
            </div>
            <div class="sec">
              <div class="sec-head"><span class="sec-title">处理先后顺序</span></div>
              <div class="set-group">
                ${activeOrder.map((id, idx) => {
                  const p = builtinById(id) || catById(id);
                  if (!p) return "";
                  const realIdx = S.order.indexOf(id);
                  return `
                    <div class="order-row">
                      <span class="order-idx">${idx + 1}</span>
                      <div class="icon-tile sm ${p.tone}">${SVG[p.icon]}</div>
                      <span style="flex:1;font-weight:500">${esc(p.name)}</span>
                      <button class="btn icon-sm subtle" ${idx === 0 ? "disabled" : ""} onclick="moveOrder(${realIdx},-1)">${SVG.up}</button>
                      <button class="btn icon-sm subtle" ${idx === activeOrder.length - 1 ? "disabled" : ""} onclick="moveOrder(${realIdx},1)">${SVG.down}</button>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
            <div class="sec">
              <div class="sec-head"><span class="sec-title">异常处理</span></div>
              <div class="set-group">
                <div class="set-row">
                  <div class="set-l">
                    <div class="set-label">当插件运行出错时</div>
                    <div class="set-desc">选择是否允许该条剪贴板继续同步到其他设备。</div>
                  </div>
                  <select class="select-input" onchange="S.globalOnError=this.value;S.needsRestart=true;render()">
                    <option value="continue" ${S.globalOnError === "continue" ? "selected" : ""}>跳过出错插件并继续</option>
                    <option value="block_sync" ${S.globalOnError === "block_sync" ? "selected" : ""}>仅保留本机，暂不同步</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="sheet-foot">
            <span class="sp"></span>
            <button class="btn sm pri" onclick="S.overlay=null;render()">完成</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.overlay === "manual") {
    return `
      <div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
        <div class="sheet sm">
          <div class="sheet-head">
            <span class="sheet-title">从链接手动安装（开发者）</span>
            <button class="btn subtle icon-only" onclick="S.overlay=null;render()">${SVG.close}</button>
          </div>
          <div class="sheet-body">
            <div class="notice warn">
              ${SVG.warn}
              <div class="notice-body"><div class="notice-sub">推荐优先使用插件市场。手动安装仅用于测试未上架插件，请确认来源可信。</div></div>
            </div>
            <div class="sec">
              <label style="font-size:12px;font-weight:600;color:var(--text-secondary)">公开仓库链接</label>
              <input class="text-input wide" placeholder="https://github.com/owner/unic-plugin-slug" value="${esc(S.manualUrl)}" oninput="S.manualUrl=this.value">
            </div>
            <label class="row-gap" style="font-size:12px;color:var(--text-secondary);cursor:pointer">
              <input type="checkbox" ${S.manualBuild ? "checked" : ""} onchange="S.manualBuild=this.checked">
              <span>无预编译版本时尝试本机源码构建</span>
            </label>
          </div>
          <div class="sheet-foot">
            <button class="btn sm" onclick="S.overlay='market';render()">返回市场</button>
            <span class="sp"></span>
            <button class="btn sm pri" onclick="submitManualInstall()">安装</button>
          </div>
        </div>
      </div>
    `;
  }

  if (S.overlay === "uninstall") {
    const it = catById(S.overlayId);
    if (!it) return "";
    return `
      <div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
        <div class="sheet sm">
          <div class="sheet-head">
            <span class="sheet-title">卸载「${esc(it.name)}」？</span>
            <button class="btn subtle icon-only" onclick="S.overlay=null;render()">${SVG.close}</button>
          </div>
          <div class="sheet-body">
            <div class="md-text" style="color:var(--text-secondary)">卸载后将移除该插件程序。你已保存的剪贴板历史不会被删除，随时可以在插件市场重新安装。</div>
          </div>
          <div class="sheet-foot">
            <span class="sp"></span>
            <button class="btn sm" onclick="S.overlay=null;render()">取消</button>
            <button class="btn sm danger-solid" onclick="confirmUninstall('${it.id}')">卸载</button>
          </div>
        </div>
      </div>
    `;
  }

  return "";
}

// ================= Main Render =================
function render() {
  renderProtoBar();
  const app = document.getElementById("app");
  app.className = "app-window" + (S.width === "compact" ? " compact" : S.width === "narrow" ? " narrow" : "");
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main-shell">
      ${renderToolbar()}
      ${renderMainPage()}
    </div>
    ${S.overlay === "market" ? renderMarketplaceModal() : renderOtherOverlays()}
    ${S.toast ? `<div class="toast-wrap"><div class="toast">${esc(S.toast)}</div></div>` : ""}
  `;
}

window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (S.overlay) { S.overlay = null; render(); }
    else if (S.topMenuOpen) { S.topMenuOpen = false; render(); }
  }
});

applyPreset("market");
</script>
</body>
</html>
