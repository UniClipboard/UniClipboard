<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>unic · Android 首次安装与 v1 迁移引导原型</title>
<!--
  Interactive Android mobile prototype for first-install setup and v1 migration.
  Follows the live Android presentation language in app/expo/src/ (Material 3 Expressive,
  colors.android.ts baseline + Material You dynamic seeds, 20dp/4dp segmented grouped lists
  with 2dp gaps, 40dp SettingsLeadingIcon circles, 16dp tonal filled TextField without
  indicator line, 56dp M3 pill buttons, FloatingNavigationBar + FAB).
  Open directly in a browser.
-->
<style>
  /* ---------- 外部工作台变量 ---------- */
  :root{
    --stage-bg:#eceaf2; --bar-bg:rgba(254,247,255,.88); --bar-border:#ddd6e6;
    --bar-text:#1d1b20; --bar-muted:#5f5a67; --bar-faint:#8e8896;
    --bar-surface:#f3edf7; --bar-accent:#6750a4; --bar-on-accent:#ffffff;
    --spec-bg:#ffffff; --spec-shadow:0 18px 44px -14px rgba(29,27,32,.18),0 0 0 .5px rgba(0,0,0,.08);

    /* ---------- Android M3 Expressive Baseline Light (colors.android.ts) ---------- */
    --m3-primary:#6750a4;
    --m3-on-primary:#ffffff;
    --m3-primary-container:#eaddff;
    --m3-on-primary-container:#21005d;
    --m3-bg:#fef7ff;
    --m3-surface:#fef7ff;
    --m3-surface-lowest:#ffffff;
    --m3-surface-low:#f7f2fa;
    --m3-surface-mid:#f3edf7;
    --m3-surface-high:#ece6f0;
    --m3-surface-highest:#e6e0e9;
    --m3-on-surface:#1d1b20;
    --m3-on-surface-variant:#49454f;
    --m3-outline:#79747e;
    --m3-outline-variant:#cac4d0;
    --m3-disabled:#cac4d0;
    --m3-ripple:rgba(29,27,32,.10);
    --m3-scrim:rgba(0,0,0,.36);

    /* M3 语义状态色 (FIXED_LIGHT) */
    --m3-error:#b3261e;
    --m3-on-error:#ffffff;
    --m3-error-container:#f9dedc;
    --m3-on-error-container:#410e0b;
    --m3-warning:#8b5000;
    --m3-on-warning:#ffffff;
    --m3-warning-container:#ffdcbe;
    --m3-on-warning-container:#2c1600;
    --m3-success:#146c2e;
    --m3-on-success:#ffffff;
    --m3-success-container:#c4efc6;
    --m3-on-success-container:#002107;
    --m3-info:#0b57d0;
    --m3-on-info:#ffffff;
    --m3-info-container:#d3e3fd;
    --m3-on-info-container:#041e49;
  }

  /* Material You 动态取色预设 (浅色) */
  [data-seed=ocean]{
    --bar-accent:#1c5fa8;
    --m3-primary:#1c5fa8; --m3-on-primary:#ffffff;
    --m3-primary-container:#d4e3ff; --m3-on-primary-container:#001c3a;
    --m3-bg:#f8f9ff; --m3-surface:#f8f9ff;
    --m3-surface-low:#f2f4fa; --m3-surface-mid:#eceef5;
    --m3-surface-high:#e6e8ef; --m3-surface-highest:#e0e3ea;
    --m3-on-surface:#191c20; --m3-on-surface-variant:#43474e;
    --m3-outline:#74777f; --m3-outline-variant:#c3c6cf;
  }
  [data-seed=sage]{
    --bar-accent:#35693e;
    --m3-primary:#35693e; --m3-on-primary:#ffffff;
    --m3-primary-container:#b7f1ba; --m3-on-primary-container:#002109;
    --m3-bg:#f7fbf2; --m3-surface:#f7fbf2;
    --m3-surface-low:#f1f5ec; --m3-surface-mid:#ebefe6;
    --m3-surface-high:#e5eae1; --m3-surface-highest:#e0e4db;
    --m3-on-surface:#181d17; --m3-on-surface-variant:#424940;
    --m3-outline:#72796f; --m3-outline-variant:#c2c9bd;
  }

  /* ---------- Android M3 Expressive Baseline Dark (colors.android.ts) ---------- */
  [data-theme=dark]{
    --stage-bg:#0d0c10; --bar-bg:rgba(24,22,29,.90); --bar-border:#2d2a34;
    --bar-text:#e6e0e9; --bar-muted:#a9a2b2; --bar-faint:#756f7e;
    --bar-surface:#211f26; --bar-accent:#d0bcff; --bar-on-accent:#381e72;
    --spec-bg:#1b1920; --spec-shadow:0 20px 50px -12px rgba(0,0,0,.68),0 0 0 .5px rgba(255,255,255,.08);

    --m3-primary:#d0bcff;
    --m3-on-primary:#381e72;
    --m3-primary-container:#4f378b;
    --m3-on-primary-container:#eaddff;
    --m3-bg:#141218;
    --m3-surface:#141218;
    --m3-surface-lowest:#0f0d13;
    --m3-surface-low:#1d1b20;
    --m3-surface-mid:#211f26;
    --m3-surface-high:#2b2930;
    --m3-surface-highest:#36343b;
    --m3-on-surface:#e6e0e9;
    --m3-on-surface-variant:#cac4d0;
    --m3-outline:#938f99;
    --m3-outline-variant:#49454f;
    --m3-disabled:#49454f;
    --m3-ripple:rgba(230,224,233,.12);
    --m3-scrim:rgba(0,0,0,.58);

    /* M3 语义状态色 (FIXED_DARK) */
    --m3-error:#f2b8b5;
    --m3-on-error:#601410;
    --m3-error-container:#8c1d18;
    --m3-on-error-container:#f9dedc;
    --m3-warning:#ffb870;
    --m3-on-warning:#4a2800;
    --m3-warning-container:#693c00;
    --m3-on-warning-container:#ffdcbe;
    --m3-success:#88d98e;
    --m3-on-success:#00390f;
    --m3-success-container:#00531d;
    --m3-on-success-container:#c4efc6;
    --m3-info:#a8c7fa;
    --m3-on-info:#062e6f;
    --m3-info-container:#0842a0;
    --m3-on-info-container:#d3e3fd;
  }
  [data-theme=dark][data-seed=ocean]{
    --bar-accent:#a5c8ff; --bar-on-accent:#00315f;
    --m3-primary:#a5c8ff; --m3-on-primary:#00315f;
    --m3-primary-container:#004786; --m3-on-primary-container:#d4e3ff;
    --m3-bg:#111318; --m3-surface:#111318;
    --m3-surface-low:#191c20; --m3-surface-mid:#1d2024;
    --m3-surface-high:#282a2f; --m3-surface-highest:#33353a;
    --m3-on-surface:#e2e2e9; --m3-on-surface-variant:#c3c6cf;
    --m3-outline:#8d9199; --m3-outline-variant:#43474e;
  }
  [data-theme=dark][data-seed=sage]{
    --bar-accent:#9cd49f; --bar-on-accent:#003914;
    --m3-primary:#9cd49f; --m3-on-primary:#003914;
    --m3-primary-container:#1c5128; --m3-on-primary-container:#b7f1ba;
    --m3-bg:#101510; --m3-surface:#101510;
    --m3-surface-low:#181d17; --m3-surface-mid:#1c211b;
    --m3-surface-high:#262b25; --m3-surface-highest:#313630;
    --m3-on-surface:#e0e4db; --m3-on-surface-variant:#c2c9bd;
    --m3-outline:#8c9388; --m3-outline-variant:#424940;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--stage-bg);color:var(--bar-text);
    font:13px/1.5 "Roboto","Noto Sans SC","PingFang SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;transition:background .2s;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  svg{display:block}
  a{color:inherit;text-decoration:none}

  /* ---------- 顶部控制条 ---------- */
  .toolbar{
    position:sticky;top:0;z-index:30;display:flex;flex-direction:column;gap:8px;
    padding:10px 24px;background:var(--bar-bg);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--bar-border);
  }
  .toolbar .line{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .toolbar b{font-size:14px}
  .platform-badge{
    display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;
    background:var(--bar-accent);color:var(--bar-on-accent);font-size:11px;font-weight:600;
  }
  .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .lbl{color:var(--bar-muted);font-size:12px;margin-right:4px}
  .chip{
    border:1px solid var(--bar-border);background:var(--spec-bg);color:var(--bar-text);
    padding:3px 10px;border-radius:999px;font-size:11.5px;transition:all .15s;
  }
  .chip:hover{background:var(--bar-surface)}
  .chip.on{background:var(--bar-accent);border-color:var(--bar-accent);color:var(--bar-on-accent);font-weight:500}
  .sel{
    border:1px solid var(--bar-border);background:var(--spec-bg);color:var(--bar-text);
    border-radius:8px;padding:3px 7px;font:inherit;font-size:12px;
  }
  .stage{
    display:flex;gap:36px;justify-content:center;align-items:flex-start;
    padding:28px 24px 64px;flex-wrap:wrap;
  }

  /* ---------- Pixel 9 外框 (400 × 840 dp 呈现) ---------- */
  .bezel{
    width:424px;padding:12px;border-radius:46px;flex:none;
    background:linear-gradient(155deg,#2e2e32 0%,#151518 55%,#252529 100%);
    box-shadow:0 32px 72px -18px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.12) inset;
  }
  .phone{
    width:400px;height:836px;border-radius:35px;overflow:hidden;position:relative;
    background:var(--m3-bg);color:var(--m3-on-surface);
    display:flex;flex-direction:column;
    font-family:"Roboto","Noto Sans SC","PingFang SC",system-ui,sans-serif;
    transition:background .2s,color .2s;
  }

  /* Android 状态栏 + 居中挖孔 */
  .and-status{
    height:40px;padding:8px 22px 0;display:flex;align-items:center;justify-content:space-between;
    flex:none;position:relative;z-index:5;user-select:none;font-size:13px;font-weight:500;
  }
  .punch{
    position:absolute;left:50%;top:12px;transform:translateX(-50%);
    width:18px;height:18px;border-radius:50%;background:#09090b;
    box-shadow:inset 0 0 0 2px #1c1d22;
  }
  .and-indicators{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600}
  .and-indicators svg{height:12px;width:auto}

  /* M3 Top App Bar */
  .m3-topbar{
    min-height:56px;padding:4px 8px 4px 12px;display:flex;align-items:center;gap:4px;
    flex:none;z-index:4;
  }
  .m3-icon-btn{
    width:48px;height:48px;border-radius:24px;border:0;background:transparent;
    color:var(--m3-on-surface);display:grid;place-items:center;flex:none;
    transition:background .15s;
  }
  .m3-icon-btn:hover:not(:disabled){background:var(--m3-ripple)}
  .m3-icon-btn:disabled{opacity:.38;cursor:default}
  .m3-icon-btn svg{width:24px;height:24px}
  .m3-topbar-title{
    font-size:22px;line-height:28px;font-weight:400;color:var(--m3-on-surface);
    flex:1;min-width:0;padding-left:4px;
  }

  /* 页面容器与底部操作区 */
  .and-screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  .m3-scroll{
    flex:1;overflow-y:auto;padding:4px 16px 20px;scrollbar-width:none;
  }
  .m3-scroll::-webkit-scrollbar{display:none}
  .m3-footer{
    flex:none;padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;
    background:linear-gradient(to top,var(--m3-bg) 82%,transparent);
  }
  .gesture-bar{
    height:22px;flex:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .gesture-bar i{
    width:108px;height:4px;border-radius:999px;background:var(--m3-on-surface);opacity:.38;display:block;
  }

  /* ---------- M3 Expressive 按钮 (AppButton.android.tsx: 56dp Pill) ---------- */
  .m3-btn{
    width:100%;min-height:56px;border-radius:999px;border:0;padding:0 24px;
    font-size:16px;line-height:22px;font-weight:500;letter-spacing:.1px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:filter .15s,background .15s,transform .1s;
  }
  .m3-btn:active:not(:disabled){transform:scale(.985)}
  .m3-btn:disabled{
    background:color-mix(in srgb,var(--m3-on-surface) 12%,transparent);
    color:color-mix(in srgb,var(--m3-on-surface) 38%,transparent);
    border-color:transparent;cursor:default;
  }
  .m3-btn.filled{background:var(--m3-primary);color:var(--m3-on-primary)}
  .m3-btn.filled:hover:not(:disabled){filter:brightness(1.06)}
  .m3-btn.tonal{background:var(--m3-primary-container);color:var(--m3-on-primary-container)}
  .m3-btn.outlined{
    background:transparent;color:var(--m3-primary);
    border:1px solid var(--m3-outline);
  }
  .m3-btn.text{
    background:transparent;color:var(--m3-primary);
    min-height:48px;font-size:14px;font-weight:500;
  }
  .m3-btn.text:hover:not(:disabled){background:var(--m3-ripple)}
  .m3-btn svg{width:18px;height:18px;flex:none}
  .m3-foot-hint{
    font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--m3-on-surface-variant);
    text-align:center;padding:0 8px 2px;
  }

  /* M3 CircularProgressIndicator */
  .m3-spin{
    width:18px;height:18px;border:2.5px solid color-mix(in srgb,currentColor 22%,transparent);
    border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite;flex:none;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- Stage 1: 欢迎页 ---------- */
  .m3-welcome{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px 28px 24px;text-align:center;
  }
  /* M3 Expressive Squircle / Soft-Rounded Emblem */
  .m3-emblem{
    width:92px;height:92px;border-radius:28px;
    background:#000;overflow:hidden;border:1px solid rgba(0,0,0,.10);
    display:grid;place-items:center;
  }
  [data-theme=dark] .m3-emblem{border-color:rgba(255,255,255,.16)}
  .m3-emblem svg{width:100%;height:100%}
  .m3-welcome h1{
    margin:28px 0 8px;font-size:28px;line-height:36px;font-weight:700;
    color:var(--m3-on-surface);
  }
  .m3-welcome .slogan{
    margin:0;font-size:16px;line-height:24px;letter-spacing:.25px;
    color:var(--m3-on-surface-variant);
  }
  .m3-detect-chip{
    margin-top:28px;min-height:40px;padding:8px 16px;border-radius:16px;
    background:var(--m3-surface-mid);color:var(--m3-on-surface-variant);
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-size:13px;line-height:18px;max-width:100%;
  }
  .m3-detect-chip.found{background:var(--m3-success-container);color:var(--m3-on-success-container)}
  .m3-detect-chip.err{
    background:var(--m3-error-container);color:var(--m3-on-error-container);
    flex-direction:column;padding:12px 16px;gap:8px;width:100%;
  }
  .m3-detect-chip svg{width:17px;height:17px;flex:none}
  .m3-chip-acts{display:flex;gap:8px}
  .m3-mini-btn{
    border:0;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:500;
    background:color-mix(in srgb,currentColor 12%,transparent);color:inherit;
  }

  /* ---------- M3 Expressive 页面标题与分段列表 (SettingsSectionItem.tsx) ---------- */
  .m3-page-head{padding:2px 4px 16px}
  .m3-page-head h2{margin:0;font-size:26px;line-height:34px;font-weight:700;color:var(--m3-on-surface)}
  .m3-page-head p{margin:6px 0 0;font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--m3-on-surface-variant)}

  .m3-sec-title{
    font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;
    color:var(--m3-primary);padding:0 4px;margin:18px 0 8px;
  }
  .m3-sec-title:first-child{margin-top:2px}
  .m3-sec-foot{
    font-size:12px;line-height:16px;letter-spacing:.4px;
    color:var(--m3-on-surface-variant);padding:8px 16px 0;
  }

  /* M3 Expressive Segmented List: 20dp outer, 4dp inner, 2dp gap, surfaceContainer */
  .m3-seg-list{display:flex;flex-direction:column;gap:2px}
  .m3-seg-row{
    display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px;
    width:100%;border:0;text-align:left;
    background:var(--m3-surface-mid);color:var(--m3-on-surface);
    border-radius:4px;transition:background .12s;
  }
  .m3-seg-row:first-child{border-top-left-radius:20px;border-top-right-radius:20px}
  .m3-seg-row:last-child{border-bottom-left-radius:20px;border-bottom-right-radius:20px}
  .m3-seg-row.tap:hover{background:var(--m3-surface-high)}
  .m3-seg-row.warn{
    background:var(--m3-warning-container);color:var(--m3-on-warning-container);
  }
  .m3-seg-row.err{
    background:var(--m3-error-container);color:var(--m3-on-error-container);
  }
  .m3-seg-row.info{
    background:var(--m3-info-container);color:var(--m3-on-info-container);
  }
  .m3-seg-row.warn .m3-row-sub,.m3-seg-row.err .m3-row-sub,.m3-seg-row.info .m3-row-sub{
    color:inherit;opacity:.88;
  }

  /* 40dp 圆形前导图标 (SettingsLeadingIcon.tsx) */
  .m3-avatar{
    width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none;
    background:var(--m3-primary-container);color:var(--m3-on-primary-container);
  }
  .m3-avatar.muted{background:var(--m3-surface-highest);color:var(--m3-on-surface-variant)}
  .m3-avatar.err{background:var(--m3-error-container);color:var(--m3-error)}
  .m3-avatar.ok{background:var(--m3-success-container);color:var(--m3-success)}
  .m3-avatar.warn{background:transparent;color:var(--m3-on-warning-container);width:28px;height:28px}
  .m3-avatar svg{width:22px;height:22px}

  .m3-row-body{flex:1;min-width:0}
  .m3-row-title{font-size:16px;line-height:22px;font-weight:400}
  .m3-row-title b{font-weight:600}
  .m3-row-sub{
    font-size:13px;line-height:18px;letter-spacing:.2px;
    color:var(--m3-on-surface-variant);margin-top:2px;
  }
  .m3-row-sub.mono{
    font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:11.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .m3-trailing-act{
    font-size:14px;font-weight:500;color:var(--m3-primary);
    display:inline-flex;align-items:center;gap:2px;flex:none;
  }
  .m3-trailing-act svg{width:18px;height:18px;color:var(--m3-on-surface-variant)}

  /* 迁移范围双栏卡片 (M3 Surface Container) */
  .m3-scope-pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .m3-scope-card{
    background:var(--m3-surface-mid);padding:14px;
    border-radius:6px;
  }
  .m3-scope-card:first-child{border-radius:20px 6px 6px 20px}
  .m3-scope-card:last-child{border-radius:6px 20px 20px 6px}
  .m3-scope-card h4{
    margin:0 0 8px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;
    color:var(--m3-on-surface-variant);
  }
  .m3-scope-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .m3-scope-card li{display:flex;align-items:center;gap:6px;font-size:13.5px;line-height:18px}
  .m3-scope-card li svg{width:15px;height:15px;flex:none}
  .m3-scope-card.yes li svg{color:var(--m3-success)}
  .m3-scope-card.no li{color:var(--m3-on-surface-variant)}
  .m3-scope-card.no li svg{color:var(--m3-outline)}

  /* ---------- M3 Expressive 步骤分段卡片 ---------- */
  .m3-step-card{
    background:var(--m3-surface-mid);padding:14px 16px;border-radius:4px;
    transition:background .15s;
  }
  .m3-step-card:first-child{border-top-left-radius:20px;border-top-right-radius:20px}
  .m3-step-card:last-child{border-bottom-left-radius:20px;border-bottom-right-radius:20px}
  .m3-step-card.active{background:var(--m3-surface-high)}
  .m3-step-head{display:flex;align-items:center;gap:12px}
  .m3-step-num{
    width:32px;height:32px;border-radius:16px;display:grid;place-items:center;flex:none;
    font-size:14px;font-weight:600;
  }
  .m3-step-num.done{background:var(--m3-success-container);color:var(--m3-success)}
  .m3-step-num.done svg{width:16px;height:16px}
  .m3-step-num.active{background:var(--m3-primary);color:var(--m3-on-primary)}
  .m3-step-num.pending{background:var(--m3-surface-highest);color:var(--m3-on-surface-variant)}
  .m3-step-meta{flex:1;min-width:0}
  .m3-step-title{font-size:15.5px;line-height:22px;font-weight:500}
  .m3-step-card.pending .m3-step-title{color:var(--m3-on-surface-variant);font-weight:400}
  .m3-step-pill{
    font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;
    font-variant-numeric:tabular-nums;flex:none;
  }
  .m3-step-pill.ok{background:var(--m3-success-container);color:var(--m3-on-success-container)}
  .m3-step-pill.active{background:var(--m3-primary-container);color:var(--m3-on-primary-container)}
  .m3-step-pill.warn{background:var(--m3-warning-container);color:var(--m3-on-warning-container)}
  .m3-step-pill.muted{color:var(--m3-on-surface-variant)}
  .m3-step-body{margin-left:44px;margin-top:6px}
  .m3-step-sub{font-size:13px;line-height:18px;color:var(--m3-on-surface-variant)}

  /* M3 Expressive LinearProgressIndicator (8dp 厚圆头轨道 + 末端停点) */
  .m3-linear-wrap{margin-top:14px}
  .m3-linear-track{
    height:8px;border-radius:999px;background:var(--m3-surface-highest);
    position:relative;overflow:hidden;
  }
  .m3-linear-track::after{
    content:"";position:absolute;right:2px;top:2px;width:4px;height:4px;border-radius:50%;
    background:var(--m3-primary);opacity:.55;
  }
  .m3-linear-fill{
    height:100%;border-radius:999px;background:var(--m3-primary);
    transition:width .18s linear;
  }
  .m3-linear-fill.verify{background:var(--m3-success)}
  .m3-linear-fill.stop{background:var(--m3-outline)}
  .m3-linear-meta{
    display:flex;justify-content:space-between;align-items:center;margin-top:8px;
    font-size:12.5px;color:var(--m3-on-surface-variant);font-variant-numeric:tabular-nums;
  }
  .m3-linear-meta b{color:var(--m3-on-surface);font-weight:600}

  /* M3 Tonal Filled TextField (严格复刻 AppTextField.android.tsx: 16dp 圆角, 无底线) */
  .m3-field-wrap{margin-top:12px}
  .m3-field{
    display:flex;align-items:center;min-height:56px;padding:6px 6px 6px 16px;
    background:var(--m3-surface-lowest);border-radius:16px;
    border:1.5px solid transparent;transition:border-color .15s;
  }
  [data-theme=dark] .m3-field{background:var(--m3-surface-mid)}
  .m3-field:focus-within{border-color:var(--m3-primary)}
  .m3-field.bad{border-color:var(--m3-error)}
  .m3-field-inner{flex:1;min-width:0;display:flex;flex-direction:column}
  .m3-field-label{
    font-size:12px;line-height:16px;font-weight:500;color:var(--m3-primary);
  }
  .m3-field.bad .m3-field-label{color:var(--m3-error)}
  .m3-field input{
    border:0;background:transparent;outline:none;color:var(--m3-on-surface);
    font-size:16px;line-height:22px;padding:2px 0 0;width:100%;
  }
  .m3-field input::placeholder{color:var(--m3-on-surface-variant);opacity:.65}
  .m3-field-err{
    margin-top:6px;padding-left:12px;font-size:12px;line-height:16px;
    color:var(--m3-error);display:flex;align-items:center;gap:5px;
  }
  .m3-field-err svg{width:14px;height:14px;flex:none}

  /* ---------- Stage 3: 结果页 ---------- */
  .m3-result{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:20px 4px 8px;
  }
  .m3-badge-ring{
    width:76px;height:76px;border-radius:26px;display:grid;place-items:center;flex:none;
  }
  .m3-badge-ring svg{width:36px;height:36px}
  .m3-badge-ring.ok{background:var(--m3-success-container);color:var(--m3-success)}
  .m3-badge-ring.warn{background:var(--m3-warning-container);color:var(--m3-warning)}
  .m3-badge-ring.stop{background:var(--m3-surface-highest);color:var(--m3-on-surface-variant)}
  .m3-badge-ring.err{background:var(--m3-error-container);color:var(--m3-error)}
  .m3-result h2{margin:18px 0 6px;font-size:24px;line-height:32px;font-weight:500}
  .m3-result .lead{
    margin:0;font-size:14px;line-height:20px;letter-spacing:.25px;
    color:var(--m3-on-surface-variant);max-width:320px;
  }
  .m3-stat-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;margin-top:22px;
  }
  .m3-stat{
    background:var(--m3-surface-mid);border-radius:16px;padding:16px 14px;text-align:left;
  }
  .m3-stat b{
    display:block;font-size:24px;line-height:30px;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--m3-on-surface);
  }
  .m3-stat span{display:block;margin-top:4px;font-size:12px;color:var(--m3-on-surface-variant)}
  .m3-stat.ok{background:var(--m3-success-container)}
  .m3-stat.ok b,.m3-stat.ok span{color:var(--m3-on-success-container)}
  .m3-stat.warn{background:var(--m3-warning-container)}
  .m3-stat.warn b,.m3-stat.warn span{color:var(--m3-on-warning-container)}
  .m3-stat.bad{background:var(--m3-error-container)}
  .m3-stat.bad b,.m3-stat.bad span{color:var(--m3-on-error-container)}

  /* ---------- Android 历史页预览 (M3 Expressive Segmented Rows + FloatingNavigationBar + FAB) ---------- */
  .m3-hist-top{
    padding:6px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  }
  .m3-hist-top h2{margin:0;font-size:26px;line-height:34px;font-weight:700}
  .m3-search-pill{
    margin:0 16px 12px;height:48px;border-radius:999px;background:var(--m3-surface-high);
    display:flex;align-items:center;gap:12px;padding:0 16px;
    color:var(--m3-on-surface-variant);font-size:15px;
  }
  .m3-search-pill svg{width:20px;height:20px}
  .m3-hist-row{
    display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:74px;
    background:var(--m3-surface-low);border-radius:4px;
  }
  .m3-hist-row:first-child{border-top-left-radius:20px;border-top-right-radius:20px}
  .m3-hist-row:last-child{border-bottom-left-radius:20px;border-bottom-right-radius:20px}
  .m3-kind-box{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
    background:var(--m3-primary-container);color:var(--m3-on-primary-container);
  }
  .m3-kind-box svg{width:20px;height:20px}
  .m3-hist-text{flex:1;min-width:0}
  .m3-hist-primary{
    font-size:15px;line-height:21px;color:var(--m3-on-surface);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .m3-hist-meta{
    font-size:12px;line-height:16px;color:var(--m3-on-surface-variant);margin-top:2px;
    display:flex;align-items:center;gap:6px;
  }
  .m3-v1-tag{
    font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;
    background:var(--m3-primary-container);color:var(--m3-on-primary-container);
  }

  /* M3 Expressive FloatingNavigationBar + FAB (复刻 FloatingNavigationBar.tsx) */
  .m3-floating-bar{
    position:absolute;left:16px;right:16px;bottom:28px;
    display:flex;align-items:center;justify-content:space-between;z-index:4;
  }
  .m3-nav-pill{
    height:64px;padding:8px;border-radius:32px;background:var(--m3-surface-high);
    display:flex;align-items:center;gap:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.16);
  }
  .m3-nav-item{
    height:48px;min-width:48px;border-radius:24px;display:inline-flex;align-items:center;
    justify-content:center;gap:8px;color:var(--m3-on-surface-variant);
    font-size:14px;font-weight:500;
  }
  .m3-nav-item.on{
    padding:0 20px 0 16px;background:var(--m3-primary-container);
    color:var(--m3-on-primary-container);
  }
  .m3-nav-item svg{width:22px;height:22px}
  .m3-fab{
    width:56px;height:56px;border-radius:16px;border:0;
    background:var(--m3-primary);color:var(--m3-on-primary);
    display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.22);
  }
  .m3-fab svg{width:24px;height:24px}

  .m3-empty-hist{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:36px 28px 100px;color:var(--m3-on-surface-variant);
  }
  .m3-empty-hist .ic{
    width:64px;height:64px;border-radius:20px;background:var(--m3-surface-mid);
    display:grid;place-items:center;margin-bottom:14px;color:var(--m3-primary);
  }
  .m3-empty-hist h3{margin:0 0 6px;font-size:18px;font-weight:500;color:var(--m3-on-surface)}
  .m3-empty-hist p{margin:0;font-size:14px;line-height:20px}

  /* ---------- Android 系统弹层 (BiometricPrompt / SAF BottomSheet / M3 AlertDialog) ---------- */
  .m3-scrim{
    position:absolute;inset:0;background:var(--m3-scrim);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:fadeIn .15s ease;
  }
  .m3-scrim.bottom{align-items:flex-end;padding:0}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes sheetIn{from{transform:translateY(28px);opacity:.65}to{transform:none;opacity:1}}

  /* M3 AlertDialog (28dp 圆角) */
  .m3-dialog{
    width:100%;max-width:320px;border-radius:28px;background:var(--m3-surface-high);
    padding:24px;box-shadow:0 16px 36px rgba(0,0,0,.32);
  }
  .m3-dialog h3{margin:0 0 12px;font-size:22px;line-height:28px;font-weight:400;color:var(--m3-on-surface)}
  .m3-dialog p{margin:0;font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--m3-on-surface-variant)}
  .m3-dialog-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
  .m3-dialog-acts button{
    border:0;background:transparent;padding:10px 14px;border-radius:999px;
    font-size:14px;font-weight:500;color:var(--m3-primary);
  }
  .m3-dialog-acts button:hover{background:var(--m3-ripple)}
  .m3-dialog-acts button.danger{color:var(--m3-error)}

  /* M3 ModalBottomSheet (SAF 选择器 / BiometricPrompt) */
  .m3-sheet{
    width:100%;background:var(--m3-surface-low);border-radius:28px 28px 0 0;
    padding:12px 16px 28px;animation:sheetIn .2s cubic-bezier(.2,.9,.2,1);
    box-shadow:0 -10px 32px rgba(0,0,0,.28);
  }
  .m3-drag-handle{
    width:32px;height:4px;border-radius:999px;background:var(--m3-outline);
    opacity:.45;margin:0 auto 14px;
  }
  .m3-sheet-title{
    font-size:18px;line-height:24px;font-weight:500;padding:0 4px 14px;
    color:var(--m3-on-surface);
  }
  .m3-bio-box{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:8px 12px 6px;gap:10px;
  }
  .m3-bio-ring{
    width:64px;height:64px;border-radius:32px;

    animation:bioPulse 1.2s ease-in-out infinite;
  }
  .m3-bio-ring svg{width:34px;height:34px}
  @keyframes bioPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.74}}

  .demo-reset-bar{
    margin:14px 0 96px;padding:10px 14px;border-radius:16px;
    background:var(--m3-surface-mid);display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12px;color:var(--m3-on-surface-variant);
  }
  .demo-reset-bar button{
    border:0;background:var(--m3-primary-container);color:var(--m3-on-primary-container);
    padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;
  }

  /* ---------- 右侧规格说明面板 ---------- */
  .spec{
    width:370px;flex:none;background:var(--spec-bg);border-radius:20px;
    box-shadow:var(--spec-shadow);padding:20px 22px;font-size:13px;
  }
  .spec-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
  .spec h3{margin:0;font-size:15px;font-weight:600}
  .spec .key{font:11.5px "Roboto Mono",ui-monospace,Menlo,monospace;color:var(--bar-faint)}
  .spec ul{margin:12px 0 0;padding-left:18px;color:var(--bar-muted)}
  .spec li{margin:6px 0}
  .spec li b{color:var(--bar-text);font-weight:600}
  .spec-block{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--bar-border);
    color:var(--bar-muted);font-size:12px;line-height:1.6;
  }
  .spec-block h4{margin:0 0 6px;font-size:12px;color:var(--bar-text);font-weight:600}
  .spec-block code{
    font:11px "Roboto Mono",ui-monospace,Menlo,monospace;
    background:var(--bar-surface);padding:1px 5px;border-radius:4px;color:var(--bar-text);
  }
</style>
</head>

<div class="toolbar">
  <div class="line">

      <button class="chip" data-theme-btn="dark">深色</button>

</div>

<div class="stage">

          <span>5G</span>

      </div>

      <!-- 页面容器 -->
      <div class="and-screen" id="screen"></div>

      <div class="gesture-bar" id="sysBack" title="点击模拟 Android 系统返回手势"><i></i></div>
    </div>
  </div>

  <aside class="spec" id="spec"></aside>
</div>

const TOTAL = 1204;
const SOURCES = [
  { id: 0, ok: true, icon: 'folder', title: '应用内部存储 · 默认位置', path: '/data/user/0/app.uniclipboard/files/v1' },

const S = {
  key: 'w-detecting',
  src: SOURCES[0],
  sheet: false,
  pendingStart: false,
  committed: 0,
  runPrior: 0,
  processed: 0,
  verified: 0,
  passErr: false,
  pass: '',
  showPass: false,
  closing: false,
  closeAsk: false,
  timer: null,
};

const $ = s => document.querySelector(s);
const sim = id => $('#' + id).value;
const fmt = n => n.toLocaleString('zh-CN');

function clearTimer(){ if(S.timer){ clearInterval(S.timer); clearTimeout(S.timer); S.timer = null; } }
function go(key){ clearTimer(); S.key = key; S.sheet = false; render(); enter(key); }

function enter(key){
  if(key === 'w-detecting'){
    S.timer = setTimeout(() => {
      const d = sim('simDetect');
      const next = d === 'found' ? 'w-found' : d === 'none' ? 'w-none' : 'w-error';
      if(S.pendingStart){ S.pendingStart = false; return startFrom(next); }
      go(next);
    }, 1350);
  }
  if(key === 'm-cred-system'){
    S.timer = setTimeout(() => {
      const c = sim('simCred');
      if(c === 'ok') return beginImport();
      S.passErr = false; S.pass = ''; S.showPass = false;
      go(c === 'pass' ? 'm-cred-pass' : 'm-cred-denied');
    }, 1700);
  }
  if(key === 'm-import'){
    const failAt = Math.round(TOTAL * .41);
    S.timer = setInterval(() => {
      S.processed = Math.min(TOTAL, S.processed + 24);
      if(sim('simResult') === 'failed' && S.processed >= failAt){
        S.processed = failAt; S.committed = Math.max(S.committed, failAt); return go('r-failed');
      }
      S.committed = Math.max(S.committed, S.processed);
      if(S.processed >= TOTAL){ S.verified = 0; return go('m-verify'); }
      updateProgress();
    }, 60);
  }
  if(key === 'm-verify'){
    S.timer = setInterval(() => {
      S.verified = Math.min(TOTAL, S.verified + 42);
      if(S.verified >= TOTAL){
        const r = sim('simResult');
        if(r === 'partial') return go('r-partial');
        return go(S.runPrior >= TOTAL ? 'r-complete-retry' : 'r-complete');
      }
      updateProgress();
    }, 60);
  }
  if(key === 'm-stopping'){
    S.timer = setTimeout(() => go(S.closing ? 'closed' : 'r-cancelled'), 1400);
  }
}

function startFrom(k){
  if(k === 'w-found') return go('m-confirm');
  go('history-empty');
}
function startMigration(){
  if(sim('simResult') === 'conflict') return go('m-conflict');
  go('m-cred-system');
}
function beginImport(){
  S.runPrior = S.committed;
  S.processed = S.committed;
  go('m-import');
}

function topBar({ title='', backAct='back-welcome', icon='arrowL', disabled=false }){

    <div class="m3-topbar-title">${title}</div>
  </div>`;
}

function stepCards(cur, activeBody, pills = {}){
  const defs = [
    { idx: 1, title: '解锁旧数据', sub: '通过 Android Keystore 或输入 v1 口令只读解锁' },
    { idx: 2, title: '导入历史记录', sub: '按条提交，中断后保留已写入记录' },
    { idx: 3, title: '重新打开并校验', sub: '逐条验证目标历史库内容摘要' },
  ];
  return `<div class="m3-seg-list">
    ${defs.map((d, i) => {
      const state = i < cur ? 'done' : i === cur ? 'active' : 'pending';
      const p = pills[i] || (state === 'done' ? { text: '已完成', cls: 'ok' } : state === 'pending' ? { text: '待进行', cls: 'muted' } : null);
      return `<div class="m3-step-card ${state}">
        <div class="m3-step-head">
          <div class="m3-step-num ${state}">${state === 'done' ? I.check : d.idx}</div>
          <div class="m3-step-meta"><div class="m3-step-title">${d.title}</div></div>
          ${p ? `<span class="m3-step-pill ${p.cls}" id="${p.id||''}">${p.text}</span>` : ''}
        </div>
        <div class="m3-step-body">
          ${state === 'active' ? activeBody : `<div class="m3-step-sub">${d.sub}</div>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function progressBlock(mode){
  const verify = mode === 'verify' || (mode === 'stop' && S.verified > 0);
  const done = verify ? S.verified : S.processed;
  const pct = Math.round(done / TOTAL * 100);
  const sub = mode === 'stop'
    ? '正在等待当前记录写完并安全释放独占锁，已提交记录会保留。'
    : verify
      ? '重新打开目标历史库，逐条校验内容完整性。'
      : (S.runPrior ? `已跳过此前导入的 ${fmt(S.runPrior)} 条记录，继续写入剩余内容。` : '按条写入历史库；已提交的记录在中断后保留。');
  return `<div class="m3-step-sub">${sub}</div>
    <div class="m3-linear-wrap">
      <div class="m3-linear-track"><div class="m3-linear-fill ${mode==='stop'?'stop':verify?'verify':''}" id="bar" style="width:${pct}%"></div></div>
      <div class="m3-linear-meta">
        <span id="cnt">${verify?'已校验':'已处理'} <b>${fmt(done)}</b> / ${fmt(TOTAL)} 条</span>
        <span id="pct">${pct}%</span>
      </div>
    </div>`;
}

const JUMPS = [
  ['w-detecting','欢迎·检测中'],['w-found','欢迎·发现'],['w-none','欢迎·未发现'],['w-error','欢迎·出错'],
  ['m-confirm','确认'],['m-invalid','无效目录'],['m-cred-system','生物识别/Keystore'],['m-cred-pass','输入口令'],['m-cred-denied','验证被拒'],
  ['m-conflict','后台占用'],['m-import','导入中'],['m-verify','校验中'],['m-stopping','停止中'],
  ['r-complete','完成'],['r-complete-retry','重试无新增'],['r-partial','部分'],['r-cancelled','已停止'],['r-failed','失败'],
  ['history','历史'],['closed','安全退出'],
];

function render(){
  const k = S.key;
  $('#screen').innerHTML = PAGES[k]() + (S.sheet ? safSheet() : '') + (S.closeAsk ? closeDialog() : '');

  const [t, items] = SPEC[k];
  $('#spec').innerHTML = `
    <div class="spec-top"><h3>${t}</h3><span class="key">${k}</span></div>
    <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
    <div class="spec-block">
      <h4>Android 前端设计语言映射（app/expo）</h4>
      色板：<code>colors.android.ts</code> M3 Baseline + Material You 动态色阶<br>
      组件：<code>SettingsSectionItem</code>（20dp/4dp 分段列表）、<code>SettingsLeadingIcon</code>（40dp 圆形图标）、<code>AppTextField.android</code>（16dp 无底线填充框）、<code>AppButton.android</code>（56dp 胶囊按钮）、<code>FloatingNavigationBar</code>（悬浮导航胶囊 + FAB）
    </div>`;

  document.querySelectorAll('#jumps .chip').forEach(c => c.classList.toggle('on', c.dataset.jump === k));
  const pw = $('#pw');
  if(pw){
    pw.focus();
    pw.oninput = e => {
      S.pass = e.target.value;
      const b = $('#unlockBtn'); if(b) b.disabled = !S.pass;
    };
    pw.onkeydown = e => { if(e.key === 'Enter' && S.pass) act('unlock'); };
  }
}

function updateProgress(){
  const verify = S.key === 'm-verify';
  const done = verify ? S.verified : S.processed;
  const pct = Math.round(done / TOTAL * 100);
  const bar = $('#bar'); if(!bar) return;
  bar.style.width = pct + '%';
  $('#cnt').innerHTML = `${verify?'已校验':'已处理'} <b>${fmt(done)}</b> / ${fmt(TOTAL)} 条`;
  $('#pct').textContent = pct + '%';
  const sp = $('#stepPct'); if(sp) sp.textContent = pct + '%';
}

function act(a){
  switch(a){
    case 'begin':
      if(S.key === 'w-detecting'){ S.pendingStart = true; return render(); }
      return startFrom(S.key);
    case 'redetect': return go('w-detecting');
    case 'manual': S.src = SOURCES[1]; return go('m-confirm');
    case 'back-welcome': return go('w-found');
    case 'back-confirm': return go('m-confirm');
    case 'open-sheet': S.sheet = true; return render();
    case 'close-sheet': S.sheet = false; return render();
    case 'skip': return go('history-empty');
    case 'start': return startMigration();
    case 'stop': return go('m-stopping');
    case 'toggle-pw': S.showPass = !S.showPass; return render();
    case 'unlock':
      if(!S.pass) return;
      if(S.pass !== 'v1pass'){ S.passErr = true; S.pass = ''; return render(); }
      S.passErr = false; S.pass = ''; return beginImport();
    case 'retry': return startMigration();
    case 'enter': return go(S.committed ? 'history' : 'history-empty');
    case 'reset':
      S.committed = 0; S.runPrior = 0; S.processed = 0; S.verified = 0;
      S.src = SOURCES[0]; S.closing = false; S.closeAsk = false;
      return go('w-detecting');
    case 'relaunch': S.closing = false; S.processed = S.committed; return go('m-confirm');
    case 'try-close':
      if(['m-import','m-verify','m-cred-system'].includes(S.key)){ S.closeAsk = true; return render(); }
      return go('m-confirm');
    case 'close-cancel': S.closeAsk = false; return render();
    case 'close-confirm': S.closeAsk = false; S.closing = true; return go('m-stopping');
  }
}

document.addEventListener('click', e => {
  const s = e.target.closest('[data-src]');
  if(s){ S.src = SOURCES[+s.dataset.src]; S.sheet = false; return go(S.src.ok ? 'm-confirm' : 'm-invalid'); }
  const b = e.target.closest('[data-act]');
  if(b && !b.disabled) return act(b.dataset.act);
});
$('#sysBack').onclick = () => {
  if(['m-import','m-verify','m-cred-system'].includes(S.key)){ S.closeAsk = true; return render(); }
  if(S.sheet){ S.sheet = false; return render(); }
  if(['m-cred-pass','m-cred-denied','m-conflict'].includes(S.key)) return go('m-confirm');
  if(['m-confirm','m-invalid'].includes(S.key)) return go('w-found');
};
document.querySelectorAll('[data-theme-btn]').forEach(b => b.onclick = () => {
  document.documentElement.dataset.theme = b.dataset.themeBtn;
  document.querySelectorAll('[data-theme-btn]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-seed-btn]').forEach(b => b.onclick = () => {
  const v = b.dataset.seedBtn;
  if(v === 'baseline') delete document.documentElement.dataset.seed;
  else document.documentElement.dataset.seed = v;
  document.querySelectorAll('[data-seed-btn]').forEach(x => x.classList.toggle('on', x === b));
});
$('#restart').onclick = () => act('reset');

const PRESET = {
  'm-import':         () => { S.runPrior = 0; S.processed = 390; S.committed = 390; S.verified = 0; },
  'm-verify':         () => { S.runPrior = 0; S.processed = TOTAL; S.committed = TOTAL; S.verified = 540; },
  'm-stopping':       () => { S.runPrior = 0; S.processed = 312; S.committed = 312; S.verified = 0; S.closing = false; },
  'r-complete':       () => { S.runPrior = 0; S.committed = TOTAL; },
  'r-complete-retry': () => { S.runPrior = TOTAL; S.committed = TOTAL; },
  'r-partial':        () => { S.runPrior = 0; S.committed = TOTAL - 18; },
  'r-cancelled':      () => { S.runPrior = 0; S.committed = 312; },
  'r-failed':         () => { S.runPrior = 0; S.committed = 494; },
  'history':          () => { if(!S.committed) S.committed = TOTAL; },
  'closed':           () => { S.committed = 312; },
  'm-invalid':        () => { S.src = SOURCES[2]; },
  'm-confirm':        () => { S.src = SOURCES[0]; },
  'm-cred-pass':      () => { S.passErr = false; S.pass = ''; },
  'm-cred-denied':    () => { S.passErr = false; S.pass = ''; },
};

const jumps = $('#jumps');
JUMPS.forEach(([k, l]) => {
  const c = document.createElement('button');
  c.className = 'chip'; c.dataset.jump = k; c.textContent = l;
  c.onclick = () => {
    clearTimer(); S.pendingStart = false; S.closeAsk = false; S.sheet = false;
    (PRESET[k] || (() => {}))();
    S.key = k; render();
    if(['w-detecting','m-cred-system','m-import','m-verify','m-stopping'].includes(k)) enter(k);
  };
  jumps.appendChild(c);
});

go('w-detecting');
</script>
</body>
</html>
