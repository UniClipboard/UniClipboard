<title>UniClipboard · 首次安装引导与 v1 迁移重设计原型（BoardUI v2）</title>
<!--
  BoardUI v2 Redesign Prototype for Decision 0026 (First-Install Setup & Offline v1 Migration).
  Open directly in any modern browser — zero external dependencies.

  UX / Architecture Redesign Highlights (aligned with settings.html / devices.html / plugins.html):
    1. Unified BoardUI v2 visual language (3-tier neutral surfaces, hairline borders, #2b7fff/#155dfc accent,
       BoardUI Dialog scale/blur motion, 0.98 button press, authentic macOS top-band traffic lights).
    2. Editorial Split-Hero Cover Page: pairs UniClipboard's official v2 pixel-cat logo (unic-logo.svg) with an interactive
       "Living Clipboard" mini-card showcase embodying "让每一次复制更有用", plus a non-intrusive
       v1 Detection Status Card that prepares users before clicking "开始使用" (zero ambush).
    3. BoardUI SplitView Migration Workspace (220px Left Journey Rail + Right Focused Pane):
       - Eliminates 7 stacked competing boxes by anchoring live 4-stage progress and persistent safety
         guarantees ("只读不删 v1", "离线独占不捕获") in the calm left rail.
       - Right workspace focuses cleanly on one task per stage: source + scope comparison + single amber
         pre-flight reminder, in-place credential/passphrase recovery, transparent 2-phase import/verify
         progress with committed-safety summary, and structured terminal result breakdown.
    4. Supports both recommended 760×540 SplitView and responsive 640×560 compact mode, First-Install vs
       Settings › Storage later-migration entry, realistic "starting runtime" transition, and smooth
       single-window expansion into BoardUI v2 History.
-->
<style>
:root {
  /* BoardUI v2 Light Surface Hierarchy (aligned with prototype/settings.html & desktopkit) */
  --bg-canvas-outer: #e7e7eb;
  --bg-sidebar: #f6f6f8;
  --bg-nav-active: #ffffff;
  --bg-nav-hover: #ededf0;
  --bg-workspace: #ffffff;
  --bg-canvas: #f5f5f7;
  --bg-card: #ffffff;
  --bg-card-subtle: #f7f7f9;
  --bg-inset: #f2f2f5;
  --bg-sheet: #ffffff;
  --bg-tertiary: #ececef;
  --bg-primary-hover: #f5f5f7;
  --bg-secondary-hover: #ebebee;

  --sep: #ececef;
  --border-sidebar: #e5e5e8;
  --card-border: #e4e4e8;
  --border-btn: #dcdce2;
  --border-hover: #c5c5cd;

  --text-primary: #111114;
  --text-secondary: #686870;
  --text-tertiary: #96969e;

  --accent-50: #f0f6ff;
  --accent-100: #dbeafe;
  --accent-200: #bfd8ff;
  --accent-500: #2b7fff;
  --accent-600: #155dfc;

  /* BoardUI semantic status tokens */
  --ok-bg: #eaf9d0;
  --ok-fg: #2f5700;
  --ok-dot: #5ea500;
  --ok-border: #c5e88e;

  --warn-bg: #fffbeb;
  --warn-pill-bg: #fef3c7;
  --warn-fg: #92400e;
  --warn-border: #fde68a;
  --warn-dot: #d97706;

  --info-bg: #eff6ff;
  --info-fg: #1d4ed8;
  --info-border: #bfdbfe;

  --err-bg: #fff1f2;
  --err-fg: #be123c;
  --err-border: #fecdd3;
  --danger: #d92d20;

  --tag-blue-bg: #e0edff; --tag-blue-fg: #155dfc; --tag-blue-dot: #2b7fff;
  --tag-orange-bg: #ffedd5; --tag-orange-fg: #c2410c; --tag-orange-dot: #f97316;
  --tag-lime-bg: #ecfccb; --tag-lime-fg: #3f6212; --tag-lime-dot: #65a30d;
  --tag-purple-bg: #f3e8ff; --tag-purple-fg: #7e22ce; --tag-purple-dot: #a855f7;
  --tag-gray-bg: #f1f1f4; --tag-gray-fg: #52525b; --tag-gray-dot: #71717a;

  --shadow-window: 0 24px 64px rgba(0, 0, 0, .13), 0 0 0 1px rgba(0, 0, 0, .07);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .035);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .08), 0 1px 3px rgba(0, 0, 0, .05);
  --shadow-popover: 0 12px 32px rgba(0, 0, 0, .12), 0 0 0 1px var(--card-border);
  --shadow-modal: 0 24px 56px rgba(0, 0, 0, .20), 0 0 0 1px rgba(0, 0, 0, .08);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .04);
  --scrim: rgba(0, 0, 0, .30);
}

[data-theme="dark"] {
  --bg-canvas-outer: #09090b;
  --bg-sidebar: #161618;
  --bg-nav-active: rgba(255, 255, 255, .09);
  --bg-nav-hover: rgba(255, 255, 255, .05);
  --bg-workspace: #1d1d20;
  --bg-canvas: #151518;
  --bg-card: #242428;
  --bg-card-subtle: #1f1f23;
  --bg-inset: #19191c;
  --bg-sheet: #232328;
  --bg-tertiary: #2d2d33;
  --bg-primary-hover: #2c2c32;
  --bg-secondary-hover: rgba(255, 255, 255, .08);

  --sep: rgba(255, 255, 255, .075);
  --border-sidebar: rgba(255, 255, 255, .08);
  --card-border: rgba(255, 255, 255, .095);
  --border-btn: rgba(255, 255, 255, .14);
  --border-hover: rgba(255, 255, 255, .24);

  --text-primary: #f4f4f6;
  --text-secondary: #9c9ca6;
  --text-tertiary: #6e6e78;

  --accent-50: rgba(43, 127, 255, .14);
  --accent-100: rgba(43, 127, 255, .22);
  --accent-200: rgba(77, 160, 255, .36);
  --accent-500: #4da0ff;
  --accent-600: #3b8eff;

  --ok-bg: rgba(94, 165, 0, .20);
  --ok-fg: #a3e635;
  --ok-dot: #84cc16;
  --ok-border: rgba(132, 204, 22, .32);

  --warn-bg: rgba(217, 119, 6, .13);
  --warn-pill-bg: rgba(245, 158, 11, .20);
  --warn-fg: #fbbf24;
  --warn-border: rgba(245, 158, 11, .30);
  --warn-dot: #f59e0b;

  --info-bg: rgba(43, 127, 255, .14);
  --info-fg: #7cb8ff;
  --info-border: rgba(77, 160, 255, .30);

  --err-bg: rgba(244, 63, 94, .15);
  --err-fg: #fda4af;
  --err-border: rgba(244, 63, 94, .30);
  --danger: #f87171;

  --tag-blue-bg: rgba(43, 127, 255, .20); --tag-blue-fg: #7cb8ff; --tag-blue-dot: #4da0ff;
  --tag-orange-bg: rgba(249, 115, 22, .20); --tag-orange-fg: #fdba74; --tag-orange-dot: #fb923c;
  --tag-lime-bg: rgba(132, 204, 22, .20); --tag-lime-fg: #bef264; --tag-lime-dot: #a3e635;
  --tag-purple-bg: rgba(168, 85, 247, .22); --tag-purple-fg: #d8b4fe; --tag-purple-dot: #c084fc;
  --tag-gray-bg: rgba(255, 255, 255, .09); --tag-gray-fg: #a1a1aa; --tag-gray-dot: #a1a1aa;

  --shadow-window: 0 28px 72px rgba(0, 0, 0, .62), 0 0 0 1px rgba(255, 255, 255, .09);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .24);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, .42), 0 0 0 1px rgba(255, 255, 255, .07);
  --shadow-popover: 0 14px 36px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .12);
  --shadow-modal: 0 24px 60px rgba(0, 0, 0, .66), 0 0 0 1px rgba(255, 255, 255, .12);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .25);
  --scrim: rgba(0, 0, 0, .54);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-canvas-outer);
  color: var(--text-primary);
  font: 13px/1.48 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background .18s ease, color .18s ease;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; flex: none; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

/* ---------------- Top Review Toolbar (matching settings.html) ---------------- */
.proto-bar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg-workspace) 90%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-sidebar);
  padding: 9px 20px;
  display: flex; flex-direction: column; gap: 7px;
}
.proto-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.proto-title { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 7px; margin-right: 4px; }
.proto-badge {
  font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  background: var(--accent-50); color: var(--accent-600); border: 1px solid var(--accent-200);
}
.proto-grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.proto-lbl { font-size: 11.5px; color: var(--text-secondary); margin-right: 3px; }
.chip {
  border: 1px solid var(--border-btn);
  background: var(--bg-card);
  color: var(--text-primary);
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  transition: background .12s, border-color .12s, color .12s;
}
.chip:hover { border-color: var(--border-hover); background: var(--bg-card-subtle); }
.chip.on { background: var(--accent-500); border-color: var(--accent-500); color: #fff; font-weight: 500; }
.sel {
  border: 1px solid var(--border-btn);
  background: var(--bg-card);
  color: var(--text-primary);
  border-radius: 7px;
  padding: 3px 8px;
  font-size: 11.5px;
}

/* ---------------- Stage & Window ---------------- */
.stage {
  display: flex; gap: 26px; justify-content: center; align-items: flex-start;
  padding: 28px 24px 60px; flex-wrap: wrap;
}
.win-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.win-caption {
  font-size: 11.5px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 8px;
}
.win-caption code {
  font-size: 11px; padding: 1px 6px; border-radius: 5px;
  background: var(--bg-card); border: 1px solid var(--card-border);
}

.app-window {
  width: 780px; height: 540px;
  max-width: calc(100vw - 40px);
  background: var(--bg-workspace);
  border-radius: 14px;
  box-shadow: var(--shadow-window);
  display: flex; flex-direction: column;
  overflow: hidden; position: relative; flex: none;
  transition: width .34s cubic-bezier(.32, .72, 0, 1), height .34s cubic-bezier(.32, .72, 0, 1), background .18s ease;
}
.app-window.compact-size { width: 640px; height: 560px; }
.app-window.expanded { width: 960px; height: 610px; }

/* Floating macOS traffic lights (unified BoardUI top band, no separate title row) */
.lights-float {
  position: absolute; top: 15px; left: 16px; z-index: 12;
  display: flex; gap: 7px; align-items: center;
}
.lights-float i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights-float i:nth-child(1) { background: #ff5f57; cursor: pointer; }
.lights-float i:nth-child(1):hover { filter: brightness(.92); }
.lights-float i:nth-child(2) { background: #febc2e; }
.lights-float i:nth-child(3) { background: #28c840; }

/* ---------------- BoardUI Controls ---------------- */
.btn {
  height: 32px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--border-btn);
  background: var(--bg-card); color: var(--text-primary);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
  box-shadow: var(--shadow-xs);
  transition: transform .08s ease, background .12s, border-color .12s, opacity .12s;
}
.btn:hover:not(:disabled) { background: var(--bg-primary-hover); border-color: var(--border-hover); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn.lg { height: 38px; padding: 0 22px; font-size: 13.5px; font-weight: 600; border-radius: 9px; }
.btn.pri {
  background: var(--accent-500); border-color: var(--accent-500); color: #fff; box-shadow: none;
}
.btn.pri:hover:not(:disabled) { background: var(--accent-600); border-color: var(--accent-600); }
.btn.subtle { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-secondary); }
.btn.subtle:hover:not(:disabled) { background: var(--bg-secondary-hover); color: var(--text-primary); }
.btn.link {
  background: transparent; border-color: transparent; box-shadow: none;
  color: var(--accent-600); padding: 0 2px; height: auto; font-size: inherit; font-weight: 500;
}
.btn.link:hover:not(:disabled) { text-decoration: underline; background: transparent; }

.pill {
  height: 22px; padding: 0 8px; border-radius: 11px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 500; white-space: nowrap; flex: none;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pill.pos { background: var(--ok-bg); color: var(--ok-fg); }
.pill.pos .dot { background: var(--ok-dot); }
.pill.warn { background: var(--warn-pill-bg); color: var(--warn-fg); }
.pill.warn .dot { background: var(--warn-dot); }
.pill.info { background: var(--info-bg); color: var(--info-fg); }
.pill.info .dot { background: var(--accent-500); }
.pill.err { background: var(--err-bg); color: var(--err-fg); }
.pill.err .dot { background: var(--danger); }
.pill.neu { background: var(--bg-tertiary); color: var(--text-secondary); }
.pill.neu .dot { background: var(--text-tertiary); }

.spin {
  width: 13px; height: 13px; border-radius: 50%; flex: none;
  border: 2px solid color-mix(in srgb, currentColor 24%, transparent);
  border-top-color: currentColor;
  animation: sp .72s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------------- PAGE 1: WELCOME (Interactive BoardUI Product Stage) ---------------- */
.welcome-split {
  flex: 1; display: grid; grid-template-columns: 392px 1fr; min-height: 0;
}
.app-window.compact-size .welcome-split {
  grid-template-columns: 1fr; grid-template-rows: 266px 1fr;
}

/* Left living product showcase canvas */
.welcome-visual {
  background: linear-gradient(155deg, var(--bg-sidebar) 0%, var(--bg-canvas) 100%);
  border-right: 1px solid var(--border-sidebar);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 46px 24px 18px;
}
[data-theme="dark"] .welcome-visual {
  background: linear-gradient(155deg, #17181e 0%, #111216 100%);
}
.app-window.compact-size .welcome-visual {
  border-right: 0; border-bottom: 1px solid var(--border-sidebar);
  padding: 36px 24px 12px;
}
.welcome-visual::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent-500) 13%, transparent), transparent 64%),
    radial-gradient(color-mix(in srgb, var(--border-hover) 55%, transparent) 1px, transparent 1px);
  background-size: 100% 100%, 22px 22px;
}

.stage-brand-bar {
  position: absolute; top: 11px; right: 16px; z-index: 3;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px 3px 4px; border-radius: 999px;
  background: color-mix(in srgb, var(--bg-card) 82%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
}
.stage-brand-bar .s-ic {
  width: 18px; height: 18px; border-radius: 5px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12);
}

.scene-viewport {
  position: relative; z-index: 2;
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  min-height: 0;
}
.scene-card-anim {
  display: flex; flex-direction: column; gap: 10px;
  animation: sceneIn .28s cubic-bezier(.32, .72, 0, 1);
}
@keyframes sceneIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Scene 0: Omnibar + Stacked Semantic Pipeline Card */
.omni-mock {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 9px;
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 9px;
  box-shadow: var(--shadow-card);
  font-size: 11px; color: var(--text-tertiary);
}
.app-window.compact-size .omni-mock { display: none; }
.tok {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 6px; border-radius: 5px;
  font-size: 10.5px; font-weight: 500; white-space: nowrap;
}
.tok.purple { background: var(--tag-purple-bg); color: var(--tag-purple-fg); }
.tok.blue   { background: var(--tag-blue-bg); color: var(--tag-blue-fg); }
.tok.gray   { background: var(--tag-gray-bg); color: var(--tag-gray-fg); }
.kbd-cap {
  margin-left: auto; font-size: 10px; font-weight: 600;
  padding: 1px 5px; border-radius: 4px;
  background: var(--bg-inset); border: 1px solid var(--card-border);
  color: var(--text-secondary);
}

.pipe-stack { position: relative; padding-bottom: 14px; }
.app-window.compact-size .pipe-stack { padding-bottom: 0; }
.pipe-back {
  position: absolute; left: 12px; right: 12px; bottom: 0;
  height: 44px; border-radius: 11px;
  background: color-mix(in srgb, var(--bg-card) 86%, var(--bg-canvas));
  border: 1px solid var(--card-border);
  padding: 0 12px;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding-bottom: 6px;
  font-size: 10.5px; color: var(--text-tertiary);
  opacity: .88;
}
.app-window.compact-size .pipe-back { display: none; }

.pipe-front {
  position: relative; z-index: 2;
  background: var(--bg-card);
  border: 1px solid var(--accent-200);
  border-radius: 12px;
  padding: 12px 13px;
  box-shadow: var(--shadow-float);
  display: flex; flex-direction: column; gap: 9px;
}
.app-window.compact-size .pipe-front { padding: 10px 12px; gap: 7px; }
.pf-head { display: flex; align-items: center; gap: 7px; }
.src-app-dot {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  display: grid; place-items: center;
  background: var(--accent-50); color: var(--accent-600);
}
.pf-meta { flex: 1; min-width: 0; }
.pf-src { font-size: 11.5px; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
.pf-tm  { font-size: 10px; color: var(--text-tertiary); }

.code-swatch-box {
  background: var(--bg-card-subtle);
  border: 1px solid var(--sep);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.code-line { font-size: 11.2px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-kw { color: var(--tag-purple-fg); font-weight: 600; }
.code-str { color: var(--accent-600); }
.color-chip {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  padding: 3px 7px 3px 4px; border-radius: 6px;
  background: var(--bg-card); border: 1px solid var(--card-border);
  font-size: 10.5px; font-weight: 600; color: var(--text-primary);
}
.color-swatch {
  width: 12px; height: 12px; border-radius: 3px;
  background: #2b7fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
}

.pf-tags { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.mini-tag {
  font-size: 10.5px; font-weight: 500; padding: 2px 7px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 4px;
}
.mini-tag i { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.mini-tag.purple { background: var(--tag-purple-bg); color: var(--tag-purple-fg); }
.mini-tag.purple i { background: var(--tag-purple-dot); }
.mini-tag.blue   { background: var(--tag-blue-bg); color: var(--tag-blue-fg); }
.mini-tag.blue i   { background: var(--tag-blue-dot); }
.mini-tag.lime   { background: var(--tag-lime-bg); color: var(--tag-lime-fg); }
.mini-tag.lime i   { background: var(--tag-lime-dot); }
.mini-tag.orange { background: var(--tag-orange-bg); color: var(--tag-orange-fg); }
.mini-tag.orange i { background: var(--tag-orange-dot); }
.mini-tag.gray   { background: var(--tag-gray-bg); color: var(--tag-gray-fg); }
.mini-tag.gray i   { background: var(--tag-gray-dot); }

/* Scene 1: Actions & Plugin Ecosystem */
.act-entry {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 11px;
  padding: 10px 12px;
  box-shadow: var(--shadow-card);
  display: flex; align-items: center; gap: 9px;
}
.act-entry-ic {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: var(--tag-orange-bg); color: var(--tag-orange-fg);
  display: grid; place-items: center;
}
.act-menu {
  background: var(--bg-sheet);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 6px;
  box-shadow: var(--shadow-float);
  display: flex; flex-direction: column; gap: 2px;
}
.act-menu-h {
  font-size: 10px; font-weight: 600; color: var(--text-tertiary);
  padding: 3px 8px 4px; letter-spacing: .02em;
  display: flex; justify-content: space-between;
}
.app-window.compact-size .act-menu-h { display: none; }
.act-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 8px;
  font-size: 11.8px; color: var(--text-primary);
}
.app-window.compact-size .act-row { padding: 5px 8px; }
.app-window.compact-size .act-row.hide-compact { display: none; }
.act-row.active {
  background: var(--accent-50);
  border: 1px solid var(--accent-200);
}
.act-row .ar-ic {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  display: grid; place-items: center;
  background: var(--bg-inset); color: var(--text-secondary);
}
.act-row.active .ar-ic { background: var(--accent-500); color: #fff; }
.act-row .ar-main { flex: 1; min-width: 0; }
.act-row .ar-name { font-weight: 600; font-size: 11.5px; line-height: 1.25; }
.act-row .ar-id   { font-size: 10px; color: var(--text-tertiary); }

/* Scene 2: Tailcat P2P Multi-Device Sync */
.sync-hub {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: var(--shadow-float);
  display: flex; align-items: center; gap: 10px;
}
.sync-hub .hub-av { width: 32px; height: 32px; border-radius: 9px; overflow: hidden; flex: none; }
.sync-bridge {
  position: relative; height: 42px;
  display: flex; align-items: center; justify-content: center;
}
.app-window.compact-size .sync-bridge { height: 28px; }
.sync-bridge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sync-pill {
  position: relative; z-index: 2;
  padding: 3px 9px; border-radius: 999px;
  background: var(--bg-card);
  border: 1px solid var(--accent-200);
  color: var(--accent-600);
  font-size: 10.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px;
  box-shadow: var(--shadow-card);
}
.sync-pulse-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent-500);
  animation: syncBlink 1.6s ease-in-out infinite;
}
@keyframes syncBlink { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }

.peer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.peer-card {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 9px 10px;
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: 4px;
}
.app-window.compact-size .peer-card { padding: 7px 9px; gap: 2px; }
.peer-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.peer-name { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
.peer-dot  { width: 6px; height: 6px; border-radius: 50%; background: var(--ok-dot); flex: none; }
.peer-sub  { font-size: 10.5px; color: var(--text-tertiary); display: flex; align-items: center; justify-content: space-between; }

/* Bottom Segmented Switcher inside Left Stage */
.stage-controls {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  margin-top: 10px;
}
.app-window.compact-size .stage-controls { margin-top: 8px; gap: 0; }
.scene-seg {
  display: inline-flex; padding: 3px; border-radius: 9px;
  background: color-mix(in srgb, var(--bg-tertiary) 80%, transparent);
  border: 1px solid var(--sep);
  gap: 2px;
}
.scene-seg button {
  position: relative; border: 0; background: transparent;
  padding: 4px 10px; border-radius: 6px;
  font-size: 11.2px; font-weight: 500; color: var(--text-secondary);
  transition: background .15s, color .15s;
  overflow: hidden;
}
.scene-seg button:hover { color: var(--text-primary); }
.scene-seg button.on {
  background: var(--bg-card); color: var(--text-primary); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .07);
}
.scene-seg button.on::after {
  content: ""; position: absolute; left: 6px; right: 6px; bottom: 1px; height: 2px;
  border-radius: 2px; background: var(--accent-500);
  transform-origin: left;
  animation: segProg 5.2s linear infinite;
}
.welcome-visual.paused .scene-seg button.on::after { animation: none; opacity: .55; }
@keyframes segProg { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.scene-caption {
  font-size: 11.2px; color: var(--text-secondary);
  text-align: center; line-height: 1.4; min-height: 16px;
}
.app-window.compact-size .scene-caption { display: none; }

/* Right action column on Welcome */
.welcome-action {
  padding: 44px 38px 32px;
  display: flex; flex-direction: column; justify-content: center;
  position: relative;
}
.app-window.compact-size .welcome-action {
  padding: 16px 40px 20px; align-items: center; text-align: center;
}
.welcome-brand-row {
  display: inline-flex; align-items: center; gap: 11px;
  margin-bottom: 14px;
}
.welcome-logo {
  width: 44px; height: 44px; border-radius: 11px; overflow: hidden; flex: none;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .14), 0 0 0 1px rgba(0, 0, 0, .08);
}
[data-theme="dark"] .welcome-logo {
  box-shadow: 0 8px 22px rgba(0, 0, 0, .48), 0 0 0 1px rgba(255, 255, 255, .18);
}
.app-window.compact-size .welcome-brand-row { margin-bottom: 8px; }
.app-window.compact-size .welcome-logo { width: 34px; height: 34px; border-radius: 9px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; color: var(--text-tertiary);
  letter-spacing: .01em;
}
.welcome-action h1 {
  margin: 0 0 6px; font-size: 24px; font-weight: 700;
  letter-spacing: -.022em; line-height: 1.25;
}
.welcome-action .slogan {
  margin: 0 0 24px; font-size: 14.5px; color: var(--text-secondary);
}
.app-window.compact-size .welcome-action .slogan { margin-bottom: 14px; }

.detect-card {
  width: 100%; border-radius: 10px;
  padding: 11px 13px; margin-bottom: 20px;
  border: 1px solid var(--card-border);
  background: var(--bg-card-subtle);
  display: flex; align-items: flex-start; gap: 10px;
  text-align: left;
  transition: background .15s, border-color .15s;
}
.app-window.compact-size .detect-card { max-width: 440px; margin-bottom: 16px; padding: 9px 12px; }
.detect-card.found { background: var(--bg-card-subtle); border-color: var(--ok-border); }
.detect-card.err   { background: var(--err-bg); border-color: var(--err-border); }
.detect-card .dc-ic {
  width: 28px; height: 28px; border-radius: 7px; flex: none;
  display: grid; place-items: center;
  background: var(--bg-card); border: 1px solid var(--card-border);
  color: var(--text-secondary);
}
.detect-card.found .dc-ic { background: var(--ok-bg); border-color: transparent; color: var(--ok-fg); }
.detect-card.err .dc-ic   { background: var(--bg-card); border-color: var(--err-border); color: var(--err-fg); }
.detect-card .dc-body { flex: 1; min-width: 0; }
.detect-card .dc-ttl { font-size: 12.5px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.detect-card.err .dc-ttl { color: var(--err-fg); }
.detect-card .dc-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; line-height: 1.45; }
.detect-card .dc-acts { display: flex; gap: 10px; margin-top: 6px; align-items: center; }

.welcome-cta-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.app-window.compact-size .welcome-cta-row { justify-content: center; }

/* ---------------- PAGE 2 & 3: BOARDUI SPLITVIEW MIGRATION ---------------- */
.mig-split {
  flex: 1; display: flex; min-height: 0;
}
.app-window.compact-size .mig-split { flex-direction: column; }

/* Left Journey Sidebar (matching settings.html sidebar) */
.j-rail {
  width: 224px; flex: none;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-sidebar);
  padding: 46px 14px 14px;
  display: flex; flex-direction: column;
  user-select: none;
}
.app-window.compact-size .j-rail {
  width: 100%; border-right: 0; border-bottom: 1px solid var(--border-sidebar);
  padding: 42px 20px 10px; flex-direction: row; align-items: center; gap: 14px;
}

.j-head {
  display: flex; align-items: center; gap: 9px;
  padding: 2px 4px 14px;
  border-bottom: 1px solid var(--sep);
  margin-bottom: 12px;
}
.app-window.compact-size .j-head { display: none; }
.j-head .j-app {
  width: 28px; height: 28px; border-radius: 7px; overflow: hidden; flex: none;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .08);
}
[data-theme="dark"] .j-head .j-app,
[data-theme="dark"] .sync-hub .hub-av {
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .18);
}
.j-head .j-t { font-size: 13px; font-weight: 700; line-height: 1.25; }
.j-head .j-s { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

.j-steps {
  display: flex; flex-direction: column; gap: 3px; flex: 1;
}
.app-window.compact-size .j-steps {
  flex-direction: row; gap: 6px; align-items: center; justify-content: space-between;
}
.j-step {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 8px 9px; border-radius: 9px;
  transition: background .12s;
}
.app-window.compact-size .j-step { padding: 4px 6px; align-items: center; gap: 6px; }
.j-step.cur {
  background: var(--bg-nav-active);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 0 0 1px var(--card-border);
}
.j-num {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
  background: var(--bg-tertiary); color: var(--text-tertiary);
  margin-top: 1px;
}
.app-window.compact-size .j-num { margin-top: 0; width: 18px; height: 18px; font-size: 10.5px; }
.j-step.cur .j-num  { background: var(--accent-500); color: #fff; }
.j-step.done .j-num { background: var(--ok-bg); color: var(--ok-fg); }
.j-step.warn .j-num { background: var(--warn-pill-bg); color: var(--warn-fg); }
.j-step.err .j-num  { background: var(--err-bg); color: var(--err-fg); }

.j-info { flex: 1; min-width: 0; }
.j-name { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); line-height: 1.3; }
.app-window.compact-size .j-name { font-size: 11.5px; white-space: nowrap; }
.j-step.cur .j-name  { color: var(--text-primary); font-weight: 600; }
.j-step.done .j-name { color: var(--text-primary); }
.j-meta {
  font-size: 11px; color: var(--text-tertiary); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.app-window.compact-size .j-meta { display: none; }

/* Persistent trust footer in left rail */
.j-trust {
  border-top: 1px solid var(--sep);
  padding-top: 11px; margin-top: 10px;
  display: flex; flex-direction: column; gap: 7px;
}
.app-window.compact-size .j-trust { display: none; }
.j-trust-row {
  display: flex; align-items: flex-start; gap: 7px;
  font-size: 11px; color: var(--text-tertiary); line-height: 1.4;
}
.j-trust-row svg { width: 13px; height: 13px; margin-top: 1px; color: var(--text-tertiary); }

/* Right Focused Workspace */
.m-pane {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--bg-workspace);
}
.m-head {
  padding: 20px 28px 14px; flex: none;
  border-bottom: 1px solid var(--sep);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.app-window.compact-size .m-head { padding: 14px 22px 12px; }
.m-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.015em; }
.m-head p  { margin: 3px 0 0; font-size: 12.2px; color: var(--text-secondary); }

.m-scroll {
  flex: 1; overflow-y: auto; padding: 18px 28px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.app-window.compact-size .m-scroll { padding: 14px 22px 16px; gap: 12px; }
.m-scroll::-webkit-scrollbar { width: 7px; }
.m-scroll::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }

.m-foot {
  flex: none; padding: 12px 24px;
  border-top: 1px solid var(--sep);
  background: color-mix(in srgb, var(--bg-sidebar) 42%, var(--bg-workspace));
  display: flex; align-items: center; gap: 8px;
}
.m-foot .sp { flex: 1; }
.m-foot .hint { font-size: 11.5px; color: var(--text-tertiary); }
.compact-only { display: none; }
.app-window.compact-size .compact-only { display: inline; }

/* ---------------- BoardUI Grouped Cards & Form Elements ---------------- */
.b-card {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  box-shadow: var(--shadow-card);
  overflow: visible;
}
.b-card.bad { border-color: var(--err-border); }

.src-row {
  padding: 11px 14px;
  display: flex; align-items: center; gap: 11px;
  position: relative;
}
.src-ic {
  width: 34px; height: 34px; border-radius: 8px; flex: none;
  background: var(--bg-inset); color: var(--text-secondary);
  display: grid; place-items: center;
}
.b-card.bad .src-ic { background: var(--err-bg); color: var(--err-fg); }
.src-main { flex: 1; min-width: 0; }
.src-top { display: flex; align-items: center; gap: 7px; }
.src-lbl { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.src-path {
  font-size: 11.5px; color: var(--text-secondary); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.src-err-strip {
  padding: 8px 14px;
  border-top: 1px solid var(--err-border);
  background: var(--err-bg); color: var(--err-fg);
  border-radius: 0 0 11px 11px;
  font-size: 12px; display: flex; align-items: center; gap: 7px;
}

/* Directory Popover (BoardUI Popover) */
.popover {
  position: absolute; right: 12px; top: 50px; z-index: 25;
  min-width: 312px; padding: 5px;
  background: var(--bg-sheet);
  border-radius: 10px; box-shadow: var(--shadow-popover);
}
.popover-h {
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  padding: 5px 9px 4px;
}
.popover button {
  width: 100%; border: 0; background: transparent;
  padding: 7px 9px; border-radius: 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  text-align: left; font-size: 12px;
}
.popover button:hover { background: var(--bg-inset); }
.popover .p-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.popover .p-tag {
  font-size: 10.5px; padding: 1px 6px; border-radius: 4px; flex: none;
  background: var(--bg-tertiary); color: var(--text-secondary);
}

/* Unified 2-Column Scope Card */
.scope-card {
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.scope-col { padding: 13px 15px; display: flex; flex-direction: column; gap: 9px; }
.scope-col.excluded {
  background: var(--bg-card-subtle);
  border-left: 1px solid var(--sep);
}
.scope-h {
  font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: space-between;
}
.scope-list {
  margin: 0; padding: 0; list-style: none;
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px;
}
.scope-list li {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.2px; color: var(--text-primary);
}
.scope-col.excluded .scope-list li { color: var(--text-secondary); }
.scope-note {
  margin-top: auto; padding-top: 7px;
  border-top: 1px solid var(--sep);
  font-size: 11.2px; color: var(--text-tertiary);
  display: flex; align-items: center; gap: 6px;
}

/* Soft Semantic Banners (BoardUI InlineNotice) */
.notice {
  border-radius: 10px; padding: 10px 13px;
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 12px; line-height: 1.48;
  border: 1px solid var(--card-border);
  background: var(--bg-card-subtle);
  color: var(--text-secondary);
}
.notice svg { width: 15px; height: 15px; margin-top: 1px; }
.notice b { color: var(--text-primary); font-weight: 600; }
.notice.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-fg); }
.notice.warn b { color: var(--warn-fg); }
.notice.err  { background: var(--err-bg); border-color: var(--err-border); color: var(--err-fg); }
.notice.err b { color: var(--err-fg); }
.notice.info { background: var(--info-bg); border-color: var(--info-border); color: var(--info-fg); }
.notice.info b { color: var(--info-fg); }

/* ---------------- Active Stage Cards (Unlock / Progress / Conflict) ---------------- */
.focus-card {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: 14px;
}
.focus-top { display: flex; align-items: flex-start; gap: 13px; }
.focus-ic {
  width: 42px; height: 42px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: var(--accent-50); color: var(--accent-600);
}
.focus-ic.ok   { background: var(--ok-bg); color: var(--ok-fg); }
.focus-ic.warn { background: var(--warn-pill-bg); color: var(--warn-fg); }
.focus-ic.err  { background: var(--err-bg); color: var(--err-fg); }
.focus-ic.neu  { background: var(--bg-tertiary); color: var(--text-secondary); }
.focus-ic.pulse { position: relative; }
.focus-ic.pulse::after {
  content: ""; position: absolute; inset: -4px; border-radius: 14px;
  border: 2px solid var(--accent-200); opacity: .7;
  animation: pulseRing 1.8s ease-out infinite;
}
@keyframes pulseRing {
  0% { transform: scale(.94); opacity: .8; }
  100% { transform: scale(1.14); opacity: 0; }
}

.focus-ttl { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.focus-sub { font-size: 12.2px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }

/* BoardUI Form Input */
.field-lbl {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px;
}
.input-wrap { position: relative; display: flex; align-items: center; }
.input {
  width: 100%; height: 36px; padding: 0 60px 0 11px;
  border: 1px solid var(--border-btn); border-radius: 8px;
  background: var(--bg-workspace); color: var(--text-primary);
  font-size: 13px; outline: none;
  transition: border-color .14s, box-shadow .14s;
}
.input:focus { border-color: var(--accent-500); box-shadow: 0 0 0 3px var(--accent-50); }
.input.bad { border-color: var(--danger); box-shadow: 0 0 0 3px var(--err-bg); }
.reveal-btn {
  position: absolute; right: 6px; height: 24px; padding: 0 8px;
  border-radius: 6px; border: 0; background: var(--bg-inset); color: var(--text-secondary);
  font-size: 11.5px; font-weight: 500;
}
.reveal-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.field-help { font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; }
.field-err  { font-size: 11.8px; color: var(--err-fg); margin-top: 6px; display: flex; align-items: center; gap: 5px; }

/* Two-Phase Progress Bar + Safety Tiles */
.phase-track {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 9px;
  background: var(--bg-card-subtle); border: 1px solid var(--sep);
  font-size: 12px;
}
.phase-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--text-tertiary); font-weight: 500; }
.phase-chip.cur  { color: var(--text-primary); font-weight: 600; }
.phase-chip.done { color: var(--ok-fg); }
.phase-arrow { color: var(--text-tertiary); font-size: 11px; }

.bar-track {
  height: 7px; border-radius: 999px;
  background: var(--bg-tertiary); overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 999px;
  background: var(--accent-500);
  transition: width .16s linear, background .2s;
}
.bar-track.verify .bar-fill { background: var(--ok-dot); }
.bar-track.stop .bar-fill   { background: var(--text-tertiary); }

.bar-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12.2px; color: var(--text-secondary);
}
.bar-meta b { color: var(--text-primary); font-weight: 600; }

.mini-metrics {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.m-tile {
  padding: 10px 12px; border-radius: 10px;
  background: var(--bg-card-subtle); border: 1px solid var(--sep);
}
.m-tile .k { font-size: 11px; color: var(--text-tertiary); }
.m-tile .v { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-top: 2px; }

/* ---------------- PAGE 3: RESULT SUMMARY ---------------- */
.res-hero {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 18px; border-radius: 12px;
  border: 1px solid var(--card-border);
  background: var(--bg-card);
  box-shadow: var(--shadow-card);
}
.res-hero.ok   { border-color: var(--ok-border); background: color-mix(in srgb, var(--ok-bg) 28%, var(--bg-card)); }
.res-hero.warn { border-color: var(--warn-border); background: color-mix(in srgb, var(--warn-bg) 70%, var(--bg-card)); }
.res-hero.err  { border-color: var(--err-border); background: color-mix(in srgb, var(--err-bg) 55%, var(--bg-card)); }
.res-hero h3 { margin: 0; font-size: 16px; font-weight: 700; }
.res-hero p  { margin: 3px 0 0; font-size: 12.5px; color: var(--text-secondary); line-height: 1.48; }

.stat-grid {
  display: grid; gap: 10px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: var(--shadow-card);
}
.stat-card .n { font-size: 22px; font-weight: 700; line-height: 1.2; color: var(--text-primary); }
.stat-card .l { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; }
.stat-card.ok   { border-color: var(--ok-border); }
.stat-card.ok .n { color: var(--ok-fg); }
.stat-card.warn { border-color: var(--warn-border); background: var(--warn-bg); }
.stat-card.warn .n { color: var(--warn-fg); }
.stat-card.bad  { border-color: var(--err-border); background: var(--err-bg); }
.stat-card.bad .n { color: var(--err-fg); }

.issue-strip {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.issue-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 11px; border-radius: 9px;
  font-size: 12px; font-weight: 500;
  border: 1px solid var(--card-border); background: var(--bg-card);
}
.issue-chip.bad  { background: var(--err-bg); border-color: var(--err-border); color: var(--err-fg); }
.issue-chip.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-fg); }
.issue-chip b { font-size: 13.5px; font-weight: 700; }

/* ---------------- HISTORY HANDOFF (Expanded Single Window) ---------------- */
.hist-wrap { flex: 1; display: flex; min-height: 0; }
.hist-sb {
  width: 210px; flex: none;
  background: var(--bg-sidebar); border-right: 1px solid var(--border-sidebar);
  padding: 46px 12px 12px; display: flex; flex-direction: column; gap: 3px;
}
.hist-nav {
  height: 30px; padding: 0 10px; border-radius: 7px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12.5px; color: var(--text-secondary);
}
.hist-nav.on {
  background: var(--bg-nav-active); color: var(--text-primary); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 0 0 1px var(--card-border);
}
.hist-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.hist-tb {
  height: 52px; padding: 0 18px; border-bottom: 1px solid var(--sep);
  display: flex; align-items: center; gap: 10px;
}
.hist-omni {
  flex: 1; max-width: 440px; height: 32px; margin: 0 auto;
  background: var(--bg-inset); border: 1px solid var(--card-border); border-radius: 8px;
  padding: 0 11px; display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--text-tertiary);
}
.hist-body { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.hist-row {
  background: var(--bg-card); border: 1px solid var(--card-border); border-radius: 10px;
  padding: 10px 13px; display: flex; align-items: center; gap: 11px;
  box-shadow: var(--shadow-card);
}
.hist-row:first-child { border-color: var(--accent-200); background: color-mix(in srgb, var(--accent-50) 45%, var(--bg-card)); }
.hist-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 8px; color: var(--text-secondary); padding: 28px;
}

/* ---------------- BoardUI AlertDialog Modal (0013 / boardui-native-contract) ---------------- */
.scrim {
  position: absolute; inset: 0; z-index: 30;
  background: var(--scrim); backdrop-filter: blur(2px);
  display: grid; place-items: center;
  animation: fadeIn .22s ease-out;
}
.modal {
  width: 380px; max-width: calc(100% - 32px);
  background: var(--bg-sheet);
  border-radius: 14px; box-shadow: var(--shadow-modal);
  padding: 20px 22px 18px;
  animation: modalIn .28s cubic-bezier(.32, .72, 0, 1);
}
.modal h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.modal p  { margin: 0; font-size: 12.8px; color: var(--text-secondary); line-height: 1.55; }
.modal-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn {
  from { opacity: 0; transform: scale(.88); filter: blur(4px); }
  to   { opacity: 1; transform: scale(1); filter: blur(0); }
}

/* ---------------- Right UX Spec Inspector ---------------- */
.spec {
  width: 344px; flex: none;
  background: var(--bg-card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  box-shadow: var(--shadow-card);
  padding: 16px 18px; font-size: 12.2px;
}
.spec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.spec h3 { margin: 0; font-size: 13.5px; font-weight: 700; }
.spec .key {
  font-size: 10.5px; padding: 2px 7px; border-radius: 5px;
  background: var(--bg-inset); color: var(--text-secondary);
}
.spec .sec-lbl {
  margin: 12px 0 5px; font-size: 11px; font-weight: 700; color: var(--accent-600);
  letter-spacing: .02em;
}
.spec p { margin: 0; color: var(--text-primary); line-height: 1.55; }
.spec ul { margin: 0; padding-left: 16px; color: var(--text-secondary); }
.spec li { margin: 4px 0; line-height: 1.48; }
.spec li b { color: var(--text-primary); font-weight: 600; }
.spec .foot {
  margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--sep);
  font-size: 11.5px; color: var(--text-tertiary); line-height: 1.52;
}

[data-motion="reduced"] *, [data-motion="reduced"] *::after {
  animation: none !important; transition: none !important;
}

<script>
/* ---------------- Clean BoardUI / Remix-style Icons ---------------- */
const I = {

/* ---------------- State Machine ---------------- */
const TOTAL = 1204;
const DEFAULT_SRC = '~/Library/Application Support/app.uniclipboard.desktop';
const SOURCES = [
  { path: DEFAULT_SRC, ok: true, label: '默认位置' },
  { path: '/Volumes/USB/UniClipboard-Portable/data', ok: true, label: '便携版目录' },
  { path: '~/Downloads', ok: false, label: '不受支持的目录' },
];

const S = {
  key: 'w-detecting',
  entryMode: 'first',      // 'first' | 'settings'
  sizeMode: 'split',       // 'split' (780x540) | 'compact' (640x560)
  sceneIdx: 0,             // 0: pipeline | 1: actions | 2: tailcat sync
  sceneManual: false,
  sceneHover: false,
  sceneTimer: null,
  src: SOURCES[0],
  picker: false,
  pendingStart: false,
  entering: false,         // Simulates session_gui.go start-runtime IPC
  committed: 0,
  runPrior: 0,
  processed: 0,
  verified: 0,
  pass: '',
  passErr: false,
  revealPass: false,
  closing: false,
  closeAsk: false,
  timer: null,
};

const $ = s => document.querySelector(s);
const sim = id => $('#' + id).value;
const fmt = n => n.toLocaleString('zh-CN');
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function clearTimer() {
  if (S.timer) { clearInterval(S.timer); clearTimeout(S.timer); S.timer = null; }
}
function go(key) {
  clearTimer();
  S.key = key;
  S.picker = false;
  S.entering = false;
  render();
  enter(key);
}

function enter(key) {
  if (key === 'w-detecting') {
    S.timer = setTimeout(() => {
      const d = sim('simDetect');
      const next = d === 'found' ? 'w-found' : d === 'none' ? 'w-none' : 'w-error';
      if (S.pendingStart) { S.pendingStart = false; return startFrom(next); }
      go(next);
    }, 1450);
  }
  if (key === 'm-cred-system') {
    S.timer = setTimeout(() => {
      const c = sim('simCred');
      if (c === 'ok') return beginImport();
      S.passErr = false; S.pass = ''; S.revealPass = false;
      go(c === 'pass' ? 'm-cred-pass' : 'm-cred-denied');
    }, 1500);
  }
  if (key === 'm-import') {
    const failAt = Math.round(TOTAL * .41);
    S.timer = setInterval(() => {
      S.processed = Math.min(TOTAL, S.processed + 27);
      if (sim('simResult') === 'failed' && S.processed >= failAt) {
        S.processed = failAt; S.committed = Math.max(S.committed, failAt);
        return go('r-failed');
      }
      S.committed = Math.max(S.committed, S.processed);
      if (S.processed >= TOTAL) { S.verified = 0; return go('m-verify'); }
      updateLiveNumbers();
    }, 65);
  }
  if (key === 'm-verify') {
    S.timer = setInterval(() => {
      S.verified = Math.min(TOTAL, S.verified + 44);
      if (S.verified >= TOTAL) {
        const r = sim('simResult');
        if (r === 'partial') return go('r-partial');
        return go(S.runPrior >= TOTAL ? 'r-complete-retry' : 'r-complete');
      }
      updateLiveNumbers();
    }, 65);
  }
  if (key === 'm-stopping') {
    S.timer = setTimeout(() => go(S.closing ? 'closed' : 'r-cancelled'), 1350);
  }
}

function startFrom(k) {
  if (k === 'w-found') return go('m-confirm');
  enterApp(false);
}
function enterApp(withCommitted) {
  if (S.entering) return;
  clearTimer();
  S.entering = true;
  render();
  S.timer = setTimeout(() => {
    S.entering = false;
    go(withCommitted && S.committed ? 'history' : 'history-empty');
  }, 520);
}
function startMigration() {
  if (sim('simResult') === 'conflict') return go('m-conflict');
  go('m-cred-system');
}
function beginImport() {
  S.runPrior = S.committed;
  S.processed = S.committed;
  go('m-import');
}

/* ---------------- Page 1: Interactive UniClipboard Product Showcase Cover ---------------- */
const SCENES = [
  {
    id: 'pipeline',
    label: '流水线标签',
    caption: '自动识别代码、色值、图片与文件，支持 #标签 @设备 令牌检索',

  {
    id: 'actions',
    label: '插件与动作',
    caption: '通过内置 Action 与 Go / Lua 插件，把一次复制直接变成工作流',
    render: () => `<div class="scene-card-anim">
      <div class="act-entry">
        <div class="act-entry-ic">${I.file}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">release-assets-v2.zip</div>

          <div class="ar-ic">${I.share}</div>

function syncSceneTimer() {
  if (S.sceneTimer) { clearInterval(S.sceneTimer); S.sceneTimer = null; }
  const reduced = document.documentElement.dataset.motion === 'reduced';
  if (!S.key.startsWith('w-') || S.sceneManual || S.sceneHover || reduced) return;
  S.sceneTimer = setInterval(() => {
    S.sceneIdx = (S.sceneIdx + 1) % SCENES.length;
    updateShowcaseOnly();
  }, 5200);
}

function updateShowcaseOnly() {
  const vp = $('#sceneViewport');
  const cap = $('#sceneCaption');
  if (!vp) return;
  const sc = SCENES[S.sceneIdx];
  vp.innerHTML = sc.render();
  if (cap) cap.textContent = sc.caption;
  document.querySelectorAll('[data-scene]').forEach(b => b.classList.toggle('on', +b.dataset.scene === S.sceneIdx));
}

function stepMetaFor(key) {
  // Returns array of 4 step descriptors: { state: ''|'cur'|'done'|'warn'|'err', meta: string }
  const d = [
    { state: '', meta: S.src.label },
    { state: '', meta: '系统凭据或口令' },
    { state: '', meta: `共 ${fmt(TOTAL)} 条` },
    { state: '', meta: '重开库校验' },
  ];
  switch (key) {
    case 'm-confirm':
      d[0] = { state: 'cur', meta: S.src.label };
      break;
    case 'm-invalid':
      d[0] = { state: 'err', meta: '目录不受支持' };
      break;
    case 'm-conflict':
      d[0] = { state: 'err', meta: '目标目录被占用' };
      break;
    case 'm-cred-system':
      d[0] = { state: 'done', meta: S.src.label };
      d[1] = { state: 'cur', meta: '等待系统授权…' };
      break;
    case 'm-cred-pass':
    case 'm-cred-denied':
      d[0] = { state: 'done', meta: S.src.label };
      d[1] = { state: 'warn', meta: '等待输入 v1 口令' };
      break;
    case 'm-import':
      d[0] = { state: 'done', meta: '已确认' };
      d[1] = { state: 'done', meta: '已解锁' };
      d[2] = { state: 'cur', meta: `${fmt(S.processed)} / ${fmt(TOTAL)} 条` };
      break;
    case 'm-verify':
      d[0] = { state: 'done', meta: '已确认' };
      d[1] = { state: 'done', meta: '已解锁' };
      d[2] = { state: 'done', meta: '已全部处理' };
      d[3] = { state: 'cur', meta: `${fmt(S.verified)} / ${fmt(TOTAL)} 条` };
      break;
    case 'm-stopping':
      d[0] = { state: 'done', meta: '已确认' };
      d[1] = { state: 'done', meta: '已解锁' };
      if (S.verified > 0) {
        d[2] = { state: 'done', meta: '已处理' };
        d[3] = { state: 'warn', meta: '正在安全停止…' };
      } else {
        d[2] = { state: 'warn', meta: '正在安全停止…' };
      }
      break;
    case 'r-complete':
    case 'r-complete-retry':
      d[0] = { state: 'done', meta: '已确认' };
      d[1] = { state: 'done', meta: '已解锁' };
      d[2] = { state: 'done', meta: `已保留 ${fmt(S.committed)} 条` };
      d[3] = { state: 'done', meta: '校验通过' };
      break;
    case 'r-partial':
      d[0] = { state: 'done', meta: '已确认' };
      d[1] = { state: 'done', meta: '已解锁' };
      d[2] = { state: 'warn', meta: '部分记录失败' };
      d[3] = { state: 'warn', meta: '存在异常项' };
      break;
    case 'r-cancelled':
      d[0] = { state: 'done', meta: '已确认' };
      d[1] = { state: 'done', meta: '已解锁' };
      d[2] = { state: 'warn', meta: `已停止 · 留存 ${fmt(S.committed)} 条` };
      d[3] = { state: '', meta: '尚未校验' };
      break;
    case 'r-failed':
      d[0] = { state: 'done', meta: '已确认' };
      d[1] = { state: 'done', meta: '已解锁' };
      d[2] = { state: 'err', meta: '读取异常中断' };
      d[3] = { state: '', meta: '未完成' };
      break;
  }
  return d;
}

function migShell(headTitle, headSub, headPill, bodyHtml, footHtml) {
  const names = ['确认目录与范围', '解锁旧数据', '导入历史', '重开校验'];
  const metas = stepMetaFor(S.key);
  const entryTag = S.entryMode === 'settings' ? '设置 › 存储补迁移' : '首次安装引导';

  const rail = `<aside class="j-rail">
    <div class="j-head">
      <div class="j-app">${I.catMark}</div>
      <div><div class="j-t">从 v1 迁移历史</div><div class="j-s">${entryTag}</div></div>
    </div>
    <div class="j-steps">
      ${names.map((n, i) => {
        const m = metas[i];
        const badge = m.state === 'done' ? I.check : (i + 1);
        return `<div class="j-step ${m.state}">
          <div class="j-num">${badge}</div>
          <div class="j-info">
            <div class="j-name">${n}</div>
            <div class="j-meta" id="jmeta-${i}">${m.meta}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="j-trust">
      <div class="j-trust-row">${I.shield}<span>只读 v1 源目录，不修改也不删除旧数据。</span></div>
      <div class="j-trust-row">${I.lock}<span>迁移期间离线独占，不捕获剪贴板与同步。</span></div>
      <div class="j-trust-row">${I.info}<span>跳过后随时可在 设置 › 存储 中再次迁移。</span></div>
    </div>
  </aside>`;

  return `<div class="mig-split">
    ${rail}
    <section class="m-pane">
      <header class="m-head">
        <div><h2>${headTitle}</h2><p>${headSub}</p></div>
        ${headPill || ''}
      </header>
      <div class="m-scroll">${bodyHtml}</div>
      <footer class="m-foot">${footHtml}</footer>
    </section>
  </div>`;
}

function progressPage(mode) {
  const isVerify = mode === 'verify' || (mode === 'stop' && S.verified > 0);

  const pill = mode === 'stop'
    ? `<span class="pill neu"><i class="dot"></i>正在停止</span>`

    : isVerify ? '正在重开历史库并逐条校验' : '正在将 v1 记录写入新历史库';
  const sub = mode === 'stop'
    ? '正在等待当前记录落盘并释放存储锁。所有已提交的记录都会完整保留。'
    : isVerify
      ? '关闭并重新打开目标库，通过公开接口逐条比对内容摘要、标签、收藏与兼容设置。'
      : (S.runPrior ? `已通过持久映射自动跳过此前导入的 ${fmt(S.runPrior)} 条记录。` : '按条写入本地历史库，不估算剩余时间；导入 100% 后将自动进入校验阶段。');

  const body = `<div class="focus-card">
    <div class="phase-track">
      <span class="phase-chip ${isVerify ? 'done' : 'cur'}">${isVerify ? I.check : '<span class="spin"></span>'} 1. 导入记录</span>
      <span class="phase-arrow">→</span>
      <span class="phase-chip ${isVerify ? (mode === 'stop' ? '' : 'cur') : ''}">${isVerify && mode !== 'stop' ? '<span class="spin"></span>' : ''} 2. 重开校验</span>
    </div>
    <div class="focus-top">
      <div class="focus-ic ${mode === 'stop' ? 'neu' : isVerify ? 'ok' : ''}">${mode === 'stop' ? I.stop : isVerify ? I.shield : I.download}</div>
      <div>
        <div class="focus-ttl">${title}</div>
        <div class="focus-sub">${sub}</div>
      </div>
    </div>
    <div>
      <div class="bar-track ${mode === 'stop' ? 'stop' : isVerify ? 'verify' : ''}">
        <div class="bar-fill" id="bar" style="width:${pct}%"></div>
      </div>
      <div class="bar-meta mono" style="margin-top:8px">
        <span id="cnt">${isVerify ? '已校验' : '已处理'} <b>${fmt(done)}</b> / ${fmt(TOTAL)} 条</span>
        <span id="pct">${pct}%</span>
      </div>
    </div>
    <div class="mini-metrics">
      <div class="m-tile">
        <div class="k">已安全提交（中断不丢失）</div>
        <div class="v mono" id="safeCommitted">${fmt(S.committed)} 条</div>
      </div>
      <div class="m-tile">
        <div class="k">运行边界</div>
        <div class="v">${S.runPrior ? `跳过已导入 ${fmt(S.runPrior)} 条` : '离线独占 · 不写剪贴板'}</div>
      </div>
    </div>
  </div>`;

  const foot = mode === 'stop'
    ? `<span class="hint">等待释放目录锁后呈现最终状态</span><span class="sp"></span><button class="btn" disabled><span class="spin"></span>正在停止…</button>`
    : `<span class="hint">请保持应用打开；点击红灯关闭也会走安全停止路径</span><span class="sp"></span><button class="btn" data-act="stop">${I.stop} 停止迁移</button>`;

  return migShell(mode === 'stop' ? '正在安全停止迁移' : '正在迁移 v1 历史', '导入与校验分阶段进行，完成后才会呈现结果。', pill, body, foot);
}

function resultPage(cfg) {
  const enterLabel = S.entering ? `<span class="spin"></span>正在启动应用…` : cfg.primaryEnterLabel;
  const statsCols = Math.min(cfg.primaryStats.length, 3);
  const body = `
    <div class="res-hero ${cfg.tone}">
      <div class="focus-ic ${cfg.tone === 'stop' ? 'neu' : cfg.tone}">${cfg.icon}</div>
      <div>
        <h3>${cfg.title}</h3>
        <p>${cfg.lead}</p>
      </div>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(${statsCols},1fr)">
      ${cfg.primaryStats.map(([cls, num, lbl]) => `
        <div class="stat-card ${cls}">
          <div class="n mono">${fmt(num)}</div>
          <div class="l">${lbl}</div>
        </div>`).join('')}
    </div>
    ${cfg.issues && cfg.issues.length ? `
      <div class="issue-strip">
        ${cfg.issues.map(([cls, num, lbl]) => `
          <div class="issue-chip ${cls}"><b class="mono">${fmt(num)}</b><span>${lbl}</span></div>`).join('')}
      </div>` : ''}
    ${cfg.note || ''}
  `;
  return migShell(cfg.headTitle, cfg.headSub, cfg.pill, body, cfg.foot(enterLabel));
}

    ['不自动写入系统剪贴板；已初始化老 v2 安装始终绕过引导。']],
  'closed': ['关闭窗口 · 安全退出',
    '模拟迁移中点击红灯并确认「停止并退出」后的安全退出与重启恢复。',
    ['未完成流程不标记 setup 完成；重启回到迁移确认页且不自动续跑。']],
};

const JUMPS = [
  ['w-detecting','封面·检测中'],['w-found','封面·发现v1'],['w-none','封面·未发现'],['w-error','封面·出错'],
  ['m-confirm','确认'],['m-invalid','无效目录'],['m-conflict','目录占用'],
  ['m-cred-system','系统凭据'],['m-cred-pass','输入口令'],['m-cred-denied','凭据被拒'],
  ['m-import','导入中'],['m-verify','校验中'],['m-stopping','停止中'],
  ['r-complete','完成'],['r-complete-retry','重试无新增'],['r-partial','部分'],['r-cancelled','已停止'],['r-failed','失败'],
  ['history','历史(已迁)'],['closed','关窗退出'],
];

function closeModal() {
  return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true">
    <h3>正在迁移历史记录</h3>
    <p>关闭窗口会先安全停止当前迁移并释放存储锁，然后退出应用。已提交的记录会完整保留，下次启动可从断点继续。</p>
    <div class="modal-acts">
      <button class="btn" data-act="close-cancel">继续迁移</button>
      <button class="btn pri" data-act="close-confirm">停止并退出</button>
    </div>
  </div></div>`;
}

function render() {
  const k = S.key;
  const isHist = k.startsWith('history');
  const win = $('#win');
  win.classList.toggle('expanded', isHist);
  win.classList.toggle('compact-size', !isHist && S.sizeMode === 'compact');

  $('#sizeLabel').innerHTML = isHist
    ? `当前主窗口：<code>1100 × 720 (扩展示意)</code>`
    : S.sizeMode === 'compact'
      ? `当前引导窗口：<code>640 × 560（现行紧凑适配）</code>`
      : `当前引导窗口：<code>780 × 540（推荐 BoardUI 分栏）</code>`;

  $('#root').innerHTML = PAGES[k]() + (S.closeAsk ? closeModal() : '');

  const wv = $('#welcomeVisual');
  if (wv) {
    wv.onmouseenter = () => { S.sceneHover = true; wv.classList.add('paused'); syncSceneTimer(); };
    wv.onmouseleave = () => { S.sceneHover = false; if (!S.sceneManual && document.documentElement.dataset.motion !== 'reduced') wv.classList.remove('paused'); syncSceneTimer(); };
  }
  syncSceneTimer();

  const [title, uxNote, items] = SPEC[k];
  $('#spec').innerHTML = `
    <div class="spec-head"><h3>${title}</h3><span class="key mono">${k}</span></div>
    <div class="sec-lbl">UI / UX 重设计要点</div>
    <p>${uxNote}</p>
    <div class="sec-lbl">0026 / 0011 契约与行为核对</div>
    <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
    <div class="foot">
      可在顶部切换 <b>780 × 540</b>（推荐分栏）与 <b>640 × 560</b>（现行尺寸响应式适配），或点击封面左栏底部分段器手动预览 3 个 UniClipboard v2 核心能力场景。
    </div>`;

  document.querySelectorAll('#jumps .chip').forEach(c => c.classList.toggle('on', c.dataset.jump === k));

  const pw = $('#pw');
  if (pw) {
    pw.focus();
    pw.setSelectionRange(pw.value.length, pw.value.length);
    pw.oninput = e => {
      S.pass = e.target.value;
      const ub = document.querySelector('[data-act="unlock"]');
      if (ub) ub.disabled = !S.pass;
    };
    pw.onkeydown = e => { if (e.key === 'Enter' && S.pass) act('unlock'); };
  }
}

function updateLiveNumbers() {
  const verify = S.key === 'm-verify';
  const done = verify ? S.verified : S.processed;
  const pct = Math.round(done / TOTAL * 100);
  const bar = $('#bar'); if (!bar) return;
  bar.style.width = pct + '%';
  $('#cnt').innerHTML = `${verify ? '已校验' : '已处理'} <b>${fmt(done)}</b> / ${fmt(TOTAL)} 条`;
  $('#pct').textContent = pct + '%';
  const sc = $('#safeCommitted'); if (sc) sc.textContent = `${fmt(S.committed)} 条`;
  const jm = $(verify ? '#jmeta-3' : '#jmeta-2');
  if (jm) jm.textContent = `${fmt(done)} / ${fmt(TOTAL)} 条`;
}

function act(a) {
  switch (a) {
    case 'begin':
      if (S.key === 'w-detecting') { S.pendingStart = true; return render(); }
      return startFrom(S.key);
    case 'redetect': return go('w-detecting');
    case 'manual': S.src = SOURCES[1]; return go('m-confirm');
    case 'pick': S.picker = !S.picker; return render();
    case 'pick-fail': S.src = SOURCES[1]; return go('m-confirm');
    case 'skip': return enterApp(false);
    case 'start': return startMigration();
    case 'stop': return go('m-stopping');
    case 'toggle-pass': S.revealPass = !S.revealPass; return render();
    case 'unlock':
      if (!S.pass) return;
      if (S.pass !== 'v1pass') { S.passErr = true; S.pass = ''; return render(); }
      S.passErr = false; S.pass = ''; return beginImport();
    case 'retry': return startMigration();
    case 'enter': return enterApp(true);
    case 'reset':
      S.committed = 0; S.runPrior = 0; S.processed = 0; S.verified = 0;
      S.src = SOURCES[0]; S.closing = false; S.passErr = false; S.pass = '';
      S.sceneIdx = 0; S.sceneManual = false;
      return go(S.entryMode === 'settings' ? 'm-confirm' : 'w-detecting');
    case 'relaunch':
      S.closing = false; S.processed = S.committed;
      return go('m-confirm');
    case 'close-cancel': S.closeAsk = false; return render();
    case 'close-confirm': S.closeAsk = false; S.closing = true; return go('m-stopping');
  }
}

document.addEventListener('click', e => {
  const sc = e.target.closest('[data-scene]');
  if (sc) {
    S.sceneIdx = +sc.dataset.scene;
    S.sceneManual = true;
    const wv = $('#welcomeVisual');
    if (wv) wv.classList.add('paused');
    syncSceneTimer();
    updateShowcaseOnly();
    return;
  }
  const s = e.target.closest('[data-src]');
  if (s) { S.src = SOURCES[+s.dataset.src]; return go(S.src.ok ? 'm-confirm' : 'm-invalid'); }
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) return act(b.dataset.act);
  if (S.picker && !e.target.closest('.popover')) { S.picker = false; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.closeAsk) { S.closeAsk = false; render(); }
    else if (S.picker) { S.picker = false; render(); }
  }
});

$('#closeBtn').onclick = () => {
  if (['m-import', 'm-verify', 'm-cred-system'].includes(S.key)) { S.closeAsk = true; render(); }
};
document.querySelectorAll('[data-theme-btn]').forEach(b => b.onclick = () => {
  document.documentElement.dataset.theme = b.dataset.themeBtn;
  document.querySelectorAll('[data-theme-btn]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-size-btn]').forEach(b => b.onclick = () => {
  S.sizeMode = b.dataset.sizeBtn;
  document.querySelectorAll('[data-size-btn]').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.querySelectorAll('[data-entry-btn]').forEach(b => b.onclick = () => {
  S.entryMode = b.dataset.entryBtn;
  document.querySelectorAll('[data-entry-btn]').forEach(x => x.classList.toggle('on', x === b));
  act('reset');
});
$('#motionBtn').onclick = e => {
  const reduced = document.documentElement.dataset.motion === 'reduced';
  document.documentElement.dataset.motion = reduced ? '' : 'reduced';
  e.target.classList.toggle('on', !reduced);
  const wv = $('#welcomeVisual');
  if (wv) wv.classList.toggle('paused', !reduced || S.sceneManual || S.sceneHover);
  syncSceneTimer();
};
$('#restart').onclick = () => act('reset');

const PRESET = {
  'm-import':         () => { S.runPrior = 0; S.processed = 396; S.committed = 396; S.verified = 0; },
  'm-verify':         () => { S.runPrior = 0; S.processed = TOTAL; S.committed = TOTAL; S.verified = 560; },
  'm-stopping':       () => { S.runPrior = 0; S.processed = 312; S.committed = 312; S.verified = 0; S.closing = false; },
  'r-complete':       () => { S.runPrior = 0; S.committed = TOTAL; },
  'r-complete-retry': () => { S.runPrior = TOTAL; S.committed = TOTAL; },
  'r-partial':        () => { S.runPrior = 0; S.committed = TOTAL - 18; },
  'r-cancelled':      () => { S.runPrior = 0; S.committed = 312; },
  'r-failed':         () => { S.runPrior = 0; S.committed = 494; },
  'history':          () => { if (!S.committed) S.committed = TOTAL; },
  'closed':           () => { S.committed = 312; },
  'm-invalid':        () => { S.src = SOURCES[2]; },
  'm-confirm':        () => { S.src = SOURCES[0]; },
  'm-cred-pass':      () => { S.passErr = false; S.pass = ''; S.revealPass = false; },
  'm-cred-denied':    () => { S.passErr = false; S.pass = ''; S.revealPass = false; },
};

const jumps = $('#jumps');
JUMPS.forEach(([k, l]) => {
  const c = document.createElement('button');
  c.className = 'chip'; c.dataset.jump = k; c.textContent = l;
  c.onclick = () => {
    clearTimer(); S.pendingStart = false; S.closeAsk = false; S.entering = false;
    (PRESET[k] || (() => {}))();
    S.key = k; S.picker = false; render();
    if (['w-detecting', 'm-cred-system', 'm-import', 'm-verify', 'm-stopping'].includes(k)) enter(k);
  };
  jumps.appendChild(c);
});

go('w-detecting');
</script>
</body>
</html>
