[toolchain]
# 钉死到 1.95.0，使 CI 与本地开发使用同一份 toolchain（缓存键也依赖它）。
# 该版本最初因 `tauri-specta` 的依赖链需要 stable Rust 1.94+ 而选定；Tauri 宿主退役后
# 不再有这个约束，降级需单独评估。CI macOS / windows runner 走 rustup 装下面这个
# channel 即可；本地开发首次 `cargo` 调用 rustup 会自动安装。
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
