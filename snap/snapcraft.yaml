name: uniclipboard
base: core22
adopt-info: uniclipboard

summary: Encrypted peer-to-peer clipboard sync between your devices
description: |
  UniClipboard syncs your clipboard securely across all your devices on
  the local network. End-to-end encrypted and powered by iroh QUIC —
  no clouds, no accounts, no third-party servers, just direct
  peer-to-peer sync.

  Pair your devices once via the in-app QR code, then anything you copy
  on one device — text, images, or files — is automatically available
  on the others.

  Currently distributed as alpha. Daemon runs in-process behind the GUI.

license: AGPL-3.0-only
website: https://uniclipboard.app
source-code: https://github.com/UniClipboard/UniClipboard
issues: https://github.com/UniClipboard/UniClipboard/issues
contact: https://github.com/UniClipboard/UniClipboard/issues

# strict + gnome extension。base=core22 决定 binary 链接 glibc 2.35,gnome
# extension (gnome-42-2204) 提供 webkit2gtk-4.1 + libsoup-3.0 + 完整 GTK
# stack。snap 跑在 mount namespace 里,binary 看到的 /lib 是 snap 内部的,
# 跟 host 完全解耦 —— Ubuntu 20.04 / RHEL 9 / openSUSE Leap 这些老
# distro 上 host 没有 webkit2gtk-4.1 也无所谓。
grade: stable
confinement: strict

architectures:
  - build-on: amd64
    build-for: amd64

apps:
  uniclipboard:
    command: usr/bin/uniclipboard
    extensions: [gnome]
    desktop: usr/share/applications/uniclipboard.desktop
    common-id: app.uniclipboard.desktop
    environment:
      # snap 嵌套 mount namespace 内,WebKit 默认还会再起一层
      # bubblewrap-style sandbox(需要 user_namespaces 等内核能力),strict
      # snap 不给。FORCE_SANDBOX=0 关掉 WebKit 自家 sandbox —— snap 已经是
      # AppArmor + seccomp + mount/user namespace 的更强 sandbox,不损失
      # 安全性。
      WEBKIT_FORCE_SANDBOX: '0'
      # 关 WebKit DMA-BUF renderer:trace 里看到 "GTK failed to initialize
      # GL: No available configurations for the given pixel format" ——
      # snap 的 GPU 隔离常无法初始化 EGL,WebKit 默认会试 DMA-BUF zero-copy
      # 失败再 fallback,中间状态不稳定。直接走 software/legacy renderer。
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      # NOTE: WEBKIT_EXEC_PATH **没用**。现代 WebKitGTK
      # (Source/WebKit/UIProcess/Launcher/glib/ProcessLauncherGLib.cpp) 用
      # 编译期宏 WEBKIT_EXEC_PATH (`g_build_filename(WEBKIT_EXEC_PATH,
      # processName, nullptr)`),不再 `g_getenv` 同名 env。所以子进程路径
      # 改不动 —— 必须用 snap layout 把硬编码的 /usr/lib/$ARCH/webkit2gtk-4.1/
      # bind-mount 到 gnome-platform 实际位置(见本文件底部 layout 块)。
    # plug 列表覆盖 GUI + 全局剪贴板 + LAN P2P 同步 + 本地配置/数据 +
    # 文件传输场景。剪贴板事件从 GTK clipboard API 取,strict snap 通过
    # wayland / x11 plug 拿到 host compositor selection;daemon 监听
    # 系统剪贴板变化跟原生 .deb 行为一致。
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - network
      - network-bind
      - home
      - removable-media
      - mount-observe
      # KEK 解锁与 iroh 设备身份回退会走系统 keyring (libsecret →
      # org.freedesktop.secrets);desktop plug 只给一般 D-Bus session,
      # secrets 路径必须显式 plug。没有它在 snap 里 keyring 调用会被
      # AppArmor / 命名空间隔离挡住,Linux 上的 fresh install
      # build_space_setup_assembly:bind → keyring::get_secret 会在 ~1s 后
      # 失败,daemon 启动直接挂——参见 MigratingSecureStorage::get
      # 的"legacy.get 失败 → 当作 miss"兜底。本 plug 让有 keyring
      # 的环境真的能用上,兜底逻辑只覆盖没 keyring 的环境。
      - password-manager-service

parts:
  uniclipboard:
    plugin: nil
    source: .
    source-type: local
    # core22 build env = Ubuntu 22.04 仓库,libwebkit2gtk-4.1 等 dev 包都
    # 在 main / universe 里。runtime 阶段这些 .so 由 gnome extension 提供,
    # stage-packages 只 stage 几个 extension 没覆盖到的辅助库 (例如
    # libayatana-appindicator3 系统托盘绘制)。
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libsoup-3.0-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libssl-dev
      - patchelf
      - cmake
      - clang
      - pkg-config
      - curl
      - file
      - desktop-file-utils
      - xdg-utils
      - jq
      - unzip
      - ca-certificates
    stage-packages:
      - libayatana-appindicator3-1
      - librsvg2-2
      # libwebkit2gtk-4.1-0 stage *仅是为了把 WebKitNetworkProcess /
      # WebKitWebProcess / WebKitGPUProcess 这三个子进程 binary bundle 到
      # $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/。snap layout 的
      # source path 必须**存在于 snap 自己的 squashfs 内**才能 bind-mount
      # 成功(snapd 在 setup 早期阶段应用 layouts,content interface 挂的
      # gnome-platform/ 那时还不存在,layout from gnome-platform 静默失败,
      # 见 v0 → v6 调试历史)。.so 也会一起被 stage,但运行时 LD_LIBRARY_PATH
      # 由 gnome extension 指向 gnome-platform 优先,实际加载的还是 gnome
      # content snap 那份(同 Ubuntu 22.04 main 同源,ABI 兼容)。
      - libwebkit2gtk-4.1-0
    build-environment:
      # NOTE: 不在这里 set PATH —— snapcraft 的 build-environment 是字面
      # 字符串注入,$HOME 不会展开。PATH 在 override-build 内用 export 设。
      - CARGO_TERM_COLOR: never
      - SNAP_BUILD: '1'
    override-pull: |
      craftctl default
      # snap 版本号 = package.json.version + "-snap" 后缀,snap store
      # 需要 SemVer-like 字符串。snap 跟 .deb 是同一份代码,但产物
      # 标识不同,加 suffix 区分上传记录。
      VERSION="$(jq -r .version "${CRAFT_PART_SRC}/package.json")"
      craftctl set version="${VERSION}"
    override-build: |
      set -euo pipefail

      # 装 Bun (前端 bundler) 和 Rust stable —— 跟 alpha-build.yml 对齐。
      # core22 自带 nodejs/npm 但不带 bun,bun-version 在 GHA 那边用
      # latest,这里也 latest 保持一致。
      curl -fsSL https://bun.sh/install | bash
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable
      export PATH="$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"

      # 1) 前端构建 —— vite 把 src/ 编到 dist/,Tauri 的 build.rs (调
      # tauri_build::build()) 在 cargo build 时把 dist/ 嵌进 binary。
      bun install --frozen-lockfile
      bun run build

      # 2) 后端构建 —— 直接 cargo build,绕过 tauri-cli (不需要 .deb /
      # AppImage / updater signing 这些 snap 用不到的逻辑)。binary 名字
      # 由 src-tauri/Cargo.toml 的 [package].name 决定 = "uniclipboard"。
      #
      # `--features custom-protocol`:`tauri build` CLI 会**隐式**启用此
      # feature 让 webview 走内嵌资源 `tauri://localhost/`;我们绕开 CLI
      # 直接走 cargo build,必须**显式**加,否则 Tauri 运行时默认 dev
      # 模式 → webview 加载 `http://localhost:1420/`(vite dev) →
      # connection refused → 前端永远加载不出来。详见 Cargo.toml
      # `[features].custom-protocol` 的注释。
      cd src-tauri
      cargo build --release --locked --features custom-protocol --bin uniclipboard
      cd ..

      # 3) 安装到 snap install 目录。strict snap 启动时 mount 这个目录
      # 到 /usr,所以路径必须以 usr/ 开头。
      install -Dm755 src-tauri/target/release/uniclipboard \
        "${CRAFT_PART_INSTALL}/usr/bin/uniclipboard"
      install -Dm644 snap/local/uniclipboard.desktop \
        "${CRAFT_PART_INSTALL}/usr/share/applications/uniclipboard.desktop"
      install -Dm644 src-tauri/icons/icon.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/uniclipboard.png"
      install -Dm644 src-tauri/icons/128x128.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/128x128/apps/uniclipboard.png"

# WebKitGTK 4.1 子进程路径 hardcode-fix。
#
# WebKit 的 ProcessLauncherGLib 用编译期宏 WEBKIT_EXEC_PATH 拼子进程
# (WebKitWebProcess / WebKitNetworkProcess / WebKitGPUProcess) 的绝对路径,
# Ubuntu 22.04 编译时 = /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/。strict
# snap 的 mount namespace 里 /usr 是 base snap (core22) tree,这条路径下
# 没文件,Tauri 一开 webview 就 ENOENT + SIGTRAP。
#
# 同名 runtime env (`WEBKIT_EXEC_PATH`) 在现代 WebKitGTK 已被废弃 (改成
# 编译期宏),只有 layout / bind-mount 这条路能改 spawn 路径。
#
# **Source path 必须在 snap squashfs 内** —— 早先版本试过 source 指向
# $SNAP/gnome-platform/usr/lib/.../webkit2gtk-4.1(content interface bind),
# snapd 在 setup 早期 apply layouts 时 content mount 还没建立,bind 静默
# 失败(target dir 建出来但是空的,mountinfo 里没记录)。改用
# `stage-packages.libwebkit2gtk-4.1-0` 把子进程 binary bundle 到
# $SNAP/usr/lib/$ARCH/webkit2gtk-4.1/(snap squashfs 内),layout source
# 指向那 —— bind 成功,WebKit 编译期硬编码路径解析到我们 staged 的 binary。
layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
