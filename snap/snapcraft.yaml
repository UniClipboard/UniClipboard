name: uniclipboard
base: core22
adopt-info: uniclipboard

summary: Encrypted peer-to-peer clipboard sync between your devices
description: |
  UniClipboard syncs your clipboard securely across all your devices on
  the local network. End-to-end encrypted and powered by iroh QUIC —
  no clouds, no accounts, no third-party servers, just direct
  peer-to-peer sync.

  Pair your devices once via the in-app QR code, then anything you copy
  on one device — text, images, or files — is automatically available
  on the others.

  A bundled background daemon handles sync.

license: AGPL-3.0-only
website: https://uniclipboard.app
source-code: https://github.com/UniClipboard/UniClipboard
issues: https://github.com/UniClipboard/UniClipboard/issues
contact: https://github.com/UniClipboard/UniClipboard/issues

# strict + gnome extension。base=core22 决定 binary 链接 glibc 2.35,gnome
# extension (gnome-42-2204) 提供 webkit2gtk-4.1 + libsoup-3.0 + 完整 GTK
# stack。snap 跑在 mount namespace 里,binary 看到的 /lib 是 snap 内部的,
# 跟 host 完全解耦 —— Ubuntu 20.04 / RHEL 9 / openSUSE Leap 这些老
# distro 上 host 没有 webkit2gtk-4.1 也无所谓。
#
# grade: devel 是有意的:Snap Store 不允许把 devel 的 snap 发布到 stable / candidate。
# Go 宿主(apps/gui-go)在 strict 限制下的启动、托盘、通知、自启动和全局快捷键
# 没有在真实 snapd 上验证过(见 docs/architecture/gui-go-distribution-channels.md),
# 验证并记录之后才能改成 stable。
grade: devel
confinement: strict

architectures:
  - build-on: amd64
    build-for: amd64
  - build-on: arm64
    build-for: arm64

apps:
  uniclipboard:
    command: usr/bin/uniclipboard
    extensions: [gnome]
    desktop: usr/share/applications/uniclipboard.desktop
    common-id: app.uniclipboard.desktop
    # plug 列表覆盖 GUI + 全局剪贴板 + LAN P2P 同步 + 本地配置/数据 +
    # 文件传输场景。剪贴板事件从 GTK clipboard API 取,strict snap 通过
    # wayland / x11 plug 拿到 host compositor selection;daemon 监听
    # 系统剪贴板变化跟原生 .deb 行为一致。
    #
    # `password-manager-service`: daemon 启动期通过 secret-service D-Bus
    # API (org.freedesktop.Secret.Service / GNOME Keyring / KWallet 等)
    # 取本地身份的 KEK。该 plug **不会** auto-connect,首装后需要 manual
    # `snap connect uniclipboard:password-manager-service`;未连接时
    # uc-platform::capability 仍会探测到 desktop 然后走 system keyring,
    # DBus 被 AppArmor 拒后直接 daemon 启动失败 ——
    # uc-platform::secure_storage 的 file-based fallback 仅在 "no desktop
    # detected" 路径触发。要在 snap store 启用 auto-connect 需在 snapcraft
    # forum 提 request。
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - network
      - network-bind
      - home
      - removable-media
      - mount-observe
      - password-manager-service

parts:
  uniclipboard:
    plugin: nil
    source: .
    source-type: local
    # core22 build env = Ubuntu 22.04 仓库,libwebkit2gtk-4.1-dev 等 dev 包都
    # 在 main / universe 里。runtime 阶段这些 .so 由 gnome extension 提供,
    # stage-packages 只 stage extension 没覆盖到的 libgtk-layer-shell0
    # (Wayland 快捷面板在运行时加载它)。托盘和通知由 Go 宿主直接走 D-Bus,
    # 不链接 appindicator / libnotify。
    #
    # 构建链:Rust 守护进程(cargo,工具链由仓库的 rust-toolchain.toml 决定)、
    # 共享前端(bun)、Go 宿主(cgo 链接 GTK3 + WebKitGTK 4.1)。Go 1.27.1 是
    # apps/gui-go/go.mod 的 toolchain 行;core22 的 apt 里没有这么新的 Go,所以
    # 下载官方压缩包并校验 SHA-256(与 e2e/linux/Dockerfile.package-build 同一版本)。
    build-packages:
      # cgo and the Rust build scripts need a C toolchain; do not rely on the build image having one.
      - build-essential
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libssl-dev
      - cmake
      - clang
      - pkg-config
      - curl
      - jq
      - unzip
      - ca-certificates
    stage-packages:
      - libgtk-layer-shell0
    build-environment:
      # NOTE: build-environment 的值会被 craft-parts 用双引号包裹后注入构建
      # 脚本(export KEY="VALUE"),且不转义值里的内层字符。含 $VAR 的值(如
      # PATH 的 $HOME)会被 shell 提前展开成错误的值,所以只放纯字面量,PATH 之类
      # 在 override-build 内用 export 设。
      - CARGO_TERM_COLOR: never
      - SNAP_BUILD: '1'
    override-pull: |
      craftctl default
      # snap 版本号 = package.json.version(与 apps/gui-go/app.json 同步)。
      VERSION="$(jq -r .version "${CRAFT_PART_SRC}/package.json")"
      craftctl set version="${VERSION}"
    override-build: |
      set -euo pipefail

      case "$(dpkg --print-architecture)" in
        amd64) GO_ARCH=amd64; GO_SHA256=63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445 ;;
        arm64) GO_ARCH=arm64; GO_SHA256=3450b45a3f9ee8568792736a5c5e70a1f2e9b36c35a8f74958c03e51d7d92bec ;;
        *) echo "unsupported architecture" >&2; exit 1 ;;
      esac
      GO_ROOT="${CRAFT_PART_BUILD}/go-toolchain"
      mkdir -p "${GO_ROOT}"
      curl -fsSL -o "${GO_ROOT}/go.tar.gz" "https://go.dev/dl/go1.27.1.linux-${GO_ARCH}.tar.gz"
      echo "${GO_SHA256}  ${GO_ROOT}/go.tar.gz" | sha256sum -c -
      tar -C "${GO_ROOT}" -xzf "${GO_ROOT}/go.tar.gz"

      # Bun (frontend bundler) and the Rust toolchain pinned by rust-toolchain.toml.
      # core22 ships nodejs/npm but no bun.
      curl -fsSL https://bun.sh/install | bash
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain none
      export PATH="${GO_ROOT}/go/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$PATH" GOTOOLCHAIN=local

      # 1) The daemon the GUI starts as its sibling ($SNAP/usr/bin/uniclipd). `-p uc-daemon` is
      # required: the `uniclipd` bin lives in that workspace member.
      cargo build --release --locked -p uc-daemon --bin uniclipd

      # 2) The shared frontend bundle, which the Go host embeds (apps/gui-go/main.go).
      (cd packages/desktop-host-go && go generate ./buildinfo)
      bun install --frozen-lockfile
      bun --bun run --cwd apps/gui-go/frontend build

      # 3) The Go host, with the shipped tags and the identity from apps/gui-go/app.json (the
      # single source: the identifier keys the single-instance scope and notifications).
      PRODUCT="$(jq -r .productName apps/gui-go/app.json)"
      IDENTIFIER="$(jq -r .identifier apps/gui-go/app.json)"
      PUBKEY="$(jq -r .updater.pubkey apps/gui-go/app.json)"
      (cd apps/gui-go && CGO_ENABLED=1 go build -tags gtk3,production,release -trimpath -buildvcs=false \
        -ldflags "-w -s -X main.updaterPublicKey=${PUBKEY} -X main.productName=${PRODUCT} -X main.bundleID=${IDENTIFIER}" \
        -o ../../target/release/uniclipboard .)

      # 4) Install into the snap. A strict snap mounts this tree at /usr, so paths start with usr/.
      install -Dm755 target/release/uniclipboard \
        "${CRAFT_PART_INSTALL}/usr/bin/uniclipboard"
      install -Dm755 target/release/uniclipd \
        "${CRAFT_PART_INSTALL}/usr/bin/uniclipd"
      # The desktop entry names its icon by explicit ${SNAP} path. A bare theme
      # name makes snapcraft (>= 9.1) guess a hicolor size directory from the
      # empty ones staged by hicolor-icon-theme and write a nonexistent path
      # (e.g. 96x96/apps/uniclipboard.xpm), which the Snap Store rejects.
      # Each icon must sit in the hicolor directory matching its pixel size.
      install -Dm644 snap/local/uniclipboard.desktop \
        "${CRAFT_PART_INSTALL}/usr/share/applications/uniclipboard.desktop"
      install -Dm644 apps/gui-go/icons/icon.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/uniclipboard.png"
      install -Dm644 apps/gui-go/icons/128x128.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/128x128/apps/uniclipboard.png"
