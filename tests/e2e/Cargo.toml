[package]
name = "uc-e2e-tests"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2021"
publish = false
description = "Black-box CLI end-to-end tests for uniclip + uniclipd"

[[bin]]
name = "prepare-legacy-release"
path = "src/bin/prepare_legacy_release.rs"

[[bin]]
name = "prepare-v0-19-1-release"
path = "src/bin/prepare_v0_19_1_release.rs"

[[bin]]
name = "prepare-upgrade-release"
path = "src/bin/prepare_upgrade_release.rs"

[[bin]]
name = "build-v0-19-1-userdata-fixture"
path = "src/bin/build_v0_19_1_userdata_fixture.rs"

[[bin]]
name = "build-upgrade-userdata-fixture"
path = "src/bin/build_upgrade_userdata_fixture.rs"

[[bin]]
name = "restore-upgrade-userdata-fixture"
path = "src/bin/restore_upgrade_userdata_fixture.rs"

[features]
membership-diagnostics = []
historical-membership = []
v0-19-1-upgrade = []

[dependencies]
# Harness utilities (re-exported for integration tests)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
uc-app-paths = { path = "../../crates/uc-app-paths" }
uc-daemon-process = { path = "../../crates/uc-daemon-process" }
uc-platform = { path = "../../crates/uc-platform" }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
libc = "0.2"
wiremock = "0.6"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
